name: Daily status LINE message

# Sends the maintainer a LINE push message once a day IF something changed in the community
# inbox. This is the delivery half of the automated-triage pipeline (see
# docs/AUTONOMOUS_TRIAGE.md). The ~04:00 JST Claude Routine processes the inbox and writes
# tools/reports/latest.json with a ready-to-send `sms_body`. This job (07:00 JST) reads that
# file plus the live open-`inbox` count and decides whether to send:
#
#   • fresh report (date == today) AND changed  → send the report's message
#   • items still waiting AND no fresh report    → send a "run didn't complete" heads-up
#   • otherwise (quiet day)                      → send nothing
#
# Runs free on GitHub's cron, so it fires even if the 04:00 subscription run never happened
# (e.g. quota exhausted) — that's the safety net that still tells the maintainer.
#
# LINE Messaging API is free (push messages to one user cost nothing at this volume).
# Requires two Actions secrets (optional feature — without them the run skips politely):
#   LINE_TOKEN     channel access token (long-lived) from the LINE Developers Console
#   LINE_USER_ID   the maintainer's LINE user ID (the push target)

on:
  schedule:
    # 22:47 UTC = 07:47 Japan time (JST = UTC+9). Off-the-hour on purpose.
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send a test message even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

jobs:
  status-line:
    runs-on: ubuntu-latest
    steps:
      - name: Check LINE secrets
        id: gate
        env:
          HAS_LINE: ${{ secrets.LINE_TOKEN != '' && secrets.LINE_USER_ID != '' }}
        run: |
          echo "enabled=$HAS_LINE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_LINE" != "true" ]; then
            echo "::notice::LINE_TOKEN/LINE_USER_ID not configured — skipping message. See docs/NOTIFICATIONS_SETUP.md."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Decide what to send
        if: steps.gate.outputs.enabled == 'true'
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          # Live count of open inbox issues (source of truth for "anything waiting").
          open_count="$(gh issue list --repo "$REPO" --label inbox --state open --json number --jq 'length' 2>/dev/null || echo 0)"

          report="tools/reports/latest.json"
          today="$(TZ=Asia/Tokyo date +%F)"

          r_date=""; r_changed="false"; r_completed="false"; r_body=""
          if [ -f "$report" ]; then
            r_date="$(jq -r '.date // ""' "$report")"
            r_changed="$(jq -r '.changed // false' "$report")"
            r_completed="$(jq -r '.completed // false' "$report")"
            r_body="$(jq -r '.sms_body // ""' "$report")"
          fi

          fresh="false"
          if [ "$r_date" = "$today" ]; then fresh="true"; fi

          send="false"; body=""
          if [ "$fresh" = "true" ] && [ "$r_changed" = "true" ]; then
            # Normal case: today's run did something. Send the report it wrote.
            send="true"; body="$r_body"
          elif [ "$open_count" -gt 0 ] && { [ "$fresh" != "true" ] || [ "$r_completed" != "true" ]; }; then
            # Items are waiting but today's run didn't finish (quota? failure?). Safety net.
            send="true"
            body="⚠️ Cinnamon Land: ${open_count} submission(s) waiting, but today's automated run didn't complete (possibly usage quota). Open Claude Code and say “process the inbox.”"
          fi

          if [ "${FORCE:-false}" = "true" ] && [ "$send" != "true" ]; then
            send="true"
            body="🐿️ Cinnamon Land test message — pipeline is wired up. Open inbox items: ${open_count}. (Nothing to report today.)"
          fi

          echo "send=$send" >> "$GITHUB_OUTPUT"
          # Multiline-safe passing of the body to the next step.
          {
            echo "body<<LINE_EOF"
            echo "$body"
            echo "LINE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::send=$send open_inbox=$open_count fresh_report=$fresh changed=$r_changed"

      - name: Send LINE push message
        if: steps.gate.outputs.enabled == 'true' && steps.decide.outputs.send == 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          BODY: ${{ steps.decide.outputs.body }}
        run: |
          set -euo pipefail
          # LINE text messages cap at 5000 chars; truncate defensively (report bodies are
          # nowhere near this, but never let a runaway string fail the push silently).
          payload="$(jq -n --arg to "$LINE_USER_ID" --arg text "${BODY:0:4900}" \
            '{to: $to, messages: [{type: "text", text: $text}]}')"

          http_code="$(curl -sS -o /tmp/line_resp.json -w '%{http_code}' -X POST \
            "https://api.line.me/v2/bot/message/push" \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")"
          echo "LINE HTTP $http_code"
          if [ "$http_code" -ge 300 ]; then
            cat /tmp/line_resp.json
            exit 1
          fi
          echo "LINE message sent."
