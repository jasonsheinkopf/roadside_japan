name: Inbox watchdog

# Fallback retry for the event-driven inbox-triage Routine (docs/NOTIFICATIONS_SETUP.md piece E).
#
# The Routine (Cinnamon Land Submission Review) fires on the GitHub "issue opened" event, the
# instant someone submits. If Claude's usage quota was exhausted at that exact moment, that
# event is simply missed — nothing re-tries it on its own. This workflow is the free, fully
# automated fix: it runs on a schedule, and for any `inbox` issue that's been open a while
# without being processed, it fires the Routine directly via its API endpoint. This retriggers
# processing without requiring the Routine's trigger configuration to include GitHub events —
# purely automatic, no manual Routine edits needed.
#
# Costs nothing to run this often: GitHub Actions cron is free, and when nothing is stuck the
# job does one cheap `gh issue list` call and exits. Firing the Routine uses your Claude
# subscription quota (counted as part of the same run batch as the normal event-driven triage).

on:
  workflow_dispatch: {}
  schedule:
    # Every 15 minutes.
    - cron: "*/15 * * * *"

permissions:
  issues: read

jobs:
  retry-stuck-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Fire Routine for stuck inbox issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          set -euo pipefail

          # Grace window: never touch an issue younger than this, so we don't race the
          # instant "issue opened" trigger — give it time to fire and finish normally first.
          GRACE_MINUTES=20
          cutoff="$(date -u -d "-${GRACE_MINUTES} minutes" +%s 2>/dev/null || date -u -v-${GRACE_MINUTES}M +%s)"

          issues_json="$(gh issue list --repo "$REPO" --label inbox --state open \
            --json number,createdAt,updatedAt,labels --limit 100)"

          stuck="$(echo "$issues_json" | jq -r --argjson cutoff "$cutoff" '
            .[]
            | select((.labels | map(.name) | index("processed")) == null)
            | select((.createdAt | fromdateiso8601) < $cutoff)
            | select((.updatedAt | fromdateiso8601) < $cutoff)
            | .number
          ')"

          if [ -z "$stuck" ]; then
            echo "Nothing stuck — no open, unprocessed inbox issues older than ${GRACE_MINUTES}m."
            exit 0
          fi

          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_FIRE_TOKEN" ]; then
            echo "::error::ROUTINE_FIRE_URL or ROUTINE_FIRE_TOKEN not configured. See docs/NOTIFICATIONS_SETUP.md piece E."
            exit 1
          fi

          issue_list=$(echo "$stuck" | tr '\n' ',' | sed 's/,$//')
          message="Watchdog: found $(($(echo "$stuck" | wc -l))) stuck inbox issues (numbers: $issue_list)"

          echo "::notice::$message"

          curl -f -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$message\"}" \
            || { echo "::error::Failed to fire Routine at $ROUTINE_FIRE_URL"; exit 1; }
