<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Roadside Japan">
  <title>Roadside Japan</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E3"/>
      <stop offset="1" stop-color="#EAD9C2"/>
    </linearGradient>
    <clipPath id="badge">
      <rect x="3" y="3" width="90" height="90" rx="22"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#sky)"/>

  <g clip-path="url(#badge)">
    <!-- Rising sun -->
    <circle cx="69" cy="28" r="10" fill="#E0492F"/>

    <!-- Rolling hill behind the mountain -->
    <path d="M-4,66 Q22,54 50,62 T100,60 L100,100 L-4,100 Z" fill="#3E7D5A"/>

    <!-- Mt. Fuji -->
    <path d="M17,67 L43,29 C45.5,25.5 50.5,25.5 53,29 L79,67 Z" fill="#243049"/>
    <!-- Snow cap -->
    <path d="M38,39 L48,27.5 L58,39 L54,38 L51,42.5 L48,38.5 L45,42.5 L42,38 Z" fill="#FFFFFF"/>

    <!-- Road (perspective) -->
    <path d="M35,96 L45.4,60 L50.6,60 L61,96 Z" fill="#FBF7EF"/>
    <!-- Center-line dashes in brand red -->
    <line x1="48" y1="94" x2="48" y2="62" stroke="#E0492F" stroke-width="2.2"
          stroke-linecap="round" stroke-dasharray="3 4.5"/>
  </g>

  <!-- Subtle inner edge for definition on light backgrounds -->
  <rect x="3.75" y="3.75" width="88.5" height="88.5" rx="21.25" fill="none"
        stroke="#243049" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
