<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A funny 'lights off please' sign at night with a single firefly perched cheekily on top of it">
  <defs>
    <radialGradient id="dark9" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#16243a"/>
      <stop offset="100%" stop-color="#080f18"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#dark9)"/>
  <!-- firefly glow on sign -->
  <circle cx="200" cy="120" r="60" fill="#d7ff7a" opacity="0.18"/>
  <!-- post -->
  <rect x="190" y="230" width="20" height="160" fill="#5a4632"/>
  <!-- sign board -->
  <rect x="80" y="140" width="240" height="110" rx="10" fill="#f4efe0" stroke="#3a3020" stroke-width="6"/>
  <!-- lightbulb crossed out -->
  <g transform="translate(200 175)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#c0392b" stroke-width="5"/>
    <circle cx="0" cy="-2" r="11" fill="#ffd24a"/>
    <rect x="-5" y="8" width="10" height="6" fill="#888"/>
    <line x1="-18" y1="18" x2="18" y2="-18" stroke="#c0392b" stroke-width="5"/>
  </g>
  <text x="200" y="228" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3a3020" text-anchor="middle">LIGHTS OFF</text>
  <!-- cheeky firefly on top -->
  <g transform="translate(200 130)">
    <circle cx="0" cy="0" r="16" fill="#d7ff7a" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#2a3a1a"/>
    <ellipse cx="0" cy="5" rx="6" ry="5" fill="#eaffa0"/>
    <circle cx="-3" cy="-3" r="2" fill="#fff"/><circle cx="3" cy="-3" r="2" fill="#fff"/>
  </g>
</svg>
