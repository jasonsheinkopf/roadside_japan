<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A huge stadium-sized animated light panorama wall depicting Mt. Fuji made of colored lights">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120a2a"/>
      <stop offset="100%" stop-color="#06030f"/>
    </linearGradient>
    <linearGradient id="sky11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a8c"/>
      <stop offset="100%" stop-color="#7a4ab0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg11)"/>
  <!-- light wall panel -->
  <rect x="20" y="40" width="360" height="240" rx="6" fill="url(#sky11)"/>
  <!-- pixel grid lines -->
  <g stroke="#000" stroke-width="1" opacity="0.15">
    <line x1="20" y1="80" x2="380" y2="80"/><line x1="20" y1="120" x2="380" y2="120"/><line x1="20" y1="160" x2="380" y2="160"/><line x1="20" y1="200" x2="380" y2="200"/><line x1="20" y1="240" x2="380" y2="240"/>
    <line x1="80" y1="40" x2="80" y2="280"/><line x1="140" y1="40" x2="140" y2="280"/><line x1="200" y1="40" x2="200" y2="280"/><line x1="260" y1="40" x2="260" y2="280"/><line x1="320" y1="40" x2="320" y2="280"/>
  </g>
  <!-- Fuji in lights -->
  <polygon points="200,90 320,265 80,265" fill="#3a78d8"/>
  <polygon points="200,90 245,155 228,153 215,168 200,156 185,170 170,153 155,160" fill="#ff5fa8"/>
  <!-- shimmer dots -->
  <g fill="#fff8c0"><circle cx="120" cy="120" r="3"/><circle cx="280" cy="130" r="3"/><circle cx="160" cy="220" r="3"/><circle cx="250" cy="230" r="3"/><circle cx="200" cy="200" r="3"/></g>
  <!-- crowd silhouettes below -->
  <rect x="0" y="280" width="400" height="120" fill="#060310"/>
  <g fill="#1a1430">
    <circle cx="40" cy="340" r="22"/><circle cx="100" cy="350" r="22"/><circle cx="170" cy="340" r="24"/><circle cx="240" cy="350" r="22"/><circle cx="310" cy="342" r="24"/><circle cx="375" cy="350" r="22"/>
  </g>
</svg>
