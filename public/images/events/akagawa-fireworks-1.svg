<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Huge fireworks bursting over a river at night with crowds watching">
  <defs>
    <linearGradient id="sky9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1233"/>
      <stop offset="1" stop-color="#2a2350"/>
    </linearGradient>
    <radialGradient id="g9a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="1" stop-color="#ff7aa0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky9)"/>
  <circle cx="130" cy="120" r="70" fill="url(#g9a)" opacity="0.5"/>
  <!-- firework bursts -->
  <g stroke-linecap="round">
    <g stroke="#ffd24a" stroke-width="3">
      <line x1="130" y1="120" x2="130" y2="60"/><line x1="130" y1="120" x2="172" y2="78"/><line x1="130" y1="120" x2="190" y2="120"/><line x1="130" y1="120" x2="172" y2="162"/><line x1="130" y1="120" x2="130" y2="180"/><line x1="130" y1="120" x2="88" y2="162"/><line x1="130" y1="120" x2="70" y2="120"/><line x1="130" y1="120" x2="88" y2="78"/>
    </g>
    <g fill="#ffd24a"><circle cx="130" cy="58" r="3"/><circle cx="174" cy="76" r="3"/><circle cx="192" cy="120" r="3"/><circle cx="174" cy="164" r="3"/><circle cx="130" cy="182" r="3"/><circle cx="86" cy="164" r="3"/><circle cx="68" cy="120" r="3"/><circle cx="86" cy="76" r="3"/></g>
  </g>
  <g stroke-linecap="round">
    <g stroke="#5ad6e6" stroke-width="2.5">
      <line x1="290" y1="90" x2="290" y2="50"/><line x1="290" y1="90" x2="318" y2="62"/><line x1="290" y1="90" x2="330" y2="90"/><line x1="290" y1="90" x2="318" y2="118"/><line x1="290" y1="90" x2="290" y2="130"/><line x1="290" y1="90" x2="262" y2="118"/><line x1="290" y1="90" x2="250" y2="90"/><line x1="290" y1="90" x2="262" y2="62"/>
    </g>
  </g>
  <circle cx="220" cy="170" r="2" fill="#ff8db0"/>
  <circle cx="60" cy="200" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="350" cy="180" r="2" fill="#fff" opacity="0.8"/>
  <!-- river reflecting -->
  <rect y="290" width="400" height="110" fill="#16204a"/>
  <g opacity="0.5">
    <rect x="115" y="290" width="30" height="110" fill="#ffd24a"/>
    <rect x="280" y="290" width="20" height="110" fill="#5ad6e6"/>
  </g>
  <!-- crowd silhouettes -->
  <g fill="#05060f">
    <rect y="280" width="400" height="20"/>
    <g><circle cx="40" cy="278" r="10"/><circle cx="80" cy="282" r="10"/><circle cx="130" cy="278" r="10"/><circle cx="180" cy="282" r="10"/><circle cx="230" cy="278" r="10"/><circle cx="280" cy="282" r="10"/><circle cx="330" cy="278" r="10"/><circle cx="370" cy="282" r="10"/></g>
  </g>
</svg>
