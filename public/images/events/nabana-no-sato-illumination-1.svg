<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="The inside of a glowing golden tunnel made of thousands of warm LED lights">
  <defs>
    <radialGradient id="tun10" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="45%" stop-color="#ffcf52"/>
      <stop offset="100%" stop-color="#b06a10"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#3a2408"/>
  <!-- concentric tunnel arches -->
  <g fill="none">
    <ellipse cx="200" cy="220" rx="195" ry="190" stroke="#7a4a0e" stroke-width="14"/>
    <ellipse cx="200" cy="215" rx="155" ry="150" stroke="#a9690f" stroke-width="13"/>
    <ellipse cx="200" cy="210" rx="118" ry="113" stroke="#d68a16" stroke-width="12"/>
    <ellipse cx="200" cy="205" rx="84" ry="80" stroke="#ffb830" stroke-width="11"/>
    <ellipse cx="200" cy="200" rx="52" ry="50" stroke="#ffd86a" stroke-width="10"/>
  </g>
  <ellipse cx="200" cy="200" rx="40" ry="40" fill="url(#tun10)"/>
  <!-- LED dots -->
  <g fill="#fff3c0">
    <circle cx="200" cy="22" r="3"/><circle cx="120" cy="45" r="3"/><circle cx="280" cy="45" r="3"/>
    <circle cx="55" cy="130" r="3"/><circle cx="345" cy="130" r="3"/><circle cx="30" cy="220" r="3"/><circle cx="370" cy="220" r="3"/>
    <circle cx="160" cy="60" r="2.5"/><circle cx="240" cy="60" r="2.5"/><circle cx="90" cy="90" r="2.5"/><circle cx="310" cy="90" r="2.5"/>
    <circle cx="200" cy="65" r="2.5"/><circle cx="135" cy="105" r="2.5"/><circle cx="265" cy="105" r="2.5"/>
    <circle cx="200" cy="105" r="2.5"/><circle cx="155" cy="135" r="2"/><circle cx="245" cy="135" r="2"/>
  </g>
</svg>
