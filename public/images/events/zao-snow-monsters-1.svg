<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A single towering white frozen snow-covered fir tree snow monster seen up close against a blue winter sky">
  <defs>
    <linearGradient id="sky13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8fd4"/>
      <stop offset="100%" stop-color="#bfe2f5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky13)"/>
  <!-- ground snow -->
  <rect x="0" y="340" width="400" height="60" fill="#eef6fc"/>
  <!-- snow monster: lumpy frosted blob tower -->
  <g fill="#f4faff" stroke="#cfe2f0" stroke-width="2">
    <path d="M200 40
      Q235 60 225 95 Q260 100 245 140 Q285 150 260 195
      Q300 210 270 255 Q310 280 270 320 Q300 350 230 360
      L170 360 Q100 350 130 320 Q90 280 130 255
      Q100 210 140 195 Q115 150 155 140 Q140 100 175 95
      Q165 60 200 40 Z"/>
  </g>
  <!-- frosty bumps -->
  <g fill="#ffffff">
    <circle cx="200" cy="80" r="14"/><circle cx="170" cy="130" r="16"/><circle cx="235" cy="135" r="16"/>
    <circle cx="160" cy="195" r="18"/><circle cx="245" cy="200" r="18"/><circle cx="200" cy="180" r="16"/>
    <circle cx="150" cy="265" r="20"/><circle cx="255" cy="270" r="20"/><circle cx="200" cy="250" r="18"/>
    <circle cx="175" cy="320" r="20"/><circle cx="230" cy="325" r="20"/>
  </g>
  <g fill="#dcecf7">
    <circle cx="185" cy="95" r="5"/><circle cx="215" cy="150" r="6"/><circle cx="175" cy="220" r="6"/><circle cx="230" cy="290" r="7"/>
  </g>
</svg>
