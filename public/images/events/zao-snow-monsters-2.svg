  <!-- gondola -->
  <g transform="translate(200 165)">
    <line x1="0" y1="-50" x2="0" y2="-22" stroke="#3a4a5a" stroke-width="4"/>
    <rect x="-12" y="-55" width="24" height="10" rx="3" fill="#5a6a7a"/>
    <rect x="-38" y="-22" width="76" height="58" rx="12" fill="#e8584c"/>
    <rect x="-30" y="-12" width="60" height="26" rx="6" fill="#bfe2f5"/>
    <line x1="0" y1="-12" x2="0" y2="14" stroke="#fff" stroke-width="3"/>
    <rect x="-38" y="6" width="76" height="8" fill="#c0392b"/>
  </g>
</svg>
