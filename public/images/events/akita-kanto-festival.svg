<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Performers balancing tall bamboo poles strung with glowing paper lanterns at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213a"/><stop offset="1" stop-color="#2c3a5a"/></linearGradient>
    <radialGradient id="lant" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#f4b23c"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#night)"/>
  <!-- distant town glow -->
  <rect y="380" width="800" height="120" fill="#1b2740"/>
  <g fill="#3a4a6a"><rect x="20" y="340" width="50" height="60"/><rect x="90" y="320" width="40" height="80"/><rect x="680" y="330" width="50" height="70"/><rect x="740" y="350" width="40" height="50"/></g>
  <g fill="#f4d06a" opacity="0.7"><rect x="34" y="356" width="8" height="8"/><rect x="100" y="340" width="8" height="8"/><rect x="700" y="350" width="8" height="8"/></g>
  <!-- moon -->
  <circle cx="700" cy="90" r="34" fill="#f4ecc8" opacity="0.8"/>
  <!-- three kanto poles, each a tall bamboo with grid of lanterns -->
  <g>
    <!-- helper macro inlined per pole -->
    <g transform="translate(180,40)">
      <rect x="-3" y="0" width="6" height="380" fill="#caa24a"/>
      <g stroke="#caa24a" stroke-width="3"><line x1="0" y1="30" x2="-46" y2="30"/><line x1="0" y1="80" x2="-52" y2="80"/><line x1="0" y1="130" x2="-58" y2="130"/><line x1="0" y1="180" x2="-62" y2="180"/></g>
      <g fill="url(#lant)" stroke="#caa12f" stroke-width="1">
        <rect x="-58" y="22" width="16" height="20" rx="4"/><rect x="-36" y="22" width="16" height="20" rx="4"/><rect x="-14" y="22" width="16" height="20" rx="4"/>
        <rect x="-62" y="72" width="16" height="20" rx="4"/><rect x="-40" y="72" width="16" height="20" rx="4"/><rect x="-18" y="72" width="16" height="20" rx="4"/>
        <rect x="-66" y="122" width="16" height="20" rx="4"/><rect x="-44" y="122" width="16" height="20" rx="4"/><rect x="-22" y="122" width="16" height="20" rx="4"/>
        <rect x="-70" y="172" width="16" height="20" rx="4"/><rect x="-48" y="172" width="16" height="20" rx="4"/><rect x="-26" y="172" width="16" height="20" rx="4"/>
      </g>
    </g>
    <g transform="translate(560,30) scale(-1,1)">
      <rect x="-3" y="0" width="6" height="400" fill="#caa24a"/>
      <g stroke="#caa24a" stroke-width="3"><line x1="0" y1="30" x2="-46" y2="30"/><line x1="0" y1="80" x2="-52" y2="80"/><line x1="0" y1="130" x2="-58" y2="130"/><line x1="0" y1="180" x2="-62" y2="180"/></g>
      <g fill="url(#lant)" stroke="#caa12f" stroke-width="1">
        <rect x="-58" y="22" width="16" height="20" rx="4"/><rect x="-36" y="22" width="16" height="20" rx="4"/><rect x="-14" y="22" width="16" height="20" rx="4"/>
        <rect x="-62" y="72" width="16" height="20" rx="4"/><rect x="-40" y="72" width="16" height="20" rx="4"/><rect x="-18" y="72" width="16" height="20" rx="4"/>
        <rect x="-66" y="122" width="16" height="20" rx="4"/><rect x="-44" y="122" width="16" height="20" rx="4"/><rect x="-22" y="122" width="16" height="20" rx="4"/>
        <rect x="-70" y="172" width="16" height="20" rx="4"/><rect x="-48" y="172" width="16" height="20" rx="4"/><rect x="-26" y="172" width="16" height="20" rx="4"/>
      </g>
    </g>
    <!-- center pole, taller -->
    <g transform="translate(400,10)">
      <rect x="-3" y="0" width="6" height="420" fill="#d8b25a"/>
      <g stroke="#d8b25a" stroke-width="3"><line x1="-30" y1="30" x2="30" y2="30"/><line x1="-34" y1="80" x2="34" y2="80"/><line x1="-38" y1="130" x2="38" y2="130"/><line x1="-42" y1="180" x2="42" y2="180"/></g>
      <g fill="url(#lant)" stroke="#caa12f" stroke-width="1">
        <rect x="-30" y="22" width="16" height="20" rx="4"/><rect x="-8" y="22" width="16" height="20" rx="4"/><rect x="14" y="22" width="16" height="20" rx="4"/>
        <rect x="-34" y="72" width="16" height="20" rx="4"/><rect x="-12" y="72" width="16" height="20" rx="4"/><rect x="10" y="72" width="16" height="20" rx="4"/><rect x="-56" y="72" width="16" height="20" rx="4"/>
        <rect x="-38" y="122" width="16" height="20" rx="4"/><rect x="-16" y="122" width="16" height="20" rx="4"/><rect x="6" y="122" width="16" height="20" rx="4"/>
        <rect x="-42" y="172" width="16" height="20" rx="4"/><rect x="-20" y="172" width="16" height="20" rx="4"/><rect x="2" y="172" width="16" height="20" rx="4"/>
      </g>
    </g>
  </g>
  <!-- performers balancing on palms/forehead -->
  <g fill="#0f1626">
    <g transform="translate(180,420)"><circle cx="0" cy="-30" r="12"/><rect x="-12" y="-20" width="24" height="40" rx="8"/><path d="M-2 -42 l4 22" stroke="#0f1626" stroke-width="6"/></g>
    <g transform="translate(400,430)"><circle cx="0" cy="-30" r="12"/><rect x="-12" y="-20" width="24" height="42" rx="8"/><line x1="0" y1="-42" x2="0" y2="-30" stroke="#0f1626" stroke-width="6"/></g>
    <g transform="translate(560,430)"><circle cx="0" cy="-30" r="12"/><rect x="-12" y="-20" width="24" height="40" rx="8"/><path d="M0 -42 l0 12" stroke="#0f1626" stroke-width="6"/></g>
  </g>
  <rect y="460" width="800" height="40" fill="#0f1626"/>
</svg>
