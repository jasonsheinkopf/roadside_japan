<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A festival performer balancing a tall bamboo pole strung with glowing paper lanterns on their forehead at night">
  <defs>
    <radialGradient id="sky1" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#26314f"/>
      <stop offset="100%" stop-color="#0c1024"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffce4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky1)"/>
  <circle cx="200" cy="150" r="120" fill="url(#glow1)"/>
  <!-- bamboo pole -->
  <rect x="196" y="20" width="8" height="280" fill="#9a7b3c"/>
  <!-- cross arms with lanterns -->
  <g fill="#ffd24a" stroke="#c98a18" stroke-width="2">
    <rect x="120" y="40" width="160" height="5" fill="#7c5a22"/>
    <rect x="125" y="80" width="150" height="5" fill="#7c5a22"/>
    <rect x="130" y="120" width="140" height="5" fill="#7c5a22"/>
    <ellipse cx="140" cy="58" rx="13" ry="17"/><ellipse cx="170" cy="58" rx="13" ry="17"/>
    <ellipse cx="200" cy="58" rx="13" ry="17"/><ellipse cx="230" cy="58" rx="13" ry="17"/>
    <ellipse cx="260" cy="58" rx="13" ry="17"/>
    <ellipse cx="150" cy="98" rx="13" ry="17"/><ellipse cx="180" cy="98" rx="13" ry="17"/>
    <ellipse cx="210" cy="98" rx="13" ry="17"/><ellipse cx="240" cy="98" rx="13" ry="17"/>
    <ellipse cx="160" cy="138" rx="13" ry="17"/><ellipse cx="200" cy="138" rx="13" ry="17"/>
    <ellipse cx="240" cy="138" rx="13" ry="17"/>
  </g>
  <!-- performer -->
  <g>
    <circle cx="200" cy="320" r="30" fill="#f0c08a"/>
    <rect x="185" y="305" width="30" height="8" rx="4" fill="#fff"/>
    <circle cx="190" cy="318" r="3" fill="#2a2a2a"/><circle cx="210" cy="318" r="3" fill="#2a2a2a"/>
    <path d="M188 332 Q200 340 212 332" stroke="#7a4a2a" stroke-width="3" fill="none"/>
    <rect x="160" y="348" width="80" height="52" rx="10" fill="#2e5a8c"/>
    <rect x="190" y="348" width="20" height="52" fill="#e8584c"/>
  </g>
</svg>
