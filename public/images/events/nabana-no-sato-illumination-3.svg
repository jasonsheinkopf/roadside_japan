<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A couple silhouetted hand-in-hand beneath a sky of sparkling illumination lights">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2a3470"/>
      <stop offset="100%" stop-color="#0a0c22"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg12)"/>
  <!-- sparkle field -->
  <g fill="#bfe0ff">
    <circle cx="40" cy="40" r="3"/><circle cx="120" cy="30" r="2.5"/><circle cx="200" cy="50" r="3.5"/><circle cx="290" cy="35" r="2.5"/><circle cx="360" cy="55" r="3"/>
    <circle cx="70" cy="100" r="2.5"/><circle cx="160" cy="90" r="3"/><circle cx="250" cy="110" r="2.5"/><circle cx="330" cy="100" r="3"/>
    <circle cx="30" cy="160" r="3"/><circle cx="110" cy="150" r="2.5"/><circle cx="200" cy="140" r="3.5"/><circle cx="300" cy="160" r="2.5"/><circle cx="370" cy="150" r="3"/>
    <circle cx="60" cy="210" r="2.5"/><circle cx="150" cy="220" r="3"/><circle cx="260" cy="205" r="2.5"/><circle cx="340" cy="215" r="3"/>
  </g>
  <g fill="#fff8c0" opacity="0.8">
    <circle cx="200" cy="50" r="6"/><circle cx="200" cy="140" r="6"/><circle cx="120" cy="30" r="5"/><circle cx="330" cy="100" r="5"/><circle cx="60" cy="210" r="5"/>
  </g>
  <!-- ground -->
  <ellipse cx="200" cy="400" rx="240" ry="60" fill="#06040f"/>
  <!-- couple silhouette -->
  <g fill="#05030c">
    <circle cx="160" cy="250" r="22"/><path d="M138 272 Q140 360 158 360 L170 360 Q172 300 172 272 Z"/>
    <circle cx="240" cy="250" r="22"/><path d="M228 272 Q228 300 230 360 L242 360 Q260 360 262 272 Z"/>
    <!-- joined hands arms -->
    <path d="M178 300 Q200 318 222 300" stroke="#05030c" stroke-width="10" fill="none"/>
  </g>
  <circle cx="200" cy="305" r="6" fill="#fff8c0" opacity="0.6"/>
</svg>
