<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A dark riverside crowd at night quietly watching fireflies, phone screens dimmed">
  <defs>
    <linearGradient id="dark8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101c2c"/>
      <stop offset="100%" stop-color="#0a1610"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#dark8)"/>
  <!-- distant trees -->
  <g fill="#0c2018">
    <polygon points="0,180 60,90 120,180"/><polygon points="90,180 150,70 210,180"/><polygon points="180,180 250,80 320,180"/><polygon points="290,180 350,90 400,180"/>
  </g>
  <!-- river -->
  <rect x="0" y="180" width="400" height="90" fill="#14283a"/>
  <g stroke="#27506e" stroke-width="2" opacity="0.5"><line x1="40" y1="210" x2="120" y2="210"/><line x1="200" y1="235" x2="300" y2="235"/><line x1="100" y1="255" x2="180" y2="255"/></g>
  <!-- bank -->
  <rect x="0" y="270" width="400" height="130" fill="#0d1810"/>
  <!-- crowd silhouettes -->
  <g fill="#070f0a">
    <circle cx="50" cy="330" r="26"/><rect x="30" y="330" width="40" height="70"/>
    <circle cx="130" cy="340" r="26"/><rect x="110" y="340" width="40" height="60"/>
    <circle cx="220" cy="332" r="28"/><rect x="198" y="332" width="44" height="68"/>
    <circle cx="310" cy="342" r="26"/><rect x="290" y="342" width="40" height="58"/>
    <circle cx="375" cy="338" r="26"/><rect x="355" y="338" width="40" height="62"/>
  </g>
  <!-- dimmed phone -->
  <rect x="206" y="318" width="16" height="24" rx="3" fill="#3a5a3a" opacity="0.7"/>
  <!-- fireflies -->
  <g fill="#d7ff7a">
    <circle cx="80" cy="120" r="3"/><circle cx="160" cy="150" r="4"/><circle cx="250" cy="110" r="3"/>
    <circle cx="330" cy="140" r="4"/><circle cx="120" cy="200" r="3"/><circle cx="290" cy="190" r="4"/>
    <circle cx="200" cy="90" r="3"/><circle cx="60" cy="240" r="3"/><circle cx="350" cy="230" r="3"/>
  </g>
  <g fill="#d7ff7a" opacity="0.3">
    <circle cx="80" cy="120" r="9"/><circle cx="160" cy="150" r="10"/><circle cx="330" cy="140" r="10"/><circle cx="290" cy="190" r="10"/>
  </g>
</svg>
