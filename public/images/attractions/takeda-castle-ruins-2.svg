<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mon-chan yawning at sunrise beside cloud-wrapped stone castle ruins">
<defs><linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7ad63"/><stop offset="1" stop-color="#d2913f"/></linearGradient><linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a0"/><stop offset="0.5" stop-color="#ffb98a"/><stop offset="1" stop-color="#f5a78f"/></linearGradient></defs>
<rect width="400" height="400" fill="url(#dawn)"/>
<circle cx="200" cy="120" r="44" fill="#fff2cf" opacity="0.85"/>
<circle cx="200" cy="120" r="30" fill="#fff8e6"/>
<!-- distant mountains -->
<path d="M0 180 L80 120 L160 175 L240 110 L320 170 L400 130 V400 H0z" fill="#b88a8a" opacity="0.7"/>
<!-- sea of clouds -->
