<!-- castle ruin stone walls on a ridge -->
<g transform="translate(255,210)">
<polygon points="-60,40 60,40 40,-10 -40,-10" fill="#9a8e74"/>
<polygon points="-60,40 60,40 50,12 -50,12" fill="#8a7e64"/>
<g stroke="#766a52" stroke-width="2"><line x1="-30" y1="-10" x2="-36" y2="40"/><line x1="0" y1="-10" x2="0" y2="40"/><line x1="30" y1="-10" x2="36" y2="40"/></g>
<rect x="-12" y="-30" width="24" height="22" fill="#8a7e64"/>
</g>
<!-- Mon-chan yawning, foreground left -->
<g transform="translate(120,300) scale(1.0)">
<path d="M-42 60 q-14 -70 42 -78 q56 8 42 78 z" fill="url(#fur)"/>
<path d="M-18 60 q-14 -58 18 -64 q32 6 18 64 z" fill="#faf1e0"/>
<ellipse cx="-34" cy="60" rx="16" ry="10" fill="#faf1e0"/><ellipse cx="34" cy="60" rx="16" ry="10" fill="#faf1e0"/>
<g transform="translate(46,-30) rotate(30)"><ellipse cx="0" cy="6" rx="10" ry="11" fill="#faf1e0"/><rect x="-7" y="-14" width="5" height="16" rx="2.5" fill="#faf1e0"/><rect x="2" y="-14" width="5" height="16" rx="2.5" fill="#faf1e0"/></g>
<path d="M-32 0 q32 22 64 0 l-6 -20 q-26 14 -52 0z" fill="#d6483b"/><path d="M0 0 l-12 26 10 -4 8 8 6 -28z" fill="#b93a2f"/>
<circle cx="-20" cy="-12" r="2" fill="#fff"/><circle cx="14" cy="-12" r="2" fill="#fff"/>
<path d="M-50 -86 l-10 -40 38 22z" fill="url(#fur)"/><path d="M50 -86 l10 -40 -38 22z" fill="url(#fur)"/>
<path d="M-47 -94 l-4 -22 18 12z" fill="#f3a6a0"/><path d="M47 -94 l4 -22 -18 12z" fill="#f3a6a0"/>
<ellipse cx="0" cy="-66" rx="52" ry="46" fill="url(#fur)"/>
<path d="M0 -80 q-44 0 -44 30 q0 26 44 26 q44 0 44 -26 q0 -30 -44 -30z" fill="#faf1e0"/>
<ellipse cx="-36" cy="-50" rx="9" ry="6" fill="#f3a6a0" opacity="0.8"/><ellipse cx="36" cy="-50" rx="9" ry="6" fill="#f3a6a0" opacity="0.8"/>
<path d="M-26 -66 q6 -5 12 0" stroke="#2e2824" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M14 -66 q6 -5 12 0" stroke="#2e2824" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M-6 -50 h12 l-6 7z" fill="#3a3330"/>
<!-- big yawn -->
<ellipse cx="0" cy="-34" rx="13" ry="16" fill="#7a2c2c"/>
<ellipse cx="0" cy="-28" rx="9" ry="9" fill="#f08a86"/>
</g>
