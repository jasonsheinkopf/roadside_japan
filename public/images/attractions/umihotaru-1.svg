<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A ship-shaped highway rest stop on an artificial island in the middle of the bay">
  <defs>
    <linearGradient id="usky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="0.55" stop-color="#f6a9b0"/>
      <stop offset="1" stop-color="#7a8fc4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#usky)"/>
  <circle cx="300" cy="90" r="34" fill="#fff0cf"/>
  <circle cx="300" cy="90" r="48" fill="#fff0cf" opacity="0.3"/>
  <!-- bay water -->
  <rect y="240" width="400" height="160" fill="#5a7ab0"/>
  <g fill="#7a96c4" opacity="0.6">
    <path d="M0 270 q40 -6 80 0 t80 0 t80 0 t80 0 V290 H0 Z"/>
    <path d="M0 320 q50 -6 100 0 t100 0 t100 0 V340 H0 Z"/>
  </g>
  <ellipse cx="300" cy="280" rx="50" ry="8" fill="#ffd9a8" opacity="0.5"/>
  <!-- ship-shaped island -->
  <g transform="translate(60,200)">
    <path d="M0 60 L260 60 L300 90 L280 130 L20 130 Q-10 95 0 60 Z" fill="#3a4a66"/>
    <path d="M0 60 L260 60 L300 90 L296 100 L20 100 Q-6 82 0 60 Z" fill="#4a5c80"/>
    <!-- decks -->
    <rect x="40" y="20" width="200" height="40" fill="#e8e2d6"/>
    <rect x="60" y="-6" width="150" height="28" rx="4" fill="#f2ede2"/>
    <rect x="90" y="-26" width="80" height="22" rx="4" fill="#dfd8c8"/>
    <!-- windows -->
    <g fill="#ffd86b"><rect x="54" y="30" width="12" height="14"/><rect x="78" y="30" width="12" height="14"/><rect x="102" y="30" width="12" height="14"/><rect x="126" y="30" width="12" height="14"/><rect x="150" y="30" width="12" height="14"/><rect x="174" y="30" width="12" height="14"/><rect x="198" y="30" width="12" height="14"/></g>
    <g fill="#ffe9a8"><rect x="80" y="2" width="14" height="14"/><rect x="110" y="2" width="14" height="14"/><rect x="140" y="2" width="14" height="14"/><rect x="170" y="2" width="14" height="14"/></g>
    <!-- mast -->
    <line x1="130" y1="-26" x2="130" y2="-52" stroke="#c94a3a" stroke-width="4"/>
    <circle cx="130" cy="-52" r="4" fill="#ffd86b"/>
  </g>
</svg>
