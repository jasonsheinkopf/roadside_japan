<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A funny gag: the yellow polka-dot pumpkin now fitted with a little hook and leash so it won't float away in a typhoon">
  <defs>
    <linearGradient id="np2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb9c9"/>
      <stop offset="1" stop-color="#c7e3e9"/>
    </linearGradient>
    <radialGradient id="np2p" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ecb000"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#np2bg)"/>
  <!-- stormy wind swirls -->
  <path d="M20 70 q40 -16 80 0 q40 16 70 -4" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <path d="M250 50 q40 -14 80 4" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <!-- ground -->
  <rect x="0" y="330" width="400" height="70" fill="#5c7d54"/>
  <!-- concrete anchor block -->
  <rect x="150" y="318" width="100" height="26" rx="4" fill="#9aa0a3"/>
  <!-- chain leash going up to pumpkin -->
  <g stroke="#777c80" stroke-width="6" fill="none">
    <line x1="200" y1="318" x2="200" y2="300"/>
  </g>
  <circle cx="200" cy="296" r="9" fill="none" stroke="#777c80" stroke-width="5"/>
  <!-- pumpkin floating, tilted, tugging up -->
  <g>
    <ellipse cx="210" cy="190" rx="120" ry="105" fill="url(#np2p)"/>
    <g fill="#1a1a1a">
      <ellipse cx="150" cy="130" rx="13" ry="11"/>
      <ellipse cx="230" cy="115" rx="15" ry="13"/>
      <ellipse cx="290" cy="170" rx="14" ry="12"/>
      <ellipse cx="120" cy="210" rx="14" ry="12"/>
      <ellipse cx="200" cy="200" rx="17" ry="15"/>
      <ellipse cx="280" cy="240" rx="13" ry="11"/>
      <ellipse cx="170" cy="260" rx="15" ry="13"/>
    </g>
    <ellipse cx="150" cy="120" rx="28" ry="18" fill="#fff6c4" opacity="0.5"/>
    <!-- nervous stem -->
    <path d="M210 88 q-6 -20 -22 -26" fill="none" stroke="#3f7a3a" stroke-width="9" stroke-linecap="round"/>
    <!-- hook attached to bottom -->
    <path d="M200 296 q0 -14 10 -16 q12 -2 8 12" fill="none" stroke="#777c80" stroke-width="5"/>
  </g>
  <!-- sweat drops (worried pumpkin) -->
  <path d="M300 130 q-6 8 0 14 q8 -2 0 -14z" fill="#bfe0ff"/>
</svg>
