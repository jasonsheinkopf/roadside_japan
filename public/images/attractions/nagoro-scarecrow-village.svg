<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Handmade scarecrows waiting at a bus stop in a quiet mountain village">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfddc6"/><stop offset="1" stop-color="#eef1e3"/></linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8a63"/><stop offset="1" stop-color="#567049"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- mountains -->
  <path d="M0 260 L160 120 L320 260 Z" fill="#7e9a72"/>
  <path d="M240 270 L460 110 L660 270 Z" fill="url(#mtn)"/>
  <path d="M540 270 L720 150 L800 240 L800 270 Z" fill="#7e9a72"/>
  <!-- field/ground -->
  <rect y="300" width="800" height="200" fill="#a9b87a"/>
  <path d="M0 300 Q400 280 800 300 L800 340 L0 340Z" fill="#bcc98c"/>
  <!-- road -->
  <path d="M340 500 L460 500 L420 320 L380 320Z" fill="#9a9488"/>
  <!-- bus stop sign + bench -->
  <g transform="translate(120,250)">
    <rect x="40" y="0" width="8" height="120" fill="#7a6f5e"/>
    <rect x="14" y="0" width="60" height="30" rx="4" fill="#e8e2cf"/>
    <text x="44" y="20" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#6a5f4e">BUS</text>
    <rect x="0" y="150" width="120" height="10" fill="#8a7d68"/>
    <rect x="6" y="160" width="8" height="24" fill="#8a7d68"/><rect x="106" y="160" width="8" height="24" fill="#8a7d68"/>
  </g>
  <!-- scarecrow figures -->
  <g>
    <!-- seated at bench -->
    <g transform="translate(150,310)">
      <ellipse cx="30" cy="86" rx="26" ry="8" fill="#000" opacity="0.12"/>
      <circle cx="30" cy="16" r="18" fill="#efe3cf"/>
      <circle cx="24" cy="14" r="2.4" fill="#3a3128"/><circle cx="36" cy="14" r="2.4" fill="#3a3128"/>
      <path d="M24 22 q6 5 12 0" stroke="#b5715a" stroke-width="2" fill="none"/>
      <path d="M12 8 q18 -16 36 0 q-18 -6 -36 0z" fill="#8a6f4a"/>
      <rect x="12" y="32" width="36" height="44" rx="8" fill="#c0524a"/>
      <rect x="6" y="38" width="14" height="30" rx="6" fill="#c0524a"/><rect x="40" y="38" width="14" height="30" rx="6" fill="#c0524a"/>
      <rect x="16" y="74" width="12" height="22" rx="5" fill="#4a6a8a"/><rect x="32" y="74" width="12" height="22" rx="5" fill="#4a6a8a"/>
    </g>
    <!-- standing in field -->
    <g transform="translate(540,300)">
      <circle cx="30" cy="20" r="18" fill="#efe3cf"/>
      <circle cx="24" cy="18" r="2.4" fill="#3a3128"/><circle cx="36" cy="18" r="2.4" fill="#3a3128"/>
      <path d="M22 26 q8 4 16 0" stroke="#b5715a" stroke-width="2" fill="none"/>
      <path d="M8 12 a22 14 0 0 1 44 0z" fill="#c9a24a"/>
      <rect x="14" y="36" width="32" height="48" rx="8" fill="#5f8a5a"/>
      <rect x="-2" y="44" width="20" height="12" rx="5" fill="#5f8a5a" transform="rotate(-25 8 50)"/>
      <rect x="42" y="44" width="20" height="12" rx="5" fill="#5f8a5a" transform="rotate(25 52 50)"/>
      <rect x="16" y="82" width="12" height="26" rx="5" fill="#7a5a3a"/><rect x="32" y="82" width="12" height="26" rx="5" fill="#7a5a3a"/>
    </g>
    <!-- small one tending field -->
    <g transform="translate(660,340) scale(0.8)">
      <circle cx="20" cy="14" r="13" fill="#efe3cf"/>
      <circle cx="16" cy="13" r="2" fill="#3a3128"/><circle cx="24" cy="13" r="2" fill="#3a3128"/>
      <rect x="8" y="26" width="24" height="34" rx="6" fill="#8a6fae"/>
      <rect x="12" y="58" width="9" height="20" rx="4" fill="#5a4a6a"/><rect x="22" y="58" width="9" height="20" rx="4" fill="#5a4a6a"/>
    </g>
  </g>
</svg>
