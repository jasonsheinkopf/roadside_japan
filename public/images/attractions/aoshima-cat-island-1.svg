<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A contented cat sprawled asleep on an overturned blue fishing boat by the harbor">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3b3"/>
      <stop offset="1" stop-color="#ffc98a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky1)"/>
  <rect y="250" width="400" height="150" fill="#6fc3d6"/>
  <path d="M0 250 q40 12 80 0 t80 0 t80 0 t80 0 t80 0 v20 H0 Z" fill="#8fd5e3"/>
  <!-- overturned blue boat hull -->
  <path d="M60 290 q140 -70 280 0 q-140 40 -280 0 Z" fill="#2b6fb0"/>
  <path d="M60 290 q140 -70 280 0 q-140 12 -280 0 Z" fill="#3f8fd4"/>
  <line x1="90" y1="278" x2="310" y2="278" stroke="#1f5286" stroke-width="4"/>
  <!-- sleeping cat -->
  <g>
    <ellipse cx="200" cy="240" rx="95" ry="40" fill="#f4a55a"/>
    <ellipse cx="200" cy="246" rx="95" ry="30" fill="#e8923f"/>
    <!-- head -->
    <circle cx="118" cy="232" r="34" fill="#f4a55a"/>
    <polygon points="96,210 104,232 84,228" fill="#f4a55a"/>
    <polygon points="140,210 132,232 152,228" fill="#f4a55a"/>
    <polygon points="98,214 104,228 90,226" fill="#e8923f"/>
    <polygon points="138,214 132,228 146,226" fill="#e8923f"/>
    <!-- closed eyes -->
    <path d="M100 232 q8 6 16 0" fill="none" stroke="#3a2a18" stroke-width="3" stroke-linecap="round"/>
    <path d="M124 232 q8 6 16 0" fill="none" stroke="#3a2a18" stroke-width="3" stroke-linecap="round"/>
    <path d="M114 244 l4 4 l4 -4" fill="#d96a5a"/>
    <path d="M118 248 q-6 6 -14 4 M118 248 q6 6 14 4" fill="none" stroke="#3a2a18" stroke-width="2" stroke-linecap="round"/>
    <!-- stripes -->
    <path d="M170 218 q6 14 0 28 M210 214 q6 16 0 32 M250 218 q6 14 0 28" fill="none" stroke="#e8923f" stroke-width="6" stroke-linecap="round"/>
    <!-- curled tail -->
    <path d="M288 244 q40 -4 30 -34 q-2 -16 -20 -10" fill="none" stroke="#f4a55a" stroke-width="20" stroke-linecap="round"/>
  </g>
  <!-- z's -->
  <text x="150" y="180" font-family="sans-serif" font-size="26" fill="#7a5a2a" font-weight="bold">z</text>
  <text x="170" y="160" font-family="sans-serif" font-size="34" fill="#7a5a2a" font-weight="bold">Z</text>
</svg>
