<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A playful gag: the blue pond shown as a desktop wallpaper inside a cartoon computer monitor window">
  <defs>
    <linearGradient id="bp3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d9a0"/>
      <stop offset="1" stop-color="#e8b878"/>
    </linearGradient>
    <linearGradient id="bp3water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8fd0"/>
      <stop offset="1" stop-color="#1c63a8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bp3bg)"/>
  <!-- monitor body -->
  <rect x="40" y="50" width="320" height="240" rx="14" fill="#3a4150"/>
  <rect x="56" y="66" width="288" height="200" rx="6" fill="#cfe6d8"/>
  <!-- window title bar -->
  <rect x="56" y="66" width="288" height="26" rx="6" fill="#e8edf2"/>
  <rect x="56" y="80" width="288" height="12" fill="#e8edf2"/>
  <circle cx="72" cy="79" r="5" fill="#ff6b5e"/>
  <circle cx="90" cy="79" r="5" fill="#ffcf4d"/>
  <circle cx="108" cy="79" r="5" fill="#5ed17a"/>
  <text x="200" y="84" font-family="sans-serif" font-size="12" fill="#5a6470" text-anchor="middle">pond.jpg</text>
  <!-- wallpaper pond -->
  <rect x="56" y="92" width="288" height="174" fill="#bfe0d2"/>
  <rect x="56" y="160" width="288" height="106" fill="url(#bp3water)"/>
  <path d="M56 160 q72 -14 144 0 t144 0 v14 H56 Z" fill="#9fc8b8"/>
  <g stroke="#efe7d6" stroke-linecap="round" fill="none">
    <path d="M120 165 L114 250" stroke-width="7"/>
    <path d="M200 162 L206 256" stroke-width="9"/>
    <path d="M280 165 L274 250" stroke-width="7"/>
  </g>
  <g stroke="#6aaad8" stroke-width="2.5" opacity="0.5" fill="none">
    <path d="M70 210 q40 -6 80 0 t160 0"/>
    <path d="M70 240 q40 -6 80 0 t160 0"/>
  </g>
  <!-- cursor -->
  <polygon points="250,210 250,232 257,226 263,238 268,235 262,224 271,224" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <!-- stand -->
  <rect x="180" y="290" width="40" height="30" fill="#3a4150"/>
  <rect x="140" y="318" width="120" height="14" rx="6" fill="#2c3340"/>
</svg>
