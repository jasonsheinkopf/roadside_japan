<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A funny heroic golden statue of inventor Momofuku Ando holding a cup of noodles aloft like an Olympic torch">
  <defs>
    <radialGradient id="cn3bg" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff6df"/>
      <stop offset="1" stop-color="#e2a23a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset="0.5" stop-color="#e8b13a"/>
      <stop offset="1" stop-color="#b9851f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#cn3bg)"/>
  <!-- radiant glory rays -->
  <g stroke="#ffe7a8" stroke-width="10" opacity="0.5">
    <line x1="200" y1="200" x2="200" y2="-40"/>
    <line x1="200" y1="200" x2="40" y2="40"/>
    <line x1="200" y1="200" x2="360" y2="40"/>
    <line x1="200" y1="200" x2="0" y2="160"/>
    <line x1="200" y1="200" x2="400" y2="160"/>
  </g>
  <!-- pedestal -->
  <rect x="120" y="350" width="160" height="50" fill="url(#gold)"/>
  <rect x="140" y="338" width="120" height="16" fill="#cf9a2a"/>
  <!-- statue body, heroic -->
  <g fill="url(#gold)" stroke="#a9791c" stroke-width="2">
    <!-- legs -->
    <rect x="170" y="270" width="26" height="80" rx="6"/>
    <rect x="204" y="270" width="26" height="80" rx="6"/>
    <!-- torso -->
    <path d="M165 180 q35 -16 70 0 l8 100 h-86 z"/>
    <!-- raised arm holding cup -->
    <path d="M232 196 q40 -10 56 -70" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <!-- other arm on hip -->
    <path d="M168 200 q-26 6 -24 40" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- glorious cup noodle torch -->
  <g>
    <path d="M276 96 L312 96 L306 150 L282 150 Z" fill="url(#gold)" stroke="#a9791c" stroke-width="2"/>
    <ellipse cx="294" cy="96" rx="18" ry="6" fill="#fff0bf" stroke="#a9791c" stroke-width="2"/>
    <!-- steam flames -->
    <path d="M286 92 q-6 -22 8 -34 q14 12 8 34" fill="#fff4cf" opacity="0.9"/>
    <path d="M294 78 q0 -16 8 -24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- head, determined hero face -->
  <g fill="url(#gold)" stroke="#a9791c" stroke-width="2">
    <circle cx="200" cy="150" r="30"/>
  </g>
  <path d="M186 146 h6 m16 0 h6" stroke="#8a6516" stroke-width="3" stroke-linecap="round"/>
  <path d="M188 162 q12 8 24 0" fill="none" stroke="#8a6516" stroke-width="3" stroke-linecap="round"/>
  <!-- glasses (Ando wore glasses) -->
  <circle cx="190" cy="146" r="7" fill="none" stroke="#8a6516" stroke-width="2.5"/>
  <circle cx="210" cy="146" r="7" fill="none" stroke="#8a6516" stroke-width="2.5"/>
</svg>
