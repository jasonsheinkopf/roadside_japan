<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A weathered five-story wooden pagoda among towering ancient cedar trees">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a3a"/>
      <stop offset="1" stop-color="#5e7a55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#hsky)"/>
  <!-- misty light beams -->
  <g fill="#cfe3c0" opacity="0.12">
    <polygon points="200,0 260,0 200,500 120,500"/>
    <polygon points="560,0 620,0 700,500 600,500"/>
  </g>
  <!-- cedar trunks -->
  <g fill="#3b2c20">
    <rect x="60" y="0" width="46" height="500"/>
    <rect x="160" y="0" width="34" height="500"/>
    <rect x="620" y="0" width="44" height="500"/>
    <rect x="710" y="0" width="36" height="500"/>
  </g>
  <g fill="#4a3526" opacity="0.6">
    <rect x="72" y="0" width="10" height="500"/>
    <rect x="632" y="0" width="10" height="500"/>
  </g>
  <!-- cedar foliage tops -->
  <g fill="#26402c">
    <ellipse cx="83" cy="80" rx="60" ry="100"/>
    <ellipse cx="177" cy="60" rx="46" ry="90"/>
    <ellipse cx="642" cy="80" rx="58" ry="100"/>
    <ellipse cx="728" cy="60" rx="46" ry="90"/>
  </g>
  <!-- ground -->
  <path d="M0 440 Q400 410 800 440 V500 H0 Z" fill="#3a5234"/>
  <!-- pagoda -->
  <g>
    <rect x="360" y="430" width="80" height="40" fill="#5a4634"/>
    <!-- tiers from bottom to top -->
    <g fill="#6e5640">
      <polygon points="320,430 480,430 460,395 340,395"/>
      <rect x="350" y="370" width="100" height="28" fill="#5a4634"/>
      <polygon points="335,372 465,372 446,340 354,340"/>
      <rect x="362" y="316" width="76" height="26" fill="#5a4634"/>
      <polygon points="348,318 452,318 435,288 365,288"/>
      <rect x="372" y="266" width="56" height="24" fill="#5a4634"/>
      <polygon points="360,268 440,268 425,240 375,240"/>
      <rect x="382" y="220" width="36" height="22" fill="#5a4634"/>
      <polygon points="372,222 428,222 416,196 384,196"/>
    </g>
    <!-- finial -->
    <rect x="397" y="160" width="6" height="40" fill="#8a7250"/>
    <circle cx="400" cy="158" r="7" fill="#c9b079"/>
    <!-- roof shading -->
    <g fill="#574330" opacity="0.6">
      <polygon points="320,430 480,430 470,418 330,418"/>
      <polygon points="335,372 465,372 456,360 344,360"/>
    </g>
    <!-- door -->
    <rect x="388" y="408" width="24" height="62" fill="#3a2c1e"/>
  </g>
</svg>
