<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A small wooden temple hall perched on a forested cliff above a green river valley">
  <defs>
    <linearGradient id="ysky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f0"/>
      <stop offset="1" stop-color="#eaf6ef"/>
    </linearGradient>
    <linearGradient id="ycliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba65c"/>
      <stop offset="1" stop-color="#4f7d3c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ysky)"/>
  <circle cx="120" cy="100" r="46" fill="#fdf6df" opacity="0.7"/>
  <!-- distant hills -->
  <path d="M0 250 Q160 190 360 240 T800 220 V500 H0 Z" fill="#9fc77f" opacity="0.6"/>
  <!-- river valley -->
  <path d="M0 420 Q200 400 400 430 T800 410 V500 H0 Z" fill="#5fa6b8"/>
  <path d="M0 440 Q250 425 500 448 T800 435 V500 H0 Z" fill="#79bccb" opacity="0.7"/>
  <!-- cliff -->
  <path d="M380 500 L420 300 Q450 230 560 220 Q690 215 760 300 L780 500 Z" fill="url(#ycliff)"/>
  <path d="M380 500 L420 300 Q445 250 500 240 L520 500 Z" fill="#3f6b30" opacity="0.5"/>
  <!-- trees on cliff -->
  <g fill="#3c6b2e">
    <ellipse cx="600" cy="240" rx="26" ry="34"/>
    <ellipse cx="660" cy="260" rx="24" ry="30"/>
    <ellipse cx="700" cy="300" rx="28" ry="36"/>
    <ellipse cx="640" cy="320" rx="22" ry="28"/>
  </g>
  <!-- temple hall -->
  <g>
    <rect x="470" y="285" width="100" height="55" fill="#9a4a33"/>
    <rect x="470" y="285" width="100" height="14" fill="#7e3a28"/>
    <polygon points="455,285 585,285 565,250 475,250" fill="#caa05f"/>
    <polygon points="455,285 520,250 565,250 585,285" fill="#b58a4d"/>
    <rect x="490" y="305" width="16" height="35" fill="#5e2e20"/>
    <rect x="534" y="305" width="16" height="35" fill="#5e2e20"/>
    <!-- support posts -->
    <rect x="478" y="340" width="8" height="60" fill="#6b3a25"/>
    <rect x="554" y="340" width="8" height="60" fill="#6b3a25"/>
  </g>
</svg>
