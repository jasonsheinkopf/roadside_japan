<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="An orca leaping high in a show pool at a seaside aquarium by the ocean">
  <defs>
    <linearGradient id="osky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd6f0"/>
      <stop offset="1" stop-color="#d9f0ea"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#osky)"/>
  <circle cx="320" cy="70" r="28" fill="#fff2c4"/>
  <ellipse cx="90" cy="70" rx="40" ry="16" fill="#fff" opacity="0.8"/>
  <!-- ocean horizon behind -->
  <rect y="170" width="400" height="40" fill="#4f96c0"/>
  <path d="M0 170 q50 -6 100 0 t100 0 t100 0 t100 0" fill="none" stroke="#bfe6ff" stroke-width="2"/>
  <!-- pool -->
  <rect y="210" width="400" height="190" fill="#2f78b0"/>
  <rect y="210" width="400" height="20" fill="#4f96c0"/>
  <ellipse cx="200" cy="350" rx="180" ry="40" fill="#1f5e92" opacity="0.6"/>
  <!-- orca -->
  <g transform="translate(200,180) rotate(20)">
    <path d="M-30 90 Q-50 0 -10 -70 Q20 -110 40 -60 Q50 -10 30 80 Q0 100 -30 90 Z" fill="#1c1c24"/>
    <path d="M-22 60 Q-30 10 -6 -40 Q10 -60 18 -30 Q22 20 8 70 Q-8 78 -22 60 Z" fill="#f2f2ee"/>
    <ellipse cx="-2" cy="-50" rx="8" ry="4" fill="#f2f2ee"/>
    <polygon points="-6,-70 -28,-104 6,-80" fill="#1c1c24"/>
    <polygon points="28,-30 60,-44 36,0" fill="#2a2a34"/>
  </g>
  <!-- splash -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="300" r="10"/><circle cx="175" cy="290" r="7"/><circle cx="130" cy="290" r="6"/>
    <circle cx="200" cy="298" r="8"/><circle cx="115" cy="305" r="5"/>
  </g>
</svg>
