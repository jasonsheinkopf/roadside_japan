<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A museum hall with a towering jar holding a famously long tapeworm specimen">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a4a"/><stop offset="1" stop-color="#1d2733"/></linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe7e2"/><stop offset="0.5" stop-color="#eaf6f3"/><stop offset="1" stop-color="#bcd9d3"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wall)"/>
  <rect y="420" width="800" height="80" fill="#11171f"/>
  <!-- floor reflection line -->
  <rect y="420" width="800" height="4" fill="#3a4b5c"/>
  <!-- display cases on left -->
  <g fill="#243240" stroke="#3a4b5c" stroke-width="2">
    <rect x="40" y="220" width="120" height="200"/><rect x="40" y="220" width="120" height="40" fill="#37506a"/>
  </g>
  <g fill="#7fb0a8" opacity="0.7"><circle cx="80" cy="300" r="14"/><circle cx="120" cy="340" r="10"/><circle cx="95" cy="380" r="8"/></g>
  <!-- spotlight -->
  <path d="M400 0 L300 420 L500 420 Z" fill="#ffffff" opacity="0.06"/>
  <!-- the giant tapeworm jar (8.8m) -->
  <g transform="translate(360,90)">
    <rect x="-8" y="320" width="96" height="14" rx="4" fill="#4a5d70"/>
    <rect x="0" y="0" width="80" height="324" rx="14" fill="url(#jar)" opacity="0.92"/>
    <rect x="0" y="0" width="80" height="26" rx="12" fill="#9fb8c0"/>
    <!-- coiled tapeworm inside -->
    <path d="M20 40 C70 60 10 90 60 110 C12 130 70 150 18 172 C70 194 12 214 60 236 C14 256 68 278 24 300"
          fill="none" stroke="#f3ead0" stroke-width="9" stroke-linecap="round"/>
    <path d="M20 40 C70 60 10 90 60 110 C12 130 70 150 18 172 C70 194 12 214 60 236 C14 256 68 278 24 300"
          fill="none" stroke="#dccba0" stroke-width="3" stroke-dasharray="2 6"/>
    <rect x="8" y="34" width="14" height="280" rx="6" fill="#ffffff" opacity="0.25"/>
  </g>
  <!-- ribbon you can walk alongside -->
  <rect x="300" y="430" width="220" height="6" rx="3" fill="#d23c6a"/>
  <circle cx="300" cy="433" r="7" fill="#d23c6a"/><circle cx="520" cy="433" r="7" fill="#d23c6a"/>
  <text x="410" y="466" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#9fb0bf">8.8 m — actual length</text>
  <!-- gift shop keychain on right -->
  <g transform="translate(620,210)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#8aa0b0">gift shop</text>
    <circle cx="30" cy="70" r="34" fill="#f2c94c" opacity="0.85"/>
    <circle cx="30" cy="70" r="34" fill="none" stroke="#caa12f" stroke-width="3"/>
    <path d="M22 60 q8 14 16 0 q-6 24 -8 0z" fill="#b5733a"/>
    <circle cx="30" cy="34" r="6" fill="none" stroke="#9fb0bf" stroke-width="3"/>
    <line x1="30" y1="40" x2="30" y2="20" stroke="#9fb0bf" stroke-width="2"/>
  </g>
</svg>
