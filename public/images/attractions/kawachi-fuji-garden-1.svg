<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Looking straight up into a domed ceiling dripping with hanging violet wisteria blossoms">
  <defs>
    <radialGradient id="sky1" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f3e9ff"/>
      <stop offset="100%" stop-color="#b89adf"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky1)"/>
  <!-- dome ribs converging to center -->
  <g stroke="#6b4a8f" stroke-width="5" fill="none" opacity="0.7">
    <line x1="200" y1="200" x2="200" y2="0"/>
    <line x1="200" y1="200" x2="400" y2="200"/>
    <line x1="200" y1="200" x2="200" y2="400"/>
    <line x1="200" y1="200" x2="0" y2="200"/>
    <line x1="200" y1="200" x2="40" y2="40"/>
    <line x1="200" y1="200" x2="360" y2="40"/>
    <line x1="200" y1="200" x2="360" y2="360"/>
    <line x1="200" y1="200" x2="40" y2="360"/>
  </g>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#6b4a8f" stroke-width="4" opacity="0.5"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#6b4a8f" stroke-width="4" opacity="0.5"/>
  <!-- hanging clusters -->
  <g fill="#8e6dc4">
    <g transform="translate(200,40)"><ellipse cx="0" cy="30" rx="14" ry="40"/><circle cx="-6" cy="2" r="7"/><circle cx="6" cy="14" r="7"/><circle cx="-4" cy="28" r="6"/><circle cx="4" cy="44" r="5"/><circle cx="0" cy="60" r="4"/></g>
    <g transform="translate(110,120)"><ellipse cx="0" cy="28" rx="12" ry="34"/><circle cx="-5" cy="4" r="6"/><circle cx="5" cy="18" r="6"/><circle cx="0" cy="34" r="5"/><circle cx="3" cy="50" r="4"/></g>
    <g transform="translate(300,120)"><ellipse cx="0" cy="28" rx="12" ry="34"/><circle cx="-5" cy="4" r="6"/><circle cx="5" cy="18" r="6"/><circle cx="0" cy="34" r="5"/></g>
    <g transform="translate(70,250)"><ellipse cx="0" cy="26" rx="11" ry="30"/><circle cx="-4" cy="6" r="6"/><circle cx="4" cy="22" r="5"/><circle cx="0" cy="38" r="4"/></g>
    <g transform="translate(330,250)"><ellipse cx="0" cy="26" rx="11" ry="30"/><circle cx="-4" cy="6" r="6"/><circle cx="4" cy="22" r="5"/><circle cx="0" cy="38" r="4"/></g>
    <g transform="translate(150,330)"><ellipse cx="0" cy="24" rx="11" ry="28"/><circle cx="-4" cy="6" r="6"/><circle cx="4" cy="22" r="5"/></g>
    <g transform="translate(260,330)"><ellipse cx="0" cy="24" rx="11" ry="28"/><circle cx="-4" cy="6" r="6"/><circle cx="4" cy="22" r="5"/></g>
  </g>
  <g fill="#c9a8ec" opacity="0.8">
    <ellipse cx="200" cy="70" rx="9" ry="26"/>
    <ellipse cx="110" cy="148" rx="8" ry="22"/>
    <ellipse cx="300" cy="148" rx="8" ry="22"/>
  </g>
  <circle cx="200" cy="200" r="14" fill="#5a3d7a"/>
</svg>
