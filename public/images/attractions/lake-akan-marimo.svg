  </defs>
  <rect width="800" height="500" fill="url(#asky)"/>
  <circle cx="660" cy="85" r="40" fill="#fff4c4"/>
  <path d="M0 200 L120 120 L240 200 Z" fill="#3f6e4a"/>
  <path d="M180 210 L340 110 L500 210 Z" fill="#356040"/>
