    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fb0"/>
      <stop offset="1" stop-color="#1b5e78"/>
    </linearGradient>
    <radialGradient id="mball" cx="0.35" cy="0.35" r="0.8">
