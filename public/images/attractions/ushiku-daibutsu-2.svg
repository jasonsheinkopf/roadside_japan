<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A scale gag: an enormous bronze Buddha statue towering next to a tiny Statue of Liberty for comparison">
  <defs>
    <linearGradient id="ud2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f0"/>
      <stop offset="1" stop-color="#e8f4ea"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#ud2sky)"/>
  <rect x="0" y="350" width="400" height="50" fill="#7cae6a"/>
  <!-- giant buddha -->
  <rect x="90" y="320" width="140" height="40" fill="#4f7a62"/>
  <path d="M100 320V150q0 -60 60 -60t60 60v170z" fill="#6f9a7e"/>
  <path d="M100 320V150q0 -60 60 -60" stroke="#4f7a62" stroke-width="0" fill="none"/>
  <!-- head -->
  <circle cx="160" cy="110" r="40" fill="#7fae8c"/>
  <g fill="#5c8a72">
    <circle cx="142" cy="86" r="5"/><circle cx="156" cy="80" r="5"/>
    <circle cx="170" cy="80" r="5"/><circle cx="180" cy="86" r="5"/>
  </g>
  <circle cx="160" cy="68" r="8" fill="#7fae8c"/>
  <path d="M148 112q12 8 24 0" stroke="#4f7a62" stroke-width="3" fill="none"/>
  <circle cx="150" cy="106" r="2" fill="#3f6650"/><circle cx="170" cy="106" r="2" fill="#3f6650"/>
  <!-- robe folds -->
  <g stroke="#4f7a62" stroke-width="4" opacity="0.5" fill="none">
    <path d="M120 200q40 60 0 120"/>
    <path d="M200 200q-40 60 0 120"/>
  </g>
  <!-- tiny statue of liberty -->
  <g transform="translate(310 290)">
    <rect x="-14" y="70" width="28" height="20" fill="#9a8a76"/>
    <rect x="-8" y="20" width="16" height="52" fill="#7fb8a8"/>
    <circle cx="0" cy="10" r="10" fill="#7fb8a8"/>
    <g fill="#7fb8a8">
      <rect x="-2" y="-12" width="4" height="10"/>
      <rect x="-9" y="-9" width="4" height="9"/>
      <rect x="5" y="-9" width="4" height="9"/>
      <rect x="-15" y="-3" width="4" height="8"/>
      <rect x="11" y="-3" width="4" height="8"/>
    </g>
    <rect x="6" y="-18" width="4" height="22" fill="#7fb8a8"/>
    <circle cx="8" cy="-22" r="5" fill="#ffd35c"/>
  </g>
  <text x="290" y="240" font-family="sans-serif" font-size="18" fill="#3f6650">vs</text>
</svg>
