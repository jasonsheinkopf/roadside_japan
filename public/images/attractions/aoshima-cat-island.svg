  <rect x="0" y="360" width="800" height="14" fill="#b8a079"/>
  <!-- cats -->
  <g transform="translate(120,300)">
    <ellipse cx="40" cy="78" rx="42" ry="22" fill="#3a3a3a"/>
    <circle cx="14" cy="56" r="20" fill="#3a3a3a"/>
    <path d="M-2 44 l8 -16 8 12 z M14 40 l6 -16 8 14 z" fill="#3a3a3a"/>
    <path d="M78 64 q26 -8 14 -34" stroke="#3a3a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="56" r="3" fill="#ffd84d"/><circle cx="20" cy="56" r="3" fill="#ffd84d"/>
  </g>
  <g transform="translate(330,318)">
    <ellipse cx="40" cy="70" rx="44" ry="24" fill="#e08c3a"/>
    <circle cx="68" cy="46" r="22" fill="#e08c3a"/>
    <path d="M52 30 l4 -18 12 14 z M74 28 l8 -16 8 18 z" fill="#e08c3a"/>
    <g stroke="#b9701f" stroke-width="4"><path d="M16 56 h40"/><path d="M18 70 h44"/></g>
    <path d="M2 66 q-24 -6 -12 -30" stroke="#e08c3a" stroke-width="11" fill="none" stroke-linecap="round"/>
    <circle cx="62" cy="46" r="3.2" fill="#2c2c2c"/><circle cx="74" cy="46" r="3.2" fill="#2c2c2c"/>
    <path d="M64 54 l4 4 4 -4" stroke="#2c2c2c" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(560,330)">
    <ellipse cx="40" cy="64" rx="40" ry="22" fill="#f4f1ec"/>
    <circle cx="16" cy="44" r="19" fill="#f4f1ec"/>
    <path d="M0 32 l6 -16 10 12 z M16 28 l8 -14 8 16 z" fill="#f4f1ec"/>
    <ellipse cx="40" cy="64" rx="40" ry="22" fill="none" stroke="#d9d3c8" stroke-width="2"/>
    <circle cx="10" cy="44" r="2.8" fill="#5a7d8c"/><circle cx="22" cy="44" r="2.8" fill="#5a7d8c"/>
  </g>
