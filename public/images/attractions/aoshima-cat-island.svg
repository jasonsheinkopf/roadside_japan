<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Cats lounging on a sleepy harbor island">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/><stop offset="1" stop-color="#eaf6fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4d6"/><stop offset="1" stop-color="#357fac"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="92" r="46" fill="#fff3c4"/>
  <circle cx="660" cy="92" r="46" fill="#ffe08a" opacity="0.5"/>
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="180" cy="110" rx="52" ry="18"/><ellipse cx="230" cy="100" rx="40" ry="16"/>
    <ellipse cx="430" cy="70" rx="44" ry="15"/>
  </g>
  <!-- island -->
  <ellipse cx="430" cy="300" rx="320" ry="70" fill="#7bbf6a"/>
  <ellipse cx="430" cy="300" rx="320" ry="70" fill="#5fa84f" opacity="0.4"/>
  <rect width="800" height="200" y="300" fill="url(#sea)"/>
  <!-- ferry -->
  <g transform="translate(540,300)">
    <path d="M0 18 L96 18 L84 42 L12 42 Z" fill="#e7ecef"/>
    <rect x="20" y="2" width="52" height="18" rx="3" fill="#d23c3c"/>
    <rect x="44" y="-10" width="8" height="14" fill="#888"/>
  </g>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="120" cy="430" rx="60" ry="6"/><ellipse cx="700" cy="400" rx="50" ry="5"/></g>
  <!-- harbor wall -->
