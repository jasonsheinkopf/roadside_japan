<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A funny visitor in a t-shirt shivering between giant snow walls under a bright blue spring sky">
  <defs>
    <linearGradient id="sky15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9ee0"/>
      <stop offset="1" stop-color="#a9dcf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky15)"/>
  <circle cx="330" cy="70" r="40" fill="#fff3b0"/>
  <circle cx="330" cy="70" r="52" fill="#fff3b0" opacity="0.4"/>
  <rect x="0" y="330" width="400" height="70" fill="#e6f0f6"/>
  <!-- left snow wall -->
  <polygon points="0,60 120,110 120,400 0,400" fill="#ffffff"/>
  <polygon points="0,60 120,110 120,400 0,400" fill="#d8eaf4" opacity="0.5"/>
  <line x1="10" y1="180" x2="110" y2="215" stroke="#c4dae8" stroke-width="3" opacity="0.7"/>
  <line x1="10" y1="290" x2="110" y2="315" stroke="#c4dae8" stroke-width="3" opacity="0.7"/>
  <!-- right snow wall -->
  <polygon points="400,60 280,110 280,400 400,400" fill="#ffffff"/>
  <polygon points="400,60 280,110 280,400 400,400" fill="#d8eaf4" opacity="0.5"/>
  <line x1="390" y1="180" x2="290" y2="215" stroke="#c4dae8" stroke-width="3" opacity="0.7"/>
  <line x1="390" y1="290" x2="290" y2="315" stroke="#c4dae8" stroke-width="3" opacity="0.7"/>
  <!-- shivering visitor in t-shirt -->
  <g transform="translate(200,250)">
    <ellipse cx="0" cy="92" rx="40" ry="14" fill="#cdd9e2"/>
    <rect x="-30" y="14" width="60" height="78" rx="14" fill="#f2c24a"/>
    <rect x="-10" y="60" width="20" height="32" fill="#3b6ea8"/>
    <circle cx="0" cy="-22" r="30" fill="#f4cda3"/>
    <path d="M-30 -28 q30 -36 60 0 q-30 -16 -60 0 z" fill="#3b2a1c"/>
    <circle cx="-10" cy="-22" r="3" fill="#2a2018"/>
    <circle cx="10" cy="-22" r="3" fill="#2a2018"/>
    <path d="M-12 -6 q12 8 24 0" stroke="#a86a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="-16" cy="-8" rx="6" ry="4" fill="#7cc4e8" opacity="0.7"/>
    <ellipse cx="16" cy="-8" rx="6" ry="4" fill="#7cc4e8" opacity="0.7"/>
    <!-- shivering arms hugging self -->
    <path d="M-30 30 q-16 14 14 20" stroke="#f2c24a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M30 30 q16 14 -14 20" stroke="#f2c24a" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>
  <!-- shiver marks -->
  <g stroke="#bfe6fb" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M150 210 l10 8 l-10 8"/>
    <path d="M250 210 l-10 8 l10 8"/>
  </g>
</svg>
