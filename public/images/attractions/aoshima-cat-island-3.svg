<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A single dignified cat sitting atop a stone harbor wall like the island's self-appointed mayor">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#ffb56b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky3)"/>
  <circle cx="320" cy="90" r="46" fill="#fff1cf" opacity="0.8"/>
  <rect y="300" width="400" height="100" fill="#5fb0c8"/>
  <path d="M0 300 q50 10 100 0 t100 0 t100 0 t100 0 v10 H0 Z" fill="#7ec6da"/>
  <!-- stone wall -->
  <rect y="250" width="400" height="60" fill="#bdb6a6"/>
  <g stroke="#9c9484" stroke-width="2" fill="none">
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="60" y1="250" x2="60" y2="280"/><line x1="140" y1="250" x2="140" y2="280"/>
    <line x1="220" y1="250" x2="220" y2="280"/><line x1="300" y1="250" x2="300" y2="280"/>
    <line x1="100" y1="280" x2="100" y2="310"/><line x1="200" y1="280" x2="200" y2="310"/>
    <line x1="300" y1="280" x2="300" y2="310"/>
  </g>
  <!-- dignified mayor cat -->
  <g>
    <ellipse cx="200" cy="252" rx="50" ry="14" fill="#3a2a1a" opacity="0.15"/>
    <path d="M165 250 q-6 -70 35 -70 q41 0 35 70 Z" fill="#4a4a4a"/>
    <path d="M178 250 q-2 -40 22 -40 q24 0 22 40 Z" fill="#f5f0e6"/>
    <!-- tail wrapped -->
    <path d="M248 248 q24 -2 18 -22" fill="none" stroke="#4a4a4a" stroke-width="14" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="200" cy="170" r="38" fill="#4a4a4a"/>
    <polygon points="172,148 184,172 158,166" fill="#4a4a4a"/>
    <polygon points="228,148 216,172 242,166" fill="#4a4a4a"/>
    <polygon points="174,152 183,168 164,164" fill="#e08a8a"/>
    <polygon points="226,152 217,168 236,164" fill="#e08a8a"/>
    <ellipse cx="186" cy="170" rx="7" ry="9" fill="#f5d142"/>
    <ellipse cx="214" cy="170" rx="7" ry="9" fill="#f5d142"/>
    <ellipse cx="186" cy="172" rx="2.5" ry="6" fill="#222"/>
    <ellipse cx="214" cy="172" rx="2.5" ry="6" fill="#222"/>
    <polygon points="196,184 204,184 200,190" fill="#e08a8a"/>
    <path d="M200 190 q-7 7 -16 5 M200 190 q7 7 16 5" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <line x1="172" y1="178" x2="148" y2="174" stroke="#fff" stroke-width="1.5"/>
    <line x1="228" y1="178" x2="252" y2="174" stroke="#fff" stroke-width="1.5"/>
  </g>
  <text x="200" y="392" font-family="sans-serif" font-size="30" fill="#7a4a1a" font-weight="bold" text-anchor="middle">MAYOR</text>
</svg>
