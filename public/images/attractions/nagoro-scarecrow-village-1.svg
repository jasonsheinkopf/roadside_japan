<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A schoolroom full of life-size handmade scarecrow students sitting at wooden desks, slightly uncanny">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7dcc4"/>
      <stop offset="100%" stop-color="#cdbf9e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg7)"/>
  <!-- floor -->
  <rect x="0" y="300" width="400" height="100" fill="#b89a6a"/>
  <!-- blackboard -->
  <rect x="30" y="30" width="340" height="90" rx="6" fill="#3a4a3a" stroke="#7a5a3a" stroke-width="8"/>
  <text x="200" y="85" font-family="sans-serif" font-size="22" fill="#dfe7d8" text-anchor="middle">ABC</text>
  <!-- scarecrow students at desks -->
  <g>
    <!-- back row -->
    <g transform="translate(110,170) scale(0.8)">
      <rect x="-35" y="60" width="70" height="40" fill="#9a7a4a"/>
      <ellipse cx="0" cy="-20" rx="24" ry="26" fill="#e8d2a8"/>
      <circle cx="-9" cy="-22" r="4" fill="#000"/><circle cx="9" cy="-22" r="4" fill="#000"/>
      <path d="M-9 -6 q9 8 18 0" stroke="#a06" stroke-width="3" fill="none"/>
      <rect x="-26" y="6" width="52" height="56" rx="8" fill="#c25a4a"/>
    </g>
    <g transform="translate(290,170) scale(0.8)">
      <rect x="-35" y="60" width="70" height="40" fill="#9a7a4a"/>
      <ellipse cx="0" cy="-20" rx="24" ry="26" fill="#e8d2a8"/>
      <circle cx="-9" cy="-22" r="4" fill="#000"/><circle cx="9" cy="-22" r="4" fill="#000"/>
      <path d="M-9 -8 q9 4 18 0" stroke="#a06" stroke-width="3" fill="none"/>
      <rect x="-26" y="6" width="52" height="56" rx="8" fill="#5a8a4a"/>
    </g>
    <!-- front row -->
    <g transform="translate(120,260)">
      <rect x="-38" y="66" width="76" height="48" fill="#a8854f"/>
      <ellipse cx="0" cy="-22" rx="28" ry="30" fill="#e8d2a8"/>
      <circle cx="-10" cy="-24" r="5" fill="#000"/><circle cx="10" cy="-24" r="5" fill="#000"/>
      <path d="M-10 -6 q10 10 20 0" stroke="#a06" stroke-width="3" fill="none"/>
      <ellipse cx="-18" cy="-40" rx="10" ry="20" fill="#5a3a1a" transform="rotate(-20 -18 -40)"/>
      <ellipse cx="18" cy="-40" rx="10" ry="20" fill="#5a3a1a" transform="rotate(20 18 -40)"/>
      <rect x="-30" y="8" width="60" height="64" rx="10" fill="#4a7ac2"/>
    </g>
    <g transform="translate(285,260)">
      <rect x="-38" y="66" width="76" height="48" fill="#a8854f"/>
      <ellipse cx="0" cy="-22" rx="28" ry="30" fill="#e8d2a8"/>
      <circle cx="-10" cy="-24" r="5" fill="#000"/><circle cx="10" cy="-24" r="5" fill="#000"/>
      <path d="M-10 -4 q10 6 20 0" stroke="#a06" stroke-width="3" fill="none"/>
      <rect x="-30" y="8" width="60" height="64" rx="10" fill="#e0a23a"/>
    </g>
  </g>
</svg>
