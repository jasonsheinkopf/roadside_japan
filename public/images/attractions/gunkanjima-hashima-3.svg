<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A funny side-by-side comparison: the island's silhouette next to an actual battleship outline, showing they match">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6dd"/>
      <stop offset="1" stop-color="#aab4bf"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg9)"/>
  <rect x="0" y="280" width="400" height="120" fill="#7e8c98"/>
  <text x="100" y="60" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3a434c" text-anchor="middle">ISLAND</text>
  <text x="300" y="60" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3a434c" text-anchor="middle">WARSHIP</text>
  <text x="200" y="230" font-family="sans-serif" font-size="40" font-weight="bold" fill="#d24b3a" text-anchor="middle">=</text>
  <!-- island silhouette -->
  <g transform="translate(20,90)">
    <path d="M0 190 q80 -16 160 0 z" fill="#46505a"/>
    <rect x="20" y="120" width="120" height="70" fill="#525c66"/>
    <g fill="#3e474f">
      <rect x="26" y="80" width="20" height="110"/>
      <rect x="52" y="60" width="24" height="130"/>
      <rect x="84" y="90" width="20" height="100"/>
      <rect x="112" y="70" width="22" height="120"/>
    </g>
  </g>
  <!-- battleship outline -->
  <g transform="translate(220,100)">
    <path d="M0 175 q80 -10 160 0 q-10 22 -30 22 l-100 0 q-20 0 -30 -22 z" fill="#46505a"/>
    <rect x="40" y="120" width="80" height="55" fill="#525c66"/>
    <rect x="64" y="70" width="34" height="50" fill="#525c66"/>
    <rect x="74" y="20" width="14" height="50" fill="#3e474f"/>
    <polygon points="20,120 50,120 44,140 26,140" fill="#3e474f"/>
    <polygon points="110,120 140,120 134,140 116,140" fill="#3e474f"/>
    <line x1="81" y1="20" x2="81" y2="0" stroke="#3e474f" stroke-width="4"/>
  </g>
</svg>
