<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A brilliant starry night sky full of stars arching over the dark silhouette of a remote island">
  <defs>
    <linearGradient id="ag2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1130"/>
      <stop offset="0.6" stop-color="#162a55"/>
      <stop offset="1" stop-color="#2a4a72"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#ag2sky)"/>
  <!-- milky way arch band -->
  <path d="M-20 60 Q200 200 420 60 L420 140 Q200 280 -20 140 Z" fill="#3a4d80" opacity="0.35"/>
  <!-- dense stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="2.2"/>
    <circle cx="90" cy="30" r="1.6"/>
    <circle cx="140" cy="60" r="2.8"/>
    <circle cx="190" cy="40" r="1.8"/>
    <circle cx="240" cy="70" r="2.4"/>
    <circle cx="300" cy="40" r="1.6"/>
    <circle cx="350" cy="64" r="2.6"/>
    <circle cx="380" cy="30" r="1.8"/>
    <circle cx="60" cy="110" r="1.8"/>
    <circle cx="120" cy="130" r="2.4"/>
    <circle cx="200" cy="110" r="3"/>
    <circle cx="270" cy="130" r="1.8"/>
    <circle cx="330" cy="120" r="2.2"/>
    <circle cx="30" cy="170" r="2.2"/>
    <circle cx="100" cy="190" r="1.6"/>
    <circle cx="160" cy="170" r="2"/>
    <circle cx="230" cy="185" r="2.6"/>
    <circle cx="300" cy="175" r="1.8"/>
    <circle cx="370" cy="190" r="2.4"/>
    <circle cx="70" cy="230" r="1.6"/>
    <circle cx="150" cy="225" r="2.2"/>
    <circle cx="260" cy="235" r="1.8"/>
    <circle cx="340" cy="225" r="2"/>
  </g>
  <!-- a few big twinkle stars -->
  <g fill="#fff4c0">
    <g>
      <circle cx="110" cy="80" r="3.4"/>
      <path d="M110 70 v20 M100 80 h20" stroke="#fff4c0" stroke-width="1.4"/>
    </g>
    <g>
      <circle cx="300" cy="95" r="3.4"/>
      <path d="M300 85 v20 M290 95 h20" stroke="#fff4c0" stroke-width="1.4"/>
    </g>
  </g>
  <!-- shooting star -->
  <path d="M250 50 L300 75" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- sea reflection -->
  <rect x="0" y="330" width="400" height="70" fill="#142848"/>
  <g stroke="#2a4a72" stroke-width="2" opacity="0.6">
    <line x1="40" y1="350" x2="120" y2="350"/>
    <line x1="200" y1="360" x2="300" y2="360"/>
    <line x1="60" y1="375" x2="180" y2="375"/>
  </g>
  <!-- island silhouette -->
  <path d="M70 330 Q120 250 200 246 Q280 250 330 330 Z" fill="#05080f"/>
  <!-- inner cone bump -->
  <path d="M170 300 Q200 252 230 300 Z" fill="#0a0f1a"/>
</svg>
