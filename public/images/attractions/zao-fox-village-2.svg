<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A sly red fox eyeing a tossed food pellet frozen in mid-air, about to pounce">
  <defs>
    <linearGradient id="z2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebf2"/>
      <stop offset="1" stop-color="#f2f6f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#z2bg)"/>
  <ellipse cx="200" cy="350" rx="280" ry="110" fill="#ffffff"/>
  <!-- crouching fox body -->
  <path d="M70 300 q40 -70 130 -60 q40 4 60 30 q30 36 70 30 q-10 30 -50 34 q-100 10 -160 -2 q-40 -8 -50 -32z" fill="#e2603a"/>
  <ellipse cx="100" cy="300" rx="34" ry="24" fill="#e2603a"/>
  <!-- bushy tail up -->
  <path d="M250 300 q70 0 100 -60 q-40 -24 -90 6z" fill="#d9542f"/>
  <path d="M320 252 q20 -10 26 -30 q-22 -2 -34 22z" fill="#fff5ef"/>
  <!-- head, sly look, lowered -->
  <g>
    <polygon points="78,250 70,222 100,244" fill="#e2603a"/>
    <polygon points="118,248 128,222 138,254" fill="#e2603a"/>
    <ellipse cx="100" cy="270" rx="40" ry="32" fill="#e87a4f"/>
    <path d="M62 268 q38 36 78 0 q-10 26 -40 28 q-32 -2 -38 -28z" fill="#fff5ef"/>
    <!-- sly half-closed eyes -->
    <path d="M78 258 q10 -8 22 -2" fill="none" stroke="#3a2218" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M104 256 q10 -6 20 0" fill="none" stroke="#3a2218" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="100" cy="288" rx="5" ry="4" fill="#3a2218"/>
    <path d="M88 296 q12 6 24 0" fill="none" stroke="#3a2218" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- pellet mid-air with motion -->
  <circle cx="300" cy="120" r="14" fill="#9a6b3f"/>
  <circle cx="300" cy="120" r="14" fill="none" stroke="#7a5230" stroke-width="2"/>
  <path d="M260 90 q24 8 36 24" fill="none" stroke="#c9b08e" stroke-width="3" stroke-linecap="round"/>
  <path d="M250 110 q26 4 42 18" fill="none" stroke="#c9b08e" stroke-width="3" stroke-linecap="round"/>
  <!-- snow puffs -->
  <circle cx="80" cy="340" r="10" fill="#f4faf7"/>
  <circle cx="180" cy="350" r="14" fill="#f4faf7"/>
</svg>
