  </defs>
  <rect width="400" height="400" fill="url(#z3bg)"/>
  <ellipse cx="200" cy="350" rx="290" ry="120" fill="#ffffff"/>
  <!-- sign post -->
  <rect x="86" y="120" width="12" height="220" fill="#8a6a4a"/>
  <rect x="40" y="120" width="104" height="76" rx="8" fill="#f3f3f0" stroke="#c23b3b" stroke-width="6"/>
  <circle cx="92" cy="150" r="16" fill="none" stroke="#c23b3b" stroke-width="6"/>
  <line x1="81" y1="139" x2="103" y2="161" stroke="#c23b3b" stroke-width="6"/>
  <text x="92" y="186" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">NO TOUCH</text>
  <!-- cheeky fox -->
  <g>
    <path d="M200 320 q30 -70 110 -56 q40 8 50 36 q-6 26 -44 30 q-80 8 -110 -10z" fill="#e2603a"/>
    <path d="M300 300 q60 6 78 -50 q-40 -16 -78 16z" fill="#d9542f"/>
