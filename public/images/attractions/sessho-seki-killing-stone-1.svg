<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A large volcanic rock split in two on a steaming yellow sulfur field, a nine-tailed fox spirit looming">
  <rect width="400" height="400" fill="#d9c34a"/>
  <rect width="400" height="160" fill="#9c8f3a"/>
  <!-- sulfur field -->
  <path d="M0 200 Q200 170 400 200 L400 400 L0 400 Z" fill="#e3cf55"/>
  <ellipse cx="120" cy="320" rx="60" ry="18" fill="#c9b43e"/>
  <ellipse cx="300" cy="300" rx="50" ry="16" fill="#c9b43e"/>
  <!-- steam -->
  <path d="M90 300 Q80 260 95 235 Q108 215 98 190" stroke="#fff" stroke-width="7" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M310 285 Q300 250 314 228 Q326 210 316 188" stroke="#fff" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- fox spirit looming -->
  <g opacity="0.85">
    <path d="M200 30 Q150 70 165 120 Q150 90 180 70 Q170 100 200 110 Q230 100 220 70 Q250 90 235 120 Q250 70 200 30 Z" fill="#f3792f"/>
    <ellipse cx="200" cy="115" rx="34" ry="26" fill="#f7913f"/>
    <polygon points="172,98 162,72 186,90" fill="#f3792f"/>
    <polygon points="228,98 238,72 214,90" fill="#f3792f"/>
    <circle cx="188" cy="112" r="5" fill="#fff"/>
    <circle cx="212" cy="112" r="5" fill="#fff"/>
    <circle cx="188" cy="112" r="2.5" fill="#b22"/>
    <circle cx="212" cy="112" r="2.5" fill="#b22"/>
    <polygon points="200,124 192,134 208,134" fill="#fff"/>
  </g>
  <!-- split rock -->
  <g>
    <polygon points="100,360 130,250 185,250 195,360" fill="#4a4a4a"/>
    <polygon points="205,360 215,250 270,250 300,360" fill="#5a5a5a"/>
    <polygon points="100,360 130,250 185,250 160,290 195,360" fill="#3a3a3a" opacity="0.5"/>
    <line x1="185" y1="250" x2="195" y2="360" stroke="#222" stroke-width="3"/>
    <line x1="215" y1="250" x2="205" y2="360" stroke="#222" stroke-width="3"/>
    <!-- shimenawa rope -->
    <rect x="120" y="278" width="170" height="12" fill="#e8dca0"/>
  </g>
  <text x="200" y="392" font-family="sans-serif" font-size="18" fill="#5a4a18" text-anchor="middle" font-weight="bold">KILLING STONE</text>
</svg>
