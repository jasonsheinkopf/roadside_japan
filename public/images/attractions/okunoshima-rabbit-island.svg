<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Wild rabbits on a grassy island chasing a bag of pellets">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdeaf3"/><stop offset="1" stop-color="#eef9fb"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#92c96e"/><stop offset="1" stop-color="#6fb24f"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="120" cy="100" r="42" fill="#fff4cf"/>
  <ellipse cx="640" cy="120" rx="60" ry="20" fill="#ffffff" opacity="0.85"/><ellipse cx="690" cy="110" rx="44" ry="16" fill="#fff" opacity="0.85"/>
  <!-- sea -->
  <rect y="250" width="800" height="60" fill="#5aa7c9"/>
  <!-- far ruins (poison gas factory) -->
  <g fill="#9fa6a0" opacity="0.7"><rect x="300" y="214" width="36" height="40"/><rect x="344" y="226" width="20" height="28"/><rect x="372" y="220" width="14" height="34"/></g>
  <rect y="290" width="800" height="210" fill="url(#grass)"/>
  <!-- food bag -->
  <g transform="translate(610,300)">
    <path d="M0 0 h70 v74 h-70 z" fill="#e8c27a"/>
    <path d="M0 0 q35 -22 70 0 z" fill="#d6ab5c"/>
    <text x="35" y="48" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#7a5a1f">🥕</text>
  </g>
  <!-- rabbits -->
  <g fill="#f7f4ee" stroke="#ddd6c8" stroke-width="2">
    <g transform="translate(120,330)">
      <ellipse cx="40" cy="64" rx="46" ry="30"/><circle cx="78" cy="40" r="20"/>
      <ellipse cx="74" cy="14" rx="6" ry="20"/><ellipse cx="88" cy="16" rx="6" ry="18"/>
      <ellipse cx="6" cy="60" rx="10" ry="9"/>
      <circle cx="84" cy="38" r="2.6" fill="#cf6a6a" stroke="none"/>
      <path d="M88 46 l3 3 3 -3" stroke="#a06868" stroke-width="1.6" fill="none"/>
    </g>
    <g transform="translate(300,360) scale(0.8)">
      <ellipse cx="40" cy="64" rx="46" ry="30"/><circle cx="78" cy="40" r="20"/>
      <ellipse cx="72" cy="16" rx="6" ry="18"/><ellipse cx="86" cy="18" rx="6" ry="16"/>
      <circle cx="84" cy="40" r="2.6" fill="#cf6a6a" stroke="none"/>
    </g>
    <g transform="translate(450,330) scale(0.9)">
      <ellipse cx="40" cy="64" rx="46" ry="30"/><circle cx="80" cy="40" r="20"/>
      <ellipse cx="78" cy="14" rx="6" ry="20"/><ellipse cx="92" cy="16" rx="6" ry="18"/>
      <circle cx="86" cy="38" r="2.6" fill="#cf6a6a" stroke="none"/>
    </g>
    <g transform="translate(225,300) scale(0.6)">
      <ellipse cx="40" cy="64" rx="46" ry="30"/><circle cx="78" cy="40" r="20"/>
      <ellipse cx="74" cy="16" rx="6" ry="18"/><ellipse cx="88" cy="18" rx="6" ry="16"/>
      <circle cx="84" cy="40" r="2.6" fill="#cf6a6a" stroke="none"/>
    </g>
  </g>
  <g fill="#5fa83f"><path d="M40 470 q6 -22 12 0z" /><path d="M520 480 q6 -20 12 0z"/><path d="M700 470 q6 -22 12 0z"/></g>
</svg>
