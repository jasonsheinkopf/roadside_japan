<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A vast hall full of historic Japanese trains including a bullet-train nose">
  <rect width="400" height="400" fill="#dfe6ec"/>
  <!-- hall -->
  <rect width="400" height="120" fill="#c3ccd6"/>
  <path d="M0 120 L400 120 L360 60 L40 60 Z" fill="#aab5c2"/>
  <line x1="120" y1="0" x2="120" y2="120" stroke="#d6dde4" stroke-width="6"/>
  <line x1="280" y1="0" x2="280" y2="120" stroke="#d6dde4" stroke-width="6"/>
  <rect y="320" width="400" height="80" fill="#9aa6b2"/>
  <!-- rails -->
  <g stroke="#6b7682" stroke-width="3">
    <line x1="40" y1="380" x2="360" y2="380"/>
    <line x1="60" y1="345" x2="340" y2="345"/>
  </g>
  <!-- bullet train nose -->
  <g>
    <path d="M70 200 Q70 150 160 160 L160 300 L70 300 Z" fill="#1d6fb8"/>
    <path d="M70 200 Q70 150 160 160 L160 185 L80 200 Z" fill="#eef4f8"/>
    <rect x="76" y="190" width="60" height="22" rx="6" fill="#2b2b2b"/>
    <rect x="70" y="225" width="90" height="20" fill="#e63946"/>
    <circle cx="95" cy="300" r="14" fill="#333"/>
    <circle cx="140" cy="300" r="14" fill="#333"/>
  </g>
  <!-- classic train -->
  <g>
    <rect x="200" y="170" width="170" height="130" rx="8" fill="#3b7a3b"/>
    <rect x="215" y="190" width="40" height="40" fill="#cfeecf"/>
    <rect x="270" y="190" width="40" height="40" fill="#cfeecf"/>
    <rect x="325" y="190" width="40" height="40" fill="#cfeecf"/>
    <rect x="200" y="260" width="170" height="16" fill="#f4c542"/>
    <circle cx="235" cy="300" r="15" fill="#333"/>
    <circle cx="300" cy="300" r="15" fill="#333"/>
    <circle cx="350" cy="300" r="15" fill="#333"/>
  </g>
  <text x="200" y="395" font-family="sans-serif" font-size="20" fill="#1d3557" text-anchor="middle" font-weight="bold">RAILWAY</text>
</svg>
