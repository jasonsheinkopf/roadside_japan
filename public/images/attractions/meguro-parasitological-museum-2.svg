<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A wide-eyed visitor standing next to a very long coiled tapeworm specimen ribbon labeled 8.8 m">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef1f6"/>
      <stop offset="100%" stop-color="#c3cad8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)"/>
  <rect x="0" y="350" width="400" height="50" fill="#9aa3b5"/>
  <!-- display case -->
  <rect x="40" y="40" width="180" height="320" rx="10" fill="#ffffff" opacity="0.55" stroke="#aeb6c6" stroke-width="3"/>
  <!-- coiled tapeworm ribbon -->
  <g fill="none" stroke="#f0e0c0" stroke-width="14" stroke-linecap="round">
    <path d="M70 70 q90 0 90 28 q0 28 -90 28 q-90 0 -90 28 q0 28 90 28 q90 0 90 28 q0 28 -90 28 q-90 0 -90 28 q0 28 90 28 q90 0 90 28"/>
  </g>
  <g stroke="#d8c49a" stroke-width="1.5">
    <line x1="40" y1="84" x2="200" y2="84"/>
    <line x1="40" y1="140" x2="200" y2="140"/>
    <line x1="40" y1="196" x2="200" y2="196"/>
    <line x1="40" y1="252" x2="200" y2="252"/>
    <line x1="40" y1="308" x2="200" y2="308"/>
  </g>
  <rect x="118" y="316" width="84" height="30" rx="6" fill="#ffe08a" stroke="#c9a04a" stroke-width="2"/>
  <text x="160" y="338" font-family="sans-serif" font-size="20" fill="#7a5a1a" text-anchor="middle" font-weight="bold">8.8 m</text>
  <!-- wide-eyed visitor -->
  <g transform="translate(310,210)">
    <ellipse cx="0" cy="135" rx="40" ry="18" fill="#7a8296" opacity="0.4"/>
    <rect x="-30" y="40" width="60" height="100" rx="22" fill="#e07a4a"/>
    <circle cx="0" cy="0" r="40" fill="#f4c89c"/>
    <path d="M-40 -8 q40 -44 80 0 q-8 -34 -40 -34 q-32 0 -40 34" fill="#5a4030"/>
    <circle cx="-15" cy="2" r="13" fill="#fff"/>
    <circle cx="15" cy="2" r="13" fill="#fff"/>
    <circle cx="-13" cy="4" r="6" fill="#2a2018"/>
    <circle cx="17" cy="4" r="6" fill="#2a2018"/>
    <ellipse cx="0" cy="28" rx="7" ry="10" fill="#c98060"/>
  </g>
</svg>
