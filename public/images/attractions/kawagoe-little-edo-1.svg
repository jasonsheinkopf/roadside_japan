<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A street of black clay-walled Edo-era warehouses and a wooden bell tower">
  <rect width="400" height="400" fill="#f4d8a8"/>
  <rect y="280" width="400" height="120" fill="#b89a6e"/>
  <circle cx="60" cy="60" r="32" fill="#ffe08a"/>
  <!-- warehouses -->
  <g>
    <rect x="20" y="200" width="120" height="100" fill="#3a3a3a"/>
    <polygon points="10,200 150,200 80,150" fill="#222"/>
    <rect x="35" y="230" width="40" height="70" fill="#5a5a5a"/>
    <rect x="90" y="230" width="35" height="50" fill="#7a7a7a"/>
  </g>
  <g>
    <rect x="260" y="210" width="120" height="90" fill="#3a3a3a"/>
    <polygon points="250,210 390,210 320,160" fill="#222"/>
    <rect x="275" y="240" width="35" height="60" fill="#5a5a5a"/>
    <rect x="325" y="240" width="40" height="60" fill="#7a7a7a"/>
  </g>
  <!-- bell tower center -->
  <g>
    <rect x="170" y="120" width="60" height="180" fill="#9c7a4a"/>
    <rect x="160" y="180" width="80" height="14" fill="#7a5c34"/>
    <polygon points="155,120 245,120 200,80" fill="#5a4226"/>
    <polygon points="150,80 250,80 200,55" fill="#3a2b18"/>
    <rect x="185" y="195" width="30" height="40" fill="#3a2b18"/>
    <rect x="178" y="250" width="44" height="50" fill="#7a5c34"/>
  </g>
  <text x="200" y="390" font-family="sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">LITTLE EDO</text>
</svg>
