<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A misty path through towering cedars lined with mossy stone lanterns and tombs">
  <defs>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe7df"/><stop offset="1" stop-color="#c4d0c4"/></linearGradient>
    <linearGradient id="cedar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5e48"/><stop offset="1" stop-color="#34452f"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#mist)"/>
  <!-- towering cedars receding -->
  <g fill="url(#cedar)">
    <rect x="40" y="0" width="60" height="500"/><rect x="150" y="40" width="44" height="460"/>
    <rect x="700" y="0" width="64" height="500"/><rect x="610" y="40" width="44" height="460"/>
    <rect x="250" y="120" width="28" height="380"/><rect x="540" y="120" width="28" height="380"/>
  </g>
  <!-- canopy haze -->
  <rect width="800" height="160" fill="#d2dcd0" opacity="0.6"/>
  <g fill="#3f5238" opacity="0.5"><ellipse cx="120" cy="60" rx="160" ry="60"/><ellipse cx="680" cy="50" rx="170" ry="64"/></g>
  <!-- path -->
  <path d="M330 500 L470 500 L420 200 L380 200 Z" fill="#9a958a"/>
  <g stroke="#857f74" stroke-width="3"><line x1="345" y1="460" x2="455" y2="460"/><line x1="356" y1="400" x2="444" y2="400"/><line x1="366" y1="330" x2="434" y2="330"/><line x1="374" y1="270" x2="426" y2="270"/></g>
  <!-- light shafts -->
  <path d="M360 0 L300 280 L420 280 Z" fill="#f4f6ea" opacity="0.18"/>
  <!-- stone lanterns lining the path -->
  <g fill="#8f8a7e">
    <g transform="translate(250,300)"><rect x="-4" y="40" width="20" height="40" rx="2"/><rect x="-12" y="20" width="36" height="22" rx="3"/><path d="M-16 20 l28 -16 28 16z" fill="#7a7568"/><rect x="-2" y="-2" width="16" height="10" rx="2"/><rect x="0" y="26" width="12" height="10" fill="#ffcf6e"/></g>
    <g transform="translate(520,300) scale(-1,1)"><rect x="-4" y="40" width="20" height="40" rx="2"/><rect x="-12" y="20" width="36" height="22" rx="3"/><path d="M-16 20 l28 -16 28 16z" fill="#7a7568"/><rect x="-2" y="-2" width="16" height="10" rx="2"/><rect x="0" y="26" width="12" height="10" fill="#ffcf6e"/></g>
    <g transform="translate(300,250) scale(0.7)"><rect x="-4" y="40" width="20" height="40" rx="2"/><rect x="-12" y="20" width="36" height="22" rx="3"/><path d="M-16 20 l28 -16 28 16z" fill="#7a7568"/><rect x="0" y="26" width="12" height="10" fill="#ffcf6e"/></g>
    <g transform="translate(478,250) scale(0.7)"><rect x="-4" y="40" width="20" height="40" rx="2"/><rect x="-12" y="20" width="36" height="22" rx="3"/><path d="M-16 20 l28 -16 28 16z" fill="#7a7568"/><rect x="0" y="26" width="12" height="10" fill="#ffcf6e"/></g>
  </g>
  <!-- mossy tombs/stupas -->
  <g>
    <g transform="translate(190,360)"><rect x="0" y="20" width="40" height="60" fill="#9a958a"/><circle cx="20" cy="14" r="16" fill="#9a958a"/><path d="M0 70 q20 -10 40 0 l0 10 -40 0z" fill="#6f8a52"/></g>
    <g transform="translate(580,360)"><rect x="0" y="20" width="40" height="60" fill="#9a958a"/><circle cx="20" cy="14" r="16" fill="#9a958a"/><path d="M0 70 q20 -10 40 0 l0 10 -40 0z" fill="#6f8a52"/></g>
  </g>
  <!-- moss on path edges -->
  <g fill="#6f8a52" opacity="0.7"><ellipse cx="350" cy="492" rx="40" ry="8"/><ellipse cx="455" cy="492" rx="40" ry="8"/></g>
</svg>
