<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A tiny person dwarfed beside a towering vertical wall of snow, with a height marker reading 20 m">
  <defs>
    <linearGradient id="sky13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec0ec"/>
      <stop offset="1" stop-color="#c8e8f8"/>
    </linearGradient>
    <linearGradient id="snow13" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e8f2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky13)"/>
  <rect x="0" y="300" width="400" height="100" fill="#e8f1f7"/>
  <!-- towering snow wall -->
  <rect x="40" y="20" width="220" height="320" fill="url(#snow13)"/>
  <path d="M40 20 q40 16 0 40 q40 16 0 40 q40 16 0 40 q40 16 0 40 q40 16 0 40 q40 16 0 40 q40 16 0 40 q40 16 0 40" fill="#cfe2ee"/>
  <g stroke="#bcd5e4" stroke-width="3" fill="none" opacity="0.7">
    <line x1="60" y1="60" x2="240" y2="50"/>
    <line x1="55" y1="140" x2="245" y2="130"/>
    <line x1="60" y1="230" x2="240" y2="220"/>
  </g>
  <!-- height marker -->
  <line x1="290" y1="30" x2="290" y2="330" stroke="#c8362a" stroke-width="5"/>
  <polygon points="290,30 282,46 298,46" fill="#c8362a"/>
  <polygon points="290,330 282,314 298,314" fill="#c8362a"/>
  <rect x="300" y="155" width="76" height="48" rx="6" fill="#fff"/>
  <rect x="300" y="155" width="76" height="48" rx="6" fill="none" stroke="#c8362a" stroke-width="3"/>
  <text x="338" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#c8362a" text-anchor="middle">20 m</text>
  <!-- tiny person -->
  <g transform="translate(155,300)">
    <ellipse cx="0" cy="36" rx="16" ry="6" fill="#cdd9e2"/>
    <rect x="-9" y="0" width="18" height="34" rx="6" fill="#d24b3a"/>
    <circle cx="0" cy="-10" r="11" fill="#f4cda3"/>
    <path d="M-11 -12 q11 -14 22 0 z" fill="#3b2a1c"/>
    <circle cx="-3" cy="-10" r="1.5" fill="#2a2018"/>
    <circle cx="4" cy="-10" r="1.5" fill="#2a2018"/>
    <path d="M-12 8 q-10 6 -4 14" stroke="#d24b3a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
