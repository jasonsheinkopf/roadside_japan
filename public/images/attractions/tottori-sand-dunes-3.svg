<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="An impressively intricate sculpture carved entirely out of sand at a sand museum">
  <defs>
    <linearGradient id="td3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="1" stop-color="#1c1a2a"/>
    </linearGradient>
    <linearGradient id="td3sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d49a"/>
      <stop offset="1" stop-color="#c79a5e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#td3bg)"/>
  <ellipse cx="200" cy="200" rx="180" ry="160" fill="#ffe9b0" opacity="0.12"/>
  <rect x="0" y="320" width="400" height="80" fill="#15131f"/>
  <!-- pedestal -->
  <rect x="120" y="300" width="160" height="40" fill="#2a2638"/>
  <ellipse cx="200" cy="300" rx="80" ry="14" fill="#3a3550"/>
  <!-- sand castle/cathedral sculpture -->
  <g fill="url(#td3sand)">
    <rect x="150" y="160" width="100" height="140"/>
    <polygon points="200,90 250,160 150,160"/>
    <rect x="120" y="200" width="34" height="100"/>
    <polygon points="137,160 154,200 120,200"/>
    <rect x="246" y="200" width="34" height="100"/>
    <polygon points="263,160 280,200 246,200"/>
  </g>
  <!-- detail -->
  <g fill="#a87c48">
    <path d="M185 300V250q15 -22 30 0v50z"/>
    <circle cx="200" cy="140" r="14"/>
    <rect x="132" y="220" width="10" height="20"/>
    <rect x="258" y="220" width="10" height="20"/>
  </g>
  <g fill="#e8c98a">
    <rect x="166" y="200" width="14" height="40"/>
    <rect x="220" y="200" width="14" height="40"/>
  </g>
  <polygon points="200,130 206,140 200,150 194,140" fill="#fff" opacity="0.6"/>
  <!-- spotlight glow -->
  <polygon points="180,30 220,30 280,120 120,120" fill="#fff" opacity="0.12"/>
</svg>
