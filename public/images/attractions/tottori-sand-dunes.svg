<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Wind-rippled sand dunes sloping to the sea, with a camel at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd07a"/><stop offset="1" stop-color="#ffeccb"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fb0"/><stop offset="1" stop-color="#2f7596"/></linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d29a"/><stop offset="1" stop-color="#d8b574"/></linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c184"/><stop offset="1" stop-color="#c8a05c"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="180" cy="120" r="52" fill="#fff2c8"/>
  <!-- sea -->
  <rect y="170" width="800" height="60" fill="url(#sea)"/>
  <g fill="#fff" opacity="0.3"><ellipse cx="300" cy="205" rx="60" ry="5"/><ellipse cx="620" cy="200" rx="70" ry="5"/></g>
  <!-- far dune ridge dropping to sea -->
  <path d="M0 230 Q300 190 800 235 L800 300 L0 300 Z" fill="url(#dune2)"/>
  <!-- mid dune -->
  <path d="M0 300 Q260 250 520 300 Q660 326 800 300 L800 420 L0 420Z" fill="url(#dune1)"/>
  <!-- ripple lines -->
  <g stroke="#c8a85e" stroke-width="2" fill="none" opacity="0.6">
    <path d="M40 330 Q200 312 360 332"/><path d="M120 360 Q300 342 480 362"/><path d="M260 392 Q440 374 640 394"/>
  </g>
  <!-- foreground dune -->
  <path d="M0 420 Q300 380 800 430 L800 500 L0 500Z" fill="#caa45c"/>
  <g stroke="#a8843e" stroke-width="2" fill="none" opacity="0.6"><path d="M60 460 Q300 432 540 462"/><path d="M300 488 Q520 470 760 490"/></g>
  <!-- camel -->
  <g transform="translate(470,300)">
    <ellipse cx="50" cy="92" rx="60" ry="12" fill="#000" opacity="0.12"/>
    <path d="M10 80 q4 -34 30 -34 l40 0 q26 0 30 34" fill="#c79a5e"/>
    <path d="M40 50 q8 -22 18 0z M62 50 q8 -22 18 0z" fill="#c79a5e"/>
    <!-- neck + head -->
    <path d="M80 60 q26 -6 30 -34 q2 -16 -10 -16 q-10 0 -10 12 q-2 18 -22 24z" fill="#c79a5e"/>
    <ellipse cx="98" cy="14" rx="10" ry="7" fill="#c79a5e"/>
    <circle cx="104" cy="10" r="2" fill="#2c2420"/>
    <path d="M88 12 q-8 -4 -10 -12" stroke="#c79a5e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- legs -->
    <g stroke="#b5894e" stroke-width="8" stroke-linecap="round"><line x1="28" y1="78" x2="24" y2="118"/><line x1="48" y1="80" x2="46" y2="118"/><line x1="70" y1="80" x2="74" y2="118"/><line x1="88" y1="78" x2="94" y2="118"/></g>
  </g>
</svg>
