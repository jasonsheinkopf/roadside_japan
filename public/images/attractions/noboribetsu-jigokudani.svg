<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A steaming red volcanic crater valley with a boardwalk and a friendly demon statue">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb6c4"/><stop offset="1" stop-color="#e0ebf0"/></linearGradient>
    <linearGradient id="crater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9743f"/><stop offset="1" stop-color="#9a4a28"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- autumn maple hills around rim -->
  <path d="M0 250 Q150 150 320 220 Q480 290 640 180 Q740 130 800 200 L800 320 L0 320Z" fill="#c45a2a"/>
  <path d="M0 270 Q150 190 320 250 Q480 310 640 220 Q740 180 800 240 L800 340 L0 340Z" fill="#d77a36" opacity="0.8"/>
  <!-- crater bowl -->
  <path d="M0 320 Q400 280 800 320 L800 500 L0 500Z" fill="url(#crater)"/>
  <path d="M0 360 Q400 330 800 360" fill="none" stroke="#7a3a1f" stroke-width="3" opacity="0.5"/>
  <!-- red/ochre vent patches -->
  <g fill="#e0a064" opacity="0.6"><ellipse cx="200" cy="430" rx="90" ry="24"/><ellipse cx="600" cy="450" rx="110" ry="26"/></g>
  <g fill="#b9542b"><ellipse cx="430" cy="400" rx="60" ry="18"/></g>
  <!-- steam columns -->
  <g opacity="0.55" stroke="#ffffff" stroke-width="15" fill="none" stroke-linecap="round">
    <path d="M220 410 q-26 -54 4 -100 q22 -34 -2 -70"/>
    <path d="M430 390 q26 -50 -2 -96 q-22 -36 4 -70"/>
    <path d="M610 430 q-22 -46 4 -86"/>
  </g>
  <!-- boardwalk -->
  <path d="M330 500 L470 500 L420 360 L380 360Z" fill="#9a7b54"/>
  <g stroke="#7a5e3c" stroke-width="3"><line x1="345" y1="470" x2="455" y2="470"/><line x1="360" y1="430" x2="440" y2="430"/><line x1="372" y1="395" x2="428" y2="395"/></g>
  <!-- coughing tiny tourist on boardwalk -->
  <g transform="translate(396,395)"><circle cx="0" cy="-16" r="9" fill="#f0c49a"/><rect x="-9" y="-8" width="18" height="26" rx="6" fill="#3f7a9a"/><path d="M10 -18 q10 -2 14 4" stroke="#fff" stroke-width="3" fill="none" opacity="0.7"/></g>
  <!-- blue oni demon statue waving with club -->
  <g transform="translate(610,300)">
    <ellipse cx="40" cy="180" rx="60" ry="14" fill="#000" opacity="0.12"/>
    <ellipse cx="40" cy="120" rx="44" ry="50" fill="#4f86c6"/>
    <circle cx="20" cy="74" r="38" fill="#4f86c6"/>
    <path d="M-4 46 l-4 -20 18 12z M44 46 l4 -20 -18 12z" fill="#f2e9c0"/>
    <circle cx="10" cy="70" r="6" fill="#fff"/><circle cx="32" cy="70" r="6" fill="#fff"/>
    <circle cx="11" cy="71" r="3" fill="#22303f"/><circle cx="33" cy="71" r="3" fill="#22303f"/>
    <path d="M2 86 q18 14 36 0 q-18 18 -36 0z" fill="#234a78"/>
    <rect x="6" y="86" width="6" height="7" fill="#fff"/><rect x="28" y="86" width="6" height="7" fill="#fff"/>
    <!-- waving arm -->
    <path d="M-12 110 q-26 -10 -28 -40" stroke="#4f86c6" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- club -->
    <g transform="translate(76,96) rotate(18)"><rect x="0" y="-6" width="60" height="22" rx="10" fill="#8a6a3a"/><g fill="#6a4f28"><circle cx="16" cy="0" r="3"/><circle cx="34" cy="6" r="3"/><circle cx="48" cy="-2" r="3"/></g></g>
  </g>
</svg>
