<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A wooden boardwalk leading into billowing steam with a tiny tourist coughing on the sulfur fumes">
  <defs>
    <linearGradient id="sky12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d3bc"/>
      <stop offset="1" stop-color="#c79a72"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky12)"/>
  <ellipse cx="200" cy="380" rx="240" ry="80" fill="#8a4d30"/>
  <rect x="0" y="220" width="400" height="60" fill="#a86a40" opacity="0.5"/>
  <!-- boardwalk perspective -->
  <polygon points="150,400 250,400 230,200 170,200" fill="#a87844"/>
  <g stroke="#7a5028" stroke-width="3">
    <line x1="172" y1="220" x2="228" y2="220"/>
    <line x1="166" y1="260" x2="234" y2="260"/>
    <line x1="158" y1="320" x2="242" y2="320"/>
    <line x1="150" y1="390" x2="250" y2="390"/>
  </g>
  <line x1="170" y1="200" x2="150" y2="400" stroke="#6a4422" stroke-width="4"/>
  <line x1="230" y1="200" x2="250" y2="400" stroke="#6a4422" stroke-width="4"/>
  <!-- billowing steam -->
  <g fill="#f2f2ee" opacity="0.92">
    <ellipse cx="200" cy="150" rx="70" ry="50"/>
    <ellipse cx="140" cy="180" rx="55" ry="42"/>
    <ellipse cx="270" cy="175" rx="58" ry="44"/>
    <ellipse cx="200" cy="110" rx="50" ry="40"/>
    <ellipse cx="110" cy="140" rx="40" ry="34"/>
    <ellipse cx="300" cy="135" rx="42" ry="34"/>
  </g>
  <!-- tiny coughing tourist -->
  <g transform="translate(120,295)">
    <ellipse cx="0" cy="40" rx="18" ry="7" fill="#7a4d2e"/>
    <rect x="-11" y="0" width="22" height="38" rx="7" fill="#e0a23a"/>
    <circle cx="0" cy="-12" r="13" fill="#f4cda3"/>
    <path d="M-13 -16 q13 -16 26 0 q-13 -8 -26 0 z" fill="#3b2a1c"/>
    <circle cx="-4" cy="-12" r="1.8" fill="#2a2018"/>
    <circle cx="5" cy="-12" r="1.8" fill="#2a2018"/>
    <ellipse cx="0" cy="-5" rx="4" ry="5" fill="#7a3f2a"/>
    <path d="M-14 8 q-10 -2 -6 8" stroke="#e0a23a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M16 -10 q8 -2 6 6" stroke="#bfc4b0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M20 -16 q10 -4 9 4" stroke="#bfc4b0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
