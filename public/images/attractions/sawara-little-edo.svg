<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A willow-lined canal with old Edo-era merchant houses and a small wooden boat">
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeaf2"/>
      <stop offset="1" stop-color="#eef6ea"/>
    </linearGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa8b8"/>
      <stop offset="1" stop-color="#4e8493"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ssky)"/>
  <!-- Houses -->
  <g>
    <rect x="40" y="160" width="140" height="160" fill="#e8e0d0"/>
    <polygon points="30,160 190,160 170,120 50,120" fill="#5a4a3a"/>
    <rect x="60" y="200" width="30" height="40" fill="#3a2a22"/>
    <rect x="110" y="200" width="30" height="40" fill="#3a2a22"/>
    <rect x="200" y="180" width="150" height="140" fill="#d8cdb8"/>
    <polygon points="190,180 360,180 338,140 212,140" fill="#4a3a2e"/>
    <rect x="230" y="220" width="34" height="44" fill="#7a5a3a"/>
    <rect x="290" y="220" width="34" height="44" fill="#7a5a3a"/>
  </g>
  <!-- Willows -->
  <g stroke="#5fae47" stroke-width="3">
    <line x1="420" y1="120" x2="420" y2="300"/>
    <line x1="420" y1="160" x2="390" y2="290"/>
    <line x1="420" y1="160" x2="450" y2="290"/>
    <line x1="420" y1="160" x2="405" y2="295"/>
    <line x1="420" y1="160" x2="438" y2="295"/>
  </g>
  <circle cx="420" cy="150" r="40" fill="#7cc85f" opacity="0.85"/>
  <!-- Canal -->
  <rect y="320" width="800" height="180" fill="url(#canal)"/>
  <g stroke="#5a4a3a" stroke-width="8">
    <line x1="40" y1="320" x2="760" y2="320"/>
  </g>
  <g stroke="#9fc8d2" stroke-width="3" opacity="0.6">
    <line x1="100" y1="370" x2="300" y2="370"/>
    <line x1="450" y1="410" x2="700" y2="410"/>
  </g>
  <!-- Boat -->
  <g>
    <path d="M520 400 Q560 380 640 400 L630 430 L530 430 Z" fill="#8a5a32"/>
    <path d="M520 400 Q560 388 640 400" fill="none" stroke="#6a3f22" stroke-width="4"/>
    <rect x="555" y="378" width="50" height="8" fill="#6a3f22"/>
  </g>
</svg>
