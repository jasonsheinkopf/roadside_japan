<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A row of meticulously shaped miniature bonsai trees on display stands">
  <rect width="400" height="400" fill="#efe2cf"/>
  <rect y="250" width="400" height="150" fill="#d8c2a0"/>
  <rect y="250" width="400" height="14" fill="#c4ab85"/>
  <!-- bonsai 1 -->
  <g>
    <rect x="50" y="300" width="70" height="60" fill="#8c4a2f"/>
    <rect x="40" y="290" width="90" height="14" fill="#6b3622"/>
    <rect x="80" y="220" width="10" height="80" fill="#5a3a22"/>
    <path d="M85 240 Q60 230 55 245" stroke="#5a3a22" stroke-width="7" fill="none"/>
    <ellipse cx="55" cy="235" rx="30" ry="20" fill="#3f7d33"/>
    <ellipse cx="100" cy="225" rx="34" ry="22" fill="#4f9040"/>
    <ellipse cx="85" cy="200" rx="40" ry="24" fill="#5fa847"/>
  </g>
  <!-- bonsai 2 center taller -->
  <g>
    <rect x="160" y="305" width="80" height="55" fill="#3a6ea5"/>
    <rect x="150" y="295" width="100" height="14" fill="#2c5680"/>
    <rect x="195" y="180" width="12" height="120" fill="#5a3a22"/>
    <path d="M201 220 Q240 205 250 230" stroke="#5a3a22" stroke-width="8" fill="none"/>
    <ellipse cx="200" cy="175" rx="46" ry="26" fill="#5fa847"/>
    <ellipse cx="250" cy="210" rx="32" ry="20" fill="#4f9040"/>
    <ellipse cx="160" cy="200" rx="30" ry="18" fill="#3f7d33"/>
  </g>
  <!-- bonsai 3 -->
  <g>
    <rect x="290" y="300" width="70" height="60" fill="#8c4a2f"/>
    <rect x="280" y="290" width="90" height="14" fill="#6b3622"/>
    <rect x="320" y="225" width="10" height="75" fill="#5a3a22"/>
    <ellipse cx="325" cy="220" rx="38" ry="24" fill="#5fa847"/>
    <ellipse cx="300" cy="235" rx="26" ry="16" fill="#4f9040"/>
  </g>
  <text x="200" y="392" font-family="sans-serif" font-size="22" fill="#5a3a22" text-anchor="middle" font-weight="bold">BONSAI</text>
</svg>
