<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="An elegant English-Renaissance government building with a clock tower">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#acd2ea"/>
      <stop offset="1" stop-color="#f3e6d5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky3)"/>
  <rect y="350" width="400" height="50" fill="#9aa17f"/>
  <!-- main building -->
  <rect x="20" y="220" width="360" height="130" fill="#f6f1e7"/>
  <rect x="20" y="210" width="360" height="14" fill="#d8cfbd"/>
