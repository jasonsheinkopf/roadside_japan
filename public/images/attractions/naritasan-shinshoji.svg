<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A grand Japanese temple complex with a three-story pagoda and a large main hall">
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf5"/>
      <stop offset="1" stop-color="#f3ecdf"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#nsky)"/>
  <circle cx="660" cy="100" r="44" fill="#ffe9a8"/>
  <g fill="#bcd9a0">
    <circle cx="80" cy="200" r="40"/><circle cx="130" cy="210" r="35"/><circle cx="40" cy="220" r="30"/>
  </g>
  <rect y="360" width="800" height="140" fill="#cdbf9e"/>
  <rect y="360" width="800" height="14" fill="#b8a884"/>
  <!-- Pagoda -->
  <g>
    <rect x="180" y="320" width="80" height="40" fill="#b03a2e"/>
    <g fill="#7a3a2e">
      <polygon points="160,320 280,320 260,290 180,290"/>
      <polygon points="170,272 270,272 252,246 188,246"/>
      <polygon points="178,232 262,232 246,208 194,208"/>
      <polygon points="186,196 254,196 240,176 200,176"/>
    </g>
    <rect x="208" y="290" width="24" height="30" fill="#e8c97a"/>
    <rect x="212" y="248" width="16" height="24" fill="#e8c97a"/>
    <line x1="220" y1="176" x2="220" y2="140" stroke="#c9a23a" stroke-width="5"/>
    <circle cx="220" cy="138" r="6" fill="#c9a23a"/>
  </g>
  <!-- Main hall -->
  <g>
    <rect x="430" y="290" width="280" height="80" fill="#c0392b"/>
    <polygon points="400,290 740,290 700,230 440,230" fill="#7a3a2e"/>
    <polygon points="400,290 740,290 720,272 420,272" fill="#5e2c22"/>
    <rect x="470" y="310" width="40" height="60" fill="#e8c97a"/>
    <rect x="540" y="310" width="40" height="60" fill="#3a2a22"/>
    <rect x="610" y="310" width="40" height="60" fill="#e8c97a"/>
    <line x1="570" y1="230" x2="570" y2="200" stroke="#c9a23a" stroke-width="5"/>
    <circle cx="570" cy="198" r="6" fill="#c9a23a"/>
  </g>
  <!-- Steps -->
  <g fill="#b8a884">
    <rect x="500" y="372" width="150" height="8"/>
    <rect x="510" y="382" width="130" height="8"/>
  </g>
</svg>
