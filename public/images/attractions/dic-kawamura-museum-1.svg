<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A modern art museum set in green gardens with outdoor sculptures and a pond">
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#e9f4e6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#msky)"/>
  <circle cx="330" cy="60" r="26" fill="#fff2c4"/>
  <g fill="#7fc066"><circle cx="40" cy="140" r="34"/><circle cx="90" cy="150" r="28"/></g>
  <rect y="160" width="400" height="120" fill="#9bd17e"/>
  <!-- museum building -->
  <g transform="translate(160,90)">
    <rect x="0" y="20" width="180" height="80" fill="#e6e2da"/>
    <rect x="0" y="20" width="180" height="14" fill="#c9c4b8"/>
    <polygon points="0,20 90,-10 180,20" fill="#cfae6a"/>
    <rect x="14" y="44" width="30" height="46" fill="#7fa8c2"/>
    <rect x="54" y="44" width="30" height="46" fill="#7fa8c2"/>
    <rect x="94" y="44" width="30" height="46" fill="#7fa8c2"/>
    <rect x="134" y="44" width="30" height="46" fill="#7fa8c2"/>
  </g>
  <!-- pond -->
  <ellipse cx="120" cy="320" rx="110" ry="50" fill="#5ea0c0"/>
  <ellipse cx="120" cy="320" rx="110" ry="50" fill="#7ec0dd" opacity="0.4"/>
  <ellipse cx="90" cy="312" rx="40" ry="14" fill="#ffffff" opacity="0.3"/>
  <rect y="370" width="400" height="30" fill="#6fb058"/>
  <!-- sculptures -->
  <g transform="translate(300,250)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#d6453a" stroke-width="12"/>
  </g>
  <g transform="translate(360,300)">
    <rect x="-8" y="-40" width="16" height="40" fill="#3a6e92"/>
    <circle cx="0" cy="-48" r="14" fill="#f0b341"/>
  </g>
  <g transform="translate(250,320)">
    <polygon points="0,0 18,-34 36,0" fill="#e0c34a"/>
  </g>
</svg>
