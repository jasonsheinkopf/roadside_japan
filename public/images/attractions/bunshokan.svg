<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An elegant English-Renaissance government building with a clock tower">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d4ec"/>
      <stop offset="1" stop-color="#e8eef2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky3)"/>
  <circle cx="120" cy="90" r="44" fill="#fff6dc" opacity="0.85"/>
  <rect x="0" y="420" width="800" height="80" fill="#9bb27e"/>
  <!-- main building -->
  <rect x="80" y="220" width="640" height="200" fill="#f2ede2"/>
  <rect x="80" y="220" width="640" height="18" fill="#dcd2bf"/>
  <!-- wings windows -->
  <g fill="#7fa6c4" stroke="#cdbf9f" stroke-width="2">
    <rect x="110" y="260" width="30" height="60"/><rect x="160" y="260" width="30" height="60"/><rect x="210" y="260" width="30" height="60"/><rect x="260" y="260" width="30" height="60"/>
    <rect x="510" y="260" width="30" height="60"/><rect x="560" y="260" width="30" height="60"/><rect x="610" y="260" width="30" height="60"/><rect x="660" y="260" width="30" height="60"/>
  </g>
  <g fill="#7fa6c4" stroke="#cdbf9f" stroke-width="2">
    <rect x="110" y="350" width="30" height="50"/><rect x="160" y="350" width="30" height="50"/><rect x="610" y="350" width="30" height="50"/><rect x="660" y="350" width="30" height="50"/>
  </g>
  <!-- central entrance -->
  <rect x="340" y="240" width="120" height="180" fill="#ece5d6"/>
  <rect x="370" y="320" width="60" height="100" fill="#6b4a33"/>
  <path d="M340 240 H460 V230 H340 Z" fill="#dcd2bf"/>
  <!-- clock tower -->
  <rect x="360" y="80" width="80" height="160" fill="# efe8d9"/>
  <rect x="360" y="80" width="80" height="160" fill="#efe8d9"/>
  <rect x="370" y="120" width="60" height="120" fill="#f2ede2"/>
  <circle cx="400" cy="140" r="24" fill="#fdfbf4" stroke="#b08f5a" stroke-width="3"/>
  <line x1="400" y1="140" x2="400" y2="124" stroke="#5a3d1a" stroke-width="3"/>
  <line x1="400" y1="140" x2="412" y2="146" stroke="#5a3d1a" stroke-width="3"/>
  <path d="M355 80 L400 40 L445 80 Z" fill="#4f6a8a"/>
  <rect x="394" y="20" width="12" height="24" fill="#4f6a8a"/>
  <circle cx="400" cy="18" r="6" fill="#d4b15c"/>
  <!-- columns -->
  <g fill="#dcd2bf"><rect x="350" y="240" width="10" height="180"/><rect x="440" y="240" width="10" height="180"/></g>
</svg>
