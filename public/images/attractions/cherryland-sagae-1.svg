<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A cherry-themed roadside park with a Ferris wheel and giant red cherries">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6f2"/>
      <stop offset="1" stop-color="#ffe2ea"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky6)"/>
  <circle cx="330" cy="70" r="32" fill="#fff3c4" opacity="0.8"/>
  <rect y="320" width="400" height="80" fill="#7fb86a"/>
  <!-- ferris wheel -->
  <g transform="translate(120 180)">
    <line x1="0" y1="0" x2="-22" y2="140" stroke="#8a93a3" stroke-width="6"/>
    <line x1="0" y1="0" x2="22" y2="140" stroke="#8a93a3" stroke-width="6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#d05a72" stroke-width="6"/>
    <g stroke="#d05a72" stroke-width="3">
      <line x1="0" y1="0" x2="0" y2="-80"/>
      <line x1="0" y1="0" x2="69" y2="40"/>
      <line x1="0" y1="0" x2="-69" y2="40"/>
      <line x1="0" y1="0" x2="69" y2="-40"/>
      <line x1="0" y1="0" x2="-69" y2="-40"/>
      <line x1="0" y1="0" x2="0" y2="80"/>
    </g>
    <g>
      <circle cx="0" cy="-80" r="10" fill="#f2c14e"/>
      <circle cx="69" cy="-40" r="10" fill="#5aa6d9"/>
      <circle cx="69" cy="40" r="10" fill="#f2c14e"/>
      <circle cx="0" cy="80" r="10" fill="#5aa6d9"/>
      <circle cx="-69" cy="40" r="10" fill="#f2c14e"/>
      <circle cx="-69" cy="-40" r="10" fill="#5aa6d9"/>
    </g>
  </g>
  <!-- giant cherries -->
  <g transform="translate(290 290)">
    <path d="M0 -50 Q40 -70 50 -30" fill="none" stroke="#5a8a3a" stroke-width="5"/>
    <path d="M0 -50 Q-30 -65 -40 -28" fill="none" stroke="#5a8a3a" stroke-width="5"/>
    <ellipse cx="20" cy="-58" rx="14" ry="7" fill="#5a8a3a"/>
    <circle cx="-40" cy="-10" r="34" fill="#d62f3e"/>
    <circle cx="-48" cy="-20" r="9" fill="#ff8d8d" opacity="0.7"/>
    <circle cx="40" cy="0" r="38" fill="#e23545"/>
    <circle cx="30" cy="-12" r="10" fill="#ff8d8d" opacity="0.7"/>
  </g>
</svg>
