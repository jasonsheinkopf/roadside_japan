<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mon-chan peeking nervously over a railed cliff ledge above a sheer drop">
<defs><linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7ad63"/><stop offset="1" stop-color="#d2913f"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aed8ef"/><stop offset="1" stop-color="#dceefb"/></linearGradient><linearGradient id="depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8a70"/><stop offset="1" stop-color="#3a5240"/></linearGradient></defs>
<rect width="400" height="400" fill="url(#sky)"/>
<!-- far valley below -->
<path d="M0 130 q200 -20 400 0 V400 H0z" fill="url(#depth)"/>
<g fill="#557a5c" opacity="0.7"><polygon points="40,260 90,160 140,260"/><polygon points="260,270 320,150 380,270"/></g>
<g fill="#9ec0a0" opacity="0.5"><circle cx="90" cy="200" r="4"/><circle cx="320" cy="210" r="4"/></g>
<!-- cliff ledge -->
<path d="M0 300 q200 16 400 0 V400 H0z" fill="#7a6a52"/>
<path d="M0 300 q200 16 400 0 v14 q-200 16 -400 0z" fill="#8a7a60"/>
