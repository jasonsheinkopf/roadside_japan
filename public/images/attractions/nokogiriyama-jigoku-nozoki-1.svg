<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A giant serene seated stone Buddha (Daibutsu) among forest trees">
  <defs>
    <linearGradient id="sky10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8ecd8"/>
      <stop offset="100%" stop-color="#aacaa0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky10)"/>
  <!-- forest trees behind -->
  <g fill="#5a8a4a">
    <polygon points="40,300 70,150 100,300"/>
    <polygon points="80,320 110,180 140,320"/>
    <polygon points="300,320 330,180 360,320"/>
    <polygon points="340,300 370,160 400,300"/>
  </g>
  <g fill="#4a7a3a">
    <polygon points="20,340 55,200 90,340"/>
    <polygon points="320,340 355,200 390,340"/>
  </g>
  <rect x="0" y="330" width="400" height="70" fill="#7a6a4a"/>
  <!-- Buddha -->
  <g transform="translate(200,210)">
    <!-- lotus base -->
    <path d="M-90 120 q90 30 180 0 q-20 -28 -90 -28 q-70 0 -90 28" fill="#b8a888"/>
    <!-- body / robe -->
    <path d="M-78 120 q-6 -70 78 -88 q84 18 78 88 Z" fill="#9a9488"/>
    <path d="M-50 120 q0 -50 50 -56 q50 6 50 56 Z" fill="#8a857a"/>
    <!-- crossed legs hint -->
    <ellipse cx="0" cy="112" rx="60" ry="20" fill="#aaa498"/>
    <!-- head -->
    <ellipse cx="0" cy="-38" rx="40" ry="44" fill="#a8a294"/>
    <!-- ushnisha bumps -->
    <g fill="#8a857a"><circle cx="0" cy="-78" r="8"/><circle cx="-12" cy="-70" r="6"/><circle cx="12" cy="-70" r="6"/></g>
    <!-- long ears -->
    <ellipse cx="-38" cy="-30" rx="8" ry="20" fill="#9a9488"/>
    <ellipse cx="38" cy="-30" rx="8" ry="20" fill="#9a9488"/>
    <!-- serene face -->
    <path d="M-16 -42 q8 6 16 0" stroke="#5a564c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M8 -42 q8 6 16 0" transform="translate(-16,0)" stroke="#5a564c" stroke-width="0" fill="none"/>
    <path d="M0 -42 q8 6 16 0" stroke="#5a564c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-8 -22 q8 5 16 0" stroke="#5a564c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-34" r="3" fill="#bcae8e"/>
    <!-- hands in lap -->
    <ellipse cx="0" cy="96" rx="26" ry="12" fill="#b0aa9c"/>
  </g>
</svg>
