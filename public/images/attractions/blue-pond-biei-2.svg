<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="The blue pond at a winter night illumination, glowing electric blue against dark snow">
  <defs>
    <radialGradient id="bp2glow" cx="0.5" cy="0.7" r="0.7">
      <stop offset="0" stop-color="#3fd2ff"/>
      <stop offset="0.6" stop-color="#1077c8"/>
      <stop offset="1" stop-color="#0a2a55"/>
    </radialGradient>
    <linearGradient id="bp2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08122e"/>
      <stop offset="1" stop-color="#142a55"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bp2sky)"/>
  <!-- stars -->
  <g fill="#cfe6ff">
    <circle cx="50" cy="40" r="2"/><circle cx="110" cy="70" r="1.5"/><circle cx="200" cy="35" r="2"/>
    <circle cx="300" cy="55" r="1.5"/><circle cx="360" cy="90" r="2"/><circle cx="80" cy="110" r="1.5"/>
    <circle cx="340" cy="30" r="1.5"/>
  </g>
  <!-- dark snowy banks -->
  <path d="M0 150 q100 -20 200 0 t200 0 v30 H0 Z" fill="#27406e"/>
  <!-- glowing pond -->
  <ellipse cx="200" cy="300" rx="220" ry="120" fill="url(#bp2glow)"/>
  <!-- glow ripples -->
  <g stroke="#9fe8ff" stroke-width="3" opacity="0.6" fill="none">
    <path d="M40 290 q60 -8 120 0 t160 0"/>
    <path d="M30 340 q60 -8 120 0 t180 0"/>
  </g>
  <!-- illuminated trunks glowing -->
  <g stroke="#bff0ff" stroke-linecap="round" fill="none">
    <path d="M110 160 L102 340" stroke-width="9"/>
    <path d="M104 230 l-16 -12 M106 290 l16 -10" stroke-width="5"/>
    <path d="M200 155 L206 360" stroke-width="11"/>
    <path d="M203 215 l20 -16 M204 285 l-18 -12" stroke-width="6"/>
    <path d="M295 160 L288 340" stroke-width="9"/>
    <path d="M291 240 l16 -12 M290 300 l-16 -10" stroke-width="5"/>
  </g>
  <!-- snow flecks -->
  <g fill="#dff2ff" opacity="0.85">
    <circle cx="60" cy="200" r="2.5"/><circle cx="150" cy="120" r="2"/><circle cx="260" cy="180" r="2.5"/>
    <circle cx="330" cy="220" r="2"/><circle cx="120" cy="260" r="2"/>
  </g>
</svg>
