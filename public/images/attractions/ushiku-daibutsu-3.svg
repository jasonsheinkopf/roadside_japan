<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Little flower gardens and a small petting zoo with animals at the feet of a giant Buddha">
  <defs>
    <linearGradient id="ud3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeaf2"/>
      <stop offset="1" stop-color="#eaf6ec"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#ud3sky)"/>
  <!-- giant buddha behind -->
  <path d="M150 260V90q0 -50 50 -50t50 50v170z" fill="#7fae8c"/>
  <circle cx="200" cy="70" r="30" fill="#8fbe9c"/>
  <g fill="#6f9e7c">
    <circle cx="186" cy="52" r="4"/><circle cx="200" cy="48" r="4"/><circle cx="214" cy="52" r="4"/>
  </g>
  <circle cx="200" cy="36" r="6" fill="#8fbe9c"/>
  <!-- ground -->
  <rect x="0" y="240" width="400" height="160" fill="#8ec96e"/>
  <rect x="0" y="240" width="400" height="14" fill="#a3d683"/>
  <!-- flower beds -->
  <g>
    <circle cx="40" cy="290" r="8" fill="#ff7aa8"/><circle cx="60" cy="300" r="8" fill="#ffd35c"/>
    <circle cx="50" cy="280" r="8" fill="#e0584f"/><circle cx="30" cy="305" r="8" fill="#b07aff"/>
    <circle cx="350" cy="290" r="8" fill="#ffd35c"/><circle cx="370" cy="300" r="8" fill="#ff7aa8"/>
    <circle cx="360" cy="280" r="8" fill="#b07aff"/><circle cx="340" cy="305" r="8" fill="#e0584f"/>
  </g>
  <!-- petting zoo fence -->
  <g stroke="#a07a4a" stroke-width="5">
    <line x1="120" y1="320" x2="120" y2="360"/>
    <line x1="160" y1="320" x2="160" y2="360"/>
    <line x1="200" y1="320" x2="200" y2="360"/>
    <line x1="240" y1="320" x2="240" y2="360"/>
    <line x1="280" y1="320" x2="280" y2="360"/>
    <line x1="115" y1="332" x2="285" y2="332"/>
  </g>
  <!-- sheep -->
  <g>
    <ellipse cx="150" cy="350" rx="20" ry="14" fill="#fff"/>
    <circle cx="135" cy="350" r="8" fill="#3a3a3a"/>
    <rect x="142" y="360" width="4" height="8" fill="#3a3a3a"/>
    <rect x="156" y="360" width="4" height="8" fill="#3a3a3a"/>
  </g>
  <!-- goat -->
  <g>
    <ellipse cx="230" cy="352" rx="18" ry="12" fill="#d8c8a8"/>
    <circle cx="248" cy="348" r="8" fill="#c8b898"/>
    <path d="M244 342q-2 -8 4 -8" stroke="#9a8a6a" stroke-width="3" fill="none"/>
    <rect x="222" y="360" width="4" height="8" fill="#9a8a6a"/>
    <rect x="236" y="360" width="4" height="8" fill="#9a8a6a"/>
    <circle cx="250" cy="346" r="1.5" fill="#222"/>
  </g>
</svg>
