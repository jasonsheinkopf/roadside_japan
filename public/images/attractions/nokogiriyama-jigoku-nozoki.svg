<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A tiny figure peering over the railed Hell Peek ledge above a sheer quarry drop">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aee0f0"/><stop offset="1" stop-color="#e6f6fb"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a948a"/><stop offset="1" stop-color="#6f6a61"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#73b8d2"/><stop offset="1" stop-color="#4a90b0"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- distant bay + Fuji -->
  <rect y="150" width="800" height="120" fill="url(#sea)"/>
  <path d="M560 150 L640 70 L720 150 Z" fill="#9fb6c9" opacity="0.8"/><path d="M620 92 l20 -22 20 22 -20 6z" fill="#fff" opacity="0.9"/>
  <!-- far shoreline -->
  <path d="M0 150 Q200 140 400 152 Q600 162 800 150 L800 170 L0 170Z" fill="#8aa98f" opacity="0.6"/>
  <!-- quarry cliff face (vertical cut) -->
  <path d="M0 500 L0 230 L360 230 L320 500 Z" fill="url(#rock)"/>
  <g stroke="#5a554c" stroke-width="3" opacity="0.5">
    <line x1="60" y1="240" x2="48" y2="500"/><line x1="140" y1="238" x2="128" y2="500"/>
    <line x1="220" y1="236" x2="206" y2="500"/><line x1="300" y1="234" x2="286" y2="500"/>
    <line x1="0" y1="320" x2="340" y2="320"/><line x1="0" y1="410" x2="328" y2="410"/>
  </g>
  <!-- the protruding ledge -->
  <path d="M0 200 L210 200 L250 248 L0 248 Z" fill="#8a857b"/>
  <path d="M0 200 L210 200 L214 214 L0 214Z" fill="#a8a298"/>
  <!-- railing -->
  <g stroke="#c0392b" stroke-width="4" stroke-linecap="round">
    <line x1="40" y1="178" x2="40" y2="202"/><line x1="90" y1="176" x2="90" y2="202"/>
    <line x1="140" y1="174" x2="140" y2="200"/><line x1="190" y1="172" x2="190" y2="200"/>
    <line x1="34" y1="178" x2="196" y2="170"/>
  </g>
  <!-- tiny brave visitor peeking over -->
  <g transform="translate(150,140)">
    <circle cx="0" cy="0" r="10" fill="#f0c49a"/>
    <path d="M-10 -2 a10 8 0 0 1 20 0z" fill="#3a3a3a"/>
    <rect x="-9" y="9" width="18" height="26" rx="6" fill="#e07a3a"/>
    <rect x="-12" y="14" width="9" height="18" rx="4" fill="#e07a3a" transform="rotate(20 -7 23)"/>
  </g>
  <!-- birds -->
  <g stroke="#3a3a3a" stroke-width="2" fill="none"><path d="M520 100 q8 -8 16 0 q8 -8 16 0"/><path d="M600 130 q6 -6 12 0 q6 -6 12 0"/></g>
</svg>
