<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Old thatched-roof farmhouses on a green wooded hillside, an open-air folk museum">
  <rect width="400" height="400" fill="#bfe3a8"/>
  <rect width="400" height="180" fill="#9fd0e8"/>
  <circle cx="70" cy="60" r="30" fill="#fff3b0"/>
  <!-- hillside -->
  <path d="M0 180 Q200 110 400 180 L400 400 L0 400 Z" fill="#79c25a"/>
  <path d="M0 250 Q200 200 400 250 L400 400 L0 400 Z" fill="#5fa847"/>
  <!-- trees -->
  <g fill="#3f7d33">
    <circle cx="40" cy="150" r="26"/>
    <circle cx="80" cy="140" r="22"/>
    <circle cx="360" cy="150" r="26"/>
    <circle cx="320" cy="138" r="20"/>
  </g>
  <!-- farmhouse big -->
  <g>
    <rect x="120" y="250" width="160" height="80" fill="#d8c4a0"/>
    <polygon points="100,250 300,250 200,150" fill="#8a6f4a"/>
    <polygon points="118,250 282,250 200,168" fill="#a98b5e"/>
    <rect x="180" y="285" width="40" height="45" fill="#5b432a"/>
    <line x1="200" y1="168" x2="200" y2="150" stroke="#6b5638" stroke-width="6"/>
  </g>
  <!-- small farmhouse -->
  <g>
    <rect x="40" y="295" width="70" height="40" fill="#d8c4a0"/>
    <polygon points="30,295 120,295 75,245" fill="#a98b5e"/>
    <rect x="65" y="312" width="20" height="23" fill="#5b432a"/>
  </g>
  <text x="200" y="392" font-family="sans-serif" font-size="20" fill="#274d1c" text-anchor="middle" font-weight="bold">FOLK HOUSES</text>
</svg>
