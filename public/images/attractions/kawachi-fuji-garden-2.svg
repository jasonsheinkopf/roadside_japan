<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A hand reaching up to gently cup one long cascading violet wisteria cluster">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c4f0"/>
      <stop offset="100%" stop-color="#f5edd6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <!-- trellis bar -->
  <rect x="0" y="20" width="400" height="16" fill="#7a5a3a"/>
  <!-- green leaves at top -->
  <g fill="#6fae5e">
    <ellipse cx="150" cy="45" rx="20" ry="10"/>
    <ellipse cx="200" cy="42" rx="22" ry="11"/>
    <ellipse cx="250" cy="45" rx="20" ry="10"/>
  </g>
  <!-- long cascading cluster -->
  <g transform="translate(200,40)">
    <ellipse cx="0" cy="140" rx="30" ry="120" fill="#9a78cf"/>
    <g fill="#8b66c4">
      <circle cx="-10" cy="20" r="14"/><circle cx="12" cy="40" r="14"/>
      <circle cx="-12" cy="62" r="13"/><circle cx="10" cy="84" r="13"/>
      <circle cx="-9" cy="106" r="12"/><circle cx="9" cy="128" r="11"/>
      <circle cx="-6" cy="150" r="10"/><circle cx="6" cy="172" r="9"/>
      <circle cx="-3" cy="194" r="8"/><circle cx="2" cy="214" r="6"/>
    </g>
    <g fill="#c6a8ec">
      <circle cx="-4" cy="28" r="6"/><circle cx="6" cy="70" r="6"/>
      <circle cx="-3" cy="116" r="5"/><circle cx="3" cy="160" r="4"/>
    </g>
  </g>
  <!-- reaching hand from bottom -->
  <g transform="translate(200,400)">
    <rect x="-26" y="-70" width="52" height="80" rx="20" fill="#f0c6a0"/>
    <!-- cupped fingers -->
    <g fill="#f0c6a0">
      <ellipse cx="-20" cy="-72" rx="9" ry="22"/>
      <ellipse cx="-2" cy="-80" rx="9" ry="26"/>
      <ellipse cx="16" cy="-76" rx="9" ry="24"/>
      <ellipse cx="30" cy="-66" rx="8" ry="20"/>
    </g>
    <ellipse cx="-30" cy="-50" rx="10" ry="16" fill="#f0c6a0"/>
  </g>
  <g stroke="#d9a878" stroke-width="2" fill="none" opacity="0.6">
    <line x1="178" y1="328" x2="174" y2="340"/>
    <line x1="198" y1="320" x2="198" y2="335"/>
    <line x1="216" y1="324" x2="220" y2="338"/>
  </g>
</svg>
