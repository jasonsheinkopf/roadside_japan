<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A button-eyed handmade scarecrow farmer in work clothes grinning out in a green field">
  <defs>
    <linearGradient id="sky8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f7"/>
      <stop offset="100%" stop-color="#e8f3d8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky8)"/>
  <rect x="0" y="250" width="400" height="150" fill="#8cc05a"/>
  <g stroke="#6fa648" stroke-width="3">
    <line x1="40" y1="300" x2="0" y2="340"/>
    <line x1="120" y1="300" x2="70" y2="350"/>
    <line x1="300" y1="300" x2="350" y2="350"/>
    <line x1="370" y1="290" x2="400" y2="330"/>
  </g>
  <circle cx="330" cy="70" r="34" fill="#ffd86a"/>
  <!-- farmer scarecrow -->
  <g transform="translate(200,160)">
    <!-- support pole -->
    <rect x="-6" y="120" width="12" height="120" fill="#8a6a3a"/>
    <!-- straw hat -->
    <ellipse cx="0" cy="-58" rx="52" ry="14" fill="#d9b75e"/>
    <path d="M-30 -58 q30 -40 60 0" fill="#e8cb7a"/>
    <!-- head -->
    <ellipse cx="0" cy="-22" rx="34" ry="36" fill="#ecd9b2"/>
    <!-- stitch seam -->
    <line x1="0" y1="-56" x2="0" y2="14" stroke="#c9b288" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- button eyes -->
    <circle cx="-13" cy="-26" r="9" fill="#fff" stroke="#444" stroke-width="2"/>
    <circle cx="13" cy="-26" r="9" fill="#fff" stroke="#444" stroke-width="2"/>
    <g fill="#333"><circle cx="-15" cy="-28" r="1.5"/><circle cx="-11" cy="-28" r="1.5"/><circle cx="-15" cy="-24" r="1.5"/><circle cx="-11" cy="-24" r="1.5"/>
    <circle cx="11" cy="-28" r="1.5"/><circle cx="15" cy="-28" r="1.5"/><circle cx="11" cy="-24" r="1.5"/><circle cx="15" cy="-24" r="1.5"/></g>
    <!-- grin -->
    <path d="M-16 -4 q16 18 32 0" fill="none" stroke="#a85a3a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-22" cy="-8" r="6" fill="#f0a0a0" opacity="0.7"/>
    <circle cx="22" cy="-8" r="6" fill="#f0a0a0" opacity="0.7"/>
    <!-- body / work clothes -->
    <rect x="-38" y="14" width="76" height="86" rx="12" fill="#4a7a8a"/>
    <rect x="-38" y="60" width="76" height="40" fill="#6a9aa8"/>
    <!-- arms outstretched -->
    <rect x="-86" y="24" width="52" height="20" rx="10" fill="#4a7a8a" transform="rotate(-18 -38 34)"/>
    <rect x="34" y="24" width="52" height="20" rx="10" fill="#4a7a8a" transform="rotate(18 38 34)"/>
    <!-- straw hands -->
    <g stroke="#d9b75e" stroke-width="3"><line x1="-82" y1="14" x2="-92" y2="6"/><line x1="-82" y1="18" x2="-94" y2="16"/><line x1="82" y1="14" x2="92" y2="6"/><line x1="82" y1="18" x2="94" y2="16"/></g>
  </g>
</svg>
