<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mon-chan shivering with foggy breath in a cold underground stone quarry">
<defs><linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7ad63"/><stop offset="1" stop-color="#d2913f"/></linearGradient><radialGradient id="cav" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#3a4458"/><stop offset="1" stop-color="#171c28"/></radialGradient><radialGradient id="breath" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#dfeefa" stop-opacity="0.85"/><stop offset="1" stop-color="#dfeefa" stop-opacity="0"/></radialGradient></defs>
<rect width="400" height="400" fill="url(#cav)"/>
