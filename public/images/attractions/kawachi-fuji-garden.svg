<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A receding tunnel dripping with cascading violet wisteria blossoms">
  <defs>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9cdb0"/><stop offset="1" stop-color="#b9a87f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5"><stop offset="0" stop-color="#fff7e6"/><stop offset="1" stop-color="#e9d9f2"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="#6a4a86"/>
  <!-- bright far end -->
  <ellipse cx="400" cy="250" rx="150" ry="120" fill="url(#glow)"/>
  <!-- tunnel arches receding -->
  <g fill="none" stroke="#5a3f73" stroke-width="6">
    <path d="M120 470 Q400 120 680 470" opacity="0.9"/>
    <path d="M190 460 Q400 170 610 460" opacity="0.8"/>
    <path d="M250 450 Q400 215 550 450" opacity="0.7"/>
    <path d="M300 445 Q400 255 500 445" opacity="0.6"/>
  </g>
  <!-- path -->
  <path d="M330 500 L470 500 L430 270 L370 270 Z" fill="url(#path)"/>
  <!-- hanging wisteria curtains -->
  <g>
    <g fill="#9a6fd0"><!-- outer left -->
      <g id="w"/>
    </g>
  </g>
  <!-- generate cascades along arches -->
  <g stroke-linecap="round">
    <!-- big outer curtain -->
    <g fill="#8e63c9">
      <g>
        <path d="M120 470 Q400 120 680 470" fill="none" stroke="#7a52b0" stroke-width="10"/>
      </g>
    </g>
  </g>
  <!-- wisteria strands as teardrop clusters -->
  <g>
    <!-- positions along the largest arch -->
    <g fill="#b48ee0">
      <path d="M150 430 q-8 60 0 100 q8 -40 0 -100z"/>
      <path d="M230 330 q-8 80 0 150 q8 -70 0 -150z"/>
      <path d="M320 250 q-8 110 0 200 q8 -90 0 -200z"/>
      <path d="M400 232 q-8 130 0 230 q8 -100 0 -230z"/>
      <path d="M480 250 q-8 110 0 200 q8 -90 0 -200z"/>
      <path d="M570 330 q-8 80 0 150 q8 -70 0 -150z"/>
      <path d="M650 430 q-8 60 0 100 q8 -40 0 -100z"/>
    </g>
    <g fill="#9a6fd0">
      <path d="M190 380 q-7 70 0 130 q7 -60 0 -130z"/>
      <path d="M275 290 q-7 100 0 180 q7 -80 0 -180z"/>
      <path d="M360 245 q-7 120 0 215 q7 -95 0 -215z"/>
      <path d="M440 245 q-7 120 0 215 q7 -95 0 -215z"/>
      <path d="M525 290 q-7 100 0 180 q7 -80 0 -180z"/>
      <path d="M610 380 q-7 70 0 130 q7 -60 0 -130z"/>
    </g>
    <!-- blossom dots -->
    <g fill="#e7d2f5">
      <circle cx="320" cy="300" r="4"/><circle cx="320" cy="360" r="4"/><circle cx="320" cy="420" r="4"/>
      <circle cx="400" cy="300" r="4"/><circle cx="400" cy="380" r="4"/><circle cx="400" cy="450" r="4"/>
      <circle cx="480" cy="300" r="4"/><circle cx="480" cy="360" r="4"/><circle cx="480" cy="420" r="4"/>
      <circle cx="235" cy="380" r="4"/><circle cx="235" cy="440" r="4"/>
      <circle cx="565" cy="380" r="4"/><circle cx="565" cy="440" r="4"/>
    </g>
  </g>
  <!-- tiny visitor -->
  <g fill="#3a2a4a"><circle cx="400" cy="392" r="9"/><rect x="391" y="400" width="18" height="34" rx="6"/></g>
</svg>
