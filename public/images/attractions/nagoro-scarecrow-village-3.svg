<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Two handmade scarecrows sitting on a bench at a rural bus stop, waiting forever">
  <defs>
    <linearGradient id="sky9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d9a8"/>
      <stop offset="100%" stop-color="#e8b87a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky9)"/>
  <rect x="0" y="320" width="400" height="80" fill="#9a8c6a"/>
  <!-- distant hills -->
  <path d="M0 320 q100 -60 200 -20 q100 40 200 -10 v30 H0 Z" fill="#b89a6a" opacity="0.6"/>
  <!-- bus stop sign -->
  <rect x="40" y="120" width="10" height="210" fill="#888"/>
  <circle cx="45" cy="120" r="26" fill="#fff" stroke="#c23a2a" stroke-width="7"/>
  <text x="45" y="128" font-family="sans-serif" font-size="20" fill="#c23a2a" text-anchor="middle" font-weight="bold">BUS</text>
  <!-- bench -->
  <rect x="120" y="280" width="220" height="16" rx="4" fill="#9a6a3a"/>
  <rect x="124" y="296" width="14" height="40" fill="#7a5230"/>
  <rect x="322" y="296" width="14" height="40" fill="#7a5230"/>
  <rect x="120" y="240" width="220" height="14" rx="4" fill="#9a6a3a"/>
  <!-- scarecrow 1 -->
  <g transform="translate(180,210)">
    <ellipse cx="0" cy="0" rx="26" ry="28" fill="#ecd9b2"/>
    <circle cx="-9" cy="-4" r="4" fill="#000"/><circle cx="9" cy="-4" r="4" fill="#000"/>
    <path d="M-9 10 q9 6 18 0" stroke="#a06" stroke-width="3" fill="none"/>
    <rect x="-26" y="26" width="52" height="50" rx="10" fill="#c2503a"/>
    <rect x="-22" y="76" width="14" height="10" fill="#3a3a4a"/>
    <rect x="8" y="76" width="14" height="10" fill="#3a3a4a"/>
  </g>
  <!-- scarecrow 2 -->
  <g transform="translate(280,210)">
    <ellipse cx="0" cy="0" rx="26" ry="28" fill="#ecd9b2"/>
    <circle cx="-9" cy="-4" r="4" fill="#000"/><circle cx="9" cy="-4" r="4" fill="#000"/>
    <path d="M-9 10 q9 4 18 0" stroke="#a06" stroke-width="3" fill="none"/>
    <ellipse cx="-16" cy="-18" rx="9" ry="18" fill="#7a4a2a" transform="rotate(-20 -16 -18)"/>
    <ellipse cx="16" cy="-18" rx="9" ry="18" fill="#7a4a2a" transform="rotate(20 16 -18)"/>
    <rect x="-26" y="26" width="52" height="50" rx="10" fill="#4a7ac2"/>
    <rect x="-22" y="76" width="14" height="10" fill="#3a3a4a"/>
    <rect x="8" y="76" width="14" height="10" fill="#3a3a4a"/>
  </g>
</svg>
