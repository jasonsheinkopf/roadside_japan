      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="td1sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c878"/>
      <stop offset="1" stop-color="#e0ad58"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#td1sky)"/>
  <path d="M0 300q120 -50 200 -20t200 -10v130H0z" fill="url(#td1sand)"/>
  <path d="M0 360q150 -40 400 0v40H0z" fill="#d49b48"/>
  <!-- camel head close-up -->
  <path d="M150 400V200q0 -40 40 -50l30 -6q30 -4 30 26v230z" fill="#c79a5e"/>
  <!-- snout -->
  <path d="M150 230q-50 6 -56 60 -4 40 30 44 30 4 36 -30z" fill="#b78a4e"/>
  <ellipse cx="104" cy="270" rx="8" ry="6" fill="#5a4226"/>
