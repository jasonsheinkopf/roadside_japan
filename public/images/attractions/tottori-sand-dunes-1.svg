  <!-- haughty side-eye -->
  <ellipse cx="196" cy="200" rx="22" ry="16" fill="#fff"/>
  <ellipse cx="186" cy="202" rx="9" ry="11" fill="#3a2a16"/>
  <path d="M174 186q22 -10 44 4" stroke="#6a4a26" stroke-width="6" fill="none"/>
  <!-- ear -->
  <path d="M214 152q18 -16 30 4 -6 18 -24 14z" fill="#b78a4e"/>
  <!-- saddle -->
  <path d="M230 250h60v40h-60z" fill="#c0392b"/>
  <rect x="230" y="258" width="60" height="6" fill="#f0c020"/>
  <rect x="230" y="278" width="60" height="6" fill="#f0c020"/>
  <g stroke="#7a5a30" stroke-width="3" fill="none">
    <path d="M150 240q-10 -10 -4 -22"/>
  </g>
