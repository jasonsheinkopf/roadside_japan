<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mon-chan riding in a little rowboat near a gorge waterfall">
<defs><linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7ad63"/><stop offset="1" stop-color="#d2913f"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fb39a"/><stop offset="1" stop-color="#0e7a68"/></linearGradient></defs>
<rect width="400" height="400" fill="#3a4a40"/>
<!-- basalt gorge walls -->
<rect x="0" y="0" width="120" height="400" fill="#54665a"/>
<rect x="280" y="0" width="120" height="400" fill="#475a4d"/>
<g fill="#5b6d61"><rect x="0" y="0" width="40" height="400"/><rect x="80" y="0" width="40" height="400"/><rect x="320" y="0" width="40" height="400"/></g>
<g fill="#6b7d70" stroke="#34433a" stroke-width="2"><polygon points="30,40 50,52 50,76 30,88 10,76 10,52"/><polygon points="90,90 110,102 110,126 90,138 70,126 70,102"/><polygon points="350,60 370,72 370,96 350,108 330,96 330,72"/></g>
