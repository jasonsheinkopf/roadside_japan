<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A cherry-themed roadside park with a Ferris wheel and giant red cherries">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf6"/>
      <stop offset="1" stop-color="#fde6ee"/>
    </linearGradient>
    <radialGradient id="cherry" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff7a8a"/>
      <stop offset="1" stop-color="#c41f3a"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky6)"/>
  <circle cx="660" cy="100" r="48" fill="#fff6dc" opacity="0.8"/>
  <!-- ground -->
  <path d="M0 360 Q400 330 800 360 V500 H0 Z" fill="#7cbf6a"/>
  <path d="M0 420 Q400 400 800 420 V500 H0 Z" fill="#4f9444"/>
  <!-- ferris wheel -->
  <g transform="translate(220 250)">
    <line x1="0" y1="0" x2="-26" y2="150" stroke="#8a96a0" stroke-width="8"/>
    <line x1="0" y1="0" x2="26" y2="150" stroke="#8a96a0" stroke-width="8"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#e76f8a" stroke-width="6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f4a7b9" stroke-width="3"/>
    <g stroke="#f4a7b9" stroke-width="3"><line x1="0" y1="-100" x2="0" y2="100"/><line x1="-100" y1="0" x2="100" y2="0"/><line x1="-71" y1="-71" x2="71" y2="71"/><line x1="71" y1="-71" x2="-71" y2="71"/></g>
    <g><circle cx="0" cy="-100" r="13" fill="#ff5a6e"/><circle cx="100" cy="0" r="13" fill="#ffd24a"/><circle cx="0" cy="100" r="13" fill="#5ac2e0"/><circle cx="-100" cy="0" r="13" fill="#7cd06a"/><circle cx="71" cy="-71" r="13" fill="#c084e0"/><circle cx="71" cy="71" r="13" fill="#ffb04a"/><circle cx="-71" cy="71" r="13" fill="#ff8a5a"/><circle cx="-71" cy="-71" r="13" fill="#5a8ae0"/></g>
    <circle cx="0" cy="0" r="10" fill="#fff"/>
  </g>
  <!-- giant cherries -->
  <g transform="translate(560 300)">
    <path d="M0 -90 Q40 -60 60 -10" fill="none" stroke="#4f7a33" stroke-width="6"/>
    <path d="M0 -90 Q-30 -50 -50 -10" fill="none" stroke="#4f7a33" stroke-width="6"/>
    <path d="M0 -90 q-6 -18 14 -26 q-2 18 -14 26" fill="#6fae5d"/>
    <circle cx="-50" cy="20" r="42" fill="url(#cherry)"/>
    <circle cx="60" cy="20" r="42" fill="url(#cherry)"/>
    <circle cx="-62" cy="6" r="9" fill="#ffd0d8" opacity="0.7"/>
    <circle cx="48" cy="6" r="9" fill="#ffd0d8" opacity="0.7"/>
  </g>
</svg>
