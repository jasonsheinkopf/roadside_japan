<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A red route bus squeezing through a narrow corridor with tall white snow walls on both sides">
  <defs>
    <linearGradient id="sky14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec0ec"/>
      <stop offset="1" stop-color="#cfeaf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky14)"/>
  <rect x="0" y="330" width="400" height="70" fill="#9aa6ae"/>
  <!-- left snow wall -->
  <polygon points="0,40 130,120 130,400 0,400" fill="#ffffff"/>
  <polygon points="0,40 130,120 130,400 0,400" fill="#dceaf2" opacity="0.5"/>
  <g stroke="#c4dae8" stroke-width="3" opacity="0.7">
    <line x1="10" y1="120" x2="120" y2="170"/>
    <line x1="10" y1="220" x2="120" y2="260"/>
    <line x1="10" y1="320" x2="120" y2="345"/>
  </g>
  <!-- right snow wall -->
  <polygon points="400,40 270,120 270,400 400,400" fill="#ffffff"/>
  <polygon points="400,40 270,120 270,400 400,400" fill="#dceaf2" opacity="0.5"/>
  <g stroke="#c4dae8" stroke-width="3" opacity="0.7">
    <line x1="390" y1="120" x2="280" y2="170"/>
    <line x1="390" y1="220" x2="280" y2="260"/>
    <line x1="390" y1="320" x2="280" y2="345"/>
  </g>
  <!-- road -->
  <polygon points="135,400 200,150 265,400" fill="#5e6a72"/>
  <g stroke="#f2e24a" stroke-width="5" stroke-dasharray="14 14">
    <line x1="200" y1="160" x2="200" y2="400"/>
  </g>
  <!-- red bus squeezing through -->
  <g transform="translate(200,250)">
    <rect x="-52" y="-50" width="104" height="100" rx="12" fill="#d24b3a"/>
    <rect x="-52" y="-50" width="104" height="22" rx="10" fill="#b53a2a"/>
    <rect x="-44" y="-22" width="88" height="34" rx="5" fill="#bfe0ef"/>
    <line x1="0" y1="-22" x2="0" y2="12" stroke="#d24b3a" stroke-width="4"/>
    <rect x="-30" y="-15" width="24" height="22" fill="#8fc2d8"/>
    <rect x="6" y="-15" width="24" height="22" fill="#8fc2d8"/>
    <circle cx="-30" cy="52" r="11" fill="#2a2a2a"/>
    <circle cx="30" cy="52" r="11" fill="#2a2a2a"/>
    <circle cx="-40" cy="36" r="5" fill="#fff2a0"/>
    <circle cx="40" cy="36" r="5" fill="#fff2a0"/>
  </g>
</svg>
