<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mountaintop stone castle walls framed by bright red autumn maple branches">
  <defs>
    <linearGradient id="tc3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f0"/>
      <stop offset="1" stop-color="#eef7da"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#tc3sky)"/>
  <!-- mountain -->
  <path d="M0 400v-110q200 -80 400 0v110z" fill="#8aa86a"/>
  <path d="M0 400v-70q200 -50 400 0v70z" fill="#6f9152"/>
  <!-- castle walls on top -->
  <path d="M120 290q80 -30 160 0v30q-80 -16 -160 0z" fill="#9a8a76"/>
  <g fill="#b0a08c">
    <rect x="130" y="270" width="34" height="22"/>
    <rect x="178" y="262" width="44" height="24"/>
    <rect x="236" y="270" width="34" height="22"/>
  </g>
  <g fill="#7a6a56">
    <rect x="132" y="282" width="30" height="3"/>
    <rect x="180" y="274" width="40" height="3"/>
    <rect x="238" y="282" width="30" height="3"/>
  </g>
  <!-- maple branches framing -->
  <path d="M0 0q60 50 40 120" stroke="#6a4a30" stroke-width="8" fill="none"/>
  <path d="M400 0q-60 50 -40 120" stroke="#6a4a30" stroke-width="8" fill="none"/>
  <g fill="#e0432b">
    <circle cx="30" cy="40" r="22"/><circle cx="70" cy="70" r="20"/>
    <circle cx="50" cy="100" r="24"/><circle cx="20" cy="90" r="18"/>
    <circle cx="370" cy="40" r="22"/><circle cx="330" cy="70" r="20"/>
    <circle cx="350" cy="100" r="24"/><circle cx="380" cy="90" r="18"/>
  </g>
  <g fill="#f08a3c" opacity="0.85">
    <circle cx="60" cy="45" r="12"/><circle cx="40" cy="120" r="12"/>
    <circle cx="340" cy="45" r="12"/><circle cx="360" cy="120" r="12"/>
  </g>
  <g fill="#e0432b">
    <circle cx="120" cy="150" r="10"/><circle cx="280" cy="150" r="10"/>
  </g>
</svg>
