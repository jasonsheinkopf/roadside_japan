<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A visitor crouching and rounding into a pumpkin shape to pose beside the polka-dot pumpkin sculpture">
  <defs>
    <linearGradient id="np3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ef"/>
      <stop offset="1" stop-color="#86c6d8"/>
    </linearGradient>
    <radialGradient id="np3p" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ecb000"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#np3bg)"/>
  <rect x="0" y="320" width="400" height="80" fill="#9ec9cf"/>
  <!-- the real pumpkin -->
  <g>
    <ellipse cx="280" cy="280" rx="110" ry="95" fill="url(#np3p)"/>
    <g fill="#1a1a1a">
      <ellipse cx="230" cy="230" rx="12" ry="10"/>
      <ellipse cx="300" cy="215" rx="14" ry="12"/>
      <ellipse cx="350" cy="270" rx="13" ry="11"/>
      <ellipse cx="250" cy="300" rx="15" ry="13"/>
      <ellipse cx="320" cy="320" rx="13" ry="11"/>
    </g>
    <path d="M280 188 q-6 -16 -20 -20" fill="none" stroke="#3f7a3a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- visitor rounded into pumpkin shape, posing -->
  <g>
    <!-- rounded body in yellow shirt mimicking pumpkin -->
    <ellipse cx="120" cy="300" rx="78" ry="68" fill="#ffd62e"/>
    <g fill="#222">
      <circle cx="90" cy="270" r="8"/>
      <circle cx="140" cy="265" r="9"/>
      <circle cx="120" cy="310" r="9"/>
      <circle cx="80" cy="320" r="7"/>
      <circle cx="155" cy="315" r="8"/>
    </g>
    <!-- head peeking over the top -->
    <circle cx="120" cy="218" r="34" fill="#f0c9a0"/>
    <path d="M86 212 q34 -50 68 0 q-6 -34 -34 -34 q-28 0 -34 34z" fill="#3a2a20"/>
    <circle cx="108" cy="216" r="4" fill="#222"/>
    <circle cx="132" cy="216" r="4" fill="#222"/>
    <path d="M108 232 q12 12 24 0" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <!-- little arms hugging knees -->
    <path d="M70 300 q-26 10 -20 40" fill="none" stroke="#ffd62e" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
