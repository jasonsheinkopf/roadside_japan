<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A funny view of a pair of nervous knees-knocking legs standing on a railed rock ledge over a sheer drop">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0f0"/>
      <stop offset="100%" stop-color="#6a9ab8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg12)"/>
  <!-- distant valley below -->
  <path d="M0 250 q100 -30 200 0 q100 30 200 0 v150 H0 Z" fill="#7aa890" opacity="0.5"/>
  <path d="M0 300 q120 -20 220 10 q120 30 180 0 v90 H0 Z" fill="#5a8a72" opacity="0.5"/>
  <!-- rock ledge -->
  <path d="M40 250 L360 250 L340 330 L60 330 Z" fill="#8a8276"/>
  <path d="M40 250 L360 250 L356 268 L44 268 Z" fill="#a89e8e"/>
  <!-- jagged drop edge -->
  <polygon points="60,330 90,360 120,330 150,365 180,330 210,360 240,330 270,365 300,330 340,330 340,330" fill="#6a6258"/>
  <!-- railing -->
  <g stroke="#c2a05a" stroke-width="7" stroke-linecap="round">
    <line x1="60" y1="170" x2="60" y2="250"/>
    <line x1="340" y1="170" x2="340" y2="250"/>
    <line x1="56" y1="174" x2="344" y2="174"/>
    <line x1="56" y1="210" x2="344" y2="210"/>
  </g>
  <!-- nervous knocking legs -->
  <g transform="translate(200,120)">
    <!-- shorts hem -->
    <rect x="-46" y="-10" width="92" height="34" rx="8" fill="#3a6a9a"/>
    <!-- left leg leaning right (knock) -->
    <path d="M-30 22 q26 40 6 80" fill="none" stroke="#f0c69a" stroke-width="26" stroke-linecap="round"/>
    <!-- right leg leaning left -->
    <path d="M30 22 q-26 40 -6 80" fill="none" stroke="#f0c69a" stroke-width="26" stroke-linecap="round"/>
    <!-- knees touching -->
    <circle cx="-8" cy="62" r="10" fill="#e6b884"/>
    <circle cx="8" cy="62" r="10" fill="#e6b884"/>
    <!-- shoes -->
    <ellipse cx="-30" cy="108" rx="20" ry="11" fill="#d24a3a"/>
    <ellipse cx="30" cy="108" rx="20" ry="11" fill="#d24a3a"/>
    <!-- shaky motion lines -->
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="-52" y1="50" x2="-58" y2="46"/><line x1="-54" y1="64" x2="-60" y2="64"/>
      <line x1="52" y1="50" x2="58" y2="46"/><line x1="54" y1="64" x2="60" y2="64"/>
    </g>
  </g>
  <text x="200" y="60" font-family="sans-serif" font-size="22" fill="#3a4a5a" text-anchor="middle" font-weight="bold">eek!</text>
</svg>
