<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A souvenir keychain with a real parasite suspended in clear resin, on a keyring">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff0ef"/>
      <stop offset="100%" stop-color="#a7cbc8"/>
    </linearGradient>
    <linearGradient id="res4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafaf6"/>
      <stop offset="100%" stop-color="#bfe6df"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <!-- keyring -->
  <circle cx="200" cy="80" r="42" fill="none" stroke="#c0c0c0" stroke-width="12"/>
  <circle cx="200" cy="80" r="42" fill="none" stroke="#e8e8e8" stroke-width="4"/>
  <!-- connector -->
  <rect x="192" y="116" width="16" height="30" rx="6" fill="#b8b8b8"/>
  <!-- resin block -->
  <rect x="120" y="140" width="160" height="200" rx="24" fill="url(#res4)" stroke="#9fd0c8" stroke-width="3"/>
  <rect x="138" y="158" width="36" height="120" rx="14" fill="#ffffff" opacity="0.45"/>
  <!-- parasite (worm) inside -->
  <path d="M200 175 q-34 18 -10 46 q26 22 4 50 q-22 26 8 50 q24 18 6 42" fill="none" stroke="#d98a8a" stroke-width="13" stroke-linecap="round"/>
  <path d="M200 175 q-34 18 -10 46 q26 22 4 50 q-22 26 8 50 q24 18 6 42" fill="none" stroke="#e9aaaa" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="172" r="11" fill="#c97676"/>
  <circle cx="196" cy="170" r="2.5" fill="#3a2222"/>
  <circle cx="204" cy="170" r="2.5" fill="#3a2222"/>
  <text x="200" y="332" font-family="sans-serif" font-size="15" fill="#3a5d59" text-anchor="middle" font-weight="bold">SOUVENIR</text>
</svg>
