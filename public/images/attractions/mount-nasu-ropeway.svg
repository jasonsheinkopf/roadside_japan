<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A ropeway gondola rising over a rugged steaming volcanic peak with autumn-colored slopes">
  <defs>
    <linearGradient id="sky10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc6e8"/>
      <stop offset="1" stop-color="#dceef7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky10)"/>
  <circle cx="680" cy="100" r="44" fill="#fff0b0"/>
  <!-- volcanic peak -->
  <polygon points="0,360 250,150 520,360" fill="#7a6e6a"/>
  <polygon points="120,360 250,150 380,360" fill="#8c807c"/>
  <polygon points="200,260 250,150 300,260" fill="#5e5450"/>
  <!-- autumn slopes -->
  <path d="M0 360 Q150 320 300 360 Q450 400 600 350 Q700 320 800 360 L800 500 L0 500 Z" fill="#d98a3a"/>
  <path d="M0 420 Q200 390 400 420 Q600 450 800 410 L800 500 L0 500 Z" fill="#b86a2a"/>
  <ellipse cx="120" cy="430" rx="70" ry="22" fill="#e0a44a"/>
  <ellipse cx="560" cy="450" rx="90" ry="24" fill="#c9b23a"/>
  <!-- steam from crater -->
  <path d="M250 170 Q230 130 250 100 Q270 75 250 50" fill="none" stroke="#ececec" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M270 175 Q290 135 270 105 Q252 80 272 55" fill="none" stroke="#dddddd" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- ropeway cable and gondola -->
  <line x1="0" y1="120" x2="800" y2="220" stroke="#444" stroke-width="3"/>
  <g>
    <line x1="430" y1="155" x2="430" y2="180" stroke="#333" stroke-width="4"/>
    <rect x="380" y="180" width="100" height="64" rx="12" fill="#e23b3b"/>
    <rect x="392" y="192" width="76" height="30" rx="6" fill="#bfe3ef"/>
    <rect x="380" y="238" width="100" height="8" rx="3" fill="#a82a2a"/>
    <circle cx="430" cy="150" r="7" fill="#333"/>
  </g>
  <!-- support tower -->
  <polygon points="640,360 660,360 654,230 646,230" fill="#5a5450"/>
  <line x1="620" y1="240" x2="680" y2="240" stroke="#5a5450" stroke-width="6"/>
</svg>
