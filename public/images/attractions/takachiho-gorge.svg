<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A rowboat drifting beneath a waterfall in a narrow basalt-columned gorge">
  <defs>
    <linearGradient id="rockL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5a48"/><stop offset="1" stop-color="#6f8264"/></linearGradient>
    <linearGradient id="rockR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f8264"/><stop offset="1" stop-color="#42513f"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fae8f"/><stop offset="1" stop-color="#1f7d68"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="#cfe7d8"/>
  <!-- sky slice up top -->
  <rect width="800" height="80" fill="#bfe0ea"/>
  <!-- left basalt cliff -->
  <path d="M0 500 L0 0 L300 0 L240 500 Z" fill="url(#rockL)"/>
  <g stroke="#37433440" stroke-width="6" opacity="0.6">
    <line x1="50" y1="0" x2="34" y2="500"/><line x1="110" y1="0" x2="90" y2="500"/><line x1="170" y1="0" x2="150" y2="500"/><line x1="230" y1="0" x2="210" y2="500"/>
  </g>
  <!-- moss top -->
  <path d="M0 0 L300 0 L296 26 Q150 40 0 24 Z" fill="#4f7d3f"/>
  <!-- right basalt cliff -->
  <path d="M800 500 L800 0 L500 0 L560 500 Z" fill="url(#rockR)"/>
  <g stroke="#37433440" stroke-width="6" opacity="0.6">
    <line x1="750" y1="0" x2="766" y2="500"/><line x1="690" y1="0" x2="710" y2="500"/><line x1="630" y1="0" x2="650" y2="500"/><line x1="570" y1="0" x2="590" y2="500"/>
  </g>
  <path d="M800 0 L500 0 L504 26 Q650 40 800 24 Z" fill="#4f7d3f"/>
  <!-- waterfall (Manai Falls) -->
  <g transform="translate(360,0)">
    <rect x="0" y="20" width="48" height="300" fill="#eaf6f2" opacity="0.92"/>
    <g stroke="#cfeae2" stroke-width="3"><line x1="10" y1="30" x2="10" y2="300"/><line x1="24" y1="30" x2="24" y2="300"/><line x1="38" y1="30" x2="38" y2="300"/></g>
    <ellipse cx="24" cy="320" rx="44" ry="16" fill="#fff" opacity="0.8"/>
  </g>
  <!-- emerald water -->
  <rect y="330" width="800" height="170" fill="url(#water)"/>
  <g fill="#fff" opacity="0.3"><ellipse cx="200" cy="380" rx="60" ry="6"/><ellipse cx="560" cy="410" rx="70" ry="6"/></g>
  <!-- rowboat -->
  <g transform="translate(300,360)">
    <path d="M0 24 q90 40 180 0 l-16 26 q-74 26 -148 0 z" fill="#b5733a"/>
    <path d="M8 24 q82 34 164 0" fill="none" stroke="#8a5628" stroke-width="3"/>
    <!-- rower -->
    <g transform="translate(80,2)"><circle cx="0" cy="-8" r="9" fill="#f0c49a"/><rect x="-9" y="0" width="18" height="22" rx="6" fill="#d6453f"/>
      <line x1="6" y1="6" x2="44" y2="26" stroke="#7a5a3a" stroke-width="4"/><line x1="-6" y1="6" x2="-40" y2="26" stroke="#7a5a3a" stroke-width="4"/></g>
  </g>
</svg>
