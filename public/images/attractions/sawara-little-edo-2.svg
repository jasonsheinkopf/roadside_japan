<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mon-chan steering a canal boat while Cinnamon the squirrel rides the bow">
<defs>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a85c"/><stop offset="1" stop-color="#cf9038"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0ef"/><stop offset="1" stop-color="#e6f0e0"/></linearGradient>
<linearGradient id="sq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c7c55"/><stop offset="1" stop-color="#7d6242"/></linearGradient>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6c49"/><stop offset="1" stop-color="#6b5236"/></linearGradient>
</defs>
<rect width="400" height="400" fill="url(#sky)"/>
<!-- old townhouses -->
<rect x="0" y="120" width="400" height="120" fill="#e6dcc4"/>
<g fill="#7a5a3a">
<rect x="10" y="120" width="80" height="14"/><rect x="110" y="120" width="80" height="14"/><rect x="210" y="120" width="80" height="14"/><rect x="310" y="120" width="80" height="14"/>
</g>
