<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Mossy stone Jizo statues wearing red bibs beneath towering cedar trees">
  <defs>
    <linearGradient id="ok3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6b46"/>
      <stop offset="1" stop-color="#86a06f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#ok3bg)"/>
  <!-- towering cedars -->
  <g fill="#3c5232">
    <rect x="30" y="0" width="40" height="400"/>
    <rect x="180" y="0" width="34" height="400" opacity="0.85"/>
    <rect x="330" y="0" width="44" height="400"/>
  </g>
  <g fill="#324628" opacity="0.6">
    <rect x="30" y="0" width="14" height="400"/>
    <rect x="330" y="0" width="16" height="400"/>
  </g>
  <!-- dappled light -->
  <circle cx="120" cy="60" r="30" fill="#bcd49a" opacity="0.25"/>
  <circle cx="280" cy="90" r="24" fill="#bcd49a" opacity="0.2"/>
  <!-- mossy ground -->
  <ellipse cx="200" cy="380" rx="260" ry="70" fill="#6f8a55"/>
  <!-- three Jizo statues with red bibs -->
  <g>
    <!-- left -->
    <g>
      <ellipse cx="110" cy="300" rx="34" ry="40" fill="#b8c0b0"/>
      <circle cx="110" cy="250" r="30" fill="#c4ccbc"/>
      <path d="M86 270 q24 28 48 0 l6 50 h-60 z" fill="#cf3b3b"/>
      <path d="M100 248 q10 -6 20 0" fill="none" stroke="#5a6452" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M98 256 q5 4 10 0 m4 0 q5 4 10 0" fill="none" stroke="#5a6452" stroke-width="2"/>
      <!-- moss patches -->
      <circle cx="92" cy="320" r="8" fill="#7fa05c" opacity="0.7"/>
    </g>
    <!-- center (bigger) -->
    <g>
      <ellipse cx="200" cy="310" rx="42" ry="48" fill="#b8c0b0"/>
      <circle cx="200" cy="248" r="38" fill="#c4ccbc"/>
      <path d="M168 272 q32 34 64 0 l8 62 h-80 z" fill="#d94343"/>
      <path d="M188 246 q12 -7 24 0" fill="none" stroke="#5a6452" stroke-width="3" stroke-linecap="round"/>
      <path d="M186 256 q6 5 12 0 m4 0 q6 5 12 0" fill="none" stroke="#5a6452" stroke-width="2.5"/>
      <circle cx="232" cy="328" r="10" fill="#7fa05c" opacity="0.7"/>
      <circle cx="172" cy="300" r="7" fill="#7fa05c" opacity="0.6"/>
    </g>
    <!-- right -->
    <g>
      <ellipse cx="292" cy="304" rx="34" ry="42" fill="#b8c0b0"/>
      <circle cx="292" cy="252" r="30" fill="#c4ccbc"/>
      <path d="M268 272 q24 28 48 0 l6 52 h-60 z" fill="#cf3b3b"/>
      <path d="M282 250 q10 -6 20 0" fill="none" stroke="#5a6452" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M280 258 q5 4 10 0 m4 0 q5 4 10 0" fill="none" stroke="#5a6452" stroke-width="2"/>
      <circle cx="276" cy="324" r="8" fill="#7fa05c" opacity="0.7"/>
    </g>
  </g>
</svg>
