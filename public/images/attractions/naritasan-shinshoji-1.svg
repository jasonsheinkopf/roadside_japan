<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A grand temple complex with a three-story pagoda and a large main hall">
  <defs>
    <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9f5"/>
      <stop offset="1" stop-color="#f3ede0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#tsky)"/>
  <circle cx="70" cy="70" r="26" fill="#fff0c0"/>
  <g fill="#7fbf6a" opacity="0.7">
    <circle cx="350" cy="120" r="40"/><circle cx="320" cy="140" r="30"/>
  </g>
  <rect y="330" width="400" height="70" fill="#cdb98f"/>
  <rect y="320" width="400" height="14" fill="#b09a6f"/>
  <!-- main hall -->
  <g transform="translate(230,200)">
    <rect x="-20" y="60" width="160" height="70" fill="#d8c9a0"/>
    <rect x="-20" y="56" width="160" height="10" fill="#8e3b2e"/>
    <polygon points="-40,56 160,56 130,8 -10,8" fill="#7a342a"/>
    <polygon points="-30,12 150,12 60,-22" fill="#94463a"/>
    <g fill="#8e3b2e">
      <rect x="0" y="66" width="14" height="64"/><rect x="40" y="66" width="14" height="64"/>
      <rect x="80" y="66" width="14" height="64"/><rect x="120" y="66" width="14" height="64"/>
    </g>
    <rect x="50" y="80" width="36" height="50" fill="#5a2a22"/>
  </g>
  <!-- pagoda -->
  <g transform="translate(120,120)">
    <rect x="-14" y="180" width="28" height="40" fill="#94463a"/>
    <polygon points="-40,180 40,180 28,156 -28,156" fill="#7a342a"/>
    <rect x="-18" y="130" width="36" height="26" fill="#d8c9a0"/>
    <polygon points="-44,130 44,130 30,104 -30,104" fill="#7a342a"/>
    <rect x="-22" y="78" width="44" height="26" fill="#d8c9a0"/>
    <polygon points="-50,78 50,78 34,50 -34,50" fill="#7a342a"/>
    <rect x="-26" y="22" width="52" height="28" fill="#d8c9a0"/>
    <polygon points="-56,22 56,22 38,-10 -38,-10" fill="#7a342a"/>
    <line x1="0" y1="-10" x2="0" y2="-40" stroke="#caa84a" stroke-width="4"/>
    <circle cx="0" cy="-40" r="5" fill="#caa84a"/>
  </g>
</svg>
