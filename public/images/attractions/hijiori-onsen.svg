<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A narrow old hot-spring street of wooden inns lit by lanterns in a green valley">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#5a4a55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky7)"/>
  <!-- valley hills -->
  <path d="M0 0 L0 220 Q150 120 320 180 L320 0 Z" fill="#27432e"/>
  <path d="M800 0 L800 220 Q650 120 480 180 L480 0 Z" fill="#27432e"/>
  <circle cx="400" cy="70" r="40" fill="#fff4d6" opacity="0.6"/>
  <!-- street -->
  <rect x="0" y="420" width="800" height="80" fill="#3a3036"/>
  <path d="M300 420 L360 500 L440 500 L500 420 Z" fill="#4a3f46"/>
  <!-- left inns -->
  <g>
    <rect x="20" y="240" width="170" height="200" fill="#5a4636"/>
    <path d="M10 240 L105 200 L200 240 Z" fill="#3a2d22"/>
    <rect x="40" y="300" width="40" height="60" fill="#ffcf6a"/>
    <rect x="100" y="300" width="40" height="60" fill="#ffcf6a"/>
    <rect x="40" y="370" width="100" height="60" fill="#6b5443"/>
    <rect x="210" y="290" width="120" height="150" fill="#6b5443"/>
    <path d="M200 290 L270 258 L340 290 Z" fill="#3a2d22"/>
    <rect x="230" y="330" width="34" height="50" fill="#ffcf6a"/>
    <rect x="280" y="330" width="34" height="50" fill="#ffcf6a"/>
  </g>
  <!-- right inns -->
  <g>
    <rect x="610" y="240" width="170" height="200" fill="#5a4636"/>
    <path d="M600 240 L695 200 L790 240 Z" fill="#3a2d22"/>
    <rect x="630" y="300" width="40" height="60" fill="#ffcf6a"/>
    <rect x="690" y="300" width="40" height="60" fill="#ffcf6a"/>
    <rect x="470" y="290" width="120" height="150" fill="#6b5443"/>
    <path d="M460 290 L530 258 L600 290 Z" fill="#3a2d22"/>
    <rect x="490" y="330" width="34" height="50" fill="#ffcf6a"/>
    <rect x="540" y="330" width="34" height="50" fill="#ffcf6a"/>
  </g>
  <!-- hanging lanterns -->
  <g>
    <g transform="translate(360 250)"><line x1="0" y1="-20" x2="0" y2="0" stroke="#222" stroke-width="2"/><ellipse cx="0" cy="14" rx="16" ry="22" fill="#ff5a4a"/><ellipse cx="0" cy="14" rx="16" ry="22" fill="#ffae6a" opacity="0.4"/></g>
    <g transform="translate(440 250)"><line x1="0" y1="-20" x2="0" y2="0" stroke="#222" stroke-width="2"/><ellipse cx="0" cy="14" rx="16" ry="22" fill="#ff5a4a"/><ellipse cx="0" cy="14" rx="16" ry="22" fill="#ffae6a" opacity="0.4"/></g>
  </g>
  <!-- glow -->
  <g fill="#ffcf6a" opacity="0.18"><circle cx="110" cy="330" r="60"/><circle cx="690" cy="330" r="60"/><circle cx="400" cy="270" r="50"/></g>
</svg>
