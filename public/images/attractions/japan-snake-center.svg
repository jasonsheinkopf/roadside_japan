<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A retro snake park with exhibit houses and a large coiled green snake behind glass">
  <defs>
    <linearGradient id="sky8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c98e"/>
      <stop offset="1" stop-color="#fbe6c6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky8)"/>
  <circle cx="120" cy="110" r="46" fill="#ffd98a"/>
  <rect y="380" width="800" height="120" fill="#8f9a6e"/>
  <!-- exhibit houses -->
  <g>
    <rect x="40" y="250" width="150" height="130" fill="#d98c4a"/>
    <polygon points="20,250 115,200 210,250" fill="#9a5e2e"/>
