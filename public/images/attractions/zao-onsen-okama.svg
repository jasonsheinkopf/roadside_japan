<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A round emerald-green volcanic crater lake ringed by bare rocky peaks">
  <defs>
    <linearGradient id="zsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ec9e8"/>
      <stop offset="1" stop-color="#dcecf2"/>
    </linearGradient>
    <radialGradient id="zlake" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3fd6a8"/>
      <stop offset="0.7" stop-color="#1fa884"/>
      <stop offset="1" stop-color="#127a63"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#zsky)"/>
  <!-- distant ridge -->
  <path d="M0 200 L150 150 L300 200 L450 140 L620 200 L800 160 V300 H0 Z" fill="#8b94a0" opacity="0.5"/>
  <!-- crater rim peaks -->
  <path d="M0 320 L120 200 L240 300 L360 190 L520 300 L660 210 L800 320 V500 H0 Z" fill="#7c6b5f"/>
  <path d="M0 320 L120 200 L240 300 L360 190 L520 300 L660 210 L800 320 L800 360 Q400 330 0 360 Z" fill="#6a5a4f"/>
  <!-- rocky shading -->
  <g fill="#5a4c43" opacity="0.5">
    <polygon points="120,200 160,260 90,270"/>
    <polygon points="360,190 410,255 320,255"/>
    <polygon points="660,210 710,280 620,275"/>
  </g>
  <!-- snow patches -->
  <g fill="#f2f5f7" opacity="0.8">
    <path d="M210 290 l30 10 -20 16 -22 -8 Z"/>
    <path d="M470 290 l34 12 -24 16 -22 -10 Z"/>
  </g>
  <!-- lake -->
  <ellipse cx="400" cy="400" rx="230" ry="95" fill="#0e5a4a"/>
  <ellipse cx="400" cy="392" rx="215" ry="84" fill="url(#zlake)"/>
  <ellipse cx="340" cy="370" rx="70" ry="22" fill="#6fe6c2" opacity="0.45"/>
</svg>
