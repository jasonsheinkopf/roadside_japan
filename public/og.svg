<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2336"/>
      <stop offset="1" stop-color="#2a3550"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E3"/>
      <stop offset="1" stop-color="#EAD9C2"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="badge"><rect x="3" y="3" width="90" height="90" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Logo mark, scaled -->
  <g transform="translate(96,212) scale(2.15)">
    <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#sky)"/>
    <g clip-path="url(#badge)">
      <circle cx="69" cy="28" r="10" fill="#E0492F"/>
      <path d="M-4,66 Q22,54 50,62 T100,60 L100,100 L-4,100 Z" fill="#3E7D5A"/>
      <path d="M17,67 L43,29 C45.5,25.5 50.5,25.5 53,29 L79,67 Z" fill="#243049"/>
      <path d="M38,39 L48,27.5 L58,39 L54,38 L51,42.5 L48,38.5 L45,42.5 L42,38 Z" fill="#FFFFFF"/>
      <path d="M35,96 L45.4,60 L50.6,60 L61,96 Z" fill="#FBF7EF"/>
      <line x1="48" y1="94" x2="48" y2="62" stroke="#E0492F" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 4.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="372" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#FBF7EF">Roadside Japan</text>
  <text x="375" y="348" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="33" fill="#E7B7AC">Discover the Japan most tourists never see.</text>

  <!-- Tag row -->
  <text x="375" y="424" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="26" fill="#b9c0d4">Hidden gems · Weird attractions · Seasonal events</text>

  <!-- Footer rule -->
  <rect x="96" y="520" width="1008" height="2" fill="#ffffff" fill-opacity="0.12"/>
  <text x="96" y="566" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="27" fill="#8b93a8">An open, community + AI-curated atlas of Japan</text>
</svg>
