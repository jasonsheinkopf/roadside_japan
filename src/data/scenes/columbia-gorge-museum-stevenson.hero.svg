<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="cgms" data-title="Columbia Gorge Museum above the river, rosary gallery lit at dusk">
  <defs>
    <linearGradient id="cgms-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33506e"/>
      <stop offset="0.45" stop-color="#a8709a"/>
      <stop offset="0.75" stop-color="#e8a466"/>
      <stop offset="1" stop-color="#fbdca0"/>
    </linearGradient>
    <radialGradient id="cgms-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6df" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffd9a0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cgms-ridgefar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8fb0"/>
      <stop offset="1" stop-color="#6a749a"/>
    </linearGradient>
    <linearGradient id="cgms-ridgemid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c7286"/>
      <stop offset="1" stop-color="#3c5468"/>
    </linearGradient>
    <linearGradient id="cgms-beacon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d6072"/>
      <stop offset="1" stop-color="#2e4254"/>
    </linearGradient>
    <linearGradient id="cgms-river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b877"/>
      <stop offset="0.4" stop-color="#93a2ad"/>
      <stop offset="1" stop-color="#4f6c82"/>
    </linearGradient>
    <linearGradient id="cgms-forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c5940"/>
      <stop offset="1" stop-color="#20331f"/>
    </linearGradient>
    <linearGradient id="cgms-clearing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9660"/>
      <stop offset="1" stop-color="#63713f"/>
    </linearGradient>
    <linearGradient id="cgms-cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#847c72"/>
      <stop offset="0.45" stop-color="#5c534a"/>
      <stop offset="1" stop-color="#302722"/>
    </linearGradient>
    <linearGradient id="cgms-column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#948b7e"/>
      <stop offset="1" stop-color="#463c33"/>
    </linearGradient>
    <linearGradient id="cgms-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5c3c"/>
      <stop offset="1" stop-color="#5c3a24"/>
    </linearGradient>
    <linearGradient id="cgms-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a49c8e"/>
      <stop offset="1" stop-color="#726a5c"/>
    </linearGradient>
    <linearGradient id="cgms-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3ab" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#c98f6a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5a4c56" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cgms-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3525"/>
      <stop offset="1" stop-color="#2c1f15"/>
    </linearGradient>
  </defs>

  <!-- sky, dusk light over the Washington side of the Gorge -->
  <rect x="0" y="0" width="480" height="150" fill="url(#cgms-sky)"/>
  <circle cx="382" cy="46" r="36" fill="url(#cgms-sun)"/>
  <path d="M40 34 Q66 24 92 34 Q112 28 130 36" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M250 24 Q272 16 294 24" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M150 66 Q156 60 162 66 Q168 60 174 66" stroke="#3a2e34" stroke-width="1.4" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M190 78 Q195 73 200 78 Q205 73 210 78" stroke="#3a2e34" stroke-width="1.2" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- far ridgeline across the Oregon side -->
  <path d="M0 150 L0 116 Q45 100 90 112 Q135 124 180 106 Q220 90 265 108 Q305 122 350 104 Q395 90 440 108 Q460 116 480 110 L480 150 Z" fill="url(#cgms-ridgefar)" opacity="0.55"/>

  <!-- Beacon Rock, the volcanic plug downriver -->
  <path d="M96 150 L100 122 Q102 104 110 94 Q118 84 125 96 Q131 108 128 124 Q133 138 130 150 Z" fill="url(#cgms-beacon)" opacity="0.85"/>
  <path d="M108 118 Q116 112 122 118" stroke="#233040" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- nearer ridge, forested hills across the river -->
  <path d="M0 150 L0 130 Q55 114 110 128 Q160 140 210 124 Q255 110 305 126 Q350 140 400 124 Q440 112 480 126 L480 150 Z" fill="url(#cgms-ridgemid)" opacity="0.85"/>

  <!-- the Columbia River, running through the gorge below the bluff -->
  <rect x="0" y="146" width="480" height="34" fill="url(#cgms-river)"/>
  <path d="M20 158 Q90 154 160 158 Q230 162 300 157 Q370 152 460 158" stroke="#fbe9c6" stroke-width="1.4" fill="none" opacity="0.4"/>
  <path d="M10 170 Q90 166 170 171 Q250 176 330 170 Q400 165 470 171" stroke="#e7eef2" stroke-width="1.3" fill="none" opacity="0.3"/>

  <!-- Bridge of the Gods, spanning the river in the middle distance -->
  <line x1="252" y1="168" x2="252" y2="150" stroke="#3a3530" stroke-width="1.6"/>
  <line x1="318" y1="168" x2="318" y2="150" stroke="#3a3530" stroke-width="1.6"/>
  <path d="M240 156 L252 150 L318 150 L330 156" stroke="#3a3530" stroke-width="1.4" fill="none"/>

  <!-- a dugout canoe and, further downriver, a sternwheeler working the water -->
  <path d="M56 174 Q64 170 74 174 Q66 178 56 174 Z" fill="#241a12" opacity="0.75"/>
  <path d="M338 170 L364 170 L362 165 L340 165 Z" fill="#221c18" opacity="0.75"/>
  <line x1="347" y1="165" x2="347" y2="159" stroke="#221c18" stroke-width="1.4" opacity="0.75"/>
  <circle cx="366" cy="172" r="3.6" fill="none" stroke="#221c18" stroke-width="1.2" opacity="0.7"/>

  <!-- the forested crest of the near-side bluff -->
  <path d="M0 300 L0 194 Q60 178 120 188 Q180 196 240 184 Q300 174 360 188 Q412 198 480 184 L480 300 Z" fill="url(#cgms-forest)"/>

  <!-- basalt cliff faces flanking the viewpoint, dropping to the river -->
  <path d="M0 300 L0 198 Q36 190 72 200 Q94 206 92 224 Q88 250 76 272 Q56 290 22 294 L0 294 Z" fill="url(#cgms-cliff)"/>
  <path d="M480 300 L480 194 Q444 186 408 200 Q388 208 390 224 Q394 250 406 272 Q426 290 460 294 L480 294 Z" fill="url(#cgms-cliff)"/>
  <!-- hexagonal basalt columns, broken off at slightly different heights -->
  <path d="M2 214 L14 202 L24 205 L21 262 L8 268 L2 260 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M24 205 L36 198 L47 203 L44 256 L30 264 L21 262 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M47 203 L58 208 L68 214 L64 248 L52 254 L44 256 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M68 214 L78 220 L84 228 L78 244 L64 248 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M478 210 L466 200 L456 204 L459 260 L472 267 L478 258 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M456 204 L444 197 L433 202 L436 254 L450 263 L459 260 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M433 202 L422 207 L412 213 L416 247 L428 253 L436 254 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M412 213 L402 219 L396 227 L402 243 L416 247 Z" fill="url(#cgms-column)" stroke="#241d17" stroke-width="1"/>
  <path d="M14 202 Q19 200 24 205 M36 198 Q42 200 47 203 M58 208 Q63 210 68 214" stroke="#c7bcaa" stroke-width="1.2" fill="none" opacity="0.55"/>
  <path d="M466 200 Q461 198 456 204 M444 197 Q438 200 433 202 M422 207 Q417 210 412 213" stroke="#c7bcaa" stroke-width="1.2" fill="none" opacity="0.55"/>

  <!-- pines along the crest, framing the clearing -->
  <path d="M14 176 L26 152 L38 176 Z" fill="#233a22"/>
  <path d="M-6 190 L10 160 L26 190 Z" fill="#1c2f1c"/>
  <path d="M448 174 L460 150 L472 174 Z" fill="#233a22"/>
  <path d="M456 190 L472 158 L488 190 Z" fill="#1c2f1c"/>
  <path d="M108 186 L118 168 L128 186 Z" fill="#2e4a2e"/>
  <path d="M354 186 L364 168 L374 186 Z" fill="#2e4a2e"/>

  <!-- the clearing on the bluff top where the museum sits, overlooking the gorge -->
  <path d="M118 300 L118 208 Q200 192 260 196 Q330 200 372 212 L372 300 Z" fill="url(#cgms-clearing)"/>
  <path d="M118 236 Q200 222 280 228 Q330 232 372 240" stroke="#4c5730" stroke-width="1.4" fill="none" opacity="0.4"/>

  <!-- Columbia Gorge Museum: stone base, timber walls, low overlook roofline -->
  <rect x="165" y="210" width="170" height="22" fill="url(#cgms-stone)" stroke="#5c5346" stroke-width="1"/>
  <line x1="165" y1="218" x2="335" y2="218" stroke="#5c5346" stroke-width="0.8" opacity="0.6"/>
  <line x1="165" y1="225" x2="335" y2="225" stroke="#5c5346" stroke-width="0.8" opacity="0.6"/>
  <rect x="165" y="172" width="170" height="38" fill="url(#cgms-wall)" stroke="#3f2717" stroke-width="1"/>
  <line x1="165" y1="184" x2="335" y2="184" stroke="#3f2717" stroke-width="0.9" opacity="0.5"/>
  <line x1="165" y1="196" x2="335" y2="196" stroke="#3f2717" stroke-width="0.9" opacity="0.5"/>
  <path d="M156 172 L344 172 L326 150 L174 150 Z" fill="url(#cgms-roof)"/>
  <line x1="174" y1="150" x2="326" y2="150" stroke="#1c130c" stroke-width="1.6" opacity="0.7"/>
  <rect x="308" y="132" width="10" height="20" fill="#4a3525" stroke="#2c1f15" stroke-width="1"/>

  <!-- the big glass wall overlooking the river, the Spiritual Quest Gallery upstairs -->
  <rect x="196" y="178" width="92" height="28" fill="url(#cgms-glass)" stroke="#3f2717" stroke-width="1.4"/>
  <path d="M218 178 v28 M242 178 v28 M266 178 v28 M196 192 h92" stroke="#3f2717" stroke-width="0.9" opacity="0.5"/>

  <!-- the rosary collection, glimpsed through the window: strands sorted small to the sixteen-foot giant -->
  <path d="M208 179 v25" stroke="#241a12" stroke-width="1" opacity="0.8"/>
  <circle cx="208" cy="184" r="1.6" fill="#241a12" opacity="0.9"/>
  <circle cx="208" cy="189" r="2.1" fill="#241a12" opacity="0.9"/>
  <circle cx="208" cy="195" r="2.6" fill="#241a12" opacity="0.9"/>
  <path d="M208 200 v3 M206 202 h4" stroke="#241a12" stroke-width="1.2" opacity="0.9"/>
  <line x1="255" y1="178" x2="255" y2="187" stroke="#241a12" stroke-width="1.4" opacity="0.85"/>
  <circle cx="255" cy="195" r="8" fill="none" stroke="#241a12" stroke-width="2.2" opacity="0.9"/>
  <path d="M255 203 v3 M253 205 h4" stroke="#241a12" stroke-width="1.4" opacity="0.9"/>

  <rect x="172" y="182" width="14" height="18" fill="url(#cgms-glass)" stroke="#3f2717" stroke-width="1"/>
  <rect x="304" y="188" width="16" height="22" fill="#2c1f15" stroke="#1c130c" stroke-width="1"/>
  <circle cx="316" cy="199" r="1.2" fill="#c9a25a"/>
  <path d="M300 232 L326 232 L322 222 L304 222 Z" fill="url(#cgms-stone)" stroke="#5c5346" stroke-width="1"/>

  <!-- sign and flagpole out front -->
  <line x1="232" y1="244" x2="232" y2="224" stroke="#3f2717" stroke-width="2"/>
  <rect x="212" y="212" width="40" height="13" fill="#e8dcc0" stroke="#3f2717" stroke-width="1"/>
  <path d="M216 216 h32 M216 220 h24" stroke="#3f2717" stroke-width="1.2" opacity="0.55"/>
  <line x1="150" y1="150" x2="150" y2="228" stroke="#3f2717" stroke-width="1.6"/>
  <path d="M150 150 L172 156 L150 162 Z" fill="#8a3b2e"/>

  <!-- the free lot overlooking the river, set on the grass beside the museum -->
  <rect x="126" y="240" width="66" height="32" rx="2" fill="#5c5f5a" opacity="0.9"/>
  <path d="M138 240 L138 272 M160 240 L160 272 M182 240 L182 272" stroke="#e8dcc0" stroke-width="1.4" opacity="0.5"/>
  <rect x="140" y="251" width="24" height="12" rx="3" fill="#7a8a94" stroke="#2c2f2e" stroke-width="1"/>
  <circle cx="146" cy="264" r="3.2" fill="#1c1e1c"/>
  <circle cx="161" cy="264" r="3.2" fill="#1c1e1c"/>
  <line x1="120" y1="250" x2="120" y2="220" stroke="#2c2f2e" stroke-width="1.6"/>
  <circle cx="120" cy="216" r="4" fill="#fbe3ab" opacity="0.6"/>

  <!-- low viewpoint rail at the cliff edge, close to camera -->
  <line x1="118" y1="286" x2="372" y2="286" stroke="#3f2717" stroke-width="2"/>
  <line x1="140" y1="286" x2="140" y2="298" stroke="#3f2717" stroke-width="2"/>
  <line x1="240" y1="286" x2="240" y2="298" stroke="#3f2717" stroke-width="2"/>
  <line x1="340" y1="286" x2="340" y2="298" stroke="#3f2717" stroke-width="2"/>

  <!-- foreground shrubs, low on the bluff edge -->
  <circle cx="20" cy="288" r="6" fill="#556b34" opacity="0.85"/>
  <circle cx="30" cy="292" r="5" fill="#63783e" opacity="0.85"/>
  <circle cx="26" cy="284" r="1.4" fill="#e0c24a"/>
  <circle cx="460" cy="286" r="6" fill="#556b34" opacity="0.85"/>
  <circle cx="450" cy="291" r="5" fill="#63783e" opacity="0.85"/>
  <path d="M400 298 q2 -14 6 0" stroke="#4a6530" stroke-width="1.8" fill="none"/>
  <path d="M410 300 q2 -12 6 0" stroke="#4a6530" stroke-width="1.8" fill="none"/>
</svg>
