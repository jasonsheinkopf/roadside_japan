<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="bbh2" data-title="Socks cataloguing all twelve NPB uniforms down the display hall">
  <defs>
    <linearGradient id="bbh2-ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3350"/>
      <stop offset="1" stop-color="#2c4c70"/>
    </linearGradient>
    <linearGradient id="bbh2-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48f6c"/>
      <stop offset="1" stop-color="#7d6a4c"/>
    </linearGradient>
    <linearGradient id="bbh2-case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeaf2"/>
      <stop offset="1" stop-color="#b7c8d6"/>
    </linearGradient>
  </defs>

  <!-- high vantage: a strip of ceiling track-lighting up top -->
  <rect x="0" y="0" width="480" height="46" fill="url(#bbh2-ceil)"/>
  <circle cx="80" cy="20" r="5" fill="#fff6d8" opacity="0.8"/>
  <circle cx="200" cy="16" r="5" fill="#fff6d8" opacity="0.8"/>
  <circle cx="320" cy="20" r="5" fill="#fff6d8" opacity="0.8"/>
  <circle cx="420" cy="16" r="5" fill="#fff6d8" opacity="0.8"/>

  <!-- the display hall floor, seen from above, receding into the distance -->
  <path d="M0 46 L480 46 L480 300 L0 300 Z" fill="url(#bbh2-floor)"/>
  <path d="M0 300 L200 46 M480 300 L280 46" stroke="#5a4c34" stroke-width="1" opacity="0.3"/>
  <path d="M60 300 L220 46 M420 300 L260 46" stroke="#5a4c34" stroke-width="0.8" opacity="0.25"/>

  <!-- twelve uniform cases lined down the hall in two receding rows -->
  <g>
    <rect x="86" y="60" width="26" height="46" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="122" y="66" width="24" height="42" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="156" y="72" width="22" height="38" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="188" y="78" width="20" height="34" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="218" y="84" width="18" height="30" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="246" y="88" width="16" height="26" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
  </g>
  <g>
    <rect x="330" y="88" width="16" height="26" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="358" y="84" width="18" height="30" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="388" y="78" width="20" height="34" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="418" y="70" width="22" height="40" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
    <rect x="452" y="62" width="24" height="46" fill="url(#bbh2-case)" stroke="#5a6b7a" stroke-width="1"/>
  </g>
  <!-- tiny jersey silhouettes ghosted inside a few of the near cases -->
  <path d="M92 74 L94 68 L104 68 L106 74 L104 100 L94 100 Z" fill="#c4362a" opacity="0.55"/>
  <path d="M128 78 L130 72 L140 72 L142 78 L140 102 L130 102 Z" fill="#2c5aa0" opacity="0.55"/>
  <path d="M334 92 L336 88 L342 88 L344 92 L342 108 L336 108 Z" fill="#f4a531" opacity="0.55"/>
  <path d="M360 88 L362 84 L370 84 L372 88 L370 108 L362 108 Z" fill="#1f7a4c" opacity="0.55"/>

  <!-- a wide central aisle rug leading the eye down the hall -->
  <path d="M198 300 L282 300 L252 60 L228 60 Z" fill="#5a2f2c" opacity="0.5"/>

  <!-- Socks, small at the far end of the aisle, craning up at the row of cases -->
  <ellipse cx="240" cy="200" rx="12" ry="4" fill="#0c1a2c" opacity="0.3"/>
  <g transform="translate(214 158) scale(0.26)">
    <use href="#advc-socks" width="200" height="200"/>
  </g>

  <!-- a clipboard held up, mid-cataloguing -->
  <rect x="252" y="182" width="10" height="13" rx="1" fill="#f4f2e6" stroke="#8a7a5e" stroke-width="0.8"/>
  <path d="M254 186 L260 186 M254 189 L260 189" stroke="#8a7a5e" stroke-width="0.6"/>
</svg>
