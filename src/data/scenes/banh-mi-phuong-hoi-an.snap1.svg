<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="bmpa" data-title="Timing the counter women: under thirty seconds a sandwich">
<defs>
  <linearGradient id="bmpa-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a2e1c"/>
    <stop offset="1" stop-color="#241408"/>
  </linearGradient>
  <radialGradient id="bmpa-glowA" cx="0.25" cy="0.2" r="0.6">
    <stop offset="0" stop-color="#ffcf7e" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#ffcf7e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bmpa-glowB" cx="0.85" cy="0.1" r="0.5">
    <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bmpa-bread" x1="0" y1="0" x2="1" y2="0.3">
    <stop offset="0" stop-color="#f2deab"/>
    <stop offset="1" stop-color="#caa057"/>
  </linearGradient>
  <linearGradient id="bmpa-crumb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbf3dd"/>
    <stop offset="1" stop-color="#ecd9a8"/>
  </linearGradient>
  <linearGradient id="bmpa-pork" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0" stop-color="#d97a3e"/>
    <stop offset="1" stop-color="#8a3c1a"/>
  </linearGradient>
  <linearGradient id="bmpa-skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0cba0"/>
    <stop offset="1" stop-color="#d9a877"/>
  </linearGradient>
</defs>

<!-- blurred warm interior of the counter, out of focus behind the action -->
<rect x="0" y="0" width="480" height="300" fill="url(#bmpa-bg)"/>
<ellipse cx="70" cy="40" rx="120" ry="70" fill="url(#bmpa-glowA)"/>
<ellipse cx="420" cy="30" rx="90" ry="60" fill="url(#bmpa-glowB)"/>
<circle cx="440" cy="120" r="26" fill="#e0503f" opacity="0.28"/>
<circle cx="30" cy="160" r="20" fill="#f2a63f" opacity="0.22"/>
<rect x="0" y="196" width="480" height="20" fill="#1c1006" opacity="0.5"/>

<!-- the counter surface, close and cropped tight -->
<rect x="0" y="206" width="480" height="94" fill="#3a2718"/>
<line x1="0" y1="212" x2="480" y2="212" stroke="#20140c" stroke-width="2" opacity="0.6"/>

<!-- the open baguette mid-assembly, filling the near-center of frame -->
<path d="M60 200 q60 -22 150 -10 l4 26 q-84 16 -150 4 z" fill="url(#bmpa-bread)"/>
<path d="M64 198 q56 -18 140 -8" stroke="#8a6a3a" stroke-width="1.4" fill="none" opacity="0.5"/>
<path d="M70 210 q54 12 130 4 l2 10 q-70 10 -130 -2z" fill="url(#bmpa-crumb)"/>
<!-- pâté smear -->
<path d="M78 214 q40 8 90 2 l1 6 q-46 8 -90 0z" fill="#c98a68"/>
<!-- grilled pork strips going down -->
<path d="M110 208 q10 -6 22 -2 l-3 14 q-11 4 -21 -2z" fill="url(#bmpa-pork)"/>
<path d="M140 210 q10 -5 21 0 l-3 13 q-10 4 -19 -3z" fill="url(#bmpa-pork)"/>
<!-- herbs -->
<path d="M170 206 q5 -8 12 -3 q6 -6 10 2 q-4 8 -12 6 q-7 3 -10 -5z" fill="#6d8f45"/>
<path d="M188 208 q5 -7 11 -2 q5 -6 9 2 q-3 7 -10 5 q-6 3 -10 -5z" fill="#5f8039"/>

<!-- the counter woman's hand, mid-motion, placing the last strip -->
<path d="M188 176 q-20 2 -26 18 q-3 10 6 16 q28 8 50 -4 q6 -14 -6 -24 q-12 -8 -24 -6z" fill="url(#bmpa-skin)"/>
<path d="M172 194 q-3 9 3 15 M190 198 q-2 10 3 16 M208 196 q-1 10 4 14" stroke="#b8875a" stroke-width="2" fill="none" opacity="0.5"/>
<!-- speed lines off the hand: she is fast -->
<path d="M150 168 q14 -2 26 4" stroke="#f2deab" stroke-width="1.6" fill="none" opacity="0.55"/>
<path d="M148 180 q16 0 28 8" stroke="#f2deab" stroke-width="1.6" fill="none" opacity="0.4"/>
<path d="M152 156 q12 -4 22 0" stroke="#f2deab" stroke-width="1.3" fill="none" opacity="0.35"/>

<!-- Cinnamon, leaning in close, riveted -->
<ellipse cx="382" cy="288" rx="82" ry="14" fill="#000" opacity="0.24"/>
<g transform="translate(258 44) scale(1.02)">
  <use href="#advc-cinnamon" width="240" height="240"/>
</g>

<!-- the stopwatch, propped on the counter edge for the timing gag -->
<g transform="translate(50 232)">
  <line x1="14" y1="-4" x2="14" y2="-11" stroke="#5c5648" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M8 -11 q6 -4 12 0" stroke="#5c5648" stroke-width="2" fill="none"/>
  <circle cx="14" cy="16" r="17" fill="#e9e2d4" stroke="#5c5648" stroke-width="2.4"/>
  <circle cx="14" cy="16" r="12.5" fill="none" stroke="#8a8272" stroke-width="1"/>
  <line x1="14" y1="16" x2="14" y2="6" stroke="#241c16" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="21" y2="18" stroke="#241c16" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="14" cy="16" r="1.6" fill="#241c16"/>
  <line x1="14" y1="5" x2="14" y2="8" stroke="#8a8272" stroke-width="1"/>
  <line x1="25" y1="16" x2="22" y2="16" stroke="#8a8272" stroke-width="1"/>
  <line x1="14" y1="27" x2="14" y2="24" stroke="#8a8272" stroke-width="1"/>
  <line x1="3" y1="16" x2="6" y2="16" stroke="#8a8272" stroke-width="1"/>
</g>
</svg>
