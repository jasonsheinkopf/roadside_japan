<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="koes" data-title="Koenji Awa Odori — under the arcade lanterns">
  <defs>
    <linearGradient id="koes-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e2a"/>
      <stop offset="0.55" stop-color="#2b2a63"/>
      <stop offset="1" stop-color="#6b3f4a"/>
    </linearGradient>
    <linearGradient id="koes-street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2145"/>
      <stop offset="1" stop-color="#120e22"/>
    </linearGradient>
    <radialGradient id="koes-glow" cx="0.5" cy="0.55" r="0.62">
      <stop offset="0" stop-color="#ffcf85" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffcf85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="koes-lanternfill" cx="0.5" cy="0.38" r="0.68">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.45" stop-color="#ffab4d"/>
      <stop offset="1" stop-color="#c23a2c"/>
    </radialGradient>
    <radialGradient id="koes-lanternglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb85a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffb85a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="koes-drumg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a2a"/>
      <stop offset="1" stop-color="#4a2313"/>
    </linearGradient>

    <!-- one chōchin lantern, reused along two draped strings -->
    <g id="koes-lantern">
      <circle r="17" fill="url(#koes-lanternglow)"/>
      <path d="M-8 -11 q8 -5 16 0 q4 11 0 22 q-8 5 -16 0 q-4 -11 0 -22z" fill="url(#koes-lanternfill)" stroke="#7a1f1f" stroke-width="1"/>
      <rect x="-6" y="-13.5" width="12" height="3.5" rx="1" fill="#2c1f10"/>
      <rect x="-6" y="10" width="12" height="3.5" rx="1" fill="#2c1f10"/>
      <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#8a2020" stroke-width="0.8" opacity="0.5"/>
    </g>

    <!-- Awa Odori woman: tiptoe, arms raised in a V, amigasa half-moon hat -->
    <g id="koes-onna">
      <path d="M-11 2 q-4 -38 11 -55 q15 17 11 55 z" fill="#2c3568"/>
      <path d="M0 -53 q11 16 11 55 l-7 0 q1 -34 -4 -53z" fill="#202a54"/>
      <path d="M-10 -26 q10 5 20 0 l-2 8 q-8 4 -16 0z" fill="#b23b46"/>
      <path d="M-5 -51 l5 9 l5 -9z" fill="#f0e6d5"/>
      <path d="M-5 -48 q-15 -7 -19 -23" fill="none" stroke="#2c3568" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M5 -48 q15 -7 19 -23" fill="none" stroke="#2c3568" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-24" cy="-71" r="2.6" fill="#ecc9a2"/>
      <circle cx="24" cy="-71" r="2.6" fill="#ecc9a2"/>
      <ellipse cx="0" cy="-52" rx="5.5" ry="6" fill="#ecc9a2"/>
      <path d="M-15 -59 q15 -11 30 0 q-7 6 -15 6 q-8 0 -15 -6z" fill="#d9b563" stroke="#a3792f" stroke-width="1.3"/>
      <path d="M-4 2 l3 5 M4 2 l-3 5" stroke="#171335" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Awa Odori man: low wide lunge, happi coat, headband -->
    <g id="koes-otoko">
      <path d="M2 2 q9 -9 13 -23" fill="none" stroke="#202a54" stroke-width="7" stroke-linecap="round"/>
      <path d="M-2 2 q-12 -5 -12 -19 q0 -5 4 -10" fill="none" stroke="#202a54" stroke-width="7" stroke-linecap="round"/>
      <path d="M-12 -26 q12 -10 24 -2 l-3 17 q-9 5 -18 0z" fill="#283266"/>
      <path d="M-10 -26 q4 7 4 16 M11 -28 q-3 7 -2 15" stroke="#f0e6d5" stroke-width="2.2" fill="none"/>
      <path d="M-10 -26 q-14 3 -21 -3" fill="none" stroke="#283266" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M12 -26 q14 5 21 -2" fill="none" stroke="#283266" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-31" cy="-29" r="2.6" fill="#ecc9a2"/>
      <circle cx="33" cy="-28" r="2.6" fill="#ecc9a2"/>
      <circle cx="2" cy="-35" r="6" fill="#ecc9a2"/>
      <path d="M-4 -38 q6 -3 12 0 l-1 2.5 q-5 -2.5 -10 0z" fill="#b23b46"/>
      <path d="M8 -37 q5 2 7 7" stroke="#b23b46" stroke-width="1.8" fill="none"/>
    </g>
  </defs>

  <!-- night sky -->
  <rect x="0" y="0" width="480" height="300" fill="url(#koes-sky)"/>
  <circle cx="46" cy="24" r="1.4" fill="#f0e6d5" opacity="0.8"/>
  <circle cx="132" cy="14" r="1.1" fill="#f0e6d5" opacity="0.7"/>
  <circle cx="330" cy="18" r="1.3" fill="#f0e6d5" opacity="0.75"/>
  <circle cx="405" cy="52" r="1.1" fill="#f0e6d5" opacity="0.65"/>
  <circle cx="458" cy="28" r="1.4" fill="#f0e6d5" opacity="0.8"/>

  <!-- covered shōtengai arcade roof, seen from beneath -->
  <path d="M-10 -10 L490 -10 L490 50 Q240 78 -10 50 Z" fill="#1c1533"/>
  <line x1="40" y1="52" x2="40" y2="70" stroke="#46375f" stroke-width="2" opacity="0.55"/>
  <line x1="100" y1="57" x2="100" y2="76" stroke="#46375f" stroke-width="2" opacity="0.55"/>
  <line x1="170" y1="63" x2="170" y2="82" stroke="#46375f" stroke-width="2" opacity="0.55"/>
  <line x1="240" y1="65" x2="240" y2="85" stroke="#46375f" stroke-width="2" opacity="0.55"/>
  <line x1="310" y1="62" x2="310" y2="81" stroke="#46375f" stroke-width="2" opacity="0.55"/>
  <line x1="380" y1="57" x2="380" y2="75" stroke="#46375f" stroke-width="2" opacity="0.55"/>
  <line x1="440" y1="52" x2="440" y2="70" stroke="#46375f" stroke-width="2" opacity="0.55"/>

  <!-- far lantern string, small and dim -->
  <g opacity="0.68">
    <path d="M30 96 Q240 122 450 96" fill="none" stroke="#3a2f4a" stroke-width="1"/>
    <g transform="translate(75 103) scale(0.5)"><use href="#koes-lantern"/></g>
    <g transform="translate(160 113) scale(0.5)"><use href="#koes-lantern"/></g>
    <g transform="translate(240 117) scale(0.5)"><use href="#koes-lantern"/></g>
    <g transform="translate(320 113) scale(0.5)"><use href="#koes-lantern"/></g>
    <g transform="translate(405 103) scale(0.5)"><use href="#koes-lantern"/></g>
  </g>

  <!-- receding mid-street buildings between the two lantern strings -->
  <g fill="#211a42">
    <rect x="138" y="118" width="56" height="80"/>
    <rect x="204" y="112" width="66" height="86"/>
    <rect x="278" y="120" width="54" height="78"/>
  </g>
  <g fill="#ffcf7a" opacity="0.75">
    <rect x="150" y="132" width="9" height="9"/>
    <rect x="170" y="132" width="9" height="9"/>
    <rect x="220" y="126" width="9" height="9"/>
    <rect x="244" y="126" width="9" height="9"/>
    <rect x="290" y="134" width="9" height="9"/>
    <rect x="310" y="134" width="9" height="9"/>
  </g>

  <!-- near lantern string, bigger and brighter -->
  <path d="M8 140 Q240 170 472 140" fill="none" stroke="#4a3a2a" stroke-width="1.2" opacity="0.6"/>
  <g transform="translate(48 149) scale(0.85)"><use href="#koes-lantern"/></g>
  <g transform="translate(150 165) scale(0.95)"><use href="#koes-lantern"/></g>
  <g transform="translate(240 172) scale(1.0)"><use href="#koes-lantern"/></g>
  <g transform="translate(330 165) scale(0.95)"><use href="#koes-lantern"/></g>
  <g transform="translate(432 149) scale(0.85)"><use href="#koes-lantern"/></g>

  <!-- left storefront block, foreground -->
  <rect x="0" y="176" width="92" height="124" fill="#1b1536"/>
  <rect x="10" y="184" width="72" height="16" fill="#2a2350"/>
  <rect x="16" y="210" width="12" height="12" fill="#ffcf7a" opacity="0.8"/>
  <rect x="40" y="210" width="12" height="12" fill="#ffcf7a" opacity="0.8"/>
  <!-- noren curtain strips over the doorway -->
  <rect x="22" y="255" width="9" height="32" fill="#33407e" opacity="0.9"/>
  <rect x="36" y="255" width="9" height="32" fill="#33407e" opacity="0.9"/>
  <rect x="50" y="255" width="9" height="32" fill="#33407e" opacity="0.9"/>
  <!-- Socks watching from an upper window -->
  <rect x="58" y="192" width="26" height="20" fill="#100c22" opacity="0.9"/>
  <g transform="translate(60 193) scale(0.115)"><use href="#advc-socks" width="200" height="200"/></g>
  <rect x="58" y="208" width="26" height="4" fill="#3a2f4a"/>

  <!-- right storefront block with a striped nobori banner -->
  <rect x="392" y="172" width="88" height="128" fill="#1b1536"/>
  <rect x="404" y="180" width="64" height="14" fill="#2a2350"/>
  <rect x="404" y="206" width="12" height="12" fill="#ffcf7a" opacity="0.8"/>
  <rect x="428" y="206" width="12" height="12" fill="#ffcf7a" opacity="0.8"/>
  <rect x="452" y="206" width="12" height="12" fill="#ffcf7a" opacity="0.8"/>
  <line x1="382" y1="300" x2="382" y2="150" stroke="#3a2c24" stroke-width="3"/>
  <path d="M382 152 l22 6 l-22 6 z" fill="#b23b46"/>
  <path d="M382 164 l22 5 l-22 5 z" fill="#f0e6d5"/>
  <path d="M382 174 l22 5 l-22 5 z" fill="#b23b46"/>

  <!-- shop awning with Cinnamon dancing on its ridge, above the drum stage -->
  <g transform="translate(92 176)">
    <path d="M0 0 h56 v10 l-56 10 z" fill="#8a2f3a"/>
    <path d="M0 10 q7 6 14 0 q7 6 14 0 q7 6 14 0 q7 6 15 0" fill="none" stroke="#5e1f27" stroke-width="2.5"/>
  </g>
  <g transform="translate(86 119) scale(0.28) rotate(-8 120 205)"><use href="#advc-cinnamon" width="240" height="240"/></g>
  <!-- flourish: tail sweep + low-lunge paw taps, echoing the field report -->
  <path d="M138 133 q14 -8 10 -22" fill="none" stroke="#d9b563" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>
  <circle cx="150" cy="107" r="1.6" fill="#f0e6d5" opacity="0.75"/>
  <path d="M100 170 l-10 5 M118 172 l9 6" stroke="#d9b563" stroke-width="1.6" opacity="0.55" stroke-linecap="round"/>

  <!-- street + warm lantern-light haze -->
  <rect x="0" y="212" width="480" height="88" fill="url(#koes-street)"/>
  <rect x="0" y="150" width="480" height="150" fill="url(#koes-glow)"/>

  <!-- taiko drum stage, centre-left foreground -->
  <g transform="translate(120 252)">
    <line x1="-18" y1="16" x2="-24" y2="42" stroke="#3a2012" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="16" x2="24" y2="42" stroke="#3a2012" stroke-width="4" stroke-linecap="round"/>
    <line x1="-24" y1="42" x2="24" y2="42" stroke="#3a2012" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="26" ry="21" fill="url(#koes-drumg)" stroke="#3a2012" stroke-width="2"/>
    <ellipse cx="0" cy="-2" rx="17" ry="14" fill="#e8d6b0" stroke="#c9a86e" stroke-width="2"/>
    <circle cx="-13" cy="-2" r="1.4" fill="#c9a86e"/>
    <circle cx="13" cy="-2" r="1.4" fill="#c9a86e"/>
    <circle cx="0" cy="-14" r="1.4" fill="#c9a86e"/>
    <circle cx="0" cy="10" r="1.4" fill="#c9a86e"/>
    <path d="M-24 -20 L-3 -7" stroke="#f0e6d2" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 -22 L4 -9" stroke="#f0e6d2" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Awa Odori procession, receding from foreground into the arcade depth -->
  <g transform="translate(232 200) scale(0.42)"><use href="#koes-onna"/></g>
  <g transform="translate(190 226) scale(0.62)"><use href="#koes-otoko"/></g>
  <g transform="translate(300 220) scale(0.62) scale(-1,1)"><use href="#koes-onna"/></g>
  <g transform="translate(206 258) scale(0.92)"><use href="#koes-otoko"/></g>
  <g transform="translate(272 254) scale(0.92) scale(-1,1)"><use href="#koes-onna"/></g>

  <!-- Mon-chan leading a troupe that had not agreed to be led -->
  <path d="M328 214 q-18 3 -30 14" fill="none" stroke="#e8973f" stroke-width="1.6" opacity="0.55" stroke-linecap="round"/>
  <path d="M332 226 q-20 4 -34 16" fill="none" stroke="#e8973f" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <path d="M336 238 q-18 3 -30 13" fill="none" stroke="#e8973f" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>
  <g transform="translate(332 179) scale(0.36) rotate(-12 100 186)"><use href="#advc-mon" width="200" height="200"/></g>

  <!-- foreground spectator crowd -->
  <path d="M-10 300 q12 -14 24 4 q10 -20 22 -2 q12 -18 24 2 q11 -16 22 0 l0 16 l-92 0z" fill="#150f28" opacity="0.9"/>
  <path d="M330 300 q12 -16 24 2 q10 -18 22 0 q12 -16 24 4 q11 -14 22 -2 l0 16 l-92 0z" fill="#150f28" opacity="0.9"/>
  <g fill="#100c22">
    <path d="M-4 300 q10 -24 24 -24 q14 0 24 24z"/>
    <path d="M40 300 q9 -19 20 -19 q11 0 20 19z"/>
    <path d="M84 300 q11 -26 26 -26 q15 0 26 26z"/>
    <path d="M400 300 q10 -22 22 -22 q12 0 22 22z"/>
    <path d="M440 300 q9 -17 18 -17 q9 0 18 17z"/>
    <path d="M120 300 q9 -17 18 -17 q9 0 18 17z"/>
  </g>
</svg>
