<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="kits1" data-title="Nose in the steam, puzzling out the soybeans on the counter">
<defs>
  <linearGradient id="kits1-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5a4128"/>
    <stop offset="1" stop-color="#3a2818"/>
  </linearGradient>
  <linearGradient id="kits1-counter" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c99b64"/>
    <stop offset="1" stop-color="#7a5230"/>
  </linearGradient>
  <radialGradient id="kits1-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="kits1-window" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#dcecc9" stop-opacity="0.65"/>
    <stop offset="1" stop-color="#dcecc9" stop-opacity="0"/>
  </radialGradient>
  <filter id="kits1-blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<!-- soft, out-of-focus background: roaster and shelf, warm bokeh -->
<rect x="0" y="0" width="480" height="300" fill="url(#kits1-bg)"/>
<rect x="-20" y="30" width="120" height="150" rx="16" fill="#5c6570" opacity="0.55" filter="url(#kits1-blur)"/>
<circle cx="60" cy="70" r="26" fill="url(#kits1-glow)" filter="url(#kits1-blur)"/>
<ellipse cx="420" cy="55" rx="70" ry="50" fill="url(#kits1-window)" filter="url(#kits1-blur)"/>
<circle cx="370" cy="90" r="34" fill="url(#kits1-glow)" filter="url(#kits1-blur)"/>
<rect x="150" y="10" width="60" height="18" rx="4" fill="#6b4a2a" opacity="0.5" filter="url(#kits1-blur)"/>

<!-- Cinnamon, leaning in over the counter -->
<g transform="translate(78 14) scale(1.4)">
  <use href="#advc-cinnamon" width="240" height="240"/>
</g>

<!-- steam curling up from the cup, just reaching Cinnamon's nose -->
<path d="M240 206 q-8 -12 1 -22 q8 -9 0 -20" stroke="#f5ede0" stroke-width="3.2" fill="none" opacity="0.6" stroke-linecap="round"/>
<path d="M270 206 q8 -11 -1 -21 q-7 -9 1 -19" stroke="#f5ede0" stroke-width="2.8" fill="none" opacity="0.5" stroke-linecap="round"/>
<path d="M256 204 q-5 -15 5 -26" stroke="#f5ede0" stroke-width="2.2" fill="none" opacity="0.5" stroke-linecap="round"/>

<!-- the long bar counter, filling the close foreground -->
<rect x="0" y="222" width="480" height="78" fill="url(#kits1-counter)"/>
<rect x="0" y="222" width="480" height="5" fill="#e6c88f"/>
<g stroke="#5c3a1e" stroke-width="1" opacity="0.3">
  <line x1="40" y1="228" x2="40" y2="300"/>
  <line x1="120" y1="228" x2="120" y2="300"/>
  <line x1="330" y1="228" x2="330" y2="300"/>
  <line x1="420" y1="228" x2="420" y2="300"/>
</g>

<!-- coffee cup on its saucer, steam already rising -->
<ellipse cx="256" cy="230" rx="30" ry="8" fill="#000" opacity="0.15"/>
<ellipse cx="256" cy="222" rx="26" ry="7.5" fill="#efe6d6"/>
<path d="M232 222 L236 202 Q256 195 276 202 L280 222 Z" fill="#3a2416"/>
<ellipse cx="256" cy="202" rx="20" ry="6" fill="#6b4426"/>
<path d="M280 208 q12 -2 11 8 q-1 9 -11 8" fill="none" stroke="#3a2416" stroke-width="3"/>

<!-- a small dish of soybeans set right beside the coffee -->
<ellipse cx="330" cy="232" rx="22" ry="7" fill="#000" opacity="0.12"/>
<path d="M310 226 Q330 240 350 226 Q350 218 330 218 Q310 218 310 226 Z" fill="#e9e2c8"/>
<ellipse cx="322" cy="222" rx="3.4" ry="2.4" fill="#c9c07a"/>
<ellipse cx="330" cy="220" rx="3.4" ry="2.4" fill="#d4cc8a"/>
<ellipse cx="338" cy="223" rx="3.4" ry="2.4" fill="#c2b96e"/>
<ellipse cx="326" cy="225" rx="3.2" ry="2.2" fill="#d8d090"/>
<ellipse cx="335" cy="227" rx="3.2" ry="2.2" fill="#cbc27c"/>

<!-- a scatter of dark roasted beans near Cinnamon's paw for contrast -->
<ellipse cx="190" cy="236" rx="3.2" ry="2.2" fill="#3a2416"/>
<ellipse cx="198" cy="240" rx="3.2" ry="2.2" fill="#2e1c10"/>
<ellipse cx="184" cy="242" rx="3" ry="2" fill="#4a2e1a"/>
</svg>
