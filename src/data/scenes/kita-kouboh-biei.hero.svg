<rect x="34" y="83" width="7" height="30" fill="#241a10"/>
<rect x="115" y="83" width="7" height="30" fill="#241a10"/>
<rect x="46" y="52" width="18" height="30" rx="2" fill="#5c3d22" opacity="0.9"/>
<ellipse cx="55" cy="52" rx="9" ry="3" fill="#caa570"/>
<circle cx="49" cy="62" r="1.5" fill="#2a1c10"/><circle cx="59" cy="70" r="1.3" fill="#2a1c10"/><circle cx="53" cy="73" r="1.2" fill="#2a1c10"/>
<rect x="70" y="56" width="16" height="26" rx="2" fill="#4a331e" opacity="0.9"/>
