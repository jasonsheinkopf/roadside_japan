<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="kitk" data-title="Kita Kouboh — roaster by the door, the long bar counter, Biei">
<defs>
  <linearGradient id="kitk-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4d3826"/>
    <stop offset="1" stop-color="#6d4f33"/>
  </linearGradient>
  <linearGradient id="kitk-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a6238"/>
    <stop offset="1" stop-color="#54371e"/>
  </linearGradient>
  <linearGradient id="kitk-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe1ea"/>
    <stop offset="0.55" stop-color="#dcecc9"/>
    <stop offset="1" stop-color="#eef2c2"/>
  </linearGradient>
  <linearGradient id="kitk-ctop" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e0bd88"/>
    <stop offset="1" stop-color="#b5875a"/>
  </linearGradient>
  <linearGradient id="kitk-cfront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8f6540"/>
    <stop offset="1" stop-color="#573a20"/>
  </linearGradient>
  <linearGradient id="kitk-roaster" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b96a0"/>
    <stop offset="1" stop-color="#454e58"/>
  </linearGradient>
  <radialGradient id="kitk-glow" cx="0.5" cy="0.45" r="0.6">
    <stop offset="0" stop-color="#ffc267" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#ffc267" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="kitk-warmpool" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffdca0" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffdca0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="kitk-smoke" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#eef1ea" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#eef1ea" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="kitk-lampshade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#caa670"/>
    <stop offset="1" stop-color="#8a6438"/>
  </linearGradient>
  <filter id="kitk-blur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.2"/>
  </filter>
</defs>

<!-- back wall -->
<rect x="0" y="0" width="480" height="168" fill="url(#kitk-wall)"/>
<g stroke="#241a10" stroke-width="1" opacity="0.22">
