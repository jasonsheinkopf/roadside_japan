<ellipse cx="98" cy="18" rx="12" ry="7" fill="url(#kitk-smoke)"/>
<ellipse cx="108" cy="9" rx="15" ry="8" fill="url(#kitk-smoke)"/>
<ellipse cx="122" cy="2" rx="16" ry="7" fill="url(#kitk-smoke)"/>

