<rect x="38" y="238" width="38" height="10" fill="#2f2013"/>
<circle cx="45" cy="242" r="2.6" fill="#a7c17a"/><circle cx="52" cy="243" r="2.6" fill="#a7c17a"/><circle cx="59" cy="242" r="2.6" fill="#a7c17a"/><circle cx="66" cy="243" r="2.6" fill="#a7c17a"/>
