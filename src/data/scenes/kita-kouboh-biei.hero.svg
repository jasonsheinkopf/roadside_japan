<rect x="0" y="0" width="480" height="9" fill="#251a10"/>
<rect x="0" y="9" width="480" height="3" fill="#180f08"/>

<!-- entrance edge at far left, indigo noren hanging in the doorway -->
<rect x="0" y="0" width="20" height="230" fill="#2c2015"/>
<line x1="4" y1="18" x2="16" y2="18" stroke="#1c130c" stroke-width="2"/>
<rect x="4" y="20" width="5" height="42" fill="#2c4a63"/>
<rect x="11" y="20" width="5" height="42" fill="#2c4a63"/>
