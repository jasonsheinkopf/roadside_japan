<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="hdst" data-title="Heiwa-dori pedestrian mall with sculptures and steel question mark">
  <defs>
    <linearGradient id="hdst-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f7"/>
      <stop offset="1" stop-color="#eef8fc"/>
    </linearGradient>
    <linearGradient id="hdst-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdc2b0"/>
      <stop offset="1" stop-color="#a68f74"/>
    </linearGradient>
    <linearGradient id="hdst-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fa"/>
      <stop offset="0.5" stop-color="#a9bcc6"/>
      <stop offset="1" stop-color="#5c7079"/>
    </linearGradient>
    <linearGradient id="hdst-bldga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd9"/>
      <stop offset="1" stop-color="#dcc9a4"/>
    </linearGradient>
    <linearGradient id="hdst-bldgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e2e7"/>
      <stop offset="1" stop-color="#b3c4cc"/>
    </linearGradient>
    <radialGradient id="hdst-canopy" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#a8d17c"/>
      <stop offset="1" stop-color="#4c7a3a"/>
    </radialGradient>
    <radialGradient id="hdst-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8dd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff8dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hdst-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8a86a"/>
      <stop offset="1" stop-color="#8a5a30"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="480" height="300" fill="url(#hdst-sky)"/>
  <circle cx="110" cy="55" r="70" fill="url(#hdst-sun)"/>
  <path d="M60,40 q6,-8 12,0 q6,-8 12,0" stroke="#5a6a7a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M340,55 q5,-7 10,0 q5,-7 10,0" stroke="#5a6a7a" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- distant Daisetsuzan ridge -->
  <path d="M0,120 L40,95 L90,110 L150,90 L210,115 L240,105 L270,118 L330,95 L390,112 L480,100 L480,132 L0,132 Z" fill="#9fb2c9" opacity="0.55"/>
  <path d="M0,128 L60,112 L130,122 L200,108 L260,120 L340,110 L420,124 L480,115 L480,134 L0,134 Z" fill="#8098af" opacity="0.6"/>

  <!-- paved pedestrian mall -->
  <polygon points="10,300 470,300 280,125 200,125" fill="url(#hdst-ground)"/>

  <!-- perspective joint lines -->
  <line x1="205" y1="125" x2="30" y2="300" stroke="#7a6650" stroke-width="1" opacity="0.35"/>
  <line x1="220" y1="125" x2="140" y2="300" stroke="#7a6650" stroke-width="1" opacity="0.35"/>
  <line x1="240" y1="125" x2="240" y2="300" stroke="#7a6650" stroke-width="1" opacity="0.35"/>
  <line x1="260" y1="125" x2="340" y2="300" stroke="#7a6650" stroke-width="1" opacity="0.35"/>
  <line x1="275" y1="125" x2="450" y2="300" stroke="#7a6650" stroke-width="1" opacity="0.35"/>

  <!-- brick rows -->
  <line x1="162" y1="160" x2="318" y2="160" stroke="#7a6650" stroke-width="1" opacity="0.3"/>
  <line x1="124" y1="195" x2="356" y2="195" stroke="#7a6650" stroke-width="1" opacity="0.3"/>
  <line x1="86" y1="230" x2="394" y2="230" stroke="#7a6650" stroke-width="1" opacity="0.3"/>
  <line x1="48" y1="265" x2="432" y2="265" stroke="#7a6650" stroke-width="1" opacity="0.3"/>

  <!-- near-left storefront -->
  <rect x="-5" y="55" width="95" height="250" fill="url(#hdst-bldga)"/>
  <rect x="-5" y="50" width="95" height="8" fill="#7a6a52"/>
  <rect x="-5" y="150" width="95" height="14" fill="#2f8f86"/>
  <rect x="15" y="90" width="14" height="18" fill="#fdf6e3" opacity="0.85"/>
  <rect x="55" y="90" width="14" height="18" fill="#fdf6e3" opacity="0.85"/>

  <!-- near-right storefront -->
  <rect x="390" y="55" width="95" height="250" fill="url(#hdst-bldga)"/>
  <rect x="390" y="50" width="95" height="8" fill="#7a6a52"/>
  <rect x="390" y="150" width="95" height="14" fill="#2f8f86"/>
  <rect x="411" y="90" width="14" height="18" fill="#fdf6e3" opacity="0.85"/>
  <rect x="451" y="90" width="14" height="18" fill="#fdf6e3" opacity="0.85"/>

  <!-- far trees -->
  <rect x="176" y="150" width="4" height="16" fill="#6b4a2f"/>
  <circle cx="178" cy="146" r="10" fill="url(#hdst-canopy)"/>
  <rect x="300" y="150" width="4" height="16" fill="#6b4a2f"/>
  <circle cx="302" cy="146" r="10" fill="url(#hdst-canopy)"/>

  <!-- small distant ring sculpture -->
  <circle cx="256" cy="148" r="10" fill="none" stroke="url(#hdst-bronze)" stroke-width="4"/>
  <rect x="248" y="158" width="16" height="4" fill="#9a9a9a"/>

  <!-- mid trees -->
  <rect x="132" y="196" width="6" height="22" fill="#6b4a2f"/>
  <circle cx="135" cy="188" r="16" fill="url(#hdst-canopy)"/>
  <rect x="342" y="196" width="6" height="22" fill="#6b4a2f"/>
  <circle cx="345" cy="188" r="16" fill="url(#hdst-canopy)"/>

  <!-- angular abstract sculpture, left -->
  <ellipse cx="179" cy="240" rx="24" ry="6" fill="#000000" opacity="0.15"/>
  <rect x="158" y="228" width="42" height="9" rx="2" fill="#9a9a9a"/>
  <polygon points="160,215 190,205 195,220 165,230" fill="#b5533f"/>
  <polygon points="168,195 188,188 193,202 173,209" fill="#d98a3d"/>

  <!-- street lamps -->
  <rect x="144" y="170" width="4" height="70" fill="#3a3a3a"/>
  <circle cx="146" cy="165" r="7" fill="#fff3cf" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="332" y="170" width="4" height="70" fill="#3a3a3a"/>
  <circle cx="334" cy="165" r="7" fill="#fff3cf" stroke="#3a3a3a" stroke-width="1"/>

  <!-- twisted ribbon sculpture, near left -->
  <ellipse cx="115" cy="260" rx="24" ry="6" fill="#000000" opacity="0.15"/>
  <rect x="95" y="248" width="40" height="10" rx="2" fill="#8d8d8d"/>
  <path d="M100,225 C95,205 130,200 130,215 C130,230 100,225 100,240 C100,255 135,250 132,232" fill="url(#hdst-bronze)" stroke="#5c3a1a" stroke-width="1.2"/>

  <!-- the 28-metre steel question mark: Zahyo -->
  <ellipse cx="300" cy="264" rx="34" ry="7" fill="#000000" opacity="0.18"/>
  <rect x="273" y="248" width="54" height="14" rx="2" fill="#9a9a9a"/>
  <line x1="300" y1="218" x2="300" y2="248" stroke="url(#hdst-metal)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="207" r="11" fill="url(#hdst-metal)" stroke="#4a5960" stroke-width="1"/>
  <path d="M288,90 C288,62 336,62 336,95 C336,122 300,118 300,150 L300,192" fill="none" stroke="url(#hdst-metal)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M288,90 C288,62 336,62 336,95 C336,122 300,118 300,150 L300,192" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" transform="translate(-3,-3)"/>

  <!-- sphere sculpture, near right -->
  <ellipse cx="382" cy="248" rx="24" ry="6" fill="#000000" opacity="0.16"/>
  <rect x="363" y="235" width="38" height="11" rx="2" fill="#9a9a9a"/>
  <circle cx="382" cy="217" r="16" fill="url(#hdst-metal)" stroke="#4a5960" stroke-width="1"/>

  <!-- near trees with planters -->
  <rect x="44" y="284" width="28" height="10" fill="#8d7862"/>
  <rect x="54" y="250" width="9" height="34" fill="#6b4a2f"/>
  <circle cx="58" cy="240" r="25" fill="url(#hdst-canopy)"/>

  <rect x="408" y="284" width="28" height="10" fill="#8d7862"/>
  <rect x="417" y="250" width="9" height="34" fill="#6b4a2f"/>
  <circle cx="422" cy="240" r="25" fill="url(#hdst-canopy)"/>
</svg>
