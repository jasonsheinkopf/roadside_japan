<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="kwab" data-title="Socks, transfixed by the embroidered robe in its case">
  <defs>
    <linearGradient id="kwab-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8cfbb"/>
      <stop offset="1" stop-color="#bcb097"/>
    </linearGradient>
    <linearGradient id="kwab-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7f56"/>
      <stop offset="1" stop-color="#6e5638"/>
    </linearGradient>
    <linearGradient id="kwab-case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9d6d2" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="kwab-pedestal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#c9bd9e"/>
    </linearGradient>
    <linearGradient id="kwab-robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31465e"/>
      <stop offset="1" stop-color="#1b2938"/>
    </linearGradient>
    <radialGradient id="kwab-spot" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#fff3d8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff3d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kwab-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- gallery wall, wide -->
  <rect x="0" y="0" width="480" height="232" fill="url(#kwab-wall)"/>
  <!-- ceiling band with track lighting -->
  <rect x="0" y="0" width="480" height="20" fill="#4a463c"/>
  <rect x="118" y="15" width="20" height="7" rx="2" fill="#2c291f"/>
  <rect x="272" y="15" width="20" height="7" rx="2" fill="#2c291f"/>
  <rect x="340" y="15" width="20" height="7" rx="2" fill="#2c291f"/>

  <!-- spotlight cones falling on the display case -->
  <path d="M282 20 L360 20 L410 220 L250 220 Z" fill="url(#kwab-spot)"/>
  <path d="M348 20 L370 20 L400 150 L360 150 Z" fill="url(#kwab-spot)" opacity="0.5"/>

  <!-- blurred exhibit cases receding into the background, giving the room depth -->
  <rect x="14" y="70" width="44" height="90" rx="2" fill="#a89a7c" opacity="0.4"/>
  <rect x="10" y="60" width="52" height="14" rx="2" fill="#8c7f63" opacity="0.4"/>
  <rect x="424" y="86" width="40" height="80" rx="2" fill="#a89a7c" opacity="0.35"/>
  <rect x="420" y="76" width="48" height="14" rx="2" fill="#8c7f63" opacity="0.35"/>
  <rect x="0" y="196" width="480" height="4" fill="#786b52" opacity="0.4"/>

  <!-- gallery floor -->
  <rect x="0" y="230" width="480" height="70" fill="url(#kwab-floor)"/>
  <path d="M0 230 L480 230" stroke="#3f3222" stroke-width="1.2" opacity="0.4"/>
  <ellipse cx="300" cy="256" rx="90" ry="10" fill="#000" opacity="0.16"/>

  <!-- display case pedestal and glass box holding the robe -->
  <rect x="232" y="238" width="126" height="18" fill="url(#kwab-pedestal)" stroke="#8c8064" stroke-width="1.2"/>
  <rect x="225" y="70" width="140" height="170" fill="url(#kwab-case)" stroke="#8c9a94" stroke-width="1.4"/>
  <path d="M230 74 L250 236" stroke="url(#kwab-glass)" stroke-width="10" opacity="0.6"/>
  <path d="M352 78 L340 200" stroke="url(#kwab-glass)" stroke-width="6" opacity="0.4"/>

  <!-- the embroidered robe on its stand inside the case -->
  <rect x="291" y="100" width="8" height="60" fill="#5c4c34"/>
  <ellipse cx="295" cy="98" rx="16" ry="12" fill="#c9bda0"/>
  <path d="M258 118 Q295 104 332 118 L340 232 Q295 246 250 232 Z" fill="url(#kwab-robe)" stroke="#101a24" stroke-width="1.4"/>
  <path d="M258 118 Q248 150 252 200 L246 226" stroke="#233240" stroke-width="16" fill="none" opacity="0.7"/>
  <path d="M332 118 Q342 150 338 200 L344 226" stroke="#233240" stroke-width="16" fill="none" opacity="0.7"/>
  <!-- cream appliqué border tracing the front opening and hem -->
  <path d="M282 120 Q276 170 280 228" stroke="#e9dcc0" stroke-width="4" fill="none"/>
  <path d="M308 120 Q314 170 310 228" stroke="#e9dcc0" stroke-width="4" fill="none"/>
  <path d="M254 224 Q295 240 336 224" stroke="#e9dcc0" stroke-width="4" fill="none"/>
  <!-- geometric curl (morew-style) motifs stitched along the border -->
  <path d="M280 140 q-8 4 -6 12 q2 8 10 6" fill="none" stroke="#c8402e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M280 168 q-8 4 -6 12 q2 8 10 6" fill="none" stroke="#c8402e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M280 196 q-8 4 -6 12 q2 8 10 6" fill="none" stroke="#c8402e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M310 140 q8 4 6 12 q-2 8 -10 6" fill="none" stroke="#c8402e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M310 168 q8 4 6 12 q-2 8 -10 6" fill="none" stroke="#c8402e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M310 196 q8 4 6 12 q-2 8 -10 6" fill="none" stroke="#c8402e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M266 228 q6 -8 14 -4 q8 4 4 12" fill="none" stroke="#c8402e" stroke-width="2" stroke-linecap="round"/>
  <path d="M324 228 q-6 -8 -14 -4 q-8 4 -4 12" fill="none" stroke="#c8402e" stroke-width="2" stroke-linecap="round"/>
  <path d="M296 232 q6 -6 12 0 q-4 6 -12 0" fill="none" stroke="#c8402e" stroke-width="2" stroke-linecap="round"/>
  <!-- collar band -->
  <path d="M278 118 Q295 128 312 118" stroke="#e9dcc0" stroke-width="4" fill="none"/>

  <!-- small museum placard beneath the case -->
  <rect x="256" y="262" width="84" height="18" rx="1" fill="#efe6d2" stroke="#a99a76" stroke-width="1"/>
  <path d="M264 268 L316 268 M264 273 L300 273" stroke="#8c7f63" stroke-width="1.4" opacity="0.6"/>

  <!-- Socks, sitting on the gallery floor in the foreground, head craned up at the robe,
       a stray loop of thread and a small wooden spool forgotten in his paws -->
  <ellipse cx="132" cy="284" rx="60" ry="11" fill="#000" opacity="0.18"/>
  <g transform="translate(70 158) scale(0.64)">
    <use href="#advc-socks" width="200" height="200"/>
  </g>
  <!-- the thread spool and trailing loop, prop: 🧵 -->
  <ellipse cx="176" cy="272" rx="10" ry="7" fill="#c8402e" stroke="#7a1f14" stroke-width="1.4"/>
  <ellipse cx="176" cy="272" rx="4" ry="2.6" fill="#5c1108"/>
  <path d="M176 266 Q196 250 214 258 Q222 262 216 268 Q206 274 192 264" stroke="#c8402e" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
