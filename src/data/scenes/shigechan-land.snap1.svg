<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="shg1" data-title="Nose to nose with a Nano-Nanoian inside the Mouth house">
  <defs>
    <linearGradient id="shg1-wallbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a28"/>
      <stop offset="1" stop-color="#2c2116"/>
    </linearGradient>
    <linearGradient id="shg1-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5439"/>
      <stop offset="1" stop-color="#463526"/>
    </linearGradient>
    <radialGradient id="shg1-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shg1-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d798"/>
      <stop offset="1" stop-color="#c99a55"/>
    </linearGradient>
    <linearGradient id="shg1-coco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6c46"/>
      <stop offset="1" stop-color="#5e4227"/>
    </linearGradient>
    <linearGradient id="shg1-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a4906f"/>
      <stop offset="1" stop-color="#725a3c"/>
    </linearGradient>
    <linearGradient id="shg1-shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6142"/>
      <stop offset="1" stop-color="#563f28"/>
    </linearGradient>
  </defs>

  <!-- inside the Mouth house: plank wall, warm afternoon light through a small window -->
  <rect x="0" y="0" width="480" height="300" fill="url(#shg1-wallbg)"/>
  <path d="M0 0 L40 0 L34 300 L0 300 Z" fill="#3a2c1e" opacity="0.5"/>
  <path d="M100 0 L104 300" stroke="#20160e" stroke-width="2" opacity="0.4"/>
  <path d="M180 0 L182 300" stroke="#20160e" stroke-width="2" opacity="0.3"/>
  <path d="M300 0 L296 300" stroke="#20160e" stroke-width="2" opacity="0.3"/>
  <path d="M400 0 L392 300" stroke="#20160e" stroke-width="2" opacity="0.35"/>

  <!-- small window, light spilling in -->
  <circle cx="392" cy="66" r="90" fill="url(#shg1-light)"/>
  <rect x="358" y="30" width="46" height="46" fill="#e9c88a" stroke="#4a3520" stroke-width="3"/>
  <path d="M381 30 L381 76 M358 53 L404 53" stroke="#4a3520" stroke-width="2.5"/>

  <!-- shelf along the back wall, spare coconut heads and driftwood bits for the exhibit -->
  <rect x="330" y="96" width="120" height="10" fill="url(#shg1-shelf)" stroke="#2c2116" stroke-width="1.5"/>
  <rect x="336" y="90" width="6" height="10" fill="#2c2116"/>
  <rect x="440" y="90" width="6" height="10" fill="#2c2116"/>
  <circle cx="358" cy="86" r="10" fill="url(#shg1-coco)" stroke="#3a2a1a" stroke-width="1.4"/>
  <path d="M350 82 Q358 78 366 82" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.6"/>
  <circle cx="382" cy="88" r="8" fill="url(#shg1-coco)" stroke="#3a2a1a" stroke-width="1.4"/>
  <path d="M414 82 L426 92 L420 96 L410 88 Z" fill="url(#shg1-wood)"/>

  <!-- hanging driftwood mobile above -->
  <path d="M300 0 L300 40" stroke="#7c6142" stroke-width="1.2" opacity="0.7"/>
  <path d="M288 40 L312 38 L306 56 L294 54 Z" fill="url(#shg1-wood)" stroke="#3a2c1e" stroke-width="1"/>
  <path d="M300 56 L296 74" stroke="#7c6142" stroke-width="1.2" opacity="0.7"/>
  <circle cx="294" cy="78" r="4" fill="#5e4227"/>

  <!-- worn plank floor -->
  <path d="M0 230 L480 214 L480 300 L0 300 Z" fill="url(#shg1-floor)"/>
  <path d="M0 246 Q140 236 280 244 Q380 250 480 236" stroke="#2c2116" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M0 274 Q150 264 300 272 Q400 278 480 264" stroke="#2c2116" stroke-width="2" opacity="0.45" fill="none"/>

  <!-- dust motes drifting in the light -->
  <circle cx="330" cy="120" r="1.6" fill="#ffe9b8" opacity="0.8"/>
  <circle cx="352" cy="150" r="1.3" fill="#ffe9b8" opacity="0.6"/>
  <circle cx="310" cy="90" r="1.4" fill="#ffe9b8" opacity="0.7"/>

  <!-- the Nano-Nanoian: coconut-shell head, narrow driftwood body, standing its ground -->
  <g transform="translate(-42 8)">
    <ellipse cx="298" cy="266" rx="34" ry="8" fill="#100b06" opacity="0.4"/>
    <path d="M282 222 Q276 246 280 264" stroke="url(#shg1-wood)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M312 222 Q320 246 316 264" stroke="url(#shg1-wood)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="279" cy="266" rx="7" ry="3.4" fill="#4a3625"/>
    <ellipse cx="317" cy="266" rx="7" ry="3.4" fill="#4a3625"/>
    <path d="M281 222 Q276 178 297 165 Q318 178 313 222 Z" fill="url(#shg1-wood)" stroke="#3a2c1e" stroke-width="1.6"/>
    <path d="M284 196 Q297 202 310 196" stroke="#3a2c1e" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M282 176 Q262 168 250 148" stroke="url(#shg1-wood)" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M312 176 Q334 182 348 162" stroke="url(#shg1-wood)" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <circle cx="250" cy="148" r="4" fill="#5e4227"/>
    <circle cx="348" cy="162" r="4" fill="#5e4227"/>
    <circle cx="283" cy="178" r="3.6" fill="#5e4227"/>
    <circle cx="311" cy="178" r="3.6" fill="#5e4227"/>
    <circle cx="297" cy="140" r="26" fill="url(#shg1-coco)" stroke="#3a2a1a" stroke-width="2"/>
    <path d="M275 128 Q297 118 319 128" stroke="#3a2a1a" stroke-width="1.3" fill="none" opacity="0.55"/>
    <path d="M278 152 Q297 160 316 152" stroke="#3a2a1a" stroke-width="1.3" fill="none" opacity="0.5"/>
    <ellipse cx="288" cy="136" rx="4.5" ry="6" fill="#1c130c"/>
    <ellipse cx="308" cy="136" rx="4.5" ry="6" fill="#1c130c"/>
    <circle cx="289.5" cy="133" r="1.4" fill="#f6e6c8"/>
    <circle cx="309.5" cy="133" r="1.4" fill="#f6e6c8"/>
    <ellipse cx="298" cy="150" rx="6" ry="3" fill="#1c130c" opacity="0.7"/>
  </g>

  <!-- Cinnamon, close in, nose to nose with the creature -->
  <ellipse cx="130" cy="272" rx="46" ry="12" fill="#100b06" opacity="0.35"/>
  <g transform="translate(30 92) scale(0.86)">
    <use href="#advc-cinnamon" width="240" height="240"/>
  </g>
</svg>
