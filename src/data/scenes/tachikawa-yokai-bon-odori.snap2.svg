<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="tybb" data-title="Straight down on the yagura — Mon-chan cuts through the yokai ring">
  <defs>
    <linearGradient id="tybb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150f22"/>
      <stop offset="1" stop-color="#1c1530"/>
    </linearGradient>
    <radialGradient id="tybb-waist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb457" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb457" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tybb-lant" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#e2621f"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="480" height="300" fill="url(#tybb-bg)"/>

  <!-- rooftop corners, confirming the high vantage looking straight down -->
  <polygon points="0,0 150,0 0,98" fill="#221e34"/>
  <polygon points="0,0 78,0 0,50" fill="#191728"/>
  <rect x="18" y="12" width="16" height="12" fill="#131120"/>
  <polygon points="480,0 330,0 480,98" fill="#221e34"/>
  <polygon points="480,0 402,0 480,50" fill="#191728"/>
  <rect x="446" y="12" width="16" height="12" fill="#131120"/>
  <polygon points="0,300 150,300 0,202" fill="#221e34"/>
  <polygon points="0,300 78,300 0,250" fill="#191728"/>
  <rect x="18" y="264" width="16" height="12" fill="#131120"/>
  <polygon points="480,300 330,300 480,202" fill="#221e34"/>
  <polygon points="480,300 402,300 480,250" fill="#191728"/>
  <rect x="446" y="264" width="16" height="12" fill="#131120"/>

  <!-- warm glow pooling around the tower directly below -->
  <ellipse cx="240" cy="160" rx="120" ry="78" fill="url(#tybb-waist)"/>

  <!-- the dance ring, lit pavement seen from above -->
  <ellipse cx="240" cy="160" rx="150" ry="78" fill="none" stroke="#5c4326" stroke-width="22" opacity="0.5"/>
  <ellipse cx="240" cy="160" rx="150" ry="78" fill="none" stroke="#8a6a3e" stroke-width="3" opacity="0.65"/>

  <!-- lanterns strung along the ring, glowing dots directly overhead -->
  <circle cx="330" cy="180" r="4" fill="url(#tybb-lant)"/>
  <circle cx="345" cy="150" r="4" fill="url(#tybb-lant)"/>
  <circle cx="285" cy="87" r="4" fill="url(#tybb-lant)"/>
  <circle cx="195" cy="87" r="4" fill="url(#tybb-lant)"/>
  <circle cx="135" cy="150" r="4" fill="url(#tybb-lant)"/>
  <circle cx="150" cy="180" r="4" fill="url(#tybb-lant)"/>
  <circle cx="195" cy="233" r="4" fill="url(#tybb-lant)"/>
  <circle cx="285" cy="233" r="4" fill="url(#tybb-lant)"/>

  <!-- the yagura tower, roofline seen straight down, ridge beams radiating from the drum -->
  <line x1="240" y1="160" x2="286" y2="160" stroke="#4a2f1a" stroke-width="2"/>
  <line x1="240" y1="160" x2="272.5" y2="178.4" stroke="#4a2f1a" stroke-width="2"/>
  <line x1="240" y1="160" x2="240" y2="186" stroke="#4a2f1a" stroke-width="2"/>
  <line x1="240" y1="160" x2="207.5" y2="178.4" stroke="#4a2f1a" stroke-width="2"/>
  <line x1="240" y1="160" x2="194" y2="160" stroke="#4a2f1a" stroke-width="2"/>
  <line x1="240" y1="160" x2="207.5" y2="141.6" stroke="#4a2f1a" stroke-width="2"/>
  <line x1="240" y1="160" x2="240" y2="134" stroke="#4a2f1a" stroke-width="2"/>
  <line x1="240" y1="160" x2="272.5" y2="141.6" stroke="#4a2f1a" stroke-width="2"/>
  <polygon points="286,160 272.5,178.4 240,186 207.5,178.4 194,160 207.5,141.6 240,134 272.5,141.6" fill="url(#tybb-lant)" opacity="0.15"/>
  <polygon points="286,160 272.5,178.4 240,186 207.5,178.4 194,160 207.5,141.6 240,134 272.5,141.6" fill="none" stroke="#6b4526" stroke-width="3"/>
  <circle cx="240" cy="160" r="14" fill="#7a4326"/>
  <circle cx="240" cy="160" r="14" fill="none" stroke="#4a2f1a" stroke-width="2"/>
  <path d="M232 152 L248 168 M248 152 L232 168" stroke="#e9dcc0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- yokai dancers ringing the tower, each a distinct silhouette read from directly above -->
  <circle cx="390" cy="160" r="6" fill="#8a2418"/>
  <path d="M390 160 L400 154 M390 160 L400 160 M390 160 L400 166 M390 160 L380 154 M390 160 L380 166" stroke="#c9601e" stroke-width="1.2" opacity="0.7"/>
  <circle cx="390" cy="160" r="2.4" fill="#fff8e8"/>

  <circle cx="369.9" cy="199" r="5" fill="#2e3d6b"/>

  <circle cx="240" cy="238" r="6.5" fill="url(#tybb-lant)"/>
  <circle cx="240" cy="238" r="3" fill="#fff8e0"/>

  <circle cx="165" cy="227.5" r="5" fill="#b23a2e"/>

  <ellipse cx="110" cy="199" rx="5" ry="5" fill="#1f7a4c"/>
  <ellipse cx="115" cy="195" rx="4" ry="5" fill="#164a2e"/>

  <circle cx="90" cy="160" r="5" fill="#2e3d6b"/>
  <circle cx="110" cy="121" r="5" fill="#b23a2e"/>

  <circle cx="165" cy="92.5" r="5.5" fill="#1a1414"/>
  <path d="M160 89 Q152 84 156 94" fill="#7a1e18"/>
  <path d="M170 89 Q178 84 174 94" fill="#7a1e18"/>

  <circle cx="240" cy="82" r="5" fill="#e9d8bd"/>
  <path d="M240 82 Q248 74 244 66" stroke="#e9d8bd" stroke-width="2" fill="none"/>

  <circle cx="315" cy="92.5" r="5" fill="#2e3d6b"/>
  <circle cx="369.9" cy="121" r="5" fill="#b23a2e"/>

  <!-- Mon-chan cutting a step through the ring -->
  <ellipse cx="315" cy="230" rx="20" ry="8" fill="#000" opacity="0.3"/>
  <g transform="translate(283 195.5) rotate(-14) scale(0.32)">
    <use href="#advc-mon" width="200" height="200"/>
  </g>
  <path d="M270 210 Q292 224 312 226" fill="none" stroke="#e8973f" stroke-width="2" opacity="0.7" stroke-dasharray="2 4"/>
</svg>
