<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="kmts2" data-title="Mon-chan sulks in the lupines — the Nissan ad never filmed him">
<defs>
  <linearGradient id="kmts2-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fb8e0"/>
    <stop offset="0.6" stop-color="#cfe7f2"/>
    <stop offset="1" stop-color="#f0f2d8"/>
  </linearGradient>
  <radialGradient id="kmts2-sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff8dc" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#fff8dc" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="kmts2-field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9fbf5a"/>
    <stop offset="1" stop-color="#6f9a3e"/>
  </linearGradient>
  <linearGradient id="kmts2-trunk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a2a18"/>
    <stop offset="0.5" stop-color="#6b4c2c"/>
    <stop offset="1" stop-color="#2e2113"/>
  </linearGradient>
  <radialGradient id="kmts2-canopy" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#8fb85a"/>
    <stop offset="0.6" stop-color="#5c8a3c"/>
    <stop offset="1" stop-color="#3c6428"/>
  </radialGradient>
</defs>

<!-- open Biei sky, wide -->
<rect x="0" y="0" width="480" height="190" fill="url(#kmts2-sky)"/>
<circle cx="70" cy="46" r="34" fill="url(#kmts2-sun)"/>
<ellipse cx="130" cy="40" rx="34" ry="11" fill="#ffffff" opacity="0.7"/>
<ellipse cx="330" cy="30" rx="40" ry="12" fill="#ffffff" opacity="0.6"/>
<ellipse cx="410" cy="60" rx="24" ry="8" fill="#ffffff" opacity="0.5"/>

<!-- rolling patchwork hills receding to the horizon -->
<path d="M0 175 Q90 155 180 172 Q280 190 480 160 L480 190 L0 190 Z" fill="#b7cf7a" opacity="0.85"/>
<path d="M0 182 Q120 168 240 180 Q360 192 480 172 L480 195 L0 195 Z" fill="#d8cf7e" opacity="0.75"/>
<path d="M0 190 Q140 178 260 190 Q380 200 480 184 L480 205 L0 205 Z" fill="#9fbf5a" opacity="0.8"/>
<path d="M0 198 Q150 188 300 198 Q400 205 480 192 L480 210 L0 210 Z" fill="#89ad4c" opacity="0.85"/>

<!-- a thin farm road along the far field, with the little roadside sign -->
<path d="M0 176 Q100 168 210 174" stroke="#c9bfa0" stroke-width="5" fill="none" opacity="0.6"/>
<path d="M0 176 Q100 168 210 174" stroke="#a89878" stroke-width="1.4" fill="none" opacity="0.5" stroke-dasharray="4 5"/>
<rect x="150" y="163" width="2.4" height="14" fill="#5c4a30"/>
<rect x="144" y="156" width="15" height="10" rx="1" fill="#e8ded0"/>

<!-- the open meadow the tree stands in -->
<path d="M0 190 Q160 178 320 192 Q400 198 480 188 L480 300 L0 300 Z" fill="url(#kmts2-field)"/>

<!-- the poplar itself: tall, thin, alone on the hillside -->
<path d="M296 292 L300 96 Q301 88 292 88 Q283 88 284 96 L280 292 Z" fill="url(#kmts2-trunk)"/>
<path d="M292 100 L290 260" stroke="#20160c" stroke-width="1.6" opacity="0.4"/>
<path d="M286 130 L285 250" stroke="#7d5c36" stroke-width="1.2" opacity="0.35"/>
<path d="M296 150 L295 260" stroke="#20160c" stroke-width="1.2" opacity="0.3"/>

<!-- the tall rounded crown, catching the sun on its left side -->
<ellipse cx="292" cy="72" rx="52" ry="62" fill="url(#kmts2-canopy)"/>
<ellipse cx="266" cy="52" rx="26" ry="30" fill="#a9d074" opacity="0.7"/>
<ellipse cx="316" cy="90" rx="24" ry="28" fill="#2f5420" opacity="0.55"/>
<ellipse cx="300" cy="34" rx="20" ry="18" fill="#b6dc84" opacity="0.5"/>

<!-- tiny Cinnamon, still working his way up the very same trunk -->
<g transform="translate(276 168) scale(0.22)">
  <use href="#advc-cinnamon" width="240" height="240"/>
</g>

<!-- distant fence posts marking the field edge -->
<rect x="24" y="176" width="2.2" height="16" fill="#5c4a30"/>
<rect x="46" y="180" width="2" height="13" fill="#5c4a30"/>
<line x1="24" y1="182" x2="46" y2="185" stroke="#5c4a30" stroke-width="1.4"/>

<!-- rapeseed drifts, bright yellow, scattered across the meadow -->
<path d="M40 238 q-10 -12 4 -20 q14 -7 22 4 q7 11 -6 18 q-13 7 -20 -2 Z" fill="#f4d233"/>
<path d="M90 254 q-9 -11 4 -18 q13 -6 20 4 q6 10 -6 16 q-11 6 -18 -2 Z" fill="#f7dd4a"/>
<path d="M400 236 q-9 -12 5 -19 q13 -6 20 5 q6 10 -6 16 q-12 6 -19 -2 Z" fill="#f4d233"/>
<path d="M440 258 q-8 -10 4 -16 q12 -6 18 4 q5 9 -5 14 q-9 5 -17 -2 Z" fill="#f7dd4a"/>
<path d="M20 276 q-7 -9 3 -14 q10 -5 15 3 q5 8 -5 12 q-8 4 -13 -1 Z" fill="#f4d233"/>
<circle cx="42" cy="234" r="3" fill="#fff0a0"/>
<circle cx="94" cy="250" r="3" fill="#fff0a0"/>
<circle cx="404" cy="232" r="3" fill="#fff0a0"/>

<!-- lupine spikes, purple, thick through the foreground -->
<path d="M60 300 L64 244 Q66 236 70 244 L74 300 Z" fill="#7a5ea8"/>
<path d="M96 300 L100 236 Q102 227 106 236 L110 300 Z" fill="#8f6fc0"/>
<path d="M136 300 L140 250 Q142 242 146 250 L150 300 Z" fill="#6a4f96"/>
<path d="M180 300 L184 232 Q186 222 190 232 L194 300 Z" fill="#8f6fc0"/>
<path d="M224 300 L228 246 Q230 238 234 246 L238 300 Z" fill="#7a5ea8"/>
<path d="M330 300 L334 238 Q336 229 340 238 L344 300 Z" fill="#8f6fc0"/>
<path d="M368 300 L372 250 Q374 242 378 250 L382 300 Z" fill="#6a4f96"/>
<path d="M406 300 L410 234 Q412 224 416 234 L420 300 Z" fill="#7a5ea8"/>
<path d="M444 300 L448 248 Q450 240 454 248 L458 300 Z" fill="#8f6fc0"/>
<path d="M20 300 L24 254 Q26 246 30 254 L34 300 Z" fill="#6a4f96"/>
<path d="M256 300 L259 256 Q261 249 264 256 L267 300 Z" fill="#7a5ea8"/>
<path d="M300 288 L303 258 Q305 251 308 258 L311 288 Z" fill="#8f6fc0" opacity="0.9"/>

<!-- a low scatter of grass tufts to root the whole meadow -->
<path d="M150 300 q6 -14 0 -22 q-2 12 -6 22 Z" fill="#5c8a3c"/>
<path d="M270 300 q6 -12 0 -20 q-2 11 -6 20 Z" fill="#4a7530"/>
<path d="M360 300 q6 -13 0 -21 q-2 11 -6 21 Z" fill="#5c8a3c"/>
<path d="M50 300 q6 -12 0 -19 q-2 10 -6 19 Z" fill="#4a7530"/>

<!-- Mon-chan's shadow, sunk down in the flowers at the base -->
<ellipse cx="215" cy="270" rx="30" ry="8" fill="#000000" opacity="0.2"/>

<!-- Mon-chan, pouting in the lupines, arms crossed at the famous tree's feet -->
<g transform="translate(160 190) scale(0.62)">
  <use href="#advc-mon" width="200" height="200"/>
</g>

<!-- a few lupine spikes drawn in front to sink him into the field -->
<path d="M148 300 L151 258 Q153 250 156 258 L159 300 Z" fill="#7a5ea8" opacity="0.95"/>
<path d="M244 300 L247 262 Q249 255 252 262 L255 300 Z" fill="#8f6fc0" opacity="0.95"/>
<path d="M196 300 L199 266 Q201 260 204 266 L207 300 Z" fill="#6a4f96" opacity="0.9"/>
<circle cx="120" cy="264" r="9" fill="#f7dd4a" opacity="0.95"/>
</svg>
