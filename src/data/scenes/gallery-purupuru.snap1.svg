<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="gala" data-title="Nose-to-canvas with the ink heron">
<defs>
  <linearGradient id="gala-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#efe3c8"/>
    <stop offset="1" stop-color="#e0d1ae"/>
  </linearGradient>
  <linearGradient id="gala-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c79063"/>
    <stop offset="1" stop-color="#8a5a35"/>
  </linearGradient>
  <linearGradient id="gala-frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6b5136"/>
    <stop offset="1" stop-color="#3d2a1a"/>
  </linearGradient>
  <radialGradient id="gala-glow" cx="0.5" cy="0.15" r="0.75">
    <stop offset="0" stop-color="#fff6da" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff6da" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- gallery wall + floor, seen close, only slivers visible beside the big frame -->
<rect x="0" y="0" width="480" height="230" fill="url(#gala-wall)"/>
<rect x="0" y="230" width="480" height="70" fill="url(#gala-floor)"/>
<rect x="0" y="226" width="480" height="6" fill="#4a3324"/>
<line x1="0" y1="8" x2="190" y2="8" stroke="#c9b78e" stroke-width="2" opacity="0.5"/>
<line x1="450" y1="8" x2="480" y2="8" stroke="#c9b78e" stroke-width="2" opacity="0.5"/>
<path d="M10 40 q80 10 170 0" stroke="#d8c8a0" stroke-width="1.4" fill="none" opacity="0.4"/>
<path d="M10 180 q80 -8 170 0" stroke="#c2ac82" stroke-width="1.4" fill="none" opacity="0.35"/>

<!-- small wall label, off to the side (a label Cinnamon has no interest in) -->
<rect x="30" y="140" width="54" height="34" rx="2" fill="#f5ead2" stroke="#5c4630" stroke-width="1"/>
<rect x="36" y="150" width="42" height="3" fill="#8a7a5e"/>
<rect x="36" y="158" width="34" height="3" fill="#8a7a5e"/>
<rect x="36" y="166" width="38" height="3" fill="#8a7a5e"/>

<!-- floor plank seams, visible only in the wall slivers left and right of the big frame -->
<line x1="60" y1="230" x2="60" y2="300" stroke="#5c3d22" stroke-width="1.5" opacity="0.25"/>
<line x1="465" y1="230" x2="465" y2="300" stroke="#5c3d22" stroke-width="1.5" opacity="0.25"/>

<!-- the frame, filling almost the whole close shot, bleeding off top and bottom -->
<rect x="190" y="-40" width="260" height="380" fill="url(#gala-frame)"/>
<rect x="204" y="-26" width="232" height="352" fill="#efe3c8"/>
<rect x="216" y="-14" width="208" height="328" fill="#f5ead2"/>
<ellipse cx="320" cy="80" rx="120" ry="100" fill="url(#gala-glow)"/>

<!-- the ink heron, brushed in a few confident strokes -->
<ellipse cx="310" cy="252" rx="72" ry="9" fill="#2a241c" opacity="0.14"/>
<path d="M285 205 q5 -35 35 -42 q28 -6 38 15 q8 18 -10 30 q-22 15 -48 8 q-15 -4 -15 -11z" fill="#2a241c"/>
<path d="M282 200 q-14 4 -20 14" stroke="#2a241c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
<path d="M295 190 q20 -8 40 -2" stroke="#2a241c" stroke-width="3" fill="none" opacity="0.45"/>
<path d="M298 200 q22 -6 38 2" stroke="#2a241c" stroke-width="2.5" fill="none" opacity="0.35"/>
<path d="M312 172 Q295 140 300 110 Q302 95 315 85" stroke="#2a241c" stroke-width="10" fill="none" stroke-linecap="round"/>
<circle cx="318" cy="80" r="9" fill="#2a241c"/>
<polygon points="309,78 279,70 309,84" fill="#2a241c"/>
<circle cx="315" cy="76" r="1.3" fill="#f5ead2"/>
<path d="M300 208 L296 230 L292 250" stroke="#2a241c" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M325 206 L332 226 L340 238" stroke="#2a241c" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M285 250 q7 -3 14 0" stroke="#2a241c" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M334 238 q6 -3 12 -1" stroke="#2a241c" stroke-width="2" fill="none" stroke-linecap="round"/>

<!-- ink-wash reeds framing the heron's feet -->
<path d="M250 260 q-4 -40 6 -70" stroke="#5c6a44" stroke-width="2" fill="none" opacity="0.6"/>
<path d="M262 262 q2 -50 14 -82" stroke="#5c6a44" stroke-width="2" fill="none" opacity="0.5"/>
<path d="M372 258 q6 -36 -2 -60" stroke="#5c6a44" stroke-width="2" fill="none" opacity="0.55"/>

<!-- the artist's red hanko seal in the corner -->
<rect x="393" y="253" width="16" height="16" rx="1" fill="#a5342a" stroke="#7a2018" stroke-width="1"/>
<rect x="398" y="257" width="6" height="8" fill="#7a2018" opacity="0.6"/>

<!-- faint glass sheen across the whole painting -->
<polygon points="220,-10 262,-10 210,310 168,310" fill="#ffffff" opacity="0.05"/>
<circle cx="240" cy="30" r="2" fill="#fff6da" opacity="0.5"/>
<circle cx="270" cy="18" r="1.5" fill="#fff6da" opacity="0.4"/>
<circle cx="255" cy="50" r="1.5" fill="#fff6da" opacity="0.35"/>

<!-- Cinnamon, pressed right up to the frame, nose actually touching the canvas -->
<ellipse cx="205" cy="262" rx="48" ry="9" fill="#2a241c" opacity="0.22"/>
<g transform="translate(130 90) scale(0.75)">
  <use href="#advc-cinnamon" width="240" height="240"/>
</g>
</svg>
