<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="armb" data-title="Mon-chan posing beside the giant ramen-bowl bench in the food hall">
  <defs>
    <linearGradient id="armb-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#1c1109"/>
    </linearGradient>
    <radialGradient id="armb-glow" cx="0.55" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff9a4a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armb-ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#4a3018"/>
    </linearGradient>
    <linearGradient id="armb-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5432"/>
      <stop offset="1" stop-color="#3a2414"/>
    </linearGradient>
    <radialGradient id="armb-floorglow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffb968" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffb968" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armb-norenA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9432f"/>
      <stop offset="1" stop-color="#8c2419"/>
    </linearGradient>
    <linearGradient id="armb-norenC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b25c"/>
      <stop offset="1" stop-color="#a3792f"/>
    </linearGradient>
    <radialGradient id="armb-lantern" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.55" stop-color="#ff9d3d"/>
      <stop offset="1" stop-color="#c9531f"/>
    </radialGradient>
    <linearGradient id="armb-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#c9a875"/>
    </linearGradient>
    <radialGradient id="armb-broth" cx="0.5" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#f0b46a"/>
      <stop offset="1" stop-color="#9a5620"/>
    </radialGradient>
  </defs>

  <!-- ambient interior, wider vantage than the shrine close-up -->
  <rect x="0" y="0" width="480" height="300" fill="url(#armb-back)"/>
  <ellipse cx="270" cy="80" rx="260" ry="140" fill="url(#armb-glow)"/>

  <!-- ceiling strip, receding -->
  <polygon points="0,0 480,0 316,52 164,52" fill="url(#armb-ceil)"/>
  <path d="M16 4 L230 50 M464 4 L250 50" stroke="#1c1109" stroke-width="1.4" opacity="0.4" fill="none"/>

  <!-- floor, wide and open -->
  <polygon points="0,300 480,300 306,150 174,150" fill="url(#armb-floor)"/>
  <ellipse cx="250" cy="235" rx="210" ry="62" fill="url(#armb-floorglow)"/>
  <path d="M8 296 L200 154 M40 298 L212 155 M472 296 L280 154 M440 298 L268 155" stroke="#2a1808" stroke-width="1.4" opacity="0.4" fill="none"/>

  <!-- distant stall fronts down the hall, left side -->
  <rect x="4" y="66" width="58" height="86" fill="#2c1a0c" opacity="0.85"/>
  <rect x="10" y="86" width="46" height="46" fill="url(#armb-norenA)" opacity="0.9"/>
  <path d="M17 86 v46 M33 86 v46 M49 86 v46" stroke="#5a170f" stroke-width="1" opacity="0.5"/>
  <ellipse cx="33" cy="72" rx="13" ry="7" fill="url(#armb-lantern)" opacity="0.9"/>

  <!-- distant stall fronts down the hall, right side -->
  <rect x="418" y="70" width="58" height="86" fill="#2c1a0c" opacity="0.85"/>
  <rect x="424" y="90" width="46" height="46" fill="url(#armb-norenC)" opacity="0.9"/>
  <path d="M431 90 v46 M447 90 v46 M463 90 v46" stroke="#6a4a1c" stroke-width="1" opacity="0.5"/>
  <ellipse cx="447" cy="76" rx="13" ry="7" fill="url(#armb-lantern)" opacity="0.9"/>

  <!-- hanging lantern string across the ceiling -->
  <path d="M70 58 Q240 34 410 60" stroke="#1c1109" stroke-width="1.8" fill="none" opacity="0.55"/>
  <ellipse cx="140" cy="62" rx="6" ry="7" fill="url(#armb-lantern)"/>
  <ellipse cx="240" cy="46" rx="5.5" ry="6.5" fill="url(#armb-lantern)"/>
  <ellipse cx="340" cy="62" rx="6" ry="7" fill="url(#armb-lantern)"/>

  <!-- the giant novelty ramen-bowl bench, food-hall rest area -->
  <ellipse cx="345" cy="264" rx="98" ry="17" fill="#000" opacity="0.28"/>
  <rect x="292" y="222" width="16" height="46" rx="4" fill="#5a3a20" transform="rotate(24 300 222)"/>
  <rect x="382" y="222" width="16" height="46" rx="4" fill="#6a4626" transform="rotate(-18 390 222)"/>
  <ellipse cx="345" cy="212" rx="92" ry="48" fill="url(#armb-bowl)"/>
  <ellipse cx="345" cy="212" rx="92" ry="48" fill="none" stroke="#a3792f" stroke-width="2.5" opacity="0.55"/>
  <ellipse cx="345" cy="206" rx="70" ry="35" fill="url(#armb-broth)"/>
  <path d="M295 190 q50 -18 100 0 q-50 14 -100 0z" fill="#fff" opacity="0.12"/>
  <path d="M285 224 q10 -6 8 -14 q-2 6 -8 6 q6 -2 4 -10" stroke="#7a5432" stroke-width="1.6" fill="none" opacity="0.6"/>
  <path d="M405 224 q-10 -6 -8 -14 q2 6 8 6 q-6 -2 -4 -10" stroke="#7a5432" stroke-width="1.6" fill="none" opacity="0.6"/>
  <path d="M318 178 q6 -8 -2 -12 M372 178 q-6 -8 2 -12" stroke="#f6efe4" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Mon-chan, posing proudly right beside the giant bowl, paw on its rim -->
  <ellipse cx="207" cy="272" rx="62" ry="13" fill="#000" opacity="0.24"/>
  <g transform="translate(152 129) scale(0.78)">
    <g transform="rotate(-7 100 178)">
      <path d="M132 118 q30 -6 28 -34 q-14 2 -22 16 q-10 8 -6 18z" fill="#e8973f" stroke="#c67a2c" stroke-width="2.5"/>
      <ellipse cx="160" cy="82" rx="10" ry="10" fill="#e8973f" stroke="#c67a2c" stroke-width="2.5"/>
      <use href="#advc-mon" width="200" height="200"/>
    </g>
  </g>

  <!-- proud little sparkle flourishes near his raised paw -->
  <path d="M280 150 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#ffe9a8" opacity="0.9"/>
  <path d="M298 172 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z" fill="#ffe9a8" opacity="0.8"/>
  <path d="M266 128 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#ffe9a8" opacity="0.75"/>
</svg>
