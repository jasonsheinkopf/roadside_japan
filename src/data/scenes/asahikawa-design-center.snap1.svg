<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="adsa" data-title="Testing a child-sized chair for scale — verdict: perfect">
  <defs>
    <linearGradient id="adsa-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#ecdfc6"/>
    </linearGradient>
    <linearGradient id="adsa-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbb8b"/>
      <stop offset="1" stop-color="#ad7f4c"/>
    </linearGradient>
    <linearGradient id="adsa-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9ee"/>
      <stop offset="0.55" stop-color="#eaf1ee"/>
      <stop offset="1" stop-color="#cfe1e3"/>
    </linearGradient>
    <radialGradient id="adsa-glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fffaef" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffaef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="adsa-wooddark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d4527"/>
      <stop offset="1" stop-color="#432c19"/>
    </linearGradient>
    <linearGradient id="adsa-woodmed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ab7940"/>
      <stop offset="1" stop-color="#7b5530"/>
    </linearGradient>
    <linearGradient id="adsa-childwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c27c"/>
      <stop offset="1" stop-color="#cf9a52"/>
    </linearGradient>
    <linearGradient id="adsa-childwood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dba85c"/>
      <stop offset="1" stop-color="#b47f3c"/>
    </linearGradient>
  </defs>

  <!-- gallery wall + floor -->
  <rect x="0" y="0" width="480" height="176" fill="url(#adsa-wall)"/>
  <rect x="0" y="0" width="480" height="12" fill="#e6d9bd"/>
  <rect x="0" y="169" width="480" height="7" fill="#d9cbaf"/>
  <rect x="0" y="176" width="480" height="124" fill="url(#adsa-floor)"/>
  <path d="M240 176 L20 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.16"/>
  <path d="M240 176 L150 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.16"/>
  <path d="M240 176 L330 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.16"/>
  <path d="M240 176 L460 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.16"/>

  <!-- soft gallery window, out of focus in the back corner -->
  <rect x="-12" y="20" width="86" height="118" fill="#3a281a" opacity="0.5"/>
  <rect x="-8" y="24" width="78" height="110" fill="url(#adsa-glass)" opacity="0.6"/>
  <ellipse cx="18" cy="66" rx="52" ry="46" fill="url(#adsa-glow)"/>
  <line x1="30" y1="24" x2="30" y2="134" stroke="#3a281a" stroke-width="2" opacity="0.55"/>
  <line x1="-8" y1="80" x2="70" y2="80" stroke="#3a281a" stroke-width="2" opacity="0.55"/>

  <!-- another piece dozing in the blurred background -->
  <rect x="404" y="42" width="62" height="82" rx="4" fill="#6d4527" opacity="0.22"/>
  <rect x="408" y="38" width="54" height="6" rx="1" fill="#8a6742" opacity="0.22"/>

  <!-- THE ADULT CHAIR: looming right behind him, far too tall to climb -->
  <ellipse cx="296" cy="252" rx="58" ry="9" fill="#241708" opacity="0.22"/>
  <line x1="260" y1="166" x2="252" y2="238" stroke="url(#adsa-wooddark)" stroke-width="5" stroke-linecap="round"/>
  <line x1="334" y1="166" x2="342" y2="238" stroke="url(#adsa-wooddark)" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="166" x2="266" y2="248" stroke="url(#adsa-woodmed)" stroke-width="7" stroke-linecap="round"/>
  <line x1="324" y1="166" x2="328" y2="248" stroke="url(#adsa-woodmed)" stroke-width="7" stroke-linecap="round"/>
  <rect x="254" y="148" width="86" height="18" rx="3" fill="url(#adsa-woodmed)"/>
  <rect x="252" y="18" width="20" height="134" rx="6" fill="url(#adsa-wooddark)"/>
  <rect x="322" y="18" width="20" height="134" rx="6" fill="url(#adsa-wooddark)"/>
  <rect x="266" y="14" width="62" height="20" rx="8" fill="url(#adsa-wooddark)"/>
  <line x1="282" y1="26" x2="282" y2="150" stroke="#2a1a0e" stroke-width="3" opacity="0.5"/>
  <line x1="298" y1="22" x2="298" y2="150" stroke="#2a1a0e" stroke-width="3" opacity="0.5"/>
  <line x1="314" y1="26" x2="314" y2="150" stroke="#2a1a0e" stroke-width="3" opacity="0.5"/>

  <!-- THE CHILD CHAIR: bright, close, exactly the right size -->
  <ellipse cx="188" cy="262" rx="60" ry="11" fill="#241708" opacity="0.2"/>
  <line x1="150" y1="222" x2="145" y2="258" stroke="url(#adsa-childwood2)" stroke-width="7" stroke-linecap="round"/>
  <line x1="226" y1="222" x2="231" y2="258" stroke="url(#adsa-childwood2)" stroke-width="7" stroke-linecap="round"/>
  <line x1="160" y1="222" x2="157" y2="252" stroke="url(#adsa-childwood)" stroke-width="6" stroke-linecap="round"/>
  <line x1="216" y1="222" x2="219" y2="252" stroke="url(#adsa-childwood)" stroke-width="6" stroke-linecap="round"/>
  <rect x="142" y="204" width="90" height="18" rx="5" fill="url(#adsa-childwood)"/>
  <rect x="152" y="146" width="68" height="60" rx="14" fill="url(#adsa-childwood2)"/>
  <circle cx="186" cy="172" r="14" fill="url(#adsa-wall)"/>
  <circle cx="186" cy="172" r="14" fill="none" stroke="#8a6236" stroke-width="2"/>

  <!-- gallery placard, with a tiny acorn — Cinnamon's one design note -->
  <rect x="248" y="230" width="9" height="11" fill="#cfcabb" stroke="#8a8474" stroke-width="0.5"/>
  <rect x="244" y="224" width="17" height="8" fill="#fbf7ee" stroke="#b7ae98" stroke-width="0.5"/>
  <ellipse cx="252" cy="228" rx="2.6" ry="3.2" fill="#8a5a30"/>
  <path d="M252 225 q1.4 -2 2.6 0" stroke="#5f7040" stroke-width="1" fill="none"/>

  <!-- Cinnamon, seated proudly, close in frame -->
  <g transform="translate(109 67) scale(0.62)">
    <use href="#advc-cinnamon" width="240" height="240"/>
  </g>

  <!-- pride sparkles -->
  <path d="M158 92 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#ffe9a8"/>
  <path d="M216 76 l2.4 6 l6 2.4 l-6 2.4 l-2.4 6 l-2.4 -6 l-6 -2.4 l6 -2.4z" fill="#ffe9a8"/>
  <path d="M228 118 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#ffe9a8" opacity="0.85"/>
</svg>
