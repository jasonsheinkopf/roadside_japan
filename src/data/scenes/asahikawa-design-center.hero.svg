<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="adsc" data-title="Asahikawa Design Center — sunlit gallery of fine wooden furniture">
  <defs>
    <linearGradient id="adsc-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#ecdfc6"/>
    </linearGradient>
    <linearGradient id="adsc-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9ee"/>
      <stop offset="0.55" stop-color="#eaf1ee"/>
      <stop offset="1" stop-color="#cfe1e3"/>
    </linearGradient>
    <radialGradient id="adsc-glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fffaef" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffaef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="adsc-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcbb8b"/>
      <stop offset="1" stop-color="#ad7f4c"/>
    </linearGradient>
    <linearGradient id="adsc-floorlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6df" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="adsc-wooddark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d4527"/>
      <stop offset="1" stop-color="#432c19"/>
    </linearGradient>
    <linearGradient id="adsc-woodmed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ab7940"/>
      <stop offset="1" stop-color="#7b5530"/>
    </linearGradient>
    <linearGradient id="adsc-woodlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcae72"/>
      <stop offset="1" stop-color="#b98548"/>
    </linearGradient>
    <linearGradient id="adsc-cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89ab9f"/>
      <stop offset="1" stop-color="#587a71"/>
    </linearGradient>
    <linearGradient id="adsc-rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6c6"/>
      <stop offset="1" stop-color="#bdb29c"/>
    </linearGradient>
  </defs>

  <!-- back wall -->
  <rect x="0" y="0" width="480" height="186" fill="url(#adsc-wall)"/>
  <rect x="0" y="0" width="480" height="16" fill="#e6d9bd"/>
  <rect x="0" y="179" width="480" height="7" fill="#d9cbaf"/>

  <!-- three tall gallery windows, soft daylight pouring in -->
  <g>
    <rect x="49" y="27" width="114" height="140" fill="#3a281a"/>
    <rect x="53" y="31" width="106" height="132" fill="url(#adsc-glass)"/>
    <ellipse cx="106" cy="70" rx="60" ry="50" fill="url(#adsc-glow)"/>
    <line x1="106" y1="31" x2="106" y2="163" stroke="#3a281a" stroke-width="2.4"/>
    <line x1="53" y1="97" x2="159" y2="97" stroke="#3a281a" stroke-width="2.4"/>

    <rect x="187" y="23" width="126" height="144" fill="#3a281a"/>
    <rect x="191" y="27" width="118" height="136" fill="url(#adsc-glass)"/>
    <ellipse cx="250" cy="68" rx="66" ry="52" fill="url(#adsc-glow)"/>
    <line x1="250" y1="27" x2="250" y2="163" stroke="#3a281a" stroke-width="2.4"/>
    <line x1="191" y1="95" x2="309" y2="95" stroke="#3a281a" stroke-width="2.4"/>

    <rect x="331" y="27" width="110" height="140" fill="#3a281a"/>
    <rect x="335" y="31" width="102" height="132" fill="url(#adsc-glass)"/>
    <ellipse cx="386" cy="70" rx="58" ry="50" fill="url(#adsc-glow)"/>
    <line x1="386" y1="31" x2="386" y2="163" stroke="#3a281a" stroke-width="2.4"/>
    <line x1="335" y1="97" x2="437" y2="97" stroke="#3a281a" stroke-width="2.4"/>
  </g>

  <!-- ceiling track light -->
  <line x1="90" y1="13" x2="390" y2="13" stroke="#2a221a" stroke-width="1.6"/>
  <rect x="106" y="11" width="5" height="6" fill="#2a221a"/>
  <rect x="178" y="11" width="5" height="6" fill="#2a221a"/>
  <rect x="250" y="11" width="5" height="6" fill="#2a221a"/>
  <rect x="322" y="11" width="5" height="6" fill="#2a221a"/>
  <rect x="374" y="11" width="5" height="6" fill="#2a221a"/>

  <!-- polished wood floor -->
  <rect x="0" y="186" width="480" height="114" fill="url(#adsc-floor)"/>
  <path d="M240 186 L0 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.18"/>
  <path d="M240 186 L60 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.18"/>
  <path d="M240 186 L150 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.18"/>
  <path d="M240 186 L330 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.18"/>
  <path d="M240 186 L420 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.18"/>
  <path d="M240 186 L480 300" stroke="#5c3f22" stroke-width="0.7" opacity="0.18"/>
  <path d="M0 220 Q240 210 480 220" stroke="#5c3f22" stroke-width="0.7" fill="none" opacity="0.16"/>
  <path d="M0 254 Q240 242 480 254" stroke="#5c3f22" stroke-width="0.7" fill="none" opacity="0.16"/>
  <path d="M0 284 Q240 272 480 284" stroke="#5c3f22" stroke-width="0.7" fill="none" opacity="0.16"/>

  <!-- daylight pooling on the floor beneath the windows -->
  <polygon points="55,186 157,186 196,297 16,297" fill="url(#adsc-floorlight)"/>
  <polygon points="195,186 305,186 336,297 164,297" fill="url(#adsc-floorlight)"/>
  <polygon points="337,186 435,186 466,297 306,297" fill="url(#adsc-floorlight)"/>

  <!-- contact shadows grounding the furniture -->
  <ellipse cx="104" cy="192" rx="46" ry="6" fill="#2a1a0e" opacity="0.16"/>
  <ellipse cx="377" cy="188" rx="48" ry="5" fill="#2a1a0e" opacity="0.16"/>
  <ellipse cx="205" cy="205" rx="52" ry="7" fill="#2a1a0e" opacity="0.14"/>
  <ellipse cx="310" cy="204" rx="40" ry="6" fill="#2a1a0e" opacity="0.14"/>
  <ellipse cx="220" cy="288" rx="82" ry="10" fill="#2a1a0e" opacity="0.18"/>
  <ellipse cx="365" cy="266" rx="30" ry="5" fill="#2a1a0e" opacity="0.15"/>

  <!-- back-left: tall walnut cabinet on splayed legs -->
  <polygon points="78,182 83,182 81,196 75,196" fill="url(#adsc-wooddark)"/>
  <polygon points="128,182 133,182 136,196 130,196" fill="url(#adsc-wooddark)"/>
  <rect x="70" y="112" width="68" height="70" fill="url(#adsc-wooddark)"/>
  <rect x="66" y="106" width="76" height="6" fill="url(#adsc-woodmed)"/>
  <line x1="104" y1="114" x2="104" y2="180" stroke="#2a1a0e" stroke-width="1" opacity="0.6"/>
  <rect x="76" y="118" width="24" height="58" fill="none" stroke="#2a1a0e" stroke-width="1" opacity="0.3"/>
  <rect x="108" y="118" width="24" height="58" fill="none" stroke="#2a1a0e" stroke-width="1" opacity="0.3"/>
  <circle cx="97" cy="148" r="1.6" fill="#e3d2a3"/>
  <circle cx="111" cy="148" r="1.6" fill="#e3d2a3"/>

  <!-- small potted plant beside the cabinet -->
  <polygon points="44,168 58,168 56,182 46,182" fill="#6b4a30"/>
  <ellipse cx="51" cy="158" rx="10" ry="13" fill="#4f6f42"/>
  <ellipse cx="44" cy="163" rx="7" ry="9" fill="#5c7f4d"/>
  <ellipse cx="58" cy="163" rx="7" ry="9" fill="#466639"/>

  <!-- gallery placard by the cabinet -->
  <rect x="150" y="186" width="10" height="12" fill="#cfcabb" stroke="#8a8474" stroke-width="0.5"/>
  <rect x="146" y="179" width="18" height="9" fill="#fbf7ee" stroke="#b7ae98" stroke-width="0.5"/>
  <line x1="149" y1="182" x2="161" y2="182" stroke="#a39a82" stroke-width="0.7"/>
  <line x1="149" y1="185" x2="157" y2="185" stroke="#a39a82" stroke-width="0.7"/>

  <!-- back-right: low teak sideboard -->
  <polygon points="340,180 345,180 347,192 341,192" fill="url(#adsc-woodmed)"/>
  <polygon points="402,180 407,180 409,192 403,192" fill="url(#adsc-woodmed)"/>
  <rect x="334" y="146" width="80" height="34" fill="url(#adsc-woodmed)"/>
  <rect x="330" y="142" width="88" height="5" fill="url(#adsc-woodlight)"/>
  <line x1="360" y1="148" x2="360" y2="178" stroke="#3a2415" stroke-width="0.9" opacity="0.35"/>
  <line x1="388" y1="148" x2="388" y2="178" stroke="#3a2415" stroke-width="0.9" opacity="0.35"/>
  <circle cx="347" cy="163" r="1.3" fill="#2a1a0e"/>
  <circle cx="374" cy="163" r="1.3" fill="#2a1a0e"/>
  <circle cx="401" cy="163" r="1.3" fill="#2a1a0e"/>

  <!-- gallery placard by the sideboard -->
  <rect x="420" y="182" width="10" height="12" fill="#cfcabb" stroke="#8a8474" stroke-width="0.5"/>
  <rect x="416" y="175" width="18" height="9" fill="#fbf7ee" stroke="#b7ae98" stroke-width="0.5"/>
  <line x1="419" y1="178" x2="431" y2="178" stroke="#a39a82" stroke-width="0.7"/>

  <!-- round table with two wishbone chairs -->
  <ellipse cx="205" cy="172" rx="40" ry="9" fill="url(#adsc-woodlight)" stroke="#7c5430" stroke-width="1" opacity="0.95"/>
  <rect x="201" y="172" width="8" height="26" fill="url(#adsc-wooddark)"/>
  <ellipse cx="205" cy="199" rx="16" ry="4" fill="url(#adsc-wooddark)"/>

  <ellipse cx="160" cy="188" rx="13" ry="5" fill="url(#adsc-woodlight)"/>
  <path d="M148 188 Q150 168 160 164 Q170 168 172 188" stroke="url(#adsc-wooddark)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="152" y1="190" x2="150" y2="206" stroke="#432c19" stroke-width="1.6"/>
  <line x1="168" y1="190" x2="170" y2="206" stroke="#432c19" stroke-width="1.6"/>

  <ellipse cx="250" cy="188" rx="13" ry="5" fill="url(#adsc-woodlight)"/>
  <path d="M238 188 Q240 168 250 164 Q260 168 262 188" stroke="url(#adsc-wooddark)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="242" y1="190" x2="240" y2="206" stroke="#432c19" stroke-width="1.6"/>
  <line x1="258" y1="190" x2="260" y2="206" stroke="#432c19" stroke-width="1.6"/>

  <!-- low bench with a folded throw -->
  <line x1="282" y1="188" x2="280" y2="204" stroke="#432c19" stroke-width="2"/>
  <line x1="338" y1="188" x2="340" y2="204" stroke="#432c19" stroke-width="2"/>
  <rect x="276" y="180" width="68" height="8" rx="2" fill="url(#adsc-woodlight)"/>
  <rect x="286" y="173" width="46" height="9" rx="4" fill="url(#adsc-cushion)"/>

  <!-- soft rug beneath the foreground seating -->
  <ellipse cx="235" cy="245" rx="95" ry="26" fill="url(#adsc-rug)" opacity="0.85"/>
  <ellipse cx="235" cy="245" rx="76" ry="20" fill="none" stroke="#9c9484" stroke-width="1" opacity="0.4"/>

  <!-- foreground statement lounge chair -->
  <polygon points="182,272 190,272 188,288 180,288" fill="url(#adsc-wooddark)"/>
  <polygon points="238,272 246,272 248,288 240,288" fill="url(#adsc-wooddark)"/>
  <path d="M172 220 Q159 239 168 261" stroke="url(#adsc-woodmed)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M256 220 Q269 239 260 261" stroke="url(#adsc-woodmed)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <rect x="178" y="207" width="70" height="55" rx="14" fill="url(#adsc-cushion)"/>
  <rect x="172" y="247" width="82" height="28" rx="10" fill="url(#adsc-cushion)"/>
  <rect x="193" y="219" width="14" height="14" rx="3" fill="#d9a441" transform="rotate(12 200 226)"/>

  <!-- foreground side table with reading lamp -->
  <ellipse cx="365" cy="232" rx="26" ry="6" fill="url(#adsc-woodlight)" stroke="#7c5430" stroke-width="0.8"/>
  <rect x="362" y="232" width="6" height="30" fill="url(#adsc-wooddark)"/>
  <ellipse cx="365" cy="263" rx="10" ry="3" fill="url(#adsc-wooddark)"/>
  <ellipse cx="352" cy="200" rx="11" ry="9" fill="url(#adsc-glow)"/>
  <line x1="352" y1="228" x2="352" y2="206" stroke="#2a221a" stroke-width="1.5"/>
  <ellipse cx="352" cy="228" rx="5" ry="2" fill="#2a221a"/>
  <polygon points="345,206 359,206 362,195 342,195" fill="#e9dcb8" opacity="0.92"/>
  <rect x="375" y="219" width="18" height="4" rx="1" fill="#d9a441"/>
  <rect x="376" y="215" width="16" height="4" rx="1" fill="url(#adsc-cushion)"/>
  <rect x="377" y="211" width="14" height="4" rx="1" fill="url(#adsc-woodmed)"/>
</svg>
