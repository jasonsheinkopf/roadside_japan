<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="koes1" data-title="Cinnamon on the awning ridge, one lantern away from the drums">
  <defs>
    <linearGradient id="koes1-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f2a"/>
      <stop offset="1" stop-color="#2c1c30"/>
    </linearGradient>
    <radialGradient id="koes1-bokeh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf85" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="koes1-lant" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff6de"/>
      <stop offset="0.5" stop-color="#ffb452"/>
      <stop offset="1" stop-color="#dd5b1f"/>
    </radialGradient>
    <linearGradient id="koes1-awn" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#8a3a2c"/>
      <stop offset="1" stop-color="#5e2a20"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="300" fill="url(#koes1-sky)"/>
  <circle cx="70" cy="60" r="30" fill="url(#koes1-bokeh)"/>
  <circle cx="420" cy="90" r="26" fill="url(#koes1-bokeh)"/>
  <circle cx="440" cy="40" r="18" fill="url(#koes1-bokeh)"/>
  <circle cx="30" cy="160" r="20" fill="url(#koes1-bokeh)"/>

  <!-- roofline of shops behind, softly out of focus -->
  <rect x="0" y="30" width="480" height="60" fill="#241a34" opacity="0.7"/>
  <rect x="20" y="20" width="70" height="20" fill="#1c1428" opacity="0.6"/>
  <rect x="360" y="18" width="80" height="24" fill="#1c1428" opacity="0.6"/>

  <!-- background lantern strand, small, distant -->
  <path d="M0 70 q60 20 120 4" fill="none" stroke="#5c3d24" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="40" cy="86" rx="6" ry="7" fill="url(#koes1-lant)" opacity="0.75"/>
  <ellipse cx="80" cy="90" rx="6" ry="7" fill="url(#koes1-lant)" opacity="0.75"/>

  <!-- the awning ridge Cinnamon dances on, running diagonally through the close foreground -->
  <path d="M-20 210 L500 130 L500 168 L-20 250 Z" fill="url(#koes1-awn)"/>
  <path d="M-20 210 L500 130" stroke="#3a1c14" stroke-width="3"/>
  <path d="M-10 220 L490 142" stroke="#b3543c" stroke-width="1.5" opacity="0.6"/>
  <path d="M-10 236 L490 158" stroke="#b3543c" stroke-width="1.5" opacity="0.5"/>
  <path d="M20 244 l14 -6 M70 234 l14 -6 M120 224 l14 -6 M170 214 l14 -6" stroke="#3a1c14" stroke-width="2" opacity="0.5"/>

  <!-- big close lantern glowing beside Cinnamon, cropped by the frame -->
  <ellipse cx="418" cy="150" rx="46" ry="58" fill="url(#koes1-lant)"/>
  <path d="M372 150 h92" stroke="#dd5b1f" stroke-width="1" opacity="0.5"/>
  <path d="M378 128 h80 M378 172 h80" stroke="#dd5b1f" stroke-width="1" opacity="0.4"/>
  <path d="M394 96 q24 -14 48 0" stroke="#4a2c1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="418" cy="94" rx="8" ry="6" fill="#4a2c1a"/>
  <ellipse cx="418" cy="206" rx="10" ry="6" fill="#4a2c1a"/>
  <circle cx="460" cy="120" r="34" fill="url(#koes1-bokeh)" opacity="0.9"/>

  <!-- Cinnamon mid-dance on the ridge -->
  <g transform="translate(178 60) rotate(-8) scale(1.05)">
    <use href="#advc-cinnamon" width="240" height="240"/>
  </g>
  <ellipse cx="238" cy="196" rx="46" ry="10" fill="#000" opacity="0.28"/>

  <!-- sparkle / paper-confetti drifting through the close frame -->
  <circle cx="150" cy="90" r="2.4" fill="#ffe6b0"/>
  <circle cx="300" cy="60" r="2" fill="#ffe6b0"/>
  <circle cx="330" cy="200" r="2.2" fill="#ffe6b0"/>
  <circle cx="120" cy="180" r="2" fill="#ffe6b0"/>

  <!-- amigasa brim sweeping through the extreme foreground corner, tight and close -->
  <path d="M-20 300 Q60 190 190 232 Q100 260 20 300 Z" fill="#e8d9a8"/>
  <path d="M-20 300 Q60 190 190 232" fill="none" stroke="#c9ad74" stroke-width="3"/>
  <path d="M10 280 Q70 220 150 240" fill="none" stroke="#b39457" stroke-width="1.5" opacity="0.7"/>
  <path d="M-10 292 Q65 205 170 236" fill="none" stroke="#b39457" stroke-width="1.5" opacity="0.6"/>
</svg>
