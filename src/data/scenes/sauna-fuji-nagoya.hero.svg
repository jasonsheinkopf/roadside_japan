<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="saufh" data-title="Sauna Fuji — the 20-meter cold pool beneath a painted Mt. Fuji mural">
  <defs>
    <linearGradient id="saufh-mural-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0ef"/>
      <stop offset="55%" stop-color="#d9edf3"/>
      <stop offset="100%" stop-color="#eef6ee"/>
    </linearGradient>
    <linearGradient id="saufh-fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="60%" stop-color="#c7d4de"/>
      <stop offset="100%" stop-color="#8fa2b3"/>
    </linearGradient>
    <linearGradient id="saufh-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7ddc9"/>
      <stop offset="100%" stop-color="#cfc2a4"/>
    </linearGradient>
    <linearGradient id="saufh-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9e2e6"/>
      <stop offset="40%" stop-color="#4fb9c4"/>
      <stop offset="100%" stop-color="#1e6f7e"/>
    </linearGradient>
    <radialGradient id="saufh-doorglow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffe6ad" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8983c" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="saufh-lamp" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff2c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff2c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saufh-capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe8ec"/>
      <stop offset="100%" stop-color="#a9bcc4"/>
    </linearGradient>
  </defs>

  <!-- full-canvas safety net -->
  <rect x="0" y="0" width="480" height="300" fill="url(#saufh-tile)"/>

  <!-- mural wall band -->
  <rect x="0" y="0" width="480" height="150" fill="url(#saufh-mural-sky)"/>

  <!-- Mt. Fuji mural, classic sento decoration -->
  <path d="M120,150 L196,44 Q212,26 228,44 L304,150 Z" fill="url(#saufh-fuji)"/>
  <path d="M196,44 Q212,26 228,44 L238,66 Q212,52 186,66 Z" fill="#ffffff"/>
  <path d="M170,84 Q212,68 254,84 L246,96 Q212,82 178,96 Z" fill="#ffffff" opacity="0.85"/>
  <!-- foothill treeline under the mural mountain -->
  <path d="M0,150 L0,132 L40,120 L80,132 L120,118 L160,130 L200,116 L240,128 Q270,114 300,128 L340,116 L380,130 L420,118 L460,130 L480,120 L480,150 Z" fill="#7ea77e"/>
  <!-- distant clouds crossing the peak -->
  <ellipse cx="150" cy="96" rx="34" ry="8" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="290" cy="104" rx="40" ry="9" fill="#ffffff" opacity="0.5"/>

  <!-- mezzanine capsule rows, upper right, glimpsed through the bathhouse's high window -->
  <rect x="352" y="18" width="120" height="96" rx="4" fill="#33404a"/>
  <rect x="360" y="26" width="104" height="80" fill="#1f2830"/>
  <g>
    <rect x="366" y="32" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="392" y="32" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="418" y="32" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="444" y="32" width="14" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="366" y="52" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="392" y="52" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="418" y="52" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="444" y="52" width="14" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="366" y="72" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="392" y="72" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="418" y="72" width="22" height="16" rx="2" fill="url(#saufh-capsule)"/>
    <rect x="444" y="72" width="14" height="16" rx="2" fill="url(#saufh-capsule)"/>
  </g>
  <circle cx="377" cy="40" r="2" fill="#8fd6e0"/>
  <circle cx="403" cy="60" r="2" fill="#8fd6e0"/>
  <circle cx="429" cy="80" r="2" fill="#8fd6e0"/>

  <!-- tiled wall band, grout lines -->
  <rect x="0" y="150" width="480" height="34" fill="url(#saufh-tile)"/>
  <g stroke="#b7a983" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="172" x2="480" y2="172"/>
    <line x1="30" y1="150" x2="30" y2="184"/>
    <line x1="70" y1="150" x2="70" y2="184"/>
    <line x1="110" y1="150" x2="110" y2="184"/>
    <line x1="150" y1="150" x2="150" y2="184"/>
    <line x1="190" y1="150" x2="190" y2="184"/>
    <line x1="230" y1="150" x2="230" y2="184"/>
    <line x1="270" y1="150" x2="270" y2="184"/>
    <line x1="310" y1="150" x2="310" y2="184"/>
    <line x1="350" y1="150" x2="350" y2="184"/>
    <line x1="390" y1="150" x2="390" y2="184"/>
    <line x1="430" y1="150" x2="430" y2="184"/>
    <line x1="470" y1="150" x2="470" y2="184"/>
  </g>

  <!-- hanging pendant lamps -->
  <line x1="90" y1="0" x2="90" y2="30" stroke="#3a352a" stroke-width="2"/>
  <ellipse cx="90" cy="30" rx="46" ry="16" fill="url(#saufh-lamp)"/>
  <path d="M78,30 L102,30 L96,40 L84,40 Z" fill="#5a4a30"/>
  <line x1="390" y1="0" x2="390" y2="24" stroke="#3a352a" stroke-width="2"/>
  <ellipse cx="390" cy="24" rx="38" ry="13" fill="url(#saufh-lamp)"/>
  <path d="M380,24 L400,24 L395,32 L385,32 Z" fill="#5a4a30"/>

  <!-- sauna room doorway, left, glowing warm from the 100°C room -->
  <path d="M8,184 L8,110 Q8,98 20,98 L64,98 Q76,98 76,110 L76,184 Z" fill="#3a2a1c"/>
  <path d="M16,184 L16,112 Q16,104 24,104 L60,104 Q68,104 68,112 L68,184 Z" fill="url(#saufh-doorglow)"/>
  <rect x="22" y="90" width="40" height="10" rx="3" fill="#a83b2a"/>
  <circle cx="42" cy="95" r="3" fill="#ffe6ad"/>
  <!-- little steam curls escaping the sauna door -->
  <ellipse cx="46" cy="86" rx="10" ry="6" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="54" cy="74" rx="13" ry="7" fill="#ffffff" opacity="0.35"/>

  <!-- the long cold pool, foreground -->
  <path d="M0,184 L480,184 L480,300 L0,300 Z" fill="url(#saufh-tile)"/>
  <path d="M0,196 L480,196 L480,284 L0,284 Z" fill="url(#saufh-water)"/>
  <rect x="0" y="192" width="480" height="6" fill="#eef3f2" opacity="0.85"/>
  <rect x="0" y="284" width="480" height="6" fill="#123f48" opacity="0.5"/>

  <!-- rippling highlight lines the length of the pool, selling the 20-meter scale -->
  <path d="M0,214 Q40,208 80,214 T160,214 T240,214 T320,214 T400,214 T480,214" stroke="#e4fbfd" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M0,236 Q40,230 80,236 T160,236 T240,236 T320,236 T400,236 T480,236" stroke="#dff9fb" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M0,260 Q40,254 80,260 T160,260 T240,260 T320,260 T400,260 T480,260" stroke="#d3f4f7" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- lane rope floating on the pool, reinforcing its length -->
  <line x1="0" y1="238" x2="480" y2="238" stroke="#f4d75a" stroke-width="2" opacity="0.7" stroke-dasharray="10 8"/>
  <circle cx="20" cy="238" r="4" fill="#f4d75a"/>
  <circle cx="100" cy="238" r="4" fill="#f4d75a"/>
  <circle cx="180" cy="238" r="4" fill="#f4d75a"/>
  <circle cx="260" cy="238" r="4" fill="#f4d75a"/>
  <circle cx="340" cy="238" r="4" fill="#f4d75a"/>
  <circle cx="420" cy="238" r="4" fill="#f4d75a"/>

  <!-- steam haze drifting over the water near the sauna door -->
  <ellipse cx="70" cy="200" rx="34" ry="10" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="120" cy="206" rx="30" ry="9" fill="#ffffff" opacity="0.15"/>
</svg>
