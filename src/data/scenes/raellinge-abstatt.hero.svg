<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="raela" data-title="Painted giant tomcat sculptures line the Bürgerpark path in Abstatt">
  <defs>
    <linearGradient id="raela-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d3e8"/>
      <stop offset="0.6" stop-color="#dcecf0"/>
      <stop offset="1" stop-color="#f3ecd9"/>
    </linearGradient>
    <radialGradient id="raela-sun" cx="0.78" cy="0.18" r="0.4">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="raela-grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb35c"/>
      <stop offset="1" stop-color="#597c3a"/>
    </linearGradient>
    <linearGradient id="raela-path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cba8"/>
      <stop offset="1" stop-color="#b9a67c"/>
    </linearGradient>
    <linearGradient id="raela-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c1614a"/>
      <stop offset="1" stop-color="#8f4534"/>
    </linearGradient>
    <linearGradient id="raela-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2bd"/>
      <stop offset="1" stop-color="#e0cb9c"/>
    </linearGradient>
    <symbol id="raela-tree" viewBox="0 0 60 90">
      <rect x="26" y="55" width="8" height="35" fill="#5b4327"/>
      <ellipse cx="30" cy="34" rx="28" ry="30" fill="#4e7a38"/>
      <ellipse cx="18" cy="26" rx="16" ry="17" fill="#5c8b43"/>
      <ellipse cx="42" cy="30" rx="15" ry="16" fill="#6a9a4c"/>
    </symbol>
  </defs>

  <!-- morning sky over the Bürgerpark -->
  <rect x="0" y="0" width="480" height="150" fill="url(#raela-sky)"/>
  <circle cx="374" cy="54" r="70" fill="url(#raela-sun)"/>
  <path d="M40 40 Q60 32 80 40 Q100 34 120 42" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.5"/>
  <path d="M180 26 Q205 18 230 28" stroke="#ffffff" stroke-width="9" fill="none" opacity="0.4"/>

  <!-- half-timbered Abstatt rooftops along the far edge of the park -->
  <g>
    <rect x="18" y="104" width="52" height="40" fill="url(#raela-wall)" stroke="#a98f5e" stroke-width="1"/>
    <path d="M12 104 L44 78 L76 104 Z" fill="url(#raela-roof)"/>
    <line x1="18" y1="120" x2="70" y2="120" stroke="#a98f5e" stroke-width="1.4" opacity="0.7"/>
    <line x1="34" y1="104" x2="34" y2="144" stroke="#a98f5e" stroke-width="1.4" opacity="0.7"/>
    <line x1="54" y1="104" x2="54" y2="144" stroke="#a98f5e" stroke-width="1.4" opacity="0.7"/>
    <rect x="40" y="122" width="12" height="22" fill="#7a5a35"/>
  </g>
  <g>
    <rect x="86" y="112" width="46" height="32" fill="url(#raela-wall)" stroke="#a98f5e" stroke-width="1"/>
    <path d="M81 112 L109 90 L137 112 Z" fill="url(#raela-roof)"/>
    <line x1="86" y1="128" x2="132" y2="128" stroke="#a98f5e" stroke-width="1.2" opacity="0.6"/>
    <rect x="99" y="120" width="10" height="24" fill="#7a5a35"/>
  </g>
  <g opacity="0.92">
    <rect x="356" y="108" width="50" height="36" fill="url(#raela-wall)" stroke="#a98f5e" stroke-width="1"/>
    <path d="M350 108 L381 84 L412 108 Z" fill="url(#raela-roof)"/>
    <line x1="356" y1="126" x2="406" y2="126" stroke="#a98f5e" stroke-width="1.2" opacity="0.6"/>
    <rect x="369" y="120" width="11" height="24" fill="#7a5a35"/>
  </g>
  <g>
    <!-- Rathaus-ish clock tower peeking above the trees, center-back -->
    <rect x="228" y="66" width="26" height="60" fill="#e7d9b6" stroke="#a98f5e" stroke-width="1"/>
    <path d="M224 66 L241 44 L258 66 Z" fill="#7d4335"/>
    <circle cx="241" cy="82" r="7" fill="#fbf3dd" stroke="#7d4335" stroke-width="1.4"/>
    <line x1="241" y1="82" x2="241" y2="77" stroke="#4a3221" stroke-width="1.2"/>
    <line x1="241" y1="82" x2="245" y2="83" stroke="#4a3221" stroke-width="1.2"/>
  </g>

  <!-- park trees framing the scene -->
  <use href="#raela-tree" x="-14" y="100" width="70" height="105"/>
  <use href="#raela-tree" x="150" y="96" width="56" height="88"/>
  <use href="#raela-tree" x="416" y="94" width="72" height="108"/>

  <!-- lawn -->
  <rect x="0" y="150" width="480" height="150" fill="url(#raela-grass)"/>
  <ellipse cx="240" cy="152" rx="260" ry="14" fill="#a6c67c" opacity="0.5"/>

  <!-- the park path curving through -->
  <path d="M-10 300 Q90 250 170 244 Q250 238 300 250 Q370 264 494 244" stroke="#c8b688" stroke-width="46" fill="none" opacity="0.95"/>
  <path d="M-10 300 Q90 250 170 244 Q250 238 300 250 Q370 264 494 244" stroke="url(#raela-path)" stroke-width="36" fill="none"/>
  <path d="M-10 300 Q90 250 170 244 Q250 238 300 250 Q370 264 494 244" stroke="#e8dcb8" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- park bench, right of center -->
  <g transform="translate(330 214)">
    <rect x="0" y="10" width="46" height="5" rx="1.5" fill="#6b4a2c"/>
    <rect x="0" y="0" width="46" height="5" rx="1.5" fill="#7a5633"/>
    <rect x="2" y="15" width="4" height="12" fill="#4a3320"/>
    <rect x="40" y="15" width="4" height="12" fill="#4a3320"/>
  </g>

  <!-- lamppost, left of the cats -->
  <g transform="translate(96 190)">
    <rect x="-2" y="0" width="4" height="52" fill="#3f4a3d"/>
    <circle cx="0" cy="-6" r="8" fill="#fef3d0" stroke="#3f4a3d" stroke-width="1.6"/>
    <circle cx="0" cy="-6" r="3" fill="#fffbe8"/>
  </g>

  <!-- Rälling #1: floral-painted, sitting, foreground left -->
  <g transform="translate(148 268)">
    <ellipse cx="0" cy="4" rx="34" ry="8" fill="#33421f" opacity="0.35"/>
    <path d="M-30 0 Q-34 -46 -8 -58 Q0 -62 8 -58 Q34 -46 30 0 Q30 10 0 12 Q-30 10 -30 0 Z" fill="#f4ede0"/>
    <path d="M-22 -46 L-30 -68 L-10 -52 Z" fill="#f4ede0"/>
    <path d="M22 -46 L30 -68 L10 -52 Z" fill="#f4ede0"/>
    <path d="M-20 -48 L-25 -60 L-13 -50 Z" fill="#e2b7cf"/>
    <path d="M20 -48 L25 -60 L13 -50 Z" fill="#e2b7cf"/>
    <circle cx="-11" cy="-30" r="4.2" fill="#3a2e2c"/>
    <circle cx="11" cy="-30" r="4.2" fill="#3a2e2c"/>
    <circle cx="-9.5" cy="-31.5" r="1.2" fill="#fff"/>
    <circle cx="12.5" cy="-31.5" r="1.2" fill="#fff"/>
    <path d="M-3 -20 Q0 -17 3 -20" stroke="#c96b7a" stroke-width="1.6" fill="none"/>
    <ellipse cx="0" cy="-16" rx="3" ry="2.2" fill="#e18ea0"/>
    <circle cx="-14" cy="-6" r="6" fill="#e8a9c4"/>
    <circle cx="14" cy="-6" r="6" fill="#f3c34e"/>
    <circle cx="0" cy="8" r="6" fill="#8fbedb"/>
    <circle cx="-14" cy="-6" r="1.8" fill="#fbe7f0"/>
    <circle cx="14" cy="-6" r="1.8" fill="#fff6df"/>
    <circle cx="0" cy="8" r="1.8" fill="#e5f2f8"/>
    <path d="M28 -4 Q52 -6 54 -34 Q55 -50 40 -52" stroke="#f4ede0" stroke-width="11" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="-52" r="6" fill="#f3c34e"/>
  </g>

  <!-- Rälling #2: rainbow-striped, standing, center -->
  <g transform="translate(232 280)">
    <ellipse cx="0" cy="4" rx="38" ry="9" fill="#33421f" opacity="0.35"/>
    <path d="M-32 4 Q-38 -50 -10 -66 Q0 -70 10 -66 Q38 -50 32 4 Q32 14 0 16 Q-32 14 -32 4 Z" fill="#f6f1e6"/>
    <path d="M-24 -52 L-33 -76 L-12 -58 Z" fill="#f6f1e6"/>
    <path d="M24 -52 L33 -76 L12 -58 Z" fill="#f6f1e6"/>
    <path d="M-22 -54 L-28 -68 L-14 -56 Z" fill="#e07d84"/>
    <path d="M22 -54 L28 -68 L14 -56 Z" fill="#e07d84"/>
    <path d="M-32 -22 Q0 -30 32 -22" stroke="#e0574f" stroke-width="7" fill="none" opacity="0.85"/>
    <path d="M-31 -8 Q0 -16 31 -8" stroke="#f0a63e" stroke-width="7" fill="none" opacity="0.85"/>
    <path d="M-30 6 Q0 -2 30 6" stroke="#4fa3d0" stroke-width="7" fill="none" opacity="0.85"/>
    <path d="M-27 -36 Q0 -44 27 -36" stroke="#5fb26a" stroke-width="7" fill="none" opacity="0.85"/>
    <circle cx="-12" cy="-34" r="4.6" fill="#2c2422"/>
    <circle cx="12" cy="-34" r="4.6" fill="#2c2422"/>
    <circle cx="-10.3" cy="-35.6" r="1.3" fill="#fff"/>
    <circle cx="13.7" cy="-35.6" r="1.3" fill="#fff"/>
    <path d="M-4 -23 Q0 -19 4 -23" stroke="#8a4a3a" stroke-width="1.8" fill="none"/>
    <ellipse cx="0" cy="-18" rx="3.4" ry="2.4" fill="#e18ea0"/>
    <path d="M-34 -18 Q28 -20 34 8 Q40 26 26 34" stroke="#f6f1e6" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="34" r="7" fill="#f0a63e"/>
  </g>

  <!-- Rälling #3: polka-dot, crouched, right foreground -->
  <g transform="translate(322 274)">
    <ellipse cx="0" cy="4" rx="30" ry="7" fill="#33421f" opacity="0.35"/>
    <path d="M-26 2 Q-30 -38 -6 -50 Q0 -53 6 -50 Q30 -38 26 2 Q26 10 0 12 Q-26 10 -26 2 Z" fill="#eef0f5"/>
    <path d="M-19 -40 L-26 -60 L-8 -46 Z" fill="#eef0f5"/>
    <path d="M19 -40 L26 -60 L8 -46 Z" fill="#eef0f5"/>
    <path d="M-17 -42 L-21 -53 L-11 -44 Z" fill="#7d9bc9"/>
    <path d="M17 -42 L21 -53 L11 -44 Z" fill="#7d9bc9"/>
    <circle cx="-9" cy="-16" r="3.6" fill="#4f6b9c" opacity="0.85"/>
    <circle cx="6" cy="-24" r="3" fill="#4f6b9c" opacity="0.85"/>
    <circle cx="-2" cy="-4" r="3.2" fill="#4f6b9c" opacity="0.85"/>
    <circle cx="15" cy="-10" r="2.6" fill="#4f6b9c" opacity="0.85"/>
    <circle cx="-16" cy="2" r="2.6" fill="#4f6b9c" opacity="0.85"/>
    <circle cx="-9.5" cy="-27" r="3.8" fill="#2c2422"/>
    <circle cx="9.5" cy="-27" r="3.8" fill="#2c2422"/>
    <circle cx="-8" cy="-28.4" r="1.1" fill="#fff"/>
    <circle cx="11" cy="-28.4" r="1.1" fill="#fff"/>
    <path d="M-3 -17 Q0 -14 3 -17" stroke="#5b6a8a" stroke-width="1.6" fill="none"/>
    <ellipse cx="0" cy="-13" rx="2.8" ry="2" fill="#c98ba0"/>
    <path d="M24 -2 Q42 4 40 -18 Q39 -32 26 -34" stroke="#eef0f5" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="-34" r="5" fill="#4f6b9c"/>
  </g>

  <!-- small interpretive plaque at the base of the center cat -->
  <g transform="translate(214 292)">
    <rect x="0" y="-14" width="20" height="14" rx="1.5" fill="#8a6a45" stroke="#5c4429" stroke-width="1"/>
    <rect x="2.5" y="-11" width="15" height="2" fill="#f0e6cc" opacity="0.8"/>
    <rect x="2.5" y="-7" width="11" height="1.6" fill="#f0e6cc" opacity="0.6"/>
  </g>

  <!-- low flowerbed along the path -->
  <g opacity="0.9">
    <circle cx="60" cy="288" r="3.2" fill="#e0577a"/>
    <circle cx="70" cy="292" r="2.8" fill="#f0a63e"/>
    <circle cx="80" cy="286" r="3" fill="#e0577a"/>
    <circle cx="400" cy="284" r="3" fill="#f0a63e"/>
    <circle cx="412" cy="290" r="2.6" fill="#e0577a"/>
    <circle cx="424" cy="285" r="3" fill="#f0a63e"/>
  </g>
</svg>
