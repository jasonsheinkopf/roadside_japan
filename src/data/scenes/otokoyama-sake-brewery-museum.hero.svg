<ellipse cx="347" cy="66" rx="26" ry="30" fill="url(#otys-lanternglow)" filter="url(#otys-blur)"/>
<line x1="347" y1="16" x2="347" y2="43" stroke="#241811" stroke-width="1.4"/>
<rect x="342" y="40" width="10" height="5" fill="#241811"/>
<ellipse cx="347" cy="65" rx="14" ry="19" fill="url(#otys-lantern)"/>
<line x1="337" y1="54" x2="337" y2="78" stroke="#a8611e" stroke-width="0.7" opacity="0.6"/>
<line x1="357" y1="54" x2="357" y2="78" stroke="#a8611e" stroke-width="0.7" opacity="0.6"/>
<rect x="342" y="81" width="10" height="5" fill="#241811"/>

<!-- floor -->
<rect x="0" y="176" width="480" height="124" fill="url(#otys-floor)"/>
<path d="M240 176 L0 300" stroke="#4a3016" stroke-width="0.8" opacity="0.18"/>
<path d="M240 176 L140 300" stroke="#4a3016" stroke-width="0.8" opacity="0.18"/>
<path d="M240 176 L360 300" stroke="#4a3016" stroke-width="0.8" opacity="0.18"/>
<path d="M240 176 L480 300" stroke="#4a3016" stroke-width="0.8" opacity="0.18"/>
<path d="M0 224 Q240 214 480 224" stroke="#4a3016" stroke-width="0.8" fill="none" opacity="0.15"/>
<path d="M0 262 Q240 250 480 262" stroke="#4a3016" stroke-width="0.8" fill="none" opacity="0.15"/>

