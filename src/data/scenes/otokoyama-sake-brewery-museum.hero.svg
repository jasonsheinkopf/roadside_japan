<ellipse cx="130" cy="72" rx="30" ry="34" fill="url(#otys-lanternglow)" filter="url(#otys-blur)"/>
<line x1="130" y1="16" x2="130" y2="48" stroke="#241811" stroke-width="1.4"/>
<rect x="124" y="45" width="12" height="6" fill="#241811"/>
