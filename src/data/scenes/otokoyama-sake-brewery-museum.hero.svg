<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="otys" data-title="Otokoyama Sake Brewery — kioke tanks, sugidama, warm lantern light">
<defs>
  <linearGradient id="otys-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a3626"/>
    <stop offset="1" stop-color="#241811"/>
  </linearGradient>
  <linearGradient id="otys-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9c6b3f"/>
    <stop offset="1" stop-color="#5c3a20"/>
  </linearGradient>
  <linearGradient id="otys-outside" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#241d47"/>
    <stop offset="0.55" stop-color="#7a4a5c"/>
    <stop offset="1" stop-color="#d98a52"/>
  </linearGradient>
  <radialGradient id="otys-sugidama" cx="0.35" cy="0.3" r="0.85">
    <stop offset="0" stop-color="#9aab6e"/>
    <stop offset="0.55" stop-color="#7a5f3a"/>
    <stop offset="1" stop-color="#54401f"/>
  </radialGradient>
  <linearGradient id="otys-tankwood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d3ac74"/>
    <stop offset="0.5" stop-color="#a9773f"/>
    <stop offset="1" stop-color="#7a5530"/>
  </linearGradient>
  <linearGradient id="otys-tanktop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e6c58e"/>
    <stop offset="1" stop-color="#ab7940"/>
  </linearGradient>
  <linearGradient id="otys-shelfwood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b4a30"/>
    <stop offset="1" stop-color="#432c19"/>
  </linearGradient>
  <linearGradient id="otys-noren" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#31527a"/>
    <stop offset="1" stop-color="#16283f"/>
  </linearGradient>
  <linearGradient id="otys-lantern" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6cf8e"/>
    <stop offset="1" stop-color="#dc8f42"/>
  </linearGradient>
  <radialGradient id="otys-lanternglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe3ab" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#ffe3ab" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="otys-floorlight" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffdca0" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffdca0" stop-opacity="0"/>
  </radialGradient>
  <filter id="otys-blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<!-- back wall -->
<rect x="0" y="0" width="480" height="176" fill="url(#otys-wall)"/>
<g stroke="#1c130c" stroke-width="1" opacity="0.22">
  <line x1="40" y1="17" x2="40" y2="176"/>
  <line x1="100" y1="17" x2="100" y2="176"/>
  <line x1="330" y1="17" x2="330" y2="176"/>
  <line x1="400" y1="17" x2="400" y2="176"/>
  <line x1="460" y1="17" x2="460" y2="176"/>
</g>

<!-- ceiling beam -->
<rect x="0" y="0" width="480" height="13" fill="#2a1c12"/>
<rect x="0" y="13" width="480" height="4" fill="#1c130c"/>

<!-- doorway to the entrance, dusk beyond -->
<rect x="296" y="34" width="132" height="146" fill="#2a1c12"/>
<rect x="304" y="42" width="116" height="134" fill="url(#otys-outside)"/>
<polygon points="304,42 420,42 409,55 315,55" fill="#1c130c"/>
<polygon points="398,110 420,110 420,155 406,155" fill="#1a1530" opacity="0.45"/>
<rect x="304" y="158" width="116" height="18" fill="#6b6355" opacity="0.7"/>

<!-- sugidama cedar-ball hanging over the entrance -->
<line x1="362" y1="55" x2="362" y2="64" stroke="#3a2a1c" stroke-width="1.6"/>
<circle cx="362" cy="87" r="22" fill="url(#otys-sugidama)"/>
