  <circle cx="374" cy="92" r="1.8"/>
  <circle cx="348" cy="90" r="1.8"/>
  <circle cx="366" cy="102" r="2"/>
</g>
<ellipse cx="355" cy="80" rx="7" ry="5" fill="#c7d69a" opacity="0.35"/>

<!-- framed ukiyo-e print on the far wall -->
<rect x="436" y="86" width="34" height="44" fill="#3a2a1c"/>
<rect x="439" y="89" width="28" height="38" fill="#e6d9b8"/>
<path d="M441 118 Q448 108 453 116 Q459 105 465 117" stroke="#31527a" stroke-width="1.4" fill="none" opacity="0.8"/>
<polygon points="444,110 452,96 460,110" fill="#8a8a8a" opacity="0.5"/>

<!-- noren curtain -->
<line x1="205" y1="18" x2="285" y2="18" stroke="#1c130c" stroke-width="3"/>
<rect x="207" y="20" width="36" height="82" fill="url(#otys-noren)"/>
<rect x="247" y="20" width="36" height="82" fill="url(#otys-noren)"/>
<circle cx="225" cy="45" r="9" fill="#e8dcc0" opacity="0.85"/>
<circle cx="265" cy="45" r="9" fill="#e8dcc0" opacity="0.85"/>
<circle cx="225" cy="45" r="3" fill="#16283f"/>
<circle cx="265" cy="45" r="3" fill="#16283f"/>

