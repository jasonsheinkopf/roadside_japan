<line x1="54" y1="140" x2="54" y2="298" stroke="#5a3d20" stroke-width="1" opacity="0.3"/>
<line x1="90" y1="140" x2="90" y2="298" stroke="#5a3d20" stroke-width="1" opacity="0.3"/>
<line x1="118" y1="140" x2="118" y2="298" stroke="#5a3d20" stroke-width="1" opacity="0.3"/>

<!-- shimenawa sacred rope with paper shide on the great tank -->
