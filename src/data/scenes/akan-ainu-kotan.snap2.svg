<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="akks2" data-title="Front row, non-negotiable — Socks and the drum he distrusted">
  <defs>
    <linearGradient id="akks2-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2032"/>
      <stop offset="1" stop-color="#4a3520"/>
    </linearGradient>
    <linearGradient id="akks2-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4128"/>
      <stop offset="1" stop-color="#382718"/>
    </linearGradient>
    <radialGradient id="akks2-fireglow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffcf82" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff8a3c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="akks2-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a41"/>
      <stop offset="1" stop-color="#5c4326"/>
    </linearGradient>
    <linearGradient id="akks2-bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93724a"/>
      <stop offset="1" stop-color="#5f4429"/>
    </linearGradient>
    <linearGradient id="akks2-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e5136"/>
      <stop offset="1" stop-color="#43301e"/>
    </linearGradient>
    <linearGradient id="akks2-robe1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3e52"/>
      <stop offset="1" stop-color="#1a2733"/>
    </linearGradient>
    <linearGradient id="akks2-robe2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c2c26"/>
      <stop offset="1" stop-color="#3a1a16"/>
    </linearGradient>
    <linearGradient id="akks2-drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d8bd"/>
      <stop offset="1" stop-color="#bfa06c"/>
    </linearGradient>
    <radialGradient id="akks2-sky" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#4a3a5c"/>
      <stop offset="1" stop-color="#241b30"/>
    </radialGradient>
  </defs>

  <!-- high, elevated view down across the theater: dusk skylight glimpsed through the roof gap -->
  <rect x="0" y="0" width="480" height="300" fill="url(#akks2-roof)"/>
  <path d="M170 0 L310 0 L280 30 L200 30 Z" fill="url(#akks2-sky)"/>
  <circle cx="240" cy="14" r="5" fill="#f3e6c8" opacity="0.7"/>

  <!-- heavy wooden roof trusses, close overhead from this raised angle -->
  <path d="M0 24 L480 6" stroke="#241a10" stroke-width="6" opacity="0.8"/>
  <path d="M0 40 L480 26" stroke="#241a10" stroke-width="5" opacity="0.6"/>
  <path d="M60 0 L100 60" stroke="#241a10" stroke-width="7" opacity="0.7"/>
  <path d="M420 0 L378 58" stroke="#241a10" stroke-width="7" opacity="0.7"/>

  <!-- back wall of the stage, deep in frame -->
  <rect x="0" y="40" width="480" height="90" fill="url(#akks2-back)"/>
  <!-- woven backdrop banner with morew curl motifs -->
  <rect x="140" y="48" width="200" height="60" rx="2" fill="#22384a" opacity="0.9"/>
  <path d="M152 66 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0" fill="none" stroke="#d9c79a" stroke-width="2" stroke-linecap="round"/>
  <path d="M152 90 q10 8 20 0 q10 8 20 0 q10 8 20 0 q10 8 20 0 q10 8 20 0" fill="none" stroke="#c8402e" stroke-width="1.8" stroke-linecap="round"/>

  <!-- carved mask hung stage-left, prop 🎭 -->
  <g transform="translate(70 56)">
    <ellipse cx="0" cy="0" rx="20" ry="26" fill="#a9743f" stroke="#5c3d20" stroke-width="1.6"/>
    <path d="M-10 -8 Q0 -18 10 -8" fill="none" stroke="#5c3d20" stroke-width="2"/>
    <circle cx="-7" cy="-2" r="3" fill="#241a10"/><circle cx="7" cy="-2" r="3" fill="#241a10"/>
    <path d="M-8 10 Q0 18 8 10" fill="none" stroke="#7a1f14" stroke-width="2.4"/>
    <path d="M0 -26 L0 -34" stroke="#5c3d20" stroke-width="1.4"/>
  </g>

  <!-- stage platform, raised above the seating -->
  <path d="M60 108 L420 108 L440 130 L40 130 Z" fill="url(#akks2-stage)" stroke="#3e2c18" stroke-width="1.4"/>
  <path d="M40 130 L440 130 L446 142 L34 142Z" fill="#382718"/>

  <!-- central fire pit, glowing, the visual heart of the stage -->
  <circle cx="240" cy="118" r="46" fill="url(#akks2-fireglow)"/>
  <ellipse cx="240" cy="122" rx="18" ry="7" fill="#241a10" stroke="#3e2c18" stroke-width="1.2"/>
  <path d="M232 122 q2 -14 6 -18 q2 8 -1 18z" fill="#ffcf6a"/>
  <path d="M244 122 q0 -12 5 -16 q3 8 -2 16z" fill="#ff8a3c"/>
  <path d="M238 122 q4 -10 8 -12 q1 6 -3 12z" fill="#ffe6ad"/>

  <!-- two performers flanking the fire, mid-dance, arms raised -->
  <g>
    <path d="M170 128 Q160 96 172 76 Q182 62 194 78 Q202 96 194 128Z" fill="url(#akks2-robe1)" stroke="#101a24" stroke-width="1.2"/>
    <circle cx="182" cy="66" r="10" fill="#c99968"/>
    <path d="M172 60 Q182 48 192 60" fill="#241a10"/>
    <path d="M172 82 Q152 66 148 48" stroke="url(#akks2-robe1)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M194 82 Q214 66 218 48" stroke="url(#akks2-robe1)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M170 98 Q182 106 194 98" stroke="#d9c79a" stroke-width="2" fill="none"/>
  </g>
  <g>
    <path d="M288 128 Q278 98 290 78 Q300 64 312 80 Q320 98 312 128Z" fill="url(#akks2-robe2)" stroke="#1c0d0a" stroke-width="1.2"/>
    <circle cx="300" cy="68" r="10" fill="#c99968"/>
    <path d="M290 62 Q300 50 310 62" fill="#241a10"/>
    <path d="M290 84 Q272 70 268 52" stroke="url(#akks2-robe2)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M312 84 Q330 70 334 52" stroke="url(#akks2-robe2)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M288 100 Q300 108 312 100" stroke="#d9c79a" stroke-width="2" fill="none"/>
  </g>

  <!-- the great drum on its stand, dead center front of stage, the thing Socks doesn't trust -->
  <g transform="translate(240 148)">
    <ellipse cx="0" cy="14" rx="16" ry="6" fill="#000" opacity="0.25"/>
    <path d="M-24 8 L-16 -2 M24 8 L16 -2" stroke="#3e2c18" stroke-width="4"/>
    <ellipse cx="0" cy="-4" rx="30" ry="13" fill="url(#akks2-drum)" stroke="#7a5a34" stroke-width="2"/>
    <ellipse cx="0" cy="-6" rx="30" ry="13" fill="none" stroke="#a9824f" stroke-width="1.4" opacity="0.6"/>
    <path d="M-24 -4 L-24 6 M24 -4 L24 6" stroke="#7a5a34" stroke-width="2.4"/>
  </g>

  <!-- seating rows fanning down toward the foreground, seen from a raised corner -->
  <path d="M20 154 L460 154 L480 176 L0 176Z" fill="url(#akks2-bench)" stroke="#3e2c18" stroke-width="1.4"/>
  <path d="M0 176 L480 176 L480 206 L0 206Z" fill="url(#akks2-floor)"/>
  <path d="M10 210 L470 210 L480 246 L0 246Z" fill="url(#akks2-bench)" stroke="#3e2c18" stroke-width="1.4"/>
  <path d="M0 246 L480 246 L480 280 L0 280Z" fill="url(#akks2-floor)"/>
  <path d="M-10 284 L490 284 L490 300 L-10 300Z" fill="url(#akks2-bench)" stroke="#3e2c18" stroke-width="1.4"/>

  <!-- individual seat divisions on the two visible benches -->
  <path d="M70 156 L64 174 M130 155 L126 175 M190 154 L188 176 M290 154 L292 176 M350 155 L354 175 M410 156 L416 174" stroke="#3e2c18" stroke-width="1.2" opacity="0.55"/>
  <path d="M60 212 L50 244 M130 211 L124 245 M210 210 L208 246 M280 210 L282 246 M360 211 L366 245 M430 212 L440 244" stroke="#3e2c18" stroke-width="1.2" opacity="0.55"/>

  <!-- small floor lamps lighting the aisle -->
  <circle cx="30" cy="184" r="5" fill="#ffcf82" opacity="0.85"/>
  <circle cx="30" cy="184" r="12" fill="#ffcf82" opacity="0.25"/>
  <circle cx="450" cy="192" r="5" fill="#ffcf82" opacity="0.85"/>
  <circle cx="450" cy="192" r="12" fill="#ffcf82" opacity="0.25"/>

  <!-- sound rippling off the drum toward the back rows — the volume Socks doesn't trust -->
  <ellipse cx="240" cy="156" rx="90" ry="34" fill="none" stroke="#ffe6ad" stroke-width="1.6" opacity="0.4" stroke-dasharray="3 7"/>
  <ellipse cx="240" cy="162" rx="130" ry="52" fill="none" stroke="#ffe6ad" stroke-width="1.6" opacity="0.3" stroke-dasharray="3 8"/>
  <ellipse cx="240" cy="168" rx="172" ry="72" fill="none" stroke="#ffe6ad" stroke-width="1.6" opacity="0.22" stroke-dasharray="3 9"/>
  <!-- a last small ripple landing right over Socks's ears -->
  <path d="M282 212 Q300 202 318 212" stroke="#ffe6ad" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M274 220 Q300 204 326 220" stroke="#ffe6ad" stroke-width="1.8" fill="none" opacity="0.34" stroke-linecap="round"/>

  <!-- Cinnamon, down by the empty front bench, paw out, coaxing Socks forward -->
  <ellipse cx="150" cy="196" rx="46" ry="9" fill="#000" opacity="0.2"/>
  <g transform="translate(96 96) scale(0.46)">
    <use href="#advc-cinnamon" width="240" height="240"/>
  </g>
  <path d="M182 184 Q210 192 232 186" stroke="#caa97e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M232 186 l6 -4 l2 7z" fill="#caa97e"/>

  <!-- Socks, planted two rows back, refusing to budge toward the front -->
  <ellipse cx="300" cy="290" rx="58" ry="11" fill="#000" opacity="0.22"/>
  <g transform="translate(240 178) scale(0.6)">
    <use href="#advc-socks" width="200" height="200"/>
  </g>
  <!-- claws hooked hard over the back bench's lip, pale against the dark wood -->
  <path d="M283 286 Q280 276 288 274 Q291 281 286 286Z" fill="#f5f1ea" stroke="#26221f" stroke-width="1"/>
  <path d="M296 288 Q293 277 301 275 Q304 282 299 288Z" fill="#f5f1ea" stroke="#26221f" stroke-width="1"/>
  <path d="M309 286 Q307 276 315 274 Q317 281 312 286Z" fill="#f5f1ea" stroke="#26221f" stroke-width="1"/>
  <!-- a small startled flinch, pale hatch marks kicked up just outside his ears -->
  <path d="M276 208 l-8 -9" stroke="#f5f1ea" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
  <path d="M270 214 l-9 -4" stroke="#f5f1ea" stroke-width="2" opacity="0.65" stroke-linecap="round"/>
  <path d="M324 208 l8 -9" stroke="#f5f1ea" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
  <path d="M330 214 l9 -4" stroke="#f5f1ea" stroke-width="2" opacity="0.65" stroke-linecap="round"/>
</svg>
