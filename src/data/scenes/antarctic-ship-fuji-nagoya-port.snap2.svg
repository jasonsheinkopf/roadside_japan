<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="antf2" data-title="Belowdecks barbershop: Mon-chan in the chair, Socks refusing">
  <defs>
    <linearGradient id="antf2-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="1" stop-color="#5a3a20"/>
    </linearGradient>
    <linearGradient id="antf2-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3018"/>
      <stop offset="1" stop-color="#2e1e10"/>
    </linearGradient>
    <radialGradient id="antf2-bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2cf" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff2cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="antf2-mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfeaf0"/>
      <stop offset="1" stop-color="#9fb3bd"/>
    </linearGradient>
    <linearGradient id="antf2-chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c23b34"/>
      <stop offset="1" stop-color="#7c211c"/>
    </linearGradient>
  </defs>

  <!-- overhead / high-corner angle: looking down into the cramped wood-paneled barbershop -->
  <rect x="0" y="0" width="480" height="300" fill="url(#antf2-wall)"/>

  <!-- wood paneling seams -->
  <line x1="0" y1="0" x2="0" y2="300" stroke="#3f2712" stroke-width="0"/>
  <path d="M40 0 L20 300 M100 0 L86 300 M170 0 L162 300 M300 0 L306 300 M370 0 L382 300 M440 0 L458 300" stroke="#3f2712" stroke-width="2" opacity="0.5"/>

  <!-- riveted steel ceiling frame visible at the very top, low headroom of a ship interior -->
  <rect x="0" y="0" width="480" height="26" fill="#28180c"/>
  <circle cx="20" cy="13" r="2" fill="#6b4c2c"/><circle cx="70" cy="13" r="2" fill="#6b4c2c"/>
  <circle cx="410" cy="13" r="2" fill="#6b4c2c"/><circle cx="460" cy="13" r="2" fill="#6b4c2c"/>
  <circle cx="240" cy="16" r="8" fill="#1a0f08"/>
  <circle cx="240" cy="16" r="4" fill="#fff2cf"/>
  <circle cx="240" cy="60" r="60" fill="url(#antf2-bulb)"/>

  <!-- floor, seen from the raised corner angle -->
  <path d="M0 300 L480 300 L360 190 L120 190 Z" fill="url(#antf2-floor)"/>
  <path d="M120 190 L360 190 L340 210 L140 210 Z" fill="#3a2412" opacity="0.6"/>
  <line x1="180" y1="200" x2="150" y2="300" stroke="#231508" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="200" x2="330" y2="300" stroke="#231508" stroke-width="1.5" opacity="0.5"/>

  <!-- wall-mounted mirror with barber tools shelf, back wall, high corner view -->
  <rect x="330" y="46" width="118" height="86" rx="4" fill="#3a2412" stroke="#20140a" stroke-width="3"/>
  <rect x="340" y="56" width="98" height="66" rx="2" fill="url(#antf2-mirror)"/>
  <path d="M348 62 L392 118" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
  <rect x="326" y="136" width="126" height="8" fill="#20140a"/>
  <rect x="336" y="128" width="10" height="10" fill="#8a939a"/>
  <rect x="352" y="126" width="6" height="14" fill="#c23b34"/>
  <rect x="364" y="130" width="8" height="10" fill="#a9b3bb"/>
  <circle cx="392" cy="132" r="5" fill="#7c8790"/>
  <rect x="410" y="127" width="8" height="15" rx="2" fill="#3f7a5c"/>
  <rect x="426" y="129" width="7" height="12" fill="#c9a531"/>

  <!-- coat hook with a spare barber's smock draped from it, small period detail -->
  <circle cx="60" cy="58" r="3" fill="#20140a"/>
  <path d="M50 60 Q60 54 70 60 L74 106 Q60 116 46 106 Z" fill="#c9d4da" opacity="0.9"/>
  <path d="M50 60 Q60 54 70 60" fill="none" stroke="#8fa3ad" stroke-width="1.5"/>

  <!-- the old barbershop chair, center, seen from the raised angle -->
  <ellipse cx="220" cy="252" rx="60" ry="14" fill="#000" opacity="0.35"/>
  <path d="M186 170 L254 170 L262 236 L178 236 Z" fill="url(#antf2-chair)"/>
  <rect x="176" y="150" width="88" height="30" rx="10" fill="url(#antf2-chair)"/>
  <rect x="182" y="156" width="76" height="16" rx="7" fill="#8f2a24"/>
  <path d="M182 236 L258 236 L250 254 L190 254 Z" fill="#5c1a16"/>
  <rect x="150" y="172" width="30" height="12" rx="4" fill="#7c211c"/>
  <rect x="258" y="172" width="30" height="12" rx="4" fill="#7c211c"/>
  <path d="M198 254 L182 300 M242 254 L258 300" stroke="#2a2a2c" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="220" cy="252" rx="34" ry="8" fill="#8f2a24"/>
  <circle cx="220" cy="196" r="5" fill="#2a2a2c"/>

  <!-- Mon-chan already sitting in the chair, demanding a trim -->
  <g transform="translate(120 84) rotate(4) scale(0.62)">
    <use href="#advc-mon" width="200" height="200"/>
  </g>

  <!-- an old barber's cape draped over the chair arm, small prop detail -->
  <path d="M186 210 q-10 20 4 30 q30 10 50 -2 q-4 -20 -10 -30 Z" fill="#e8e2d2" opacity="0.9"/>

  <!-- Socks, backed away and refusing, foreground left, larger from the near angle -->
  <ellipse cx="70" cy="278" rx="42" ry="10" fill="#000" opacity="0.35"/>
  <g transform="translate(-14 108) rotate(-6) scale(0.66)">
    <use href="#advc-socks" width="200" height="200"/>
  </g>

  <!-- a second, empty stool waiting, small detail bottom right -->
  <ellipse cx="410" cy="272" rx="20" ry="6" fill="#000" opacity="0.3"/>
  <rect x="392" y="240" width="36" height="10" rx="3" fill="#6b4c2c"/>
  <path d="M398 250 L394 268 M422 250 L426 268" stroke="#2a2a2c" stroke-width="4" stroke-linecap="round"/>

  <!-- hazy corner vignette to sell the cramped depth -->
  <path d="M0 300 L0 220 Q30 300 0 300 Z" fill="#160e07" opacity="0.5"/>
  <path d="M480 300 L480 220 Q450 300 480 300 Z" fill="#160e07" opacity="0.5"/>
</svg>
