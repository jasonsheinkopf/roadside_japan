<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="shno2" data-title="Socks won't go near the edge — Cinnamon wades into the sunflowers">
  <defs>
    <linearGradient id="shno2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc4e8"/>
      <stop offset="1" stop-color="#dcedd8"/>
    </linearGradient>
    <linearGradient id="shno2-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d066"/>
      <stop offset="0.4" stop-color="#a9c14e"/>
      <stop offset="1" stop-color="#7a9c3a"/>
    </linearGradient>
    <linearGradient id="shno2-lawn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8f45"/>
      <stop offset="1" stop-color="#83a852"/>
    </linearGradient>
    <linearGradient id="shno2-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6835a"/>
      <stop offset="1" stop-color="#7c5c3c"/>
    </linearGradient>
    <radialGradient id="shno2-petal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f5a623"/>
    </radialGradient>
  </defs>

  <!-- sky, seen from a different corner of the 360-degree hilltop -->
  <rect x="0" y="0" width="480" height="92" fill="url(#shno2-sky)"/>
  <ellipse cx="70" cy="24" rx="40" ry="10" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="380" cy="18" rx="46" ry="11" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="250" cy="34" rx="30" ry="8" fill="#ffffff" opacity="0.45"/>

  <!-- Tokachidake range, small and hazy along this far horizon -->
  <path d="M-10 92 L40 68 L80 84 L130 58 L190 86 L240 66 L300 88 L360 62 L420 86 L490 70 L490 120 L-10 120 Z" fill="#8894b8" opacity="0.55"/>
  <path d="M130 58 L138 70 L122 72 Z" fill="#eef0f4" opacity="0.6"/>
  <path d="M360 62 L367 72 L353 74 Z" fill="#eef0f4" opacity="0.55"/>

  <!-- the hilltop park drops away toward the sunflower slope: wide elevated view -->
  <path d="M-10 92 Q140 108 260 96 Q380 84 490 100 L490 300 L-10 300 Z" fill="url(#shno2-field)"/>

  <!-- terraced shading suggesting the slope falling away from the viewer -->
  <path d="M-10 140 Q150 124 280 138 Q400 150 490 132 L490 160 Q380 178 260 166 Q140 152 -10 168 Z" fill="#5f7c3c" opacity="0.35"/>
  <path d="M-10 210 Q160 192 300 208 Q400 218 490 202 L490 228 Q390 244 280 230 Q150 214 -10 234 Z" fill="#5f7c3c" opacity="0.3"/>

  <!-- the lawn platform in the near foreground, where the railing and bench sit -->
  <path d="M-10 158 Q60 148 130 160 Q150 220 120 300 L-10 300 Z" fill="url(#shno2-lawn)"/>

  <!-- sunflower rows, smaller and denser toward the horizon, bigger up close -->
  <g>
    <line x1="222" y1="108" x2="222" y2="118" stroke="#5f7c3c" stroke-width="1.5"/>
    <path d="M222 108 m-6 0 a6 6 0 1 1 12 0 a6 6 0 1 1 -12 0" fill="url(#shno2-petal)"/>
    <circle cx="222" cy="108" r="3" fill="#6b4a26"/>

    <line x1="270" y1="102" x2="270" y2="112" stroke="#5f7c3c" stroke-width="1.5"/>
    <path d="M270 102 m-5 0 a5 5 0 1 1 10 0 a5 5 0 1 1 -10 0" fill="url(#shno2-petal)"/>
    <circle cx="270" cy="102" r="2.6" fill="#6b4a26"/>

    <line x1="310" y1="112" x2="310" y2="124" stroke="#5f7c3c" stroke-width="1.5"/>
    <path d="M310 112 m-6 0 a6 6 0 1 1 12 0 a6 6 0 1 1 -12 0" fill="url(#shno2-petal)"/>
    <circle cx="310" cy="112" r="3" fill="#6b4a26"/>

    <line x1="180" y1="140" x2="180" y2="156" stroke="#4f6b30" stroke-width="2"/>
    <path d="M180 140 m-8 0 a8 8 0 1 1 16 0 a8 8 0 1 1 -16 0" fill="url(#shno2-petal)"/>
    <circle cx="180" cy="140" r="3.8" fill="#6b4a26"/>

    <line x1="230" y1="150" x2="230" y2="166" stroke="#4f6b30" stroke-width="2"/>
    <path d="M230 150 m-8 0 a8 8 0 1 1 16 0 a8 8 0 1 1 -16 0" fill="url(#shno2-petal)"/>
    <circle cx="230" cy="150" r="3.8" fill="#6b4a26"/>

    <line x1="340" y1="146" x2="340" y2="162" stroke="#4f6b30" stroke-width="2"/>
    <path d="M340 146 m-8 0 a8 8 0 1 1 16 0 a8 8 0 1 1 -16 0" fill="url(#shno2-petal)"/>
    <circle cx="340" cy="146" r="3.8" fill="#6b4a26"/>

    <line x1="390" y1="138" x2="390" y2="152" stroke="#4f6b30" stroke-width="2"/>
    <path d="M390 138 m-7 0 a7 7 0 1 1 14 0 a7 7 0 1 1 -14 0" fill="url(#shno2-petal)"/>
    <circle cx="390" cy="138" r="3.4" fill="#6b4a26"/>

    <line x1="150" y1="188" x2="150" y2="210" stroke="#4a6329" stroke-width="2.4"/>
    <path d="M150 188 m-10 0 a10 10 0 1 1 20 0 a10 10 0 1 1 -20 0" fill="url(#shno2-petal)"/>
    <circle cx="150" cy="188" r="4.6" fill="#6b4a26"/>

    <line x1="370" y1="196" x2="370" y2="220" stroke="#4a6329" stroke-width="2.4"/>
    <path d="M370 196 m-10 0 a10 10 0 1 1 20 0 a10 10 0 1 1 -20 0" fill="url(#shno2-petal)"/>
    <circle cx="370" cy="196" r="4.6" fill="#6b4a26"/>

    <line x1="420" y1="176" x2="420" y2="196" stroke="#4a6329" stroke-width="2.2"/>
    <path d="M420 176 m-9 0 a9 9 0 1 1 18 0 a9 9 0 1 1 -18 0" fill="url(#shno2-petal)"/>
    <circle cx="420" cy="176" r="4" fill="#6b4a26"/>

    <line x1="290" y1="230" x2="290" y2="258" stroke="#3f5723" stroke-width="3"/>
    <path d="M290 230 m-13 0 a13 13 0 1 1 26 0 a13 13 0 1 1 -26 0" fill="url(#shno2-petal)"/>
    <circle cx="290" cy="230" r="6" fill="#6b4a26"/>

    <line x1="200" y1="248" x2="200" y2="278" stroke="#3f5723" stroke-width="3"/>
    <path d="M200 248 m-13 0 a13 13 0 1 1 26 0 a13 13 0 1 1 -26 0" fill="url(#shno2-petal)"/>
    <circle cx="200" cy="248" r="6" fill="#6b4a26"/>

    <line x1="440" y1="230" x2="440" y2="256" stroke="#3f5723" stroke-width="2.6"/>
    <path d="M440 230 m-11 0 a11 11 0 1 1 22 0 a11 11 0 1 1 -22 0" fill="url(#shno2-petal)"/>
    <circle cx="440" cy="230" r="5" fill="#6b4a26"/>

    <line x1="335" y1="258" x2="335" y2="290" stroke="#354a1e" stroke-width="3.2"/>
    <path d="M335 258 m-14 0 a14 14 0 1 1 28 0 a14 14 0 1 1 -28 0" fill="url(#shno2-petal)"/>
    <circle cx="335" cy="258" r="6.4" fill="#6b4a26"/>
  </g>

  <!-- Cinnamon, out among the sunflowers, arms up in the middle of the field -->
  <ellipse cx="256" cy="222" rx="26" ry="7" fill="#1a1710" opacity="0.25"/>
  <g transform="translate(216 132) scale(0.4)">
    <use href="#advc-cinnamon" width="240" height="240"/>
  </g>

  <!-- a low wooden railing marking the edge of the ridge platform -->
  <rect x="-10" y="176" width="18" height="46" fill="url(#shno2-wood)" stroke="#5a4530" stroke-width="1.5"/>
  <rect x="26" y="170" width="16" height="46" fill="url(#shno2-wood)" stroke="#5a4530" stroke-width="1.5"/>
  <rect x="66" y="166" width="16" height="46" fill="url(#shno2-wood)" stroke="#5a4530" stroke-width="1.5"/>
  <rect x="104" y="164" width="14" height="44" fill="url(#shno2-wood)" stroke="#5a4530" stroke-width="1.5"/>
  <path d="M-10 186 L120 174" stroke="#7c5c3c" stroke-width="4"/>
  <path d="M-10 200 L118 190" stroke="#7c5c3c" stroke-width="4"/>

  <!-- a plain bench set back from the railing on the lawn -->
  <rect x="8" y="228" width="66" height="8" rx="2" fill="url(#shno2-wood)" stroke="#5a4530" stroke-width="1.5"/>
  <rect x="8" y="212" width="66" height="7" rx="2" fill="url(#shno2-wood)" stroke="#5a4530" stroke-width="1.5"/>
  <rect x="12" y="236" width="6" height="16" fill="#5a4530"/>
  <rect x="64" y="236" width="6" height="16" fill="#5a4530"/>

  <!-- Socks, crouched low near the bench, unwilling to go any closer to the edge -->
  <ellipse cx="58" cy="266" rx="26" ry="7" fill="#1a1710" opacity="0.25"/>
  <g transform="translate(20 190) scale(0.4)">
    <use href="#advc-socks" width="200" height="200"/>
  </g>

  <!-- a scatter of salvia spikes along the lawn edge, red and pink -->
  <g stroke="#3f5723" stroke-width="1.2">
    <line x1="96" y1="270" x2="98" y2="250"/>
    <path d="M98 250 Q94 254 96 260 Q98 253 98 250 Q102 254 100 260 Q98 253 98 250Z" fill="#c0243f" stroke="none"/>
    <line x1="113" y1="274" x2="115" y2="256"/>
    <path d="M115 256 Q111 260 113 265 Q115 259 115 256 Q119 260 117 265 Q115 259 115 256Z" fill="#d8567a" stroke="none"/>
    <line x1="84" y1="276" x2="86" y2="260"/>
    <path d="M86 260 Q82 264 84 269 Q86 263 86 260 Q90 264 88 269 Q86 263 86 260Z" fill="#c0243f" stroke="none"/>
    <line x1="131" y1="270" x2="133" y2="252"/>
    <path d="M133 252 Q129 256 131 261 Q133 255 133 252 Q137 256 135 261 Q133 255 133 252Z" fill="#d8567a" stroke="none"/>
  </g>

  <!-- a few loose petals drifting near Cinnamon in the field -->
  <circle cx="292" cy="196" r="2.4" fill="#ffd23f" opacity="0.85"/>
  <circle cx="182" cy="214" r="2" fill="#ffd23f" opacity="0.8"/>
</svg>
