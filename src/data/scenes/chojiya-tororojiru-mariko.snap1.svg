<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="chs1" data-title="Cinnamon climbs the low table to watch the tororo go on">
<defs>
  <linearGradient id="chs1-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5c4530"/>
    <stop offset="1" stop-color="#332419"/>
  </linearGradient>
  <radialGradient id="chs1-spot" cx="0.35" cy="0.3" r="0.7">
    <stop offset="0" stop-color="#f2d290" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#f2d290" stop-opacity="0"/>
  </radialGradient>
  <filter id="chs1-blur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="chs1-table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9773f"/>
    <stop offset="1" stop-color="#8a6335"/>
  </linearGradient>
  <linearGradient id="chs1-tableedge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b4a2a"/>
    <stop offset="1" stop-color="#3a2818"/>
  </linearGradient>
  <linearGradient id="chs1-tororo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf6e3"/>
    <stop offset="1" stop-color="#e9dcae"/>
  </linearGradient>
  <linearGradient id="chs1-stream" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf8e8"/>
    <stop offset="1" stop-color="#efe0af"/>
  </linearGradient>
  <radialGradient id="chs1-bowl" cx="0.5" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#3d5a72"/>
    <stop offset="1" stop-color="#22384a"/>
  </radialGradient>
  <linearGradient id="chs1-pot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e6ddc6"/>
    <stop offset="1" stop-color="#b8a97c"/>
  </linearGradient>
</defs>

<!-- dim tatami-room wall, out of focus, above the table -->
<rect x="0" y="0" width="480" height="80" fill="url(#chs1-wall)"/>
<ellipse cx="170" cy="10" rx="220" ry="70" fill="url(#chs1-spot)"/>
<rect x="4" y="0" width="70" height="60" fill="#8a7048" opacity="0.5" filter="url(#chs1-blur)"/>
<circle cx="360" cy="18" r="24" fill="#f6cf8e" opacity="0.55" filter="url(#chs1-blur)"/>

<!-- the low tabletop, seen close and from slightly above: one broad surface plane -->
<polygon points="-20,68 500,58 500,240 -20,250" fill="url(#chs1-table)"/>
<path d="M-20 68 L500 58" stroke="#e6c58e" stroke-width="1.6" opacity="0.45" fill="none"/>
<path d="M-20 130 Q240 118 500 128" stroke="#5c4327" stroke-width="1" opacity="0.15" fill="none"/>
<path d="M-20 190 Q240 178 500 188" stroke="#5c4327" stroke-width="1" opacity="0.15" fill="none"/>

<!-- the table's front apron / near edge, below the surface -->
<rect x="-20" y="240" width="520" height="60" fill="url(#chs1-tableedge)"/>
<path d="M-20 244 Q240 232 500 242" stroke="#e6c58e" stroke-width="1" opacity="0.2" fill="none"/>

<!-- a bowl of barley rice, further back on the left of the table -->
<ellipse cx="92" cy="122" rx="42" ry="13" fill="#241a10" opacity="0.2"/>
<path d="M52 116 q40 -17 80 0 q-4 15 -40 15 q-36 0 -40 -15z" fill="#e9dcc0"/>
<ellipse cx="92" cy="115" rx="38" ry="11" fill="#f2ecd0"/>
<ellipse cx="92" cy="115" rx="38" ry="11" fill="none" stroke="#2c4a68" stroke-width="1.3" opacity="0.6"/>
<circle cx="78" cy="113" r="2.1" fill="#c9a866"/>
<circle cx="93" cy="110" r="2" fill="#c9a866"/>
<circle cx="106" cy="114" r="2.1" fill="#c9a866"/>

<!-- small pickle side dishes, right on the table surface -->
<ellipse cx="408" cy="150" rx="24" ry="8" fill="#e9dcc0"/>
<ellipse cx="408" cy="150" rx="24" ry="8" fill="none" stroke="#2c4a68" stroke-width="1" opacity="0.5"/>
<ellipse cx="401" cy="148" rx="5" ry="2.4" fill="#8a3a2c"/>
<ellipse cx="414" cy="150" rx="4.5" ry="2.2" fill="#a85c3c"/>

<!-- chopsticks resting near the front edge of the table -->
<rect x="380" y="216" width="28" height="7" rx="3" fill="#3a2818"/>
<line x1="386" y1="192" x2="388" y2="219" stroke="#c9a866" stroke-width="2.4" stroke-linecap="round"/>
<line x1="395" y1="190" x2="397" y2="219" stroke="#c9a866" stroke-width="2.4" stroke-linecap="round"/>

<!-- Cinnamon, climbed up onto the table, front and center, watching the pour -->
<ellipse cx="150" cy="222" rx="58" ry="14" fill="#000" opacity="0.22"/>
<g transform="translate(56 26) scale(0.82) rotate(4 120 120)">
  <use href="#advc-cinnamon" width="240" height="240"/>
</g>

<!-- the tororo bowl, right of Cinnamon, mid-pour, unobstructed -->
<ellipse cx="316" cy="196" rx="66" ry="20" fill="#241a10" opacity="0.28"/>
<path d="M252 182 q64 -24 128 0 q-6 24 -64 24 q-58 0 -64 -24z" fill="url(#chs1-bowl)"/>
<ellipse cx="316" cy="180" rx="56" ry="16" fill="url(#chs1-tororo)"/>
<path d="M270 177 q46 12 92 0" stroke="#d9c890" stroke-width="1.1" fill="none" opacity="0.5"/>
<ellipse cx="316" cy="180" rx="56" ry="16" fill="none" stroke="#f2c76b" stroke-width="1.4" opacity="0.4"/>

<!-- the pale glossy stream, poured from just off the top of the frame -->
<path d="M322 4 q10 90 -8 168" stroke="url(#chs1-stream)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.95"/>
<path d="M322 4 q10 90 -8 168" stroke="#fffef4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
<ellipse cx="314" cy="172" rx="17" ry="6" fill="#fdf8e8" opacity="0.85"/>

<!-- the pouring pot, tipped, cropped at the very top of the frame -->
<path d="M300 -20 q4 -14 34 -12 q30 2 26 24 l-8 18 q-4 8 -14 6 l-30 -6 q-8 -4 -8 -14z" fill="url(#chs1-pot)" stroke="#8a7a52" stroke-width="1.5"/>
<ellipse cx="336" cy="0" rx="20" ry="8" fill="#d9caa0"/>

<!-- a little steam drifting off the fresh pour, right beside Cinnamon's nose -->
<path d="M270 150 q-4 -10 2 -18" stroke="#fdf6e3" stroke-width="1.6" fill="none" opacity="0.55"/>
<path d="M280 154 q4 -9 -1 -17" stroke="#fdf6e3" stroke-width="1.6" fill="none" opacity="0.45"/>
</svg>
