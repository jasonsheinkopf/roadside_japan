<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="chs1" data-title="Cinnamon climbs the low table to watch the tororo go on">
<defs>
  <linearGradient id="chs1-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5c4530"/>
    <stop offset="1" stop-color="#332419"/>
  </linearGradient>
  <radialGradient id="chs1-spot" cx="0.4" cy="0.28" r="0.7">
    <stop offset="0" stop-color="#f2d290" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#f2d290" stop-opacity="0"/>
  </radialGradient>
  <filter id="chs1-blur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="chs1-table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9773f"/>
    <stop offset="1" stop-color="#6b4a2a"/>
  </linearGradient>
  <linearGradient id="chs1-tableedge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b4a2a"/>
    <stop offset="1" stop-color="#3a2818"/>
  </linearGradient>
  <linearGradient id="chs1-tororo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf6e3"/>
    <stop offset="1" stop-color="#e9dcae"/>
  </linearGradient>
  <linearGradient id="chs1-stream" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf8e8"/>
    <stop offset="1" stop-color="#efe0af"/>
  </linearGradient>
  <radialGradient id="chs1-bowl" cx="0.5" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#3d5a72"/>
    <stop offset="1" stop-color="#22384a"/>
  </radialGradient>
  <linearGradient id="chs1-pot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e6ddc6"/>
    <stop offset="1" stop-color="#b8a97c"/>
  </linearGradient>
</defs>

<!-- dim tatami-room wall, out of focus -->
<rect x="0" y="0" width="480" height="130" fill="url(#chs1-wall)"/>
<ellipse cx="190" cy="40" rx="220" ry="90" fill="url(#chs1-spot)"/>

<!-- blurred shoji screen and hanging lamp far behind -->
<rect x="4" y="10" width="70" height="90" fill="#8a7048" opacity="0.5" filter="url(#chs1-blur)"/>
<circle cx="360" cy="34" r="26" fill="#f6cf8e" opacity="0.55" filter="url(#chs1-blur)"/>
<ellipse cx="120" cy="112" rx="200" ry="20" fill="#241a10" opacity="0.4" filter="url(#chs1-blur)"/>

<!-- tatami floor sliver at the very top edge -->
<rect x="0" y="112" width="480" height="18" fill="#4a6b4a" opacity="0.5" filter="url(#chs1-blur)"/>

<!-- the low table, filling most of the frame, seen close and slightly from above -->
<path d="M-20 118 L500 100 L500 300 L-20 300 Z" fill="url(#chs1-tableedge)"/>
<path d="M-20 118 L500 100 L500 130 L-20 148 Z" fill="url(#chs1-table)"/>
<path d="M-20 118 L500 100" stroke="#e6c58e" stroke-width="1.5" opacity="0.4" fill="none"/>
<line x1="-20" y1="140" x2="500" y2="122" stroke="#3a2818" stroke-width="1" opacity="0.25"/>
<line x1="-20" y1="200" x2="500" y2="182" stroke="#3a2818" stroke-width="1" opacity="0.15"/>

<!-- a bowl of barley rice, off to the left, waiting -->
<ellipse cx="88" cy="176" rx="46" ry="16" fill="#241a10" opacity="0.25"/>
<path d="M46 172 q42 -20 84 0 q-4 18 -42 18 q-38 0 -42 -18z" fill="#e9dcc0"/>
<ellipse cx="88" cy="171" rx="42" ry="13" fill="#f2ecd0"/>
<ellipse cx="88" cy="171" rx="42" ry="13" fill="none" stroke="#2c4a68" stroke-width="1.5" opacity="0.6"/>
<circle cx="72" cy="168" r="2.4" fill="#c9a866"/>
<circle cx="90" cy="165" r="2.2" fill="#c9a866"/>
<circle cx="104" cy="169" r="2.4" fill="#c9a866"/>
<circle cx="80" cy="173" r="2" fill="#c9a866"/>

<!-- the tororo bowl, center, mid-pour -->
<ellipse cx="286" cy="216" rx="70" ry="22" fill="#241a10" opacity="0.3"/>
<path d="M226 202 q60 -26 120 0 q-6 26 -60 26 q-54 0 -60 -26z" fill="url(#chs1-bowl)"/>
<ellipse cx="286" cy="200" rx="60" ry="18" fill="url(#chs1-tororo)"/>
<path d="M240 197 q46 14 92 0" stroke="#d9c890" stroke-width="1.2" fill="none" opacity="0.5"/>
<ellipse cx="286" cy="200" rx="60" ry="18" fill="none" stroke="#f2c76b" stroke-width="1.5" opacity="0.4"/>

<!-- the pale glossy stream, poured from just off-frame above -->
<path d="M300 60 q6 60 -6 128" stroke="url(#chs1-stream)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.95"/>
<path d="M300 60 q6 60 -6 128" stroke="#fffef4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
<ellipse cx="292" cy="192" rx="18" ry="7" fill="#fdf8e8" opacity="0.85"/>

<!-- the pouring pot, tipped, top edge of frame -->
<path d="M280 30 q4 -22 34 -20 q30 2 26 26 l-10 20 q-4 8 -14 6 l-30 -8 q-8 -4 -6 -14z" fill="url(#chs1-pot)" stroke="#8a7a52" stroke-width="1.5"/>
<ellipse cx="316" cy="28" rx="20" ry="9" fill="#d9caa0"/>
<path d="M292 44 q4 10 8 16" stroke="#8a7a52" stroke-width="1.2" fill="none" opacity="0.5"/>

<!-- chopsticks resting on a small rest, foreground right -->
<rect x="386" y="240" width="26" height="7" rx="3" fill="#3a2818"/>
<line x1="392" y1="212" x2="394" y2="243" stroke="#c9a866" stroke-width="2.4" stroke-linecap="round"/>
<line x1="400" y1="210" x2="402" y2="243" stroke="#c9a866" stroke-width="2.4" stroke-linecap="round"/>

<!-- small pickle side dish, foreground left -->
<ellipse cx="40" cy="258" rx="26" ry="10" fill="#e9dcc0"/>
<ellipse cx="40" cy="258" rx="26" ry="10" fill="none" stroke="#2c4a68" stroke-width="1.2" opacity="0.5"/>
<ellipse cx="32" cy="255" rx="6" ry="3" fill="#8a3a2c"/>
<ellipse cx="46" cy="257" rx="5" ry="2.6" fill="#a85c3c"/>

<!-- Cinnamon, up on hind legs, front paws hooked over the table's near edge, nose toward the pour -->
<ellipse cx="175" cy="268" rx="58" ry="14" fill="#000" opacity="0.22"/>
<g transform="translate(112 40) scale(0.98) rotate(-3 120 120)">
  <use href="#advc-cinnamon" width="240" height="240"/>
</g>

<!-- her paws gripping the table edge, drawn over the tabletop so she reads as climbing -->
<ellipse cx="196" cy="196" rx="10" ry="7" fill="#b9966c"/>
<ellipse cx="222" cy="192" rx="10" ry="7" fill="#b9966c"/>

<!-- a little steam drifting off the fresh pour -->
<path d="M320 176 q-4 -10 2 -18" stroke="#fdf6e3" stroke-width="1.6" fill="none" opacity="0.55"/>
<path d="M330 180 q4 -9 -1 -17" stroke="#fdf6e3" stroke-width="1.6" fill="none" opacity="0.45"/>
</svg>
