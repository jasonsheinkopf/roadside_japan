<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="galp" data-title="Gallery PuruPuru's dusk storefront, framed animal art in the window">
<defs>
  <linearGradient id="galp-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#241d47"/>
    <stop offset="1" stop-color="#c67a63"/>
  </linearGradient>
  <radialGradient id="galp-glow" cx="0.5" cy="0.32" r="0.8">
    <stop offset="0" stop-color="#fff4d8"/>
    <stop offset="0.55" stop-color="#f6c988"/>
    <stop offset="1" stop-color="#d68d51"/>
  </radialGradient>
  <linearGradient id="galp-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c79063"/>
    <stop offset="1" stop-color="#8a5a35"/>
  </linearGradient>
  <filter id="galp-blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <clipPath id="galp-awningclip">
    <path d="M20,34 L460,34 L445,84 L35,84 Z"/>
  </clipPath>
  <clipPath id="galp-winclip">
    <rect x="108" y="98" width="352" height="144" rx="2"/>
  </clipPath>
</defs>

<!-- sky -->
<rect x="0" y="0" width="480" height="30" fill="url(#galp-sky)"/>

<!-- facade -->
<rect x="0" y="18" width="480" height="282" fill="#e7d9bd"/>
<rect x="0" y="16" width="480" height="16" fill="#3a2a1c"/>
<rect x="0" y="30" width="480" height="3" fill="#241811"/>

<!-- awning -->
<ellipse cx="240" cy="98" rx="205" ry="7" fill="#160f08" opacity="0.25" filter="url(#galp-blur)"/>
<path d="M20,34 L460,34 L445,84 L35,84 Z" fill="#8a3b3b"/>
<g clip-path="url(#galp-awningclip)">
  <rect x="110" y="30" width="22" height="60" fill="#eee2c8"/>
  <rect x="228" y="30" width="22" height="60" fill="#eee2c8"/>
  <rect x="346" y="30" width="22" height="60" fill="#eee2c8"/>
</g>
<path d="M35,84 A25.6,9 0 0 1 86.25,84 Z" fill="#eee2c8"/>
<path d="M86.25,84 A25.6,9 0 0 1 137.5,84 Z" fill="#eee2c8"/>
<path d="M137.5,84 A25.6,9 0 0 1 188.75,84 Z" fill="#eee2c8"/>
<path d="M188.75,84 A25.6,9 0 0 1 240,84 Z" fill="#eee2c8"/>
<path d="M240,84 A25.6,9 0 0 1 291.25,84 Z" fill="#eee2c8"/>
<path d="M291.25,84 A25.6,9 0 0 1 342.5,84 Z" fill="#eee2c8"/>
<path d="M342.5,84 A25.6,9 0 0 1 393.75,84 Z" fill="#eee2c8"/>
<path d="M393.75,84 A25.6,9 0 0 1 445,84 Z" fill="#eee2c8"/>

<!-- signboard nook -->
<rect x="85" y="128" width="14" height="52" rx="2" fill="#efe3c8" stroke="#5c4630" stroke-width="1.2"/>
<path d="M89,142 L96,146 L91,151 Z" fill="#8a3b3b"/>
<circle cx="92" cy="162" r="2.1" fill="#4a7a52"/>

<!-- window -->
<rect x="100" y="92" width="368" height="150" rx="4" fill="#3d2a1a"/>
<rect x="94" y="238" width="380" height="10" rx="2" fill="#4a3324"/>
<rect x="108" y="100" width="352" height="134" fill="url(#galp-glow)"/>

<g clip-path="url(#galp-winclip)">
  <rect x="108" y="98" width="352" height="92" fill="#f5ead2"/>
  <rect x="108" y="188" width="352" height="46" fill="url(#galp-floor)"/>
  <rect x="108" y="186" width="352" height="3" fill="#6b4a30"/>

  <!-- framed polar bear -->
  <rect x="122" y="108" width="64" height="52" rx="2" fill="#5c4630"/>
  <rect x="127" y="113" width="54" height="42" fill="#bcdff0"/>
  <ellipse cx="154" cy="142" rx="16" ry="11" fill="#fdfaf3"/>
  <circle cx="154" cy="128" r="10" fill="#fdfaf3"/>
  <circle cx="146" cy="121" r="3.2" fill="#fdfaf3"/>
  <circle cx="162" cy="121" r="3.2" fill="#fdfaf3"/>
  <circle cx="151" cy="127" r="1.1" fill="#33261c"/>
  <circle cx="157" cy="127" r="1.1" fill="#33261c"/>

  <!-- framed penguin -->
  <rect x="210" y="104" width="76" height="60" rx="2" fill="#5c4630"/>
  <rect x="216" y="110" width="64" height="48" fill="#d8edf2"/>
  <path d="M248,120 c-8,0 -13,8 -13,17 c0,9 6,16 13,16 c7,0 13,-7 13,-16 c0,-9 -5,-17 -13,-17 Z" fill="#2b2b2e"/>
  <ellipse cx="248" cy="142" rx="6" ry="11" fill="#fefefe"/>
  <polygon points="245,131 251,131 248,135.5" fill="#e8862f"/>
  <circle cx="248" cy="127" r="1.3" fill="#111111"/>

  <!-- framed owl -->
  <rect x="306" y="106" width="68" height="56" rx="2" fill="#5c4630"/>
  <rect x="311" y="111" width="58" height="46" fill="#584f7a"/>
  <ellipse cx="340" cy="141" rx="15" ry="13" fill="#7a5a3e"/>
  <polygon points="330,120 333,110 337,122" fill="#7a5a3e"/>
  <polygon points="350,120 347,110 343,122" fill="#7a5a3e"/>
  <circle cx="340" cy="129" r="10" fill="#e8d2a8"/>
  <circle cx="335" cy="128" r="4.2" fill="#fdfaf3"/>
  <circle cx="345" cy="128" r="4.2" fill="#fdfaf3"/>
  <circle cx="335" cy="128" r="1.8" fill="#1c140c"/>
  <circle cx="345" cy="128" r="1.8" fill="#1c140c"/>
  <polygon points="337,133 343,133 340,138" fill="#e0a53d"/>

  <!-- pendant lights -->
  <line x1="198" y1="98" x2="198" y2="104" stroke="#2a2018" stroke-width="1.4"/>
  <circle cx="198" cy="106" r="7" fill="#ffe8b0" opacity="0.55" filter="url(#galp-blur)"/>
  <circle cx="198" cy="106" r="3" fill="#fff3d6"/>
  <line x1="296" y1="98" x2="296" y2="104" stroke="#2a2018" stroke-width="1.4"/>
  <circle cx="296" cy="106" r="7" fill="#ffe8b0" opacity="0.55" filter="url(#galp-blur)"/>
  <circle cx="296" cy="106" r="3" fill="#fff3d6"/>

  <!-- pedestal with ceramic vase -->
  <rect x="188" y="178" width="20" height="12" fill="#e8dfc9"/>
  <path d="M194,160 c-3,4 -3,9 0,14 l8,0 c3,-5 3,-10 0,-14 c-2,3 -6,3 -8,0 Z" fill="#7a8a6a"/>
  <path d="M197,150 c1,4 -1,7 -2,9 c2,-1 5,-2 6,-6 Z" fill="#4a5a3a"/>

  <!-- window mullions + glass sheen -->
  <path d="M198,98 L198,234 M296,98 L296,234" stroke="#2a2018" stroke-width="2" opacity="0.3" fill="none"/>
  <polygon points="120,100 172,100 140,234 108,234" fill="#ffffff" opacity="0.07"/>
</g>

<!-- door -->
<rect x="22" y="96" width="60" height="142" rx="3" fill="#3d2a1a"/>
<rect x="28" y="104" width="48" height="118" fill="url(#galp-glow)" opacity="0.75"/>
<rect x="66" y="168" width="3" height="16" rx="1.5" fill="#c9a45a"/>

<!-- potted plants -->
<path d="M8,246 L34,246 L30,266 L12,266 Z" fill="#7a4a34"/>
<path d="M21,246 c-10,-6 -14,-18 -10,-28 c8,2 14,10 14,20 c6,-8 14,-12 20,-8 c-2,10 -12,16 -22,16 Z" fill="#3f6b45"/>
<path d="M472,246 L446,246 L450,266 L468,266 Z" fill="#7a4a34"/>
<path d="M459,246 c10,-6 14,-18 10,-28 c-8,2 -14,10 -14,20 c-6,-8 -14,-12 -20,-8 c2,10 12,16 24,16 Z" fill="#3f6b45"/>

<!-- sidewalk -->
<rect x="0" y="248" width="480" height="52" fill="#8a8a86"/>
<rect x="95" y="248" width="2" height="52" fill="#00000022"/>
<rect x="230" y="248" width="2" height="52" fill="#00000022"/>
<rect x="365" y="248" width="2" height="52" fill="#00000022"/>
</svg>
