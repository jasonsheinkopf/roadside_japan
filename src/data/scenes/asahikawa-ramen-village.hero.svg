<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="armv" data-title="Asahikawa Ramen Village — ramen stalls and the ramen-god shrine">
  <defs>
    <linearGradient id="armv-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#1c1109"/>
    </linearGradient>
    <radialGradient id="armv-glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff9a4a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armv-ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#4a3018"/>
    </linearGradient>
    <linearGradient id="armv-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5432"/>
      <stop offset="1" stop-color="#3a2414"/>
    </linearGradient>
    <radialGradient id="armv-floorglow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffb968" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb968" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armv-facadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="1" stop-color="#38220f"/>
    </linearGradient>
    <linearGradient id="armv-facadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38220f"/>
      <stop offset="1" stop-color="#5a3a20"/>
    </linearGradient>
    <linearGradient id="armv-norenA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9432f"/>
      <stop offset="1" stop-color="#8c2419"/>
    </linearGradient>
    <linearGradient id="armv-norenB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5f66"/>
      <stop offset="1" stop-color="#173a3f"/>
    </linearGradient>
    <linearGradient id="armv-norenC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b25c"/>
      <stop offset="1" stop-color="#a3792f"/>
    </linearGradient>
    <radialGradient id="armv-lantern" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.55" stop-color="#ff9d3d"/>
      <stop offset="1" stop-color="#c9531f"/>
    </radialGradient>
    <linearGradient id="armv-torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d94a34"/>
      <stop offset="1" stop-color="#8f2618"/>
    </linearGradient>
    <linearGradient id="armv-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ece0"/>
      <stop offset="1" stop-color="#c9a875"/>
    </linearGradient>
    <radialGradient id="armv-broth" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#e8a95a"/>
      <stop offset="1" stop-color="#9a5620"/>
    </radialGradient>
  </defs>

  <!-- back wall / ambient interior glow -->
  <rect x="0" y="0" width="480" height="300" fill="url(#armv-back)"/>
  <ellipse cx="240" cy="140" rx="180" ry="110" fill="url(#armv-glow)"/>

  <!-- ceiling and floor, converging toward the shrine at the back -->
  <polygon points="0,0 480,0 300,72 180,72" fill="url(#armv-ceil)"/>
  <path d="M20 4 L240 70 M460 4 L240 70 M0 40 L200 70 M480 40 L280 70" stroke="#1c1109" stroke-width="1.6" opacity="0.4" fill="none"/>
  <polygon points="0,300 480,300 306,172 174,172" fill="url(#armv-floor)"/>
  <ellipse cx="240" cy="230" rx="170" ry="60" fill="url(#armv-floorglow)"/>
  <path d="M12 296 L200 176 M60 298 L214 178 M468 296 L280 176 M420 298 L266 178" stroke="#2a1808" stroke-width="1.5" opacity="0.45"/>

  <!-- back-wall alcove holding the Ramen Shrine, the village's charming gimmick -->
  <rect x="186" y="76" width="108" height="96" fill="#241408" opacity="0.85"/>
  <rect x="186" y="76" width="108" height="10" fill="#150c05"/>

  <!-- shrine: small torii gate, shimenawa rope, tiny offering bowl -->
  <rect x="204" y="108" width="8" height="58" fill="url(#armv-torii)"/>
  <rect x="268" y="108" width="8" height="58" fill="url(#armv-torii)"/>
  <path d="M196 108 L284 108 L280 98 L200 98 Z" fill="url(#armv-torii)"/>
  <rect x="202" y="116" width="76" height="7" fill="url(#armv-torii)"/>
  <rect x="238" y="98" width="4" height="14" fill="#5c1810"/>
  <path d="M212 122 Q240 130 268 122" stroke="#e8dcc0" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M224 124 l-3 8 M240 126 l-3 9 M256 124 l-3 8" stroke="#e8dcc0" stroke-width="2" opacity="0.8"/>
  <path d="M228 150 q12 -8 24 0 q-2 10 -12 10 q-10 0 -12 -10z" fill="#3a2410"/>
  <ellipse cx="240" cy="150" rx="10" ry="4" fill="url(#armv-broth)"/>
  <path d="M234 145 q2 -6 0 -10 M240 144 q2 -7 -1 -11 M246 145 q2 -6 0 -9" stroke="#f4ece0" stroke-width="1.3" fill="none" opacity="0.55"/>
  <rect x="230" y="160" width="20" height="6" rx="1.5" fill="#4a2c14"/>

  <!-- small lanterns strung across the shrine alcove -->
  <ellipse cx="212" cy="90" rx="7" ry="9" fill="url(#armv-lantern)"/>
  <ellipse cx="268" cy="90" rx="7" ry="9" fill="url(#armv-lantern)"/>

  <!-- LEFT row of ramen stalls, near facade -->
  <rect x="-10" y="24" width="118" height="280" fill="url(#armv-facadeL)"/>
  <rect x="0" y="52" width="96" height="14" fill="#1c1109"/>
  <ellipse cx="48" cy="59" rx="34" ry="8" fill="url(#armv-lantern)"/>
  <path d="M22 59 q26 -7 52 0 M22 59 q26 7 52 0" stroke="#8a2c14" stroke-width="1.2" fill="none" opacity="0.55"/>
  <path d="M14 59 h68" stroke="#4a1a0c" stroke-width="1.4" opacity="0.6"/>
  <rect x="10" y="78" width="76" height="86" fill="url(#armv-norenA)"/>
  <path d="M10 78 h76 M28 78 v86 M48 78 v86 M68 78 v86" stroke="#5a170f" stroke-width="1.6" opacity="0.6"/>
  <ellipse cx="48" cy="106" rx="9" ry="9" fill="none" stroke="#f4ece0" stroke-width="1.8" opacity="0.85"/>
  <rect x="6" y="166" width="84" height="14" fill="#2c1a0c"/>
  <rect x="14" y="182" width="68" height="46" fill="#1c1109"/>
  <ellipse cx="34" cy="186" rx="16" ry="7" fill="url(#armv-bowl)"/>
  <ellipse cx="34" cy="185" rx="12" ry="5" fill="url(#armv-broth)"/>
  <path d="M28 178 q-2 -8 2 -13 M36 176 q-1 -9 3 -14" stroke="#f4ece0" stroke-width="1.6" opacity="0.65" fill="none"/>

  <!-- RIGHT row of ramen stalls, near facade -->
  <rect x="372" y="24" width="118" height="280" fill="url(#armv-facadeR)"/>
  <rect x="384" y="52" width="96" height="14" fill="#1c1109"/>
  <ellipse cx="432" cy="59" rx="34" ry="8" fill="url(#armv-lantern)"/>
  <path d="M406 59 q26 -7 52 0 M406 59 q26 7 52 0" stroke="#8a2c14" stroke-width="1.2" fill="none" opacity="0.55"/>
  <path d="M398 59 h68" stroke="#4a1a0c" stroke-width="1.4" opacity="0.6"/>
  <rect x="394" y="78" width="76" height="86" fill="url(#armv-norenB)"/>
  <path d="M394 78 h76 M412 78 v86 M432 78 v86 M452 78 v86" stroke="#0c2226" stroke-width="1.6" opacity="0.6"/>
  <rect x="426" y="98" width="12" height="16" rx="2" fill="none" stroke="#f4ece0" stroke-width="1.6" opacity="0.85"/>
  <rect x="390" y="166" width="84" height="14" fill="#2c1a0c"/>
  <rect x="398" y="182" width="68" height="46" fill="#1c1109"/>
  <ellipse cx="446" cy="186" rx="16" ry="7" fill="url(#armv-bowl)"/>
  <ellipse cx="446" cy="185" rx="12" ry="5" fill="url(#armv-broth)"/>
  <path d="M440 178 q-2 -8 2 -13 M448 176 q-1 -9 3 -14" stroke="#f4ece0" stroke-width="1.6" opacity="0.65" fill="none"/>

  <!-- mid-distance smaller stalls receding either side of the shrine -->
  <rect x="118" y="98" width="46" height="60" fill="#2c1a0c" opacity="0.9"/>
  <rect x="122" y="104" width="38" height="34" fill="url(#armv-norenC)" opacity="0.92"/>
  <path d="M132 104 v34 M141 104 v34 M150 104 v34" stroke="#6a4a1c" stroke-width="1" opacity="0.6"/>
  <ellipse cx="141" cy="98" rx="12" ry="6" fill="url(#armv-lantern)" opacity="0.9"/>
  <rect x="316" y="98" width="46" height="60" fill="#2c1a0c" opacity="0.9"/>
  <rect x="320" y="104" width="38" height="34" fill="url(#armv-norenA)" opacity="0.9"/>
  <path d="M330 104 v34 M339 104 v34 M348 104 v34" stroke="#5a170f" stroke-width="1" opacity="0.6"/>
  <ellipse cx="339" cy="98" rx="12" ry="6" fill="url(#armv-lantern)" opacity="0.9"/>

  <!-- hanging lantern string along the ceiling beam, receding toward the shrine -->
  <path d="M96 66 Q240 40 384 66" stroke="#1c1109" stroke-width="2" fill="none" opacity="0.6"/>
  <ellipse cx="150" cy="70" rx="6" ry="7" fill="url(#armv-lantern)"/>
  <ellipse cx="190" cy="58" rx="5" ry="6" fill="url(#armv-lantern)"/>
  <ellipse cx="290" cy="58" rx="5" ry="6" fill="url(#armv-lantern)"/>
  <ellipse cx="330" cy="70" rx="6" ry="7" fill="url(#armv-lantern)"/>

  <!-- foreground: two bowls of ramen on the near counters, steam curling up -->
  <rect x="0" y="252" width="150" height="48" fill="#241408"/>
  <rect x="10" y="248" width="130" height="10" fill="#3a2410"/>
  <ellipse cx="70" cy="252" rx="46" ry="16" fill="url(#armv-bowl)"/>
  <ellipse cx="70" cy="249" rx="36" ry="12" fill="url(#armv-broth)"/>
  <path d="M50 236 q10 6 6 -6 M70 232 q8 8 2 -8 M92 236 q9 6 5 -7" stroke="#f7efe2" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M100 246 l26 -14 M104 250 l26 -14" stroke="#d9c8a8" stroke-width="2" stroke-linecap="round"/>

  <rect x="330" y="256" width="150" height="44" fill="#241408"/>
  <rect x="340" y="252" width="130" height="10" fill="#3a2410"/>
  <ellipse cx="408" cy="256" rx="40" ry="14" fill="url(#armv-bowl)"/>
  <ellipse cx="408" cy="253" rx="31" ry="10" fill="url(#armv-broth)"/>
  <path d="M392 240 q8 6 4 -6 M408 236 q7 7 2 -7 M425 240 q8 6 4 -6" stroke="#f7efe2" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- soft warm mist drifting low across the aisle floor -->
  <path d="M120 210 q120 -14 240 0 v8 h-240z" fill="#ffdca0" opacity="0.12"/>
</svg>
