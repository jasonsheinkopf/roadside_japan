  <ellipse cx="90" cy="234" rx="24" ry="7" fill="#000" opacity="0.32"/>
  <use href="#tybh-karakasa" x="63.75" y="152.5" width="52.5" height="82.5"/>

  <ellipse cx="165" cy="252" rx="26" ry="7" fill="#000" opacity="0.34"/>
