  <ellipse cx="300" cy="52" rx="11" ry="13" fill="url(#tybh-lant)"/>
  <ellipse cx="380" cy="76" rx="10" ry="12" fill="url(#tybh-lant)"/>
  <path d="M195 144 Q120 110 60 118" fill="none" stroke="#5c3d24" stroke-width="1.6" opacity="0.7"/>
  <ellipse cx="140" cy="112" rx="9" ry="11" fill="url(#tybh-lant)"/>
  <ellipse cx="82" cy="118" rx="9" ry="11" fill="url(#tybh-lant)"/>
  <path d="M285 144 Q360 110 420 118" fill="none" stroke="#5c3d24" stroke-width="1.6" opacity="0.7"/>
  <ellipse cx="340" cy="112" rx="9" ry="11" fill="url(#tybh-lant)"/>
  <ellipse cx="398" cy="118" rx="9" ry="11" fill="url(#tybh-lant)"/>

