  <rect x="178" y="192" width="18" height="24" fill="#b3382c"/>
  <rect x="214" y="192" width="18" height="24" fill="#b3382c"/>
  <rect x="250" y="192" width="18" height="24" fill="#b3382c"/>
  <rect x="286" y="192" width="18" height="24" fill="#b3382c"/>

