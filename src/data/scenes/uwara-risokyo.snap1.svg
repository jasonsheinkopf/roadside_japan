<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="uria" data-title="Two rings for luck at Taoyame-daira's bell of happiness">
  <defs>
    <linearGradient id="uria-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeadd"/>
      <stop offset="0.5" stop-color="#9fd2c6"/>
      <stop offset="1" stop-color="#4c8f8a"/>
    </linearGradient>
    <linearGradient id="uria-bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a4e"/>
      <stop offset="0.5" stop-color="#8a6428"/>
      <stop offset="1" stop-color="#5e441c"/>
    </linearGradient>
    <linearGradient id="uria-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5a36"/>
      <stop offset="1" stop-color="#4e3a22"/>
    </linearGradient>
    <radialGradient id="uria-flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff8e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft green clearing behind, blurred bokeh feel -->
  <rect x="0" y="0" width="480" height="300" fill="url(#uria-bg)"/>
  <ellipse cx="70" cy="60" rx="90" ry="70" fill="#e7f5ea" opacity="0.4"/>
  <ellipse cx="410" cy="220" rx="100" ry="80" fill="#2f6b63" opacity="0.35"/>
  <ellipse cx="440" cy="50" rx="60" ry="50" fill="#fff2c7" opacity="0.3"/>
  <ellipse cx="30" cy="240" rx="70" ry="60" fill="#215c52" opacity="0.35"/>
  <ellipse cx="230" cy="20" rx="120" ry="30" fill="#e7f5ea" opacity="0.3"/>
  <!-- glimpse of sea past the clearing -->
  <rect x="0" y="150" width="480" height="34" fill="#3f8fa0" opacity="0.4"/>
  <ellipse cx="120" cy="160" rx="30" ry="4" fill="#eaf7f3" opacity="0.35"/>
  <ellipse cx="330" cy="168" rx="40" ry="5" fill="#eaf7f3" opacity="0.3"/>

  <!-- sunlight flare, upper right -->
  <circle cx="420" cy="46" r="110" fill="url(#uria-flare)"/>

  <!-- wooden bell frame, close and cropped by the top edge -->
  <rect x="150" y="-10" width="14" height="90" fill="url(#uria-wood)"/>
  <rect x="300" y="-10" width="14" height="70" fill="url(#uria-wood)"/>
  <rect x="146" y="30" width="172" height="16" rx="3" fill="url(#uria-wood)"/>
  <path d="M150 46 q4 10 0 18" stroke="#3a2c18" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- the bronze bell, hanging front and center -->
  <path d="M198 55 Q196 130 176 168 Q222 182 268 168 Q248 130 246 55 Z" fill="url(#uria-bell)" stroke="#3d2c14" stroke-width="2.5"/>
  <ellipse cx="222" cy="168" rx="46" ry="11" fill="#6b4a1e" stroke="#3d2c14" stroke-width="2"/>
  <path d="M204 90 Q222 98 240 90" stroke="#4a341a" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M200 118 Q222 128 244 118" stroke="#4a341a" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="222" cy="176" r="6" fill="#2e2010"/>
  <line x1="222" y1="46" x2="222" y2="60" stroke="#241a0e" stroke-width="4"/>

  <!-- rope, taut mid-pull -->
  <path d="M222 46 Q206 66 196 96 Q188 122 178 142" stroke="#d8c49a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M222 46 Q206 66 196 96 Q188 122 178 142" stroke="#a3854f" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- sound rings from the ringing bell -->
  <path d="M268 100 q22 20 8 46" stroke="#fff8e2" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M280 90 q34 26 12 66" stroke="#fff8e2" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Cinnamon mid-pull, leaning back on the rope -->
  <g transform="translate(60 96) scale(0.72)">
    <use href="#advc-cinnamon" width="240" height="240"/>
  </g>

  <!-- foreground foliage framing the close crop -->
  <path d="M0 0 Q40 30 20 70 Q0 60 0 0 Z" fill="#1f4b3f" opacity="0.6"/>
  <path d="M480 300 Q440 260 460 220 Q480 230 480 300 Z" fill="#1f4b3f" opacity="0.55"/>
  <path d="M0 300 Q30 260 70 290 Q40 300 0 300 Z" fill="#173c33" opacity="0.6"/>
</svg>
