<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" data-prefix="koenh" data-title="Koenji at night — lantern-lit shōtengai alive with Awa Odori dancers">
  <defs>
    <linearGradient id="koenh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0718"/>
      <stop offset="0.6" stop-color="#160f2a"/>
      <stop offset="1" stop-color="#241a34"/>
    </linearGradient>
    <radialGradient id="koenh-glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffe9bd" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffab52" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffab52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="koenh-lant" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.55" stop-color="#ffb14c"/>
      <stop offset="1" stop-color="#e2621f"/>
    </radialGradient>
    <radialGradient id="koenh-ground" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ff9d4c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9d4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="koenh-street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2038"/>
      <stop offset="1" stop-color="#0c0a14"/>
    </linearGradient>

    <!-- small receding dancer silhouettes, tinted per-instance via the "color" attr + currentColor -->
    <symbol id="koenh-amigasa-sil" viewBox="0 0 40 80">
      <path d="M11 78 Q9 50 15 34 Q20 27 25 34 Q31 50 29 78 Z" fill="currentColor"/>
      <ellipse cx="20" cy="31" rx="6" ry="7" fill="currentColor"/>
      <ellipse cx="20" cy="25" rx="17" ry="5.5" fill="currentColor"/>
    </symbol>
    <symbol id="koenh-happi-sil" viewBox="0 0 40 60">
      <path d="M8 58 Q6 40 16 34 Q14 24 22 18 Q30 14 30 24 Q26 30 28 40 Q30 50 26 58 Z" fill="currentColor"/>
      <ellipse cx="20" cy="14" rx="7" ry="7" fill="currentColor"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="480" height="300" fill="url(#koenh-sky)"/>
  <ellipse cx="240" cy="110" rx="130" ry="115" fill="url(#koenh-glow)"/>

  <!-- mid buildings -->
  <rect x="86" y="52" width="115" height="248" fill="#211a38"/>
  <polygon points="80,52 207,52 194,34 93,34" fill="#1a1530"/>
  <rect x="279" y="52" width="115" height="248" fill="#211a38"/>
  <polygon points="273,52 400,52 387,34 286,34" fill="#1a1530"/>
  <rect x="96" y="150" width="30" height="20" fill="#ffb457" opacity="0.55"/>
  <rect x="354" y="150" width="30" height="20" fill="#ffb457" opacity="0.55"/>

  <!-- near buildings, darkest silhouette, frame the street -->
  <rect x="-10" y="22" width="118" height="278" fill="#150f24"/>
  <polygon points="-14,22 112,22 96,2 -2,2" fill="#100b1c"/>
  <rect x="372" y="22" width="118" height="278" fill="#150f24"/>
  <polygon points="368,22 494,22 482,2 384,2" fill="#100b1c"/>

  <!-- shop awnings on the near buildings, arcade of the shōtengai -->
  <path d="M0 210 h96 v34 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 z" fill="#8a3a2c"/>
  <path d="M384 210 h96 v34 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 q-8 8 -16 0 z" fill="#8a3a2c"/>
  <rect x="18" y="168" width="26" height="30" fill="#ffb457" opacity="0.65"/>
  <rect x="60" y="168" width="26" height="30" fill="#ffb457" opacity="0.4"/>
  <rect x="398" y="168" width="26" height="30" fill="#ffb457" opacity="0.4"/>
  <rect x="438" y="168" width="26" height="30" fill="#ffb457" opacity="0.65"/>

  <!-- distant crowd silhouette lining the street -->
  <path d="M96 258 q10 -14 20 -2 q10 -12 20 0 q10 -13 20 -1 q10 -12 20 1 q10 -12 20 0 v12 h-100 z" fill="#0a0812" opacity="0.85"/>
  <path d="M304 258 q10 -14 20 -2 q10 -12 20 0 q10 -13 20 -1 q10 -12 20 1 q10 -12 20 0 v12 h-100 z" fill="#0a0812" opacity="0.85"/>

  <!-- street surface + warm reflected glow pooling on the ground -->
  <rect x="96" y="270" width="288" height="30" fill="url(#koenh-street)"/>
  <ellipse cx="240" cy="272" rx="140" ry="14" fill="url(#koenh-ground)"/>

  <!-- low crowd right at the front edge, heads only -->
  <path d="M150 284 q9 -12 18 -2 q9 -11 18 0 q9 -11 18 0 q9 -11 18 0 q9 -11 18 0 q9 -11 18 0 q9 -11 18 0 v16 h-126 z" fill="#0a0812" opacity="0.75"/>

  <!-- lantern garland, far strand between the mid buildings -->
  <path d="M205 78 q35 22 70 0" fill="none" stroke="#6b4a2c" stroke-width="1.5"/>
  <ellipse cx="221" cy="93" rx="7" ry="9" fill="url(#koenh-lant)"/>
  <ellipse cx="240" cy="97" rx="7" ry="9" fill="url(#koenh-lant)"/>
  <ellipse cx="259" cy="93" rx="7" ry="9" fill="url(#koenh-lant)"/>

  <!-- lantern garland, near strand strung across the whole street -->
  <path d="M100 96 q140 46 280 0" fill="none" stroke="#6b4a2c" stroke-width="2"/>
  <ellipse cx="140" cy="120" rx="12" ry="15" fill="url(#koenh-lant)"/>
  <ellipse cx="195" cy="134" rx="13" ry="16" fill="url(#koenh-lant)"/>
  <ellipse cx="240" cy="139" rx="13" ry="17" fill="url(#koenh-lant)"/>
  <ellipse cx="285" cy="134" rx="13" ry="16" fill="url(#koenh-lant)"/>
  <ellipse cx="340" cy="120" rx="12" ry="15" fill="url(#koenh-lant)"/>
  <path d="M140 106 h0 M195 119 h0 M240 123 h0 M285 119 h0 M340 106 h0" stroke="#4a2c1a" stroke-width="3" stroke-linecap="round"/>

  <!-- receding line of small dancer silhouettes in the glowing gap between the mid buildings, farthest first -->
  <use href="#koenh-amigasa-sil" x="209" y="74" width="8" height="16" color="#392a52"/>
  <use href="#koenh-happi-sil" x="255" y="73" width="10" height="15" color="#392a52"/>
  <use href="#koenh-amigasa-sil" x="199" y="106" width="12" height="24" color="#2c2244"/>
  <use href="#koenh-happi-sil" x="260.65" y="106" width="14.7" height="22" color="#2c2244"/>
  <use href="#koenh-amigasa-sil" x="194.5" y="138" width="15" height="30" color="#1c1730"/>
  <use href="#koenh-happi-sil" x="262.65" y="138" width="18.7" height="28" color="#1c1730"/>

  <!-- taiko drum, mid-street, simplified: clean barrel, pale head, two crossed bachi -->
  <path d="M222 236 l4 -10 h28 l4 10z" fill="#3a2416"/>
  <rect x="216" y="196" width="48" height="42" rx="6" fill="#7a4326"/>
  <line x1="216" y1="214" x2="264" y2="214" stroke="#5c3018" stroke-width="1.5" opacity="0.7"/>
  <line x1="216" y1="226" x2="264" y2="226" stroke="#5c3018" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="240" cy="196" rx="24" ry="9" fill="#e9dcc0"/>
  <ellipse cx="240" cy="196" rx="24" ry="9" fill="none" stroke="#4a2c1a" stroke-width="2"/>
  <path d="M220 199 L260 193" stroke="#8a5a34" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 199 L220 193" stroke="#8a5a34" stroke-width="3" stroke-linecap="round"/>

  <use href="#koenh-amigasa-sil" x="188.5" y="177" width="19" height="38" color="#150f24"/>
  <use href="#koenh-happi-sil" x="270" y="176" width="24" height="36" color="#150f24"/>
</svg>
