<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"
     data-episode="The Ribbon You Can Walk" data-prefix="meguo">
  <style>
    .meguo-walk1 { animation: meguo-walkin 1.6s cubic-bezier(.32,.9,.4,1) both; animation-delay: calc(var(--t1) + .15s); }
    .meguo-bobA { animation: meguo-bob 2.7s ease-in-out infinite; }
    .meguo-bobB { animation: meguo-bob 3.2s ease-in-out infinite; }
    .meguo-river { animation: meguo-shim 3.6s ease-in-out infinite; }
    .meguo-cloud { animation: meguo-cloud 18s linear infinite; }
    .meguo-cam2 { transform-box: fill-box; transform-origin: 50% 55%; animation: meguo-push 3.4s ease-out both; animation-delay: var(--t2); }
    .meguo-jar { animation: meguo-jar 3.4s ease-in-out infinite; }
    .meguo-jar2 { animation: meguo-jar 4.1s ease-in-out infinite; animation-delay: -1.6s; }
    .meguo-ribbon { animation: meguo-ribbon 3s cubic-bezier(.4,.5,.5,1) both; animation-delay: calc(var(--t3) + .3s); }
    .meguo-tape { animation: meguo-tape 4s ease-in-out infinite; }
    .meguo-sweat { animation: meguo-sweat 2.2s ease-in infinite; }
    .meguo-shiver { animation: meguo-shiver 0.35s ease-in-out infinite; transform-origin: 50% 90%; }
    .meguo-swing { animation: meguo-swing 2.6s ease-in-out infinite; transform-origin: 50% 6%; }
    .meguo-glint { animation: meguo-glint 2.4s ease-in-out infinite; }
    @keyframes meguo-walkin { from { transform: translateX(-96px); } to { transform: translateX(0); } }
    @keyframes meguo-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes meguo-shim { 0%,100% { opacity: .35; transform: translateX(0); } 50% { opacity: .7; transform: translateX(10px); } }
    @keyframes meguo-cloud { from { transform: translateX(-50px); } to { transform: translateX(540px); } }
    @keyframes meguo-push { from { transform: scale(1); } to { transform: scale(1.06); } }
    @keyframes meguo-jar { 0%,100% { opacity: .55; } 50% { opacity: .95; } }
    @keyframes meguo-ribbon { from { transform: translateX(-70px); } to { transform: translateX(30px); } }
    @keyframes meguo-tape { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(1.5deg); } }
    @keyframes meguo-sweat { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: .9; } 80% { transform: translateY(26px); opacity: .9; } 100% { transform: translateY(30px); opacity: 0; } }
    @keyframes meguo-shiver { 0%,100% { transform: translateX(-1px); } 50% { transform: translateX(1px); } }
    @keyframes meguo-swing { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes meguo-glint { 0%,100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  </style>
  <defs>
    <linearGradient id="meguo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0e6"/><stop offset="1" stop-color="#eef0e6"/>
    </linearGradient>
    <linearGradient id="meguo-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d2"/><stop offset="1" stop-color="#e3d4b6"/>
    </linearGradient>
    <linearGradient id="meguo-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7c55"/><stop offset="1" stop-color="#7d6242"/>
    </linearGradient>
    <radialGradient id="meguo-resin" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#d8ead0" stop-opacity=".95"/><stop offset="1" stop-color="#9dc39a" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="meguo-spot" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff6e2" stop-opacity=".9"/><stop offset="1" stop-color="#fff6e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ SCENE 1 — WIDE ESTABLISHING: the quiet Meguro block ============ -->
  <g class="scene" data-dur="3.2" data-caption="CINNAMON: “Two floors, three hundred specimens, entirely parasites, entirely free. Peak Tokyo.”">
    <rect width="480" height="270" fill="url(#meguo-sky)"/>
    <g class="meguo-cloud"><ellipse cx="80" cy="34" rx="30" ry="11" fill="#fff" opacity=".7"/><ellipse cx="106" cy="28" rx="20" ry="10" fill="#fff" opacity=".7"/></g>
    <!-- residential skyline behind -->
    <rect x="0" y="72" width="66" height="80" fill="#cbb9a0"/><rect x="8" y="82" width="10" height="12" fill="#8fa0ab"/><rect x="26" y="82" width="10" height="12" fill="#8fa0ab"/><rect x="44" y="82" width="10" height="12" fill="#8fa0ab"/>
    <rect x="366" y="60" width="58" height="92" fill="#d3c4ac"/><rect x="376" y="72" width="9" height="11" fill="#8fa0ab"/><rect x="392" y="72" width="9" height="11" fill="#8fa0ab"/><rect x="408" y="72" width="9" height="11" fill="#8fa0ab"/><rect x="376" y="92" width="9" height="11" fill="#8fa0ab"/><rect x="392" y="92" width="9" height="11" fill="#8fa0ab"/><rect x="408" y="92" width="9" height="11" fill="#8fa0ab"/>
    <rect x="422" y="90" width="58" height="62" fill="#c3b298"/>
    <!-- the museum building -->
    <rect x="188" y="82" width="162" height="86" fill="url(#meguo-wall)"/>
    <rect x="188" y="82" width="162" height="11" fill="#c98f4f"/>
    <rect x="202" y="102" width="28" height="30" fill="#a9c4cc"/><rect x="242" y="102" width="28" height="30" fill="#a9c4cc"/><rect x="282" y="102" width="28" height="30" fill="#a9c4cc"/>
    <line x1="216" y1="102" x2="216" y2="132" stroke="#7c9098" stroke-width="1.5"/><line x1="256" y1="102" x2="256" y2="132" stroke="#7c9098" stroke-width="1.5"/><line x1="296" y1="102" x2="296" y2="132" stroke="#7c9098" stroke-width="1.5"/>
    <!-- entrance -->
    <rect x="300" y="138" width="34" height="30" fill="#5b4a34"/>
    <rect x="303" y="142" width="13" height="26" fill="#7a6446"/><rect x="318" y="142" width="13" height="26" fill="#7a6446"/>
    <!-- signboard, fully above the ground line -->
    <rect x="198" y="140" width="84" height="26" rx="2" fill="#3f5d63"/>
    <text x="240" y="152" font-family="Verdana, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#fff">PARASITE MUSEUM</text>
    <text x="240" y="162" font-family="Verdana, sans-serif" font-size="7" text-anchor="middle" fill="#d7e6e6">寄生虫館 · FREE</text>
    <!-- Meguro river along the left, behind, with railing + bank trees -->
    <rect x="0" y="140" width="150" height="26" fill="#79a7ad"/>
    <g class="meguo-river"><path d="M14 152 q46 -4 92 0" stroke="#cfeef0" stroke-width="2" fill="none" opacity=".5"/></g>
    <rect x="0" y="136" width="150" height="5" fill="#8a8f7a"/>
    <path d="M8 136 l0 -8 M32 136 l0 -8 M56 136 l0 -8 M80 136 l0 -8 M104 136 l0 -8 M128 136 l0 -8" stroke="#6f7566" stroke-width="2"/>
    <circle cx="40" cy="118" r="15" fill="#6f9a56"/><rect x="38" y="118" width="4" height="20" fill="#6b5030"/>
    <circle cx="66" cy="122" r="12" fill="#5f8a49"/><rect x="64" y="122" width="4" height="16" fill="#6b5030"/>
    <!-- sidewalk + street across the front -->
    <rect x="0" y="164" width="480" height="106" fill="#c9c3b4"/>
    <rect x="0" y="164" width="480" height="7" fill="#b3ad9d"/>
    <rect x="0" y="210" width="480" height="60" fill="#b8b2a2"/>
    <line x1="40" y1="240" x2="130" y2="240" stroke="#e6e0d0" stroke-width="3" stroke-dasharray="18 14"/>
    <line x1="310" y1="240" x2="450" y2="240" stroke="#e6e0d0" stroke-width="3" stroke-dasharray="18 14"/>
    <!-- cast arriving toward the entrance -->
    <g class="meguo-walk1">
      <g class="meguo-bobA"><use href="#advc-cinnamon" x="150" y="176" width="54" height="54"/></g>
      <g class="meguo-bobB"><use href="#advc-socks" x="112" y="184" width="44" height="44"/></g>
    </g>
  </g>

  <!-- ============ SCENE 2 — MEDIUM INTERIOR: the specimen hall ============ -->
  <g class="scene" data-dur="3.0" data-caption="SOCKS: “Couples come here on dates. Tokyo is a beautiful, strange place.”">
    <rect width="480" height="270" fill="#e6d9bf"/>
    <g class="meguo-cam2">
      <!-- back wall + ceiling + wood floor -->
      <rect x="0" y="0" width="480" height="30" fill="#d8c8a8"/>
      <rect x="0" y="176" width="480" height="94" fill="#b98a52"/>
      <path d="M0 176 L480 176 L420 270 L60 270 Z" fill="#a9793f" opacity=".4"/>
      <line x1="0" y1="176" x2="480" y2="176" stroke="#8a5f2e" stroke-width="2"/>
      <!-- perspective floor boards -->
      <path d="M120 176 L60 270 M200 176 L170 270 M280 176 L310 270 M360 176 L420 270" stroke="#8a5f2e" stroke-width="1.6" opacity=".4"/>
      <!-- wall-mounted lit display cases with specimen jars -->
      <g>
        <rect x="30" y="52" width="120" height="112" rx="3" fill="#2c3a40"/>
        <rect x="36" y="58" width="108" height="100" fill="#1d2a2f"/>
        <g class="meguo-jar"><rect x="46" y="74" width="20" height="34" rx="8" fill="#7fb890" opacity=".8"/><ellipse cx="56" cy="90" rx="4" ry="9" fill="#cfeecf"/></g>
        <g class="meguo-jar2"><rect x="76" y="74" width="20" height="34" rx="8" fill="#8ec59a" opacity=".8"/><path d="M86 82 q4 8 -1 16 q-4 6 1 10" stroke="#e6f4e0" stroke-width="2" fill="none"/></g>
        <g class="meguo-jar"><rect x="106" y="74" width="22" height="34" rx="8" fill="#7fb890" opacity=".8"/><circle cx="117" cy="92" r="6" fill="#d6efd6"/></g>
        <rect x="46" y="120" width="82" height="30" rx="4" fill="#243237"/>
        <rect x="52" y="126" width="70" height="4" fill="#5f7d84"/><rect x="52" y="134" width="52" height="3" fill="#4f6a70"/>
      </g>
      <g>
        <rect x="330" y="52" width="120" height="112" rx="3" fill="#2c3a40"/>
        <rect x="336" y="58" width="108" height="100" fill="#1d2a2f"/>
        <g class="meguo-jar2"><rect x="348" y="74" width="20" height="34" rx="8" fill="#8ec59a" opacity=".8"/><ellipse cx="358" cy="90" rx="4" ry="9" fill="#cfeecf"/></g>
        <g class="meguo-jar"><rect x="378" y="74" width="22" height="34" rx="8" fill="#7fb890" opacity=".8"/><path d="M389 82 q5 8 -1 16 q-5 6 1 10" stroke="#e6f4e0" stroke-width="2" fill="none"/></g>
        <g class="meguo-jar2"><rect x="410" y="74" width="20" height="34" rx="8" fill="#8ec59a" opacity=".8"/><circle cx="420" cy="92" r="6" fill="#d6efd6"/></g>
        <rect x="348" y="120" width="82" height="30" rx="4" fill="#243237"/>
        <rect x="354" y="126" width="70" height="4" fill="#5f7d84"/>
      </g>
      <!-- warm ceiling spots -->
      <ellipse cx="90" cy="60" rx="70" ry="30" fill="url(#meguo-spot)"/>
      <ellipse cx="390" cy="60" rx="70" ry="30" fill="url(#meguo-spot)"/>
      <!-- a couple on a date, silhouetted, further back -->
      <g opacity=".8">
        <path d="M228 214 q-4 -30 6 -30 q10 0 6 30z" fill="#5a4f42"/><circle cx="234" cy="180" r="8" fill="#6b5f50"/>
        <path d="M246 214 q-3 -26 6 -26 q9 0 6 26z" fill="#4a4136"/><circle cx="252" cy="184" r="7" fill="#5c5145"/>
        <path d="M240 200 q6 4 12 0" stroke="#3a2c24" stroke-width="2" fill="none"/>
      </g>
      <!-- our cast, near, looking up at a case -->
      <g class="meguo-bobA"><use href="#advc-cinnamon" x="120" y="150" width="66" height="66"/></g>
      <g class="meguo-bobB"><use href="#advc-socks" x="70" y="162" width="52" height="52"/></g>
    </g>
  </g>

  <!-- ============ SCENE 3 — TALL WIDE: walking the 8.8-metre ribbon ============ -->
  <g class="scene" data-dur="3.6" data-caption="CINNAMON: “I walked the ribbon beside it — 8.8 metres, nose to tail-tip, twice to be sure.”">
    <rect width="480" height="270" fill="#241d16"/>
    <!-- warm rear wall + floor -->
    <rect x="0" y="0" width="480" height="196" fill="#3a2f24"/>
    <rect x="0" y="196" width="480" height="74" fill="#5b4a34"/>
    <line x1="0" y1="196" x2="480" y2="196" stroke="#2c231a" stroke-width="2"/>
    <!-- a tall glass case holding the full-length tapeworm -->
    <rect x="40" y="14" width="72" height="200" rx="4" fill="#12181a"/>
    <rect x="46" y="20" width="60" height="188" fill="#1c2a2c"/>
    <rect x="46" y="20" width="16" height="188" fill="#33474a" opacity=".4"/>
    <!-- the tapeworm: a long pale ribbon coiling down the case -->
    <path d="M76 26 q22 12 -8 26 q-30 14 6 28 q26 12 -8 26 q-30 14 6 28 q26 12 -8 26 q-28 14 4 28 q22 12 -4 22"
          fill="none" stroke="#efe6d0" stroke-width="6" stroke-linecap="round"/>
    <path d="M76 26 q22 12 -8 26 q-30 14 6 28 q26 12 -8 26 q-30 14 6 28 q26 12 -8 26 q-28 14 4 28 q22 12 -4 22"
          fill="none" stroke="#cbbfa2" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <text x="76" y="228" font-family="Verdana, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#e6dcc4">8.8 m</text>
    <!-- the red measuring ribbon stretched across the floor with tick marks -->
    <g class="meguo-tape">
      <rect x="120" y="230" width="340" height="8" rx="2" fill="#c1443f"/>
      <rect x="120" y="230" width="340" height="3" fill="#d8635e"/>
      <line x1="160" y1="230" x2="160" y2="238" stroke="#fff" stroke-width="1.4" opacity=".7"/><line x1="210" y1="230" x2="210" y2="238" stroke="#fff" stroke-width="1.4" opacity=".7"/><line x1="260" y1="230" x2="260" y2="238" stroke="#fff" stroke-width="1.4" opacity=".7"/><line x1="310" y1="230" x2="310" y2="238" stroke="#fff" stroke-width="1.4" opacity=".7"/><line x1="360" y1="230" x2="360" y2="238" stroke="#fff" stroke-width="1.4" opacity=".7"/><line x1="410" y1="230" x2="410" y2="238" stroke="#fff" stroke-width="1.4" opacity=".7"/>
    </g>
    <!-- spotlight from above the case -->
    <ellipse cx="76" cy="120" rx="60" ry="150" fill="url(#meguo-spot)" opacity=".5"/>
    <!-- cast walking the ribbon, dwarfed by the length -->
    <g class="meguo-ribbon">
      <g class="meguo-bobA"><use href="#advc-cinnamon" x="196" y="182" width="52" height="52"/></g>
      <g class="meguo-bobB"><use href="#advc-socks" x="158" y="192" width="42" height="42"/></g>
    </g>
  </g>

  <!-- ============ SCENE 4 — REACTION CLOSE-UP: Cinnamon reconsiders lunch ============ -->
  <g class="scene" data-dur="2.4" data-caption="CINNAMON: “Eight-point-eight metres. I have never chewed my lunch so carefully since.”">
    <rect width="480" height="270" fill="#3a2f24"/>
    <!-- warm blurred museum backdrop with a hint of the case -->
    <rect x="0" y="0" width="480" height="270" fill="#443628" opacity=".5"/>
    <rect x="300" y="20" width="90" height="230" rx="6" fill="#1c2a2c" opacity=".7"/>
    <ellipse cx="240" cy="150" rx="200" ry="150" fill="url(#meguo-spot)" opacity=".35"/>
    <!-- big custom Cinnamon head, alarmed -->
    <g class="meguo-shiver">
      <path d="M172 88 q-14 -44 20 -40 q14 8 8 40z" fill="#7d6242"/>
      <path d="M300 88 q14 -44 -20 -40 q-14 8 -8 40z" fill="#7d6242"/>
      <path d="M182 76 q-6 -22 12 -24 M290 76 q6 -22 -12 -24" stroke="#5e4a32" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M180 82 q-6 -22 14 -22 q6 4 4 18z" fill="#e7b0a2" opacity=".7"/>
      <path d="M292 82 q6 -22 -14 -22 q-6 4 -4 18z" fill="#e7b0a2" opacity=".7"/>
      <ellipse cx="236" cy="146" rx="104" ry="94" fill="url(#meguo-fur)"/>
      <ellipse cx="236" cy="182" rx="66" ry="52" fill="#e9d8bd"/>
      <ellipse cx="180" cy="160" rx="17" ry="12" fill="#e7b0a2" opacity=".55"/>
      <ellipse cx="292" cy="160" rx="17" ry="12" fill="#e7b0a2" opacity=".55"/>
      <!-- wide alarmed eyes -->
      <ellipse cx="202" cy="130" rx="18" ry="22" fill="#fff"/><ellipse cx="270" cy="130" rx="18" ry="22" fill="#fff"/>
      <ellipse cx="204" cy="134" rx="11" ry="14" fill="#241c16"/><ellipse cx="272" cy="134" rx="11" ry="14" fill="#241c16"/>
      <circle cx="208" cy="128" r="4" fill="#fff"/><circle cx="276" cy="128" r="4" fill="#fff"/>
      <path d="M184 110 q16 -8 34 -2 M256 108 q18 -6 34 2" stroke="#5e4a32" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- nose + open worried mouth -->
      <path d="M226 168 h20 l-10 12z" fill="#2e2219"/>
      <ellipse cx="236" cy="196" rx="15" ry="12" fill="#7a4a44"/>
      <path d="M221 190 q15 -6 30 0" stroke="#3a2c24" stroke-width="2.6" fill="none"/>
      <!-- whiskers -->
      <path d="M174 176 l-34 -6 M176 186 l-34 4 M298 176 l34 -6 M296 186 l34 4" stroke="#cbb894" stroke-width="1.6" opacity=".8"/>
    </g>
    <!-- clutched acorn at his chin -->
    <g class="meguo-bobA">
      <ellipse cx="236" cy="238" rx="17" ry="20" fill="#a9763f"/>
      <path d="M219 230 q17 -10 34 0 q-3 6 -17 6 q-14 0 -17 -6z" fill="#6b4a26"/>
      <rect x="233" y="214" width="5" height="10" rx="2" fill="#6b4a26"/>
      <path d="M214 238 q-8 -6 -6 -16 M258 238 q8 -6 6 -16" stroke="#b9966c" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>
    <!-- nervous sweat bead -->
    <g class="meguo-sweat"><path d="M312 118 q-6 10 0 18 q6 -8 0 -18z" fill="#bfe4e8"/></g>
  </g>

  <!-- ============ SCENE 5 — INSERT / PAYOFF: the gift-shop keychain ============ -->
  <g class="scene" data-dur="2.8" data-caption="SOCKS: “I got a tapeworm keychain for my desk. It funds research. It horrifies visitors.”">
    <rect width="480" height="270" fill="#efe4cd"/>
    <!-- gift-shop shelving behind -->
    <rect x="0" y="0" width="480" height="270" fill="#f3ead4"/>
    <rect x="30" y="40" width="420" height="6" fill="#c9a86e"/><rect x="30" y="120" width="420" height="6" fill="#c9a86e"/>
    <!-- folded parasite T-shirts on the shelves -->
    <g>
      <rect x="46" y="52" width="46" height="30" rx="3" fill="#6f9a56"/><path d="M52 52 l8 -6 l6 6 M76 52 l6 -6 l8 6" fill="#6f9a56"/>
      <rect x="104" y="52" width="46" height="30" rx="3" fill="#d8894a"/><path d="M110 52 l8 -6 l6 6 M134 52 l6 -6 l8 6" fill="#d8894a"/>
      <rect x="330" y="52" width="46" height="30" rx="3" fill="#5f8aa8"/><path d="M336 52 l8 -6 l6 6 M360 52 l6 -6 l8 6" fill="#5f8aa8"/>
      <rect x="388" y="52" width="46" height="30" rx="3" fill="#b06b8f"/>
    </g>
    <!-- a rack of keychains + a shop sign -->
    <rect x="150" y="46" width="180" height="20" rx="2" fill="#3f5d63"/>
    <text x="240" y="60" font-family="Verdana, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">MUSEUM SHOP</text>
    <line x1="200" y1="66" x2="200" y2="96" stroke="#8a7a5c" stroke-width="2"/>
    <line x1="280" y1="66" x2="280" y2="96" stroke="#8a7a5c" stroke-width="2"/>
    <ellipse cx="200" cy="102" rx="8" ry="10" fill="url(#meguo-resin)" opacity=".7"/>
    <ellipse cx="280" cy="102" rx="8" ry="10" fill="url(#meguo-resin)" opacity=".7"/>
    <!-- Socks holding up the keychain to examine it -->
    <g class="meguo-bobB"><use href="#advc-socks" x="60" y="140" width="120" height="120"/></g>
    <!-- the big hero keychain, swinging on its string from Socks's raised paw -->
    <g class="meguo-swing">
      <line x1="196" y1="80" x2="196" y2="120" stroke="#8a7a5c" stroke-width="2"/>
      <circle cx="196" cy="122" r="7" fill="none" stroke="#c9c2b0" stroke-width="3"/>
      <path d="M180 132 q16 -8 32 0 q10 34 -16 46 q-26 -12 -16 -46z" fill="url(#meguo-resin)"/>
      <path d="M180 132 q16 -8 32 0 q10 34 -16 46 q-26 -12 -16 -46z" fill="none" stroke="#8fb08c" stroke-width="1.6" opacity=".7"/>
      <!-- the parasite coil suspended inside -->
      <path d="M188 146 q10 -4 12 6 q2 10 -10 8 q-10 -2 -6 -12 q3 -6 10 -4" fill="none" stroke="#6b4a3a" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="196" cy="150" rx="3" ry="2" fill="#8a5f4a"/>
      <!-- resin highlight -->
      <ellipse cx="190" cy="140" rx="4" ry="7" fill="#fff" opacity=".5"/>
    </g>
    <!-- glint sparkle on the resin -->
    <g class="meguo-glint" transform="translate(206,138)"><path d="M0 -8 l2.5 6 l6 2 l-6 2 l-2.5 6 l-2.5 -6 l-6 -2 l6 -2z" fill="#fff"/></g>
  </g>
</svg>
