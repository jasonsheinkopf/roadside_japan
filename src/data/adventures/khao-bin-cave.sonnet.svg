<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"
     data-episode="Chamber Three's New Mascot" data-prefix="khaos">
  <style>
    .khaos-walk1 { animation: khaos-walkin 1.3s cubic-bezier(.3,.9,.4,1) both; animation-delay: calc(var(--t1) + 0.2s); }
    .khaos-bob { animation: khaos-bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .khaos-leaf-l { animation: khaos-swayl 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
    .khaos-leaf-r { animation: khaos-swayr 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 100%; }
    .khaos-bat { animation: khaos-batflap .5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .khaos-bat1 { animation-delay: 0s; }
    .khaos-bat2 { animation-delay: .15s; }
    .khaos-bat3 { animation-delay: .3s; }
    .khaos-drip { animation: khaos-drip 2.2s ease-in linear infinite; }
    .khaos-lampglow { animation: khaos-glow 2.8s ease-in-out infinite; }
    .khaos-lookup { animation: khaos-lookup 1.1s ease-out both; animation-delay: calc(var(--t2) + .3s); transform-box: fill-box; transform-origin: 50% 100%; }
    .khaos-squeeze { animation: khaos-squeezein 1s ease-out both; animation-delay: calc(var(--t3) + .2s); }
    .khaos-shine { animation: khaos-shine 2s ease-in-out infinite; }
    .khaos-cam4 { animation: khaos-push 2.8s ease-out both; animation-delay: var(--t4); transform-box: fill-box; transform-origin: 50% 55%; }
    .khaos-smile { animation: khaos-popin .7s cubic-bezier(.3,1.4,.5,1) both; animation-delay: calc(var(--t4) + .3s); transform-box: fill-box; transform-origin: 50% 100%; }
    .khaos-exitwalk { animation: khaos-exitwalk 1.6s cubic-bezier(.3,.9,.4,1) both; animation-delay: calc(var(--t5) + .2s); }
    .khaos-batline { animation: khaos-batline 2.4s linear infinite; }

    @keyframes khaos-walkin { from { transform: translateX(-150px); } to { transform: translateX(0); } }
    @keyframes khaos-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes khaos-swayl { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes khaos-swayr { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    @keyframes khaos-batflap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
    @keyframes khaos-drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 70% { transform: translateY(26px); opacity: 1; } 100% { transform: translateY(30px); opacity: 0; } }
    @keyframes khaos-glow { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
    @keyframes khaos-lookup { from { transform: rotate(0deg) translateY(0); } to { transform: rotate(-6deg) translateY(-2px); } }
    @keyframes khaos-squeezein { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes khaos-shine { 0%,100% { opacity: .2; } 50% { opacity: .8; } }
    @keyframes khaos-push { from { transform: scale(1); } to { transform: scale(1.06); } }
    @keyframes khaos-popin { from { transform: scale(0) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes khaos-exitwalk { from { transform: translateX(-40px); opacity: .3; } to { transform: translateX(0); opacity: 1; } }
    @keyframes khaos-batline { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(70px,-46px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="khaos-sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeee2"/><stop offset="1" stop-color="#f7e3ab"/>
    </linearGradient>
    <linearGradient id="khaos-sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdeaf6"/><stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <linearGradient id="khaos-cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd3ae"/><stop offset="1" stop-color="#a99b76"/>
    </linearGradient>
    <linearGradient id="khaos-cave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123339"/><stop offset="1" stop-color="#040f12"/>
    </linearGradient>
    <linearGradient id="khaos-cavebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a30"/><stop offset="1" stop-color="#1e4a52"/>
    </linearGradient>
    <linearGradient id="khaos-stal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c0bf"/><stop offset="1" stop-color="#6f8b8a"/>
    </linearGradient>
    <radialGradient id="khaos-lampr" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="khaos-sqg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7c55"/><stop offset="1" stop-color="#7d6242"/>
    </linearGradient>
  </defs>

