      <path d="M9,192 L57,192 L50,177 L16,177 Z" fill="#6b3f22"/>
      <rect x="22" y="200" width="14" height="12" fill="#dfe7e6"/>
      <text x="33" y="233" font-size="7" fill="#3a2c24" text-anchor="middle" font-family="sans-serif">30 THB</text>
    </g>
    <path d="M0,232 Q120,222 215,225 L215,270 L0,270 Z" fill="#b99a6b"/>
    <path d="M0,232 Q120,222 215,225" fill="none" stroke="#8d7146" stroke-width="2" opacity="0.5"/>
    <g fill="#8d7146" opacity="0.6"><circle cx="70" cy="238" r="2.5"/><circle cx="125" cy="234" r="2"/><circle cx="180" cy="230" r="2.5"/></g>
    <g fill="#436b46"><path d="M75,242 l4,-10 l4,10z"/><path d="M190,231 l3,-8 l3,8z"/></g>
    <path class="khaos-leaf-l" d="M0,270 L0,230 Q22,225 37,242 Q22,257 0,252 Z" fill="#2e4d33"/>
    <path class="khaos-leaf-r" d="M480,270 L480,225 Q458,220 443,238 Q458,252 480,248 Z" fill="#2e4d33"/>
    <g class="khaos-walk1">
