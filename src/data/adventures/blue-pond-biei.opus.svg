<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"
     data-episode="A Mistake That Came Out Beautiful" data-prefix="blueo">
  <style>
    .blueo-walk1 { animation: blueo-walkin 1.6s cubic-bezier(.32,.9,.4,1) both; animation-delay: calc(var(--t1) + .15s); }
    .blueo-bobA { animation: blueo-bob 2.7s ease-in-out infinite; }
    .blueo-bobB { animation: blueo-bob 3.2s ease-in-out infinite; }
    .blueo-shimA { animation: blueo-shim 3.4s ease-in-out infinite; }
    .blueo-shimB { animation: blueo-shim 4.1s ease-in-out infinite; animation-delay: -1.5s; }
    .blueo-cloud { animation: blueo-cloud 16s linear infinite; }
    .blueo-lean { transform-box: fill-box; transform-origin: 50% 92%; animation: blueo-lean 1.3s cubic-bezier(.4,.7,.5,1.3) both; animation-delay: calc(var(--t2) + .3s); }
    .blueo-hold { transform-box: fill-box; transform-origin: 50% 92%; animation: blueo-hold 1.3s ease-out both; animation-delay: calc(var(--t2) + .3s); }
    .blueo-drop { animation: blueo-drop 2.4s ease-in infinite; }
    .blueo-ring1 { transform-box: fill-box; transform-origin: 50% 50%; animation: blueo-ripple 2.4s ease-out infinite; }
    .blueo-ring2 { transform-box: fill-box; transform-origin: 50% 50%; animation: blueo-ripple 2.4s ease-out infinite; animation-delay: -.8s; }
    .blueo-ring3 { transform-box: fill-box; transform-origin: 50% 50%; animation: blueo-ripple 2.4s ease-out infinite; animation-delay: -1.6s; }
    .blueo-reflect { animation: blueo-reflect 3.6s ease-in-out infinite; }
    .blueo-glow { animation: blueo-glow 3.2s ease-in-out infinite; }
    .blueo-snowA { animation: blueo-snow 5s linear infinite; }
    .blueo-snowB { animation: blueo-snow 6.4s linear infinite; animation-delay: -2.2s; }
    .blueo-snowC { animation: blueo-snow 4.3s linear infinite; animation-delay: -3s; }
    .blueo-cam5 { transform-box: fill-box; transform-origin: 50% 60%; animation: blueo-push 4s ease-out both; animation-delay: var(--t5); }
    @keyframes blueo-walkin { from { transform: translateX(94px); } to { transform: translateX(0); } }
    @keyframes blueo-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes blueo-shim { 0%,100% { opacity: .2; transform: translateX(0); } 50% { opacity: .55; transform: translateX(12px); } }
    @keyframes blueo-cloud { from { transform: translateX(-40px); } to { transform: translateX(520px); } }
    @keyframes blueo-lean { from { transform: translate(0,0) rotate(0); } to { transform: translate(-4px,-24px) rotate(-15deg); } }
    @keyframes blueo-hold { from { transform: translateX(0) rotate(0); } to { transform: translateX(5px) rotate(10deg); } }
    @keyframes blueo-drop { 0% { transform: translateY(-54px); opacity: 0; } 26% { opacity: 1; } 66% { transform: translateY(22px); opacity: 1; } 70% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes blueo-ripple { 0% { transform: scale(.15); opacity: .85; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes blueo-reflect { 0%,100% { opacity: .5; transform: scaleY(1); } 50% { opacity: .8; transform: scaleY(1.06); } }
    @keyframes blueo-glow { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
    @keyframes blueo-snow { 0% { transform: translateY(-16px); opacity: 0; } 12% { opacity: .9; } 100% { transform: translateY(150px); opacity: 0; } }
    @keyframes blueo-push { from { transform: scale(1.05); } to { transform: scale(1); } }
  </style>
  <defs>
    <linearGradient id="blueo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cfe0"/><stop offset=".6" stop-color="#cfe4ec"/><stop offset="1" stop-color="#e6eef0"/>
    </linearGradient>
    <linearGradient id="blueo-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ba6d8"/><stop offset=".5" stop-color="#1a86bf"/><stop offset="1" stop-color="#12628f"/>
    </linearGradient>
    <linearGradient id="blueo-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7c55"/><stop offset="1" stop-color="#7d6242"/>
    </linearGradient>
    <linearGradient id="blueo-nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12213f"/><stop offset=".6" stop-color="#1c3358"/><stop offset="1" stop-color="#2c4a72"/>
    </linearGradient>
    <linearGradient id="blueo-litwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd0e8"/><stop offset=".5" stop-color="#1f9fce"/><stop offset="1" stop-color="#136a9a"/>
    </linearGradient>
  </defs>

  <!-- ============ SCENE 1 — WIDE ESTABLISHING: the impossible blue pond ============ -->
  <g class="scene" data-dur="3.2" data-caption="CINNAMON: “A bus driver called it ‘a mistake that came out beautiful.’ So am I.”">
    <rect width="480" height="270" fill="url(#blueo-sky)"/>
    <!-- drifting cloud -->
    <g class="blueo-cloud"><ellipse cx="60" cy="40" rx="34" ry="12" fill="#fff" opacity=".7"/><ellipse cx="92" cy="34" rx="24" ry="12" fill="#fff" opacity=".7"/></g>
    <!-- far Hokkaido ridge -->
    <path d="M0 120 Q120 92 240 110 T480 100 L480 150 L0 150 Z" fill="#8fb0a2" opacity=".7"/>
    <!-- dark forest line behind the pond -->
    <path d="M0 118 L18 100 L34 118 L52 96 L70 118 L92 98 L112 118 L140 100 L164 120 L200 102 L232 120 L270 100 L300 120 L338 102 L366 120 L400 100 L430 120 L460 102 L480 120 L480 150 L0 150 Z" fill="#3e5a48"/>
    <path d="M0 128 L480 128 L480 150 L0 150 Z" fill="#2f4a3a"/>
    <!-- the pond -->
    <path d="M0 150 Q240 138 480 150 L480 232 Q240 246 0 232 Z" fill="url(#blueo-water)"/>
    <!-- water shimmer streaks -->
    <g class="blueo-shimA"><path d="M40 176 q60 -5 120 0 M220 168 q70 -5 140 0" stroke="#bfeaf6" stroke-width="2.4" fill="none" opacity=".4"/></g>
    <g class="blueo-shimB"><path d="M90 200 q80 -5 160 0 M300 194 q60 -4 120 0" stroke="#d6f2fa" stroke-width="2" fill="none" opacity=".35"/></g>
    <!-- drowned bleached larch trunks rising from the water -->
    <g>
      <path d="M118 210 L120 66 M120 100 l-14 -12 M120 120 l16 -14 M120 140 l-12 -10" stroke="#e4eaea" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M186 214 L188 54 M188 92 l16 -14 M188 116 l-14 -12 M188 138 l14 -12" stroke="#eef2f2" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <path d="M258 210 L260 74 M260 104 l-14 -12 M260 128 l16 -12" stroke="#dfe6e6" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M330 214 L332 60 M332 96 l16 -14 M332 122 l-16 -12 M332 146 l14 -10" stroke="#eef2f2" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M400 208 L402 84 M402 112 l-12 -10 M402 134 l14 -12" stroke="#dbe3e3" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </g>
    <!-- broken reflections of the trunks -->
    <g class="blueo-reflect" opacity=".5">
      <path d="M120 214 l0 14 M188 216 l0 16 M260 214 l0 12 M332 216 l0 14 M402 212 l0 12" stroke="#cdeaf6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- distant tour bus + photographers on the road at left -->
    <rect x="20" y="112" width="30" height="12" rx="2" fill="#e2e2e2"/><rect x="24" y="115" width="20" height="5" fill="#7fb8d4"/>
    <circle cx="60" cy="126" r="2.4" fill="#3a4a52"/><circle cx="68" cy="127" r="2.4" fill="#3a4a52"/><circle cx="76" cy="126" r="2.4" fill="#3a4a52"/>
    <!-- gravel bank foreground -->
    <path d="M0 226 Q240 240 480 226 L480 270 L0 270 Z" fill="#b7ab98"/>
    <path d="M0 244 Q240 256 480 244 L480 270 L0 270 Z" fill="#a3977f"/>
    <circle cx="60" cy="256" r="2.2" fill="#8a7d66"/><circle cx="150" cy="262" r="2.6" fill="#8a7d66"/><circle cx="300" cy="258" r="2.2" fill="#8a7d66"/><circle cx="420" cy="262" r="3" fill="#8a7d66"/>
    <!-- parking sign post -->
    <rect x="44" y="206" width="3" height="26" fill="#6b6350"/>
    <rect x="34" y="198" width="24" height="12" rx="2" fill="#3a5f8a"/>
    <text x="46" y="207" font-family="Verdana, sans-serif" font-size="7" font-weight="700" text-anchor="middle" fill="#fff">P</text>
    <!-- cast arriving on the bank from the right -->
    <g class="blueo-walk1">
      <g class="blueo-bobA"><use href="#advc-cinnamon" x="330" y="196" width="52" height="52"/></g>
      <g class="blueo-bobB"><use href="#advc-socks" x="382" y="204" width="42" height="42"/></g>
    </g>
  </g>

  <!-- ============ SCENE 2 — MEDIUM TWO-SHOT: Cinnamon lunges for the pond ============ -->
  <g class="scene" data-dur="3.4" data-caption="SOCKS: “He yelled ‘YEAH!’ at a pond and tried to jump in. I am supervising.”">
    <rect width="480" height="270" fill="url(#blueo-sky)"/>
    <!-- forest line -->
    <path d="M0 82 L20 62 L40 82 L64 60 L88 84 L120 62 L150 86 L190 62 L226 86 L268 62 L306 86 L348 62 L384 86 L420 62 L456 86 L480 66 L480 112 L0 112 Z" fill="#3e5a48"/>
    <path d="M0 100 L480 100 L480 116 L0 116 Z" fill="#2f4a3a"/>
    <!-- pond -->
    <path d="M0 116 Q240 108 480 116 L480 214 Q240 224 0 214 Z" fill="url(#blueo-water)"/>
    <g class="blueo-shimA"><path d="M40 150 q90 -6 180 0 M280 142 q80 -5 160 0" stroke="#bfeaf6" stroke-width="3" fill="none" opacity=".4"/></g>
    <g class="blueo-shimB"><path d="M60 188 q100 -6 200 0" stroke="#d6f2fa" stroke-width="2.4" fill="none" opacity=".35"/></g>
    <!-- framing larches -->
    <path d="M64 206 L66 44 M66 88 l16 -14 M66 122 l-14 -12" stroke="#eef2f2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M418 210 L420 50 M420 94 l-16 -14 M420 130 l16 -12" stroke="#e4eaea" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- ripple in the pond where he is about to land -->
    <ellipse class="blueo-ring2" cx="176" cy="196" rx="30" ry="8" fill="none" stroke="#cdeaf6" stroke-width="2" opacity=".7"/>
    <ellipse class="blueo-ring1" cx="176" cy="196" rx="30" ry="8" fill="none" stroke="#eef7fb" stroke-width="2.4"/>
    <!-- gravel bank -->
    <path d="M0 208 Q240 222 480 208 L480 270 L0 270 Z" fill="#b7ab98"/>
    <path d="M0 234 Q240 248 480 234 L480 270 L0 270 Z" fill="#a3977f"/>
    <!-- Socks braced on the bank, leaning back against the pull -->
    <g class="blueo-hold"><g class="blueo-bobB"><use href="#advc-socks" x="250" y="172" width="60" height="60"/></g></g>
    <!-- Cinnamon launching himself off the bank toward the water -->
    <g class="blueo-lean"><use href="#advc-cinnamon" x="150" y="158" width="74" height="74"/></g>
    <!-- excitement burst: sparkle + shout mark -->
    <g class="blueo-glow"><path d="M150 132 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z" fill="#fff"/></g>
    <g class="blueo-glow"><rect x="130" y="140" width="4" height="14" rx="2" fill="#f6e27a"/><circle cx="132" cy="160" r="2.4" fill="#f6e27a"/></g>
  </g>

  <!-- ============ SCENE 3 — CLOSE-UP INSERT: an acorn ripples the surface ============ -->
  <g class="scene" data-dur="2.6" data-caption="CINNAMON: “Minerals, they say. I checked twice, then voted for magic in my journal.”">
    <rect width="480" height="270" fill="url(#blueo-water)"/>
    <!-- deep cobalt field with soft light gradient at top -->
    <path d="M0 0 Q240 40 480 0 L480 90 Q240 120 0 90 Z" fill="#37b6dd" opacity=".55"/>
    <!-- mirrored larch reflection wobbling -->
    <g class="blueo-reflect" opacity=".55">
      <path d="M150 40 L150 250 M150 120 l24 -18 M150 170 l-22 -16" stroke="#d6eef8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M338 30 L338 250 M338 110 l-24 -18 M338 168 l22 -16" stroke="#c9e6f4" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- expanding ripple rings around the impact point -->
    <ellipse class="blueo-ring3" cx="242" cy="176" rx="70" ry="26" fill="none" stroke="#e6f6fc" stroke-width="2.2" opacity=".7"/>
    <ellipse class="blueo-ring2" cx="242" cy="176" rx="70" ry="26" fill="none" stroke="#d6f2fa" stroke-width="2.6" opacity=".8"/>
    <ellipse class="blueo-ring1" cx="242" cy="176" rx="70" ry="26" fill="none" stroke="#f2fbfe" stroke-width="3" opacity=".9"/>
    <!-- the acorn dropping in -->
    <g class="blueo-drop">
      <ellipse cx="242" cy="150" rx="9" ry="11" fill="#a9763f"/>
      <path d="M233 144 q9 -8 18 0 q-2 4 -9 4 q-7 0 -9 -4z" fill="#6b4a26"/>
      <rect x="240" y="132" width="3" height="7" rx="1" fill="#6b4a26"/>
    </g>
    <!-- Cinnamon's paw dipping in from the top-left -->
    <g class="blueo-bobA">
      <path d="M40 -10 q40 60 70 96 q10 12 6 26 q-18 6 -30 -6 q-30 -40 -58 -96z" fill="url(#blueo-fur)"/>
      <ellipse cx="112" cy="118" rx="16" ry="12" fill="#b9966c"/>
      <ellipse cx="104" cy="122" rx="4.5" ry="6" fill="#caa97e"/><ellipse cx="116" cy="124" rx="4.5" ry="6" fill="#caa97e"/><ellipse cx="126" cy="120" rx="4.5" ry="6" fill="#caa97e"/>
    </g>
  </g>

  <!-- ============ SCENE 4 — DETAIL: the ghost larches ============ -->
  <g class="scene" data-dur="2.6" data-caption="A dam pooled the water and drowned the trees. Now they stand like pencils in a cup.">
    <rect width="480" height="270" fill="url(#blueo-water)"/>
    <!-- upper water lighter, a band of forest shadow far off -->
    <path d="M0 0 Q240 30 480 0 L480 70 Q240 96 0 70 Z" fill="#3fbfe6" opacity=".5"/>
    <path d="M0 46 L480 46 L480 66 L0 66 Z" fill="#2f6f8f" opacity=".5"/>
    <!-- close, ghostly bleached larches, full-height, bare and dead -->
    <g stroke-linecap="round" fill="none">
      <path d="M90 270 L96 20 M96 70 l-22 -18 M96 108 l24 -18 M96 150 l-20 -16 M96 190 l18 -14" stroke="#eef3f3" stroke-width="5"/>
      <path d="M210 270 L216 8 M216 56 l24 -20 M216 98 l-22 -18 M216 140 l22 -16 M216 182 l-18 -14 M216 214 l16 -12" stroke="#f3f7f7" stroke-width="6"/>
      <path d="M330 270 L336 26 M336 74 l-24 -18 M336 116 l22 -16 M336 158 l-20 -14" stroke="#e6ecec" stroke-width="4.6"/>
      <path d="M420 270 L426 40 M426 84 l20 -16 M426 126 l-18 -14" stroke="#dbe4e4" stroke-width="4"/>
      <path d="M150 270 L154 120 M154 150 l-16 -12" stroke="#d0dcdc" stroke-width="3" opacity=".8"/>
    </g>
    <!-- soft shimmer band across the waterline -->
    <g class="blueo-shimA"><path d="M0 200 q120 -8 240 0 t240 0" stroke="#bfeaf6" stroke-width="3" fill="none" opacity=".4"/></g>
    <g class="blueo-shimB"><path d="M0 232 q120 -8 240 0 t240 0" stroke="#d6f2fa" stroke-width="2.4" fill="none" opacity=".35"/></g>
  </g>

  <!-- ============ SCENE 5 — PAYOFF WIDE: the winter illumination at dusk ============ -->
  <g class="scene" data-dur="3.4" data-caption="SOCKS: “The crowd took one photo and left in nine minutes. We stayed twenty.”">
    <rect width="480" height="270" fill="url(#blueo-nightsky)"/>
    <g class="blueo-cam5">
      <!-- a few stars -->
      <circle cx="70" cy="34" r="1.4" fill="#fff" opacity=".8"/><circle cx="150" cy="22" r="1" fill="#fff" opacity=".7"/><circle cx="300" cy="40" r="1.4" fill="#fff" opacity=".8"/><circle cx="410" cy="26" r="1.1" fill="#fff" opacity=".7"/>
      <!-- snowy forest line -->
      <path d="M0 96 L22 74 L44 96 L70 72 L96 98 L128 74 L160 100 L200 74 L238 100 L280 74 L318 100 L358 74 L396 100 L432 74 L466 100 L480 80 L480 128 L0 128 Z" fill="#2a3a56"/>
      <path d="M0 110 L26 96 L52 110 L84 94 L116 110 L152 94 L188 110 L228 94 L268 110 L308 94 L348 110 L388 94 L428 110 L466 96 L480 110 L480 132 L0 132 Z" fill="#e7eef6" opacity=".85"/>
      <!-- the illuminated pond glowing teal against the snow -->
      <path d="M0 132 Q240 124 480 132 L480 214 Q240 228 0 214 Z" fill="url(#blueo-litwater)"/>
      <g class="blueo-glow"><path d="M0 150 Q240 142 480 150 L480 190 Q240 200 0 190 Z" fill="#7ff0ff" opacity=".4"/></g>
      <!-- lit drowned larches, catching the underlight -->
      <g stroke-linecap="round" fill="none">
        <path d="M118 190 L120 60 M120 96 l14 -12 M120 120 l-12 -10" stroke="#bfe9f2" stroke-width="3.4"/>
        <path d="M200 196 L202 48 M202 88 l16 -14 M202 118 l-14 -12" stroke="#d6f4fb" stroke-width="4"/>
        <path d="M300 192 L302 62 M302 98 l-14 -12 M302 124 l16 -12" stroke="#bfe9f2" stroke-width="3.4"/>
        <path d="M372 188 L374 74 M374 108 l14 -12" stroke="#a9dbe8" stroke-width="3"/>
      </g>
      <!-- reflections -->
      <g class="blueo-reflect" opacity=".6"><path d="M120 194 l0 14 M202 200 l0 14 M302 196 l0 12 M374 190 l0 12" stroke="#8fe6f4" stroke-width="3.4" stroke-linecap="round"/></g>
      <!-- snowy foreground bank -->
      <path d="M0 210 Q240 224 480 210 L480 270 L0 270 Z" fill="#dfe8f2"/>
      <path d="M0 232 Q240 244 480 232 L480 270 L0 270 Z" fill="#c7d4e2"/>
      <!-- cast on the snowy bank, watching, alone now -->
      <g class="blueo-bobA"><use href="#advc-cinnamon" x="204" y="176" width="52" height="52"/></g>
      <g class="blueo-bobB"><use href="#advc-socks" x="252" y="186" width="42" height="42"/></g>
      <!-- falling snow -->
      <circle class="blueo-snowA" cx="90" cy="40" r="2.2" fill="#fff"/>
      <circle class="blueo-snowB" cx="220" cy="20" r="2.6" fill="#fff"/>
      <circle class="blueo-snowC" cx="360" cy="30" r="2" fill="#fff"/>
      <circle class="blueo-snowA" cx="420" cy="16" r="2.4" fill="#fff" opacity=".9"/>
      <circle class="blueo-snowB" cx="150" cy="50" r="1.8" fill="#fff"/>
    </g>
  </g>
</svg>
