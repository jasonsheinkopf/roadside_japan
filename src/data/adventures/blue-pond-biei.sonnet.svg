<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"
     data-episode="An Accidental Masterpiece" data-prefix="blues">
  <style>
    .blues-walk1 { animation: blues-walkin 1.3s cubic-bezier(.3,.9,.4,1) both; animation-delay: calc(var(--t1) + 0.2s); }
    .blues-bob { animation: blues-bob 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .blues-shimmer { animation: blues-shimmer 3s ease-in-out infinite; }
    .blues-shimmer2 { animation: blues-shimmer 3.6s ease-in-out infinite; animation-delay: .8s; }
    .blues-cloud { animation: blues-drift 14s linear infinite; }
    .blues-sit { animation: blues-sitdown .9s ease-out both; animation-delay: calc(var(--t2) + .2s); transform-box: fill-box; transform-origin: 50% 100%; }
    .blues-stare { animation: blues-stare 2.4s ease-in-out infinite; animation-delay: calc(var(--t2) + 1s); transform-box: fill-box; transform-origin: 50% 100%; }
    .blues-dip { animation: blues-dip 1.6s ease-in-out infinite; animation-delay: calc(var(--t3) + .2s); transform-box: fill-box; transform-origin: 50% 0%; }
    .blues-ring1 { animation: blues-ring 1.6s ease-out infinite; animation-delay: calc(var(--t3) + .6s); }
    .blues-ring2 { animation: blues-ring 1.6s ease-out infinite; animation-delay: calc(var(--t3) + 1.1s); }
    .blues-buspull { animation: blues-buspull 1.4s ease-out both; animation-delay: calc(var(--t4) + .1s); }
    .blues-crowd { animation: blues-popin .5s ease-out both; animation-delay: calc(var(--t4) + .8s); }
    .blues-startle { animation: blues-startle .6s cubic-bezier(.3,1.6,.4,1) both; animation-delay: calc(var(--t4) + 1.3s); transform-box: fill-box; transform-origin: 50% 100%; }
    .blues-leave { animation: blues-leave .8s ease-in both; animation-delay: calc(var(--t4) + 2.5s); }
    .blues-cam5 { animation: blues-push5 3s ease-out both; animation-delay: var(--t5); transform-box: fill-box; transform-origin: 50% 60%; }

    @keyframes blues-walkin { from { transform: translateX(-140px); } to { transform: translateX(0); } }
    @keyframes blues-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blues-shimmer { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
    @keyframes blues-drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    @keyframes blues-sitdown { from { transform: scale(1,.8) translateY(6px); } to { transform: scale(1,1) translateY(0); } }
    @keyframes blues-stare { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    @keyframes blues-dip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    @keyframes blues-ring { 0% { transform: scale(.3); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes blues-buspull { from { transform: translateX(90px); } to { transform: translateX(0); } }
    @keyframes blues-popin { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes blues-startle { 0% { transform: translateY(0) rotate(0deg); } 40% { transform: translateY(-10px) rotate(-8deg); } 100% { transform: translateY(-2px) rotate(-4deg); } }
    @keyframes blues-leave { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(60px); } }
    @keyframes blues-push5 { from { transform: scale(1); } to { transform: scale(1.05); } }
  </style>
  <defs>
    <linearGradient id="blues-sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d8e6"/><stop offset="1" stop-color="#e8f2df"/>
    </linearGradient>
    <linearGradient id="blues-sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa8b8"/><stop offset="1" stop-color="#c7d6cf"/>
    </linearGradient>
    <linearGradient id="blues-pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6c9"/><stop offset="0.55" stop-color="#1f7fb0"/><stop offset="1" stop-color="#0e4f82"/>
    </linearGradient>
    <linearGradient id="blues-ponddeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6f9c"/><stop offset="1" stop-color="#083a63"/>
    </linearGradient>
    <linearGradient id="blues-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9805a"/><stop offset="1" stop-color="#7c5a3c"/>
    </linearGradient>
  </defs>

  <!-- Scene 1: wide establishing — the boardwalk, the impossible blue -->
  <g class="scene" data-dur="3.2" data-caption="CINNAMON: “The pond is so blue I checked if the sky had fallen in.”">
    <rect x="0" y="0" width="480" height="270" fill="url(#blues-sky1)"/>
    <path class="blues-cloud" d="M40,40 q20,-14 40,0 q18,-10 34,4 q-4,10 -20,9 q-30,6 -54,-2 q-8,0 0,-11z" fill="#ffffff" opacity="0.8"/>
    <path class="blues-cloud" d="M330,30 q16,-11 32,0 q14,-8 27,3 q-3,8 -16,7 q-24,5 -43,-1 q-6,0 0,-9z" fill="#ffffff" opacity="0.7"/>
    <path d="M0,120 L60,70 L120,110 L190,55 L260,105 L330,65 L400,108 L480,75 L480,150 L0,150 Z" fill="#7f8fa0"/>
    <path d="M0,140 L90,105 L180,132 L280,98 L360,128 L480,110 L480,160 L0,160 Z" fill="#4f6a72" opacity="0.85"/>
    <g fill="#2c4a3c">
      <path d="M20,160 L34,120 L48,160Z"/><path d="M46,160 L58,128 L70,160Z"/><path d="M400,160 L414,122 L428,160Z"/>
      <path d="M424,160 L436,130 L448,160Z"/><path d="M450,160 L462,124 L474,160Z"/>
    </g>
    <rect x="0" y="155" width="480" height="70" fill="url(#blues-pond)"/>
    <path class="blues-shimmer" d="M20,175 q60,-6 120,0 q60,6 120,-2 q60,-8 120,2 q60,6 90,-4" fill="none" stroke="#dff3f7" stroke-width="2" opacity="0.4"/>
    <path class="blues-shimmer2" d="M10,196 q70,-6 140,2 q70,8 150,-3 q60,-6 150,4" fill="none" stroke="#bdeaf2" stroke-width="2" opacity="0.35"/>
    <g stroke="#e6e2d4" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M100,225 L96,168 M96,168 q6,-6 -2,-14"/>
      <path d="M170,222 L168,160 M168,160 q7,-5 0,-13 M168,160 q-6,-4 -1,-11"/>
      <path d="M330,224 L332,166 M332,166 q6,-5 -1,-12"/>
    </g>
    <path d="M0,222 Q120,214 220,220 T480,216 L480,270 L0,270 Z" fill="url(#blues-wood)"/>
    <g stroke="#5c4128" stroke-width="1.5" opacity="0.6">
      <line x1="20" y1="224" x2="20" y2="268"/><line x1="70" y1="220" x2="70" y2="268"/><line x1="150" y1="218" x2="150" y2="268"/>
      <line x1="260" y1="219" x2="260" y2="268"/><line x1="360" y1="217" x2="360" y2="268"/><line x1="440" y1="218" x2="440" y2="268"/>
    </g>
    <g stroke="#7c5a3c" stroke-width="4"><line x1="0" y1="212" x2="215" y2="205"/></g>
    <g stroke="#7c5a3c" stroke-width="4"><line x1="30" y1="196" x2="30" y2="212"/><line x1="120" y1="192" x2="120" y2="209"/><line x1="200" y1="200" x2="200" y2="207"/></g>
    <g class="blues-walk1">
      <use href="#advc-socks" x="30" y="150" width="62" height="62"/>
      <use href="#advc-cinnamon" x="75" y="136" width="78" height="78"/>
    </g>
  </g>

  <!-- Scene 2: medium — bank-side, staring at the color -->
  <g class="scene" data-dur="3.2" data-caption="SOCKS: “It's minerals. Scientifically. Definitely not magic.”">
    <rect x="0" y="0" width="480" height="270" fill="url(#blues-sky1)"/>
    <path d="M0,110 L100,60 L220,100 L340,55 L480,95 L480,140 L0,140 Z" fill="#5c778a" opacity="0.9"/>
    <rect x="0" y="135" width="480" height="80" fill="url(#blues-pond)"/>
    <path class="blues-shimmer" d="M0,160 q80,-8 160,0 q80,8 160,-2 q80,-6 160,2" fill="none" stroke="#dff3f7" stroke-width="2" opacity="0.4"/>
    <g stroke="#e6e2d4" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M340,215 L336,140 M336,140 q8,-6 0,-16"/>
      <path d="M400,213 L404,145 M404,145 q-7,-5 1,-14"/>
    </g>
    <path d="M0,205 Q160,192 280,200 T480,195 L480,270 L0,270 Z" fill="#3c5a3f"/>
    <g fill="#2c4530"><path d="M10,208 q10,-14 20,0z"/><path d="M60,204 q9,-13 18,0z"/><path d="M440,200 q10,-13 20,0z"/></g>
    <g class="blues-sit">
      <use href="#advc-cinnamon" x="150" y="150" width="86" height="86"/>
    </g>
    <g class="blues-stare">
      <use href="#advc-socks" x="235" y="163" width="66" height="66"/>
    </g>
  </g>

  <!-- Scene 3: close-up insert — the drowned larches, a paw dips the surface -->
  <g class="scene" data-dur="2.6" data-caption="The ghost-white trunks stand in the water like pencils in a cup.">
    <rect x="0" y="0" width="480" height="270" fill="url(#blues-ponddeep)"/>
    <path class="blues-shimmer" d="M0,40 q60,-8 120,0 q60,8 120,-3 q60,-7 120,3 q60,7 120,-3" fill="none" stroke="#7fd6e6" stroke-width="3" opacity="0.4"/>
    <path class="blues-shimmer2" d="M0,90 q70,-8 140,2 q70,9 150,-4 q60,-6 190,4" fill="none" stroke="#5cb6cc" stroke-width="3" opacity="0.35"/>
    <path class="blues-shimmer" d="M0,150 q80,8 160,-2 q80,-9 160,3 q80,9 160,-3" fill="none" stroke="#3f96b3" stroke-width="3" opacity="0.4"/>
    <g stroke="#e6e2d4" stroke-width="10" fill="none" stroke-linecap="round">
      <line x1="90" y1="270" x2="86" y2="20"/>
      <line x1="230" y1="270" x2="236" y2="10"/>
      <line x1="370" y1="270" x2="364" y2="24"/>
    </g>
    <g stroke="#c9c4b0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M86,60 q-16,-8 -26,-2 M86,100 q18,-8 28,0"/>
      <path d="M236,50 q-16,-8 -26,0 M236,90 q16,-6 26,2"/>
      <path d="M364,64 q-14,-7 -24,-1 M364,104 q16,-7 24,1"/>
    </g>
    <g class="blues-dip">
      <ellipse cx="240" cy="60" rx="20" ry="16" fill="#b9966c"/>
      <ellipse cx="240" cy="48" rx="16" ry="13" fill="#b9966c"/>
    </g>
    <ellipse class="blues-ring1" cx="240" cy="90" rx="20" ry="7" fill="none" stroke="#eafaff" stroke-width="2"/>
    <ellipse class="blues-ring2" cx="240" cy="90" rx="20" ry="7" fill="none" stroke="#eafaff" stroke-width="2"/>
  </g>

  <!-- Scene 4: reaction — a bus, a crowd, one photo, then a horn -->
  <g class="scene" data-dur="3.4" data-caption="SOCKS: “That bus horn came out of absolutely nowhere.”">
    <rect x="0" y="0" width="480" height="270" fill="url(#blues-sky1)"/>
    <path d="M0,110 L100,60 L220,100 L340,55 L480,95 L480,140 L0,140 Z" fill="#5c778a" opacity="0.9"/>
    <rect x="0" y="135" width="480" height="80" fill="url(#blues-pond)"/>
    <path d="M0,205 Q160,192 280,200 T480,195 L480,270 L0,270 Z" fill="#3c5a3f"/>
    <g class="blues-buspull">
      <rect x="300" y="150" width="140" height="60" rx="6" fill="#e2e6e2" stroke="#8b9a8e" stroke-width="2"/>
      <rect x="312" y="160" width="26" height="20" rx="2" fill="#8fd0e0"/>
      <rect x="344" y="160" width="26" height="20" rx="2" fill="#8fd0e0"/>
      <rect x="376" y="160" width="26" height="20" rx="2" fill="#8fd0e0"/>
      <rect x="408" y="160" width="22" height="20" rx="2" fill="#8fd0e0"/>
      <circle cx="325" cy="212" r="9" fill="#2c2c2c"/><circle cx="420" cy="212" r="9" fill="#2c2c2c"/>
      <rect x="300" y="195" width="140" height="8" fill="#3f6a9c"/>
    </g>
    <g class="blues-crowd" fill="#4a4038">
      <path d="M250,215 Q246,182 262,178 Q278,182 274,215Z"/><circle cx="262" cy="172" r="9" fill="#c9a07a"/>
      <path d="M275,217 Q272,190 284,187 Q296,190 293,217Z"/><circle cx="284" cy="182" r="7" fill="#e0b98f"/>
      <path d="M297,216 Q294,188 306,185 Q318,188 315,216Z"/><circle cx="306" cy="180" r="7.5" fill="#c9a07a"/>
    </g>
    <g class="blues-leave">
      <use href="#advc-cinnamon" x="120" y="150" width="76" height="76"/>
      <g class="blues-startle">
        <use href="#advc-socks" x="196" y="163" width="64" height="64"/>
      </g>
    </g>
  </g>

  <!-- Scene 5: payoff wide — the crowd gone, clouds deepen the blue -->
  <g class="scene" data-dur="3.4" data-caption="Stay twenty minutes and the drowned larches are nearly yours alone.">
    <g class="blues-cam5">
      <rect x="0" y="0" width="480" height="270" fill="url(#blues-sky2)"/>
      <path d="M50,45 q22,-15 44,0 q20,-11 38,4 q-4,11 -22,10 q-33,7 -60,-2 q-9,0 0,-12z" fill="#e7ece7" opacity="0.85"/>
      <path d="M300,35 q18,-12 36,0 q16,-9 30,3 q-3,9 -18,8 q-27,6 -48,-1 q-7,0 0,-10z" fill="#e7ece7" opacity="0.75"/>
      <path d="M0,120 L60,70 L120,110 L190,55 L260,105 L330,65 L400,108 L480,75 L480,150 L0,150 Z" fill="#5f6f7c"/>
      <path d="M0,140 L90,105 L180,132 L280,98 L360,128 L480,110 L480,160 L0,160 Z" fill="#39525a" opacity="0.85"/>
      <rect x="0" y="155" width="480" height="70" fill="url(#blues-ponddeep)"/>
      <path class="blues-shimmer" d="M20,175 q60,-6 120,0 q60,6 120,-2 q60,-8 120,2 q60,6 90,-4" fill="none" stroke="#9fdcec" stroke-width="2" opacity="0.4"/>
      <g stroke="#d9d5c4" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M100,225 L96,168 M96,168 q6,-6 -2,-14"/>
        <path d="M170,222 L168,160 M168,160 q7,-5 0,-13"/>
        <path d="M330,224 L332,166 M332,166 q6,-5 -1,-12"/>
      </g>
      <path d="M0,222 Q120,214 220,220 T480,216 L480,270 L0,270 Z" fill="url(#blues-wood)"/>
      <g stroke="#7c5a3c" stroke-width="4"><line x1="0" y1="212" x2="215" y2="205"/></g>
      <g class="blues-bob">
        <use href="#advc-cinnamon" x="150" y="146" width="80" height="80"/>
      </g>
      <g class="blues-bob">
        <use href="#advc-socks" x="220" y="160" width="62" height="62"/>
      </g>
    </g>
  </g>
</svg>
