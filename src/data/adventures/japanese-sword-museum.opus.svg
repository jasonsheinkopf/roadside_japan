<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"
     data-episode="Metallurgy as Calligraphy" data-prefix="sworo">
  <style>
    .sworo-walk1 { animation: sworo-walkin 1.6s cubic-bezier(.32,.9,.4,1) both; animation-delay: calc(var(--t1) + .15s); }
    .sworo-bobA { animation: sworo-bob 2.7s ease-in-out infinite; }
    .sworo-bobB { animation: sworo-bob 3.2s ease-in-out infinite; }
    .sworo-pond { animation: sworo-shim 3.6s ease-in-out infinite; }
    .sworo-cloud { animation: sworo-cloud 20s linear infinite; }
    .sworo-cam2 { transform-box: fill-box; transform-origin: 50% 60%; animation: sworo-push 3.4s ease-out both; animation-delay: var(--t2); }
    .sworo-uplight { animation: sworo-uplight 3.2s ease-in-out infinite; }
    .sworo-uplight2 { animation: sworo-uplight 4s ease-in-out infinite; animation-delay: -1.5s; }
    .sworo-mote { animation: sworo-rise 6s linear infinite; }
    .sworo-mote2 { animation: sworo-rise 7.4s linear infinite; animation-delay: -3s; }
    .sworo-glint { animation: sworo-glint 3s ease-in-out infinite; }
    .sworo-hamon { animation: sworo-hamon 3.4s ease-in-out infinite; }
    .sworo-fog { transform-box: fill-box; transform-origin: 50% 60%; animation: sworo-fog 3.4s ease-in-out infinite; }
    .sworo-guard { animation: sworo-guard 4s ease-out both; animation-delay: calc(var(--t4) + .6s); }
    .sworo-press { animation: sworo-press 2.6s ease-in-out infinite; transform-origin: 50% 50%; }
    .sworo-slash { transform-box: fill-box; transform-origin: 26% 84%; animation: sworo-slash 1.2s cubic-bezier(.5,.1,.3,1) both; animation-delay: calc(var(--t5) + .5s); }
    .sworo-flash { animation: sworo-flash 1.2s ease-out both; animation-delay: calc(var(--t5) + .7s); }
    @keyframes sworo-walkin { from { transform: translateX(-96px); } to { transform: translateX(0); } }
    @keyframes sworo-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes sworo-shim { 0%,100% { opacity: .35; transform: translateX(0); } 50% { opacity: .7; transform: translateX(9px); } }
    @keyframes sworo-cloud { from { transform: translateX(-50px); } to { transform: translateX(540px); } }
    @keyframes sworo-push { from { transform: scale(1); } to { transform: scale(1.06); } }
    @keyframes sworo-uplight { 0%,100% { opacity: .4; } 50% { opacity: .85; } }
    @keyframes sworo-rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .5; } 100% { transform: translateY(-50px); opacity: 0; } }
    @keyframes sworo-glint { 0% { opacity: 0; transform: translate(-120px,72px); } 42%,56% { opacity: .95; } 100% { opacity: 0; transform: translate(120px,-72px); } }
    @keyframes sworo-hamon { 0%,100% { opacity: .5; } 50% { opacity: .95; } }
    @keyframes sworo-fog { 0% { opacity: 0; transform: scale(.4); } 55% { opacity: .8; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.2); } }
    @keyframes sworo-guard { from { transform: translateX(70px); opacity: 0; } 40%,100% { transform: translateX(0); opacity: 1; } }
    @keyframes sworo-press { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    @keyframes sworo-slash { 0% { transform: rotate(-58deg); } 60% { transform: rotate(24deg); } 100% { transform: rotate(16deg); } }
    @keyframes sworo-flash { 0%,30% { opacity: 0; } 46% { opacity: .9; } 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="sworo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4d6df"/><stop offset="1" stop-color="#e9ecdf"/>
    </linearGradient>
    <linearGradient id="sworo-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d2da"/><stop offset=".5" stop-color="#eef4f7"/><stop offset="1" stop-color="#9aa8b2"/>
    </linearGradient>
    <radialGradient id="sworo-up" cx="50%" cy="100%" r="90%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sworo-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7c55"/><stop offset="1" stop-color="#7d6242"/>
    </linearGradient>
  </defs>

  <!-- ============ SCENE 1 — WIDE ESTABLISHING: Ryogoku, sumo & swords ============ -->
  <g class="scene" data-dur="3.2" data-caption="CINNAMON: “One thousand yen, right next to the sumo arena. A very Ryogoku afternoon.”">
    <rect width="480" height="270" fill="url(#sworo-sky)"/>
    <g class="sworo-cloud"><ellipse cx="90" cy="34" rx="30" ry="11" fill="#fff" opacity=".7"/><ellipse cx="116" cy="28" rx="20" ry="10" fill="#fff" opacity=".7"/></g>
    <!-- the Kokugikan sumo arena behind: pale walls, big green tiered roof -->
    <rect x="18" y="120" width="196" height="70" fill="#d8cdb8"/>
    <path d="M6 120 L226 120 L206 96 L26 96 Z" fill="#3f8f7a"/>
    <path d="M26 96 L206 96 L190 78 L42 78 Z" fill="#4c9f88"/>
    <path d="M42 78 L190 78 L116 60 Z" fill="#3f8f7a"/>
    <rect x="112" y="52" width="8" height="12" fill="#caa24a"/><circle cx="116" cy="50" r="4" fill="#e0b95a"/>
    <rect x="60" y="140" width="22" height="50" fill="#b7aa92"/><rect x="150" y="140" width="22" height="50" fill="#b7aa92"/>
    <!-- the modern sword museum on the right: angular dark building -->
    <path d="M270 190 L270 96 L360 78 L460 96 L460 190 Z" fill="#4a4038"/>
    <path d="M270 96 L360 78 L460 96 L460 110 L270 110 Z" fill="#5b5048"/>
    <rect x="286" y="120" width="26" height="52" fill="#26221f"/><rect x="322" y="120" width="26" height="52" fill="#26221f"/>
    <rect x="358" y="120" width="26" height="52" fill="#26221f"/><rect x="394" y="120" width="26" height="52" fill="#26221f"/>
    <rect x="286" y="120" width="26" height="52" fill="#79909a" opacity=".35"/><rect x="358" y="120" width="26" height="52" fill="#79909a" opacity=".35"/>
    <rect x="418" y="150" width="30" height="40" fill="#1c1916"/>
    <text x="342" y="103" font-family="Verdana, sans-serif" font-size="7" font-weight="700" text-anchor="middle" fill="#e6dcc4">刀剣博物館</text>
    <!-- a hedge line at the museum's base -->
    <path d="M260 188 q30 -10 60 0 q30 -10 60 0 q30 -10 60 0 q30 -8 40 0 L480 200 L260 200 Z" fill="#5f8a49"/>
    <!-- ground / plaza -->
    <rect x="0" y="188" width="480" height="82" fill="#cdc6b4"/>
    <path d="M180 210 Q300 202 480 212 L480 270 L120 270 Z" fill="#c1b9a4"/>
    <path d="M0 244 L480 244" stroke="#b3ab96" stroke-width="2" opacity=".6"/>
    <!-- Kyu-Yasuda garden pond + stone lantern in the foreground-left -->
    <path d="M-10 256 Q80 236 176 252 Q150 274 60 276 Q-24 274 -10 256 Z" fill="#5f8a86"/>
    <g class="sworo-pond"><path d="M18 258 q52 -6 104 2" stroke="#bfe0dc" stroke-width="2.4" fill="none" opacity=".5"/></g>
    <g>
      <rect x="150" y="224" width="14" height="8" fill="#9a9384"/>
      <path d="M146 224 L168 224 L162 214 L152 214 Z" fill="#8a8375"/>
      <rect x="153" y="216" width="8" height="6" fill="#6f6a5c"/>
      <rect x="154" y="232" width="6" height="16" fill="#8a8375"/>
      <ellipse cx="157" cy="250" rx="12" ry="4" fill="#6f9a86" opacity=".5"/>
    </g>
    <!-- cast crossing the plaza -->
    <g class="sworo-walk1">
      <g class="sworo-bobA"><use href="#advc-cinnamon" x="300" y="196" width="54" height="54"/></g>
      <g class="sworo-bobB"><use href="#advc-socks" x="262" y="204" width="44" height="44"/></g>
    </g>
  </g>

  <!-- ============ SCENE 2 — MEDIUM INTERIOR: the dark blade hall ============ -->
  <g class="scene" data-dur="3.0" data-caption="SOCKS: “They light each blade from below so the steel ripples in the dark. Serious business.”">
    <rect width="480" height="270" fill="#14110e"/>
    <g class="sworo-cam2">
      <!-- deep charcoal walls + floor -->
      <rect x="0" y="0" width="480" height="200" fill="#1c1815"/>
      <rect x="0" y="200" width="480" height="70" fill="#2a2320"/>
      <line x1="0" y1="200" x2="480" y2="200" stroke="#0e0b09" stroke-width="2"/>
      <!-- a receding row of lit vitrines along the left wall -->
      <g>
        <rect x="40" y="70" width="70" height="130" fill="#0e0c0a"/>
        <g class="sworo-uplight"><ellipse cx="75" cy="150" rx="30" ry="70" fill="url(#sworo-up)"/></g>
        <path d="M60 176 L92 84" stroke="url(#sworo-steel)" stroke-width="4" stroke-linecap="round"/>
        <path d="M60 176 L92 84" stroke="#fff" stroke-width="1" opacity=".5"/>
        <rect x="52" y="182" width="46" height="10" fill="#3a322c"/>
      </g>
      <g>
        <rect x="150" y="84" width="58" height="116" fill="#0e0c0a"/>
        <g class="sworo-uplight2"><ellipse cx="179" cy="150" rx="24" ry="58" fill="url(#sworo-up)"/></g>
        <path d="M166 176 L192 100" stroke="url(#sworo-steel)" stroke-width="3.4" stroke-linecap="round"/>
        <rect x="160" y="182" width="38" height="9" fill="#3a322c"/>
      </g>
      <!-- vitrines along the right wall -->
      <g>
        <rect x="380" y="70" width="70" height="130" fill="#0e0c0a"/>
        <g class="sworo-uplight2"><ellipse cx="415" cy="150" rx="30" ry="70" fill="url(#sworo-up)"/></g>
        <path d="M400 176 L432 84" stroke="url(#sworo-steel)" stroke-width="4" stroke-linecap="round"/>
        <path d="M400 176 L432 84" stroke="#fff" stroke-width="1" opacity=".5"/>
        <rect x="392" y="182" width="46" height="10" fill="#3a322c"/>
      </g>
      <g>
        <rect x="288" y="84" width="58" height="116" fill="#0e0c0a"/>
        <g class="sworo-uplight"><ellipse cx="317" cy="150" rx="24" ry="58" fill="url(#sworo-up)"/></g>
        <path d="M304 176 L330 100" stroke="url(#sworo-steel)" stroke-width="3.4" stroke-linecap="round"/>
        <rect x="298" y="182" width="38" height="9" fill="#3a322c"/>
      </g>
      <!-- dust motes drifting in the beams -->
      <circle class="sworo-mote" cx="90" cy="180" r="1.8" fill="#ffe6a8"/>
      <circle class="sworo-mote2" cx="410" cy="176" r="1.6" fill="#ffe6a8"/>
      <!-- cast, small and reverent, in the middle of the dark hall -->
      <g class="sworo-bobA"><use href="#advc-cinnamon" x="216" y="150" width="56" height="56"/></g>
      <g class="sworo-bobB"><use href="#advc-socks" x="256" y="160" width="46" height="46"/></g>
    </g>
  </g>

  <!-- ============ SCENE 3 — CLOSE-UP INSERT: the temper line ============ -->
  <g class="scene" data-dur="2.8" data-caption="CINNAMON: “Metallurgy as calligraphy — a smith folds a poem into a bar of steel.”">
    <rect width="480" height="270" fill="#100d0b"/>
    <!-- uplight pooling under the blade -->
    <g class="sworo-uplight"><ellipse cx="240" cy="230" rx="220" ry="70" fill="url(#sworo-up)"/></g>
    <!-- the katana displayed at a shallow diagonal, lit from below -->
    <g>
      <!-- blade body (gentle katana curve) -->
      <path d="M74 214 Q250 150 430 74 Q432 82 428 88 Q252 162 80 224 Z" fill="url(#sworo-steel)"/>
      <!-- back edge highlight -->
      <path d="M74 214 Q250 150 430 74" stroke="#f6fbfd" stroke-width="1.6" fill="none" opacity=".8"/>
      <!-- the hamon: a wavy temper line following the cutting edge -->
      <path class="sworo-hamon" d="M92 216 q40 -12 66 -20 q30 -14 58 -22 q34 -16 62 -24 q30 -12 60 -22 q24 -8 40 -14"
            stroke="#eaf6fb" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>
      <path class="sworo-hamon" d="M100 214 q30 -6 44 -18 q22 -4 40 -16 q26 -6 44 -18 q26 -6 46 -16 q22 -8 40 -14"
            stroke="#cfe6ef" stroke-width="1.6" fill="none" opacity=".6"/>
      <!-- grain of the folded steel -->
      <path d="M120 196 q120 -50 240 -104 M150 202 q110 -46 210 -96" stroke="#aebac2" stroke-width=".8" fill="none" opacity=".5"/>
      <!-- tsuba (guard) + tsuka (handle) at the lower-left -->
      <ellipse cx="70" cy="216" rx="9" ry="16" fill="#3a2c1e" transform="rotate(-20 70 216)"/>
      <path d="M30 236 L70 216 L76 226 L36 246 Z" fill="#2a1d13"/>
      <path d="M34 234 l40 -20 M40 240 l40 -20" stroke="#6b5030" stroke-width="1.4" opacity=".7"/>
    </g>
    <!-- the traveling glint along the blade -->
    <g class="sworo-glint"><path d="M240 150 l6 -10 l6 10 l-6 10z" fill="#fff"/></g>
    <!-- pedestal + engraved label -->
    <rect x="196" y="244" width="120" height="20" rx="2" fill="#2a2320"/>
    <rect x="204" y="250" width="70" height="3" fill="#6b5f52"/><rect x="204" y="256" width="48" height="2.4" fill="#5a4f44"/>
  </g>

  <!-- ============ SCENE 4 — REACTION: nose to the glass, fogging it ============ -->
  <g class="scene" data-dur="3.0" data-caption="CINNAMON: “I fogged the glass twice. A guard un-fogged it twice. We are friends now.”">
    <rect width="480" height="270" fill="#14110e"/>
    <!-- inside the case, beyond the glass: a glowing blade -->
    <rect x="300" y="0" width="180" height="270" fill="#1a1613"/>
    <g class="sworo-uplight"><ellipse cx="392" cy="240" rx="90" ry="120" fill="url(#sworo-up)"/></g>
    <path d="M340 230 L446 60" stroke="url(#sworo-steel)" stroke-width="5" stroke-linecap="round"/>
    <path d="M340 230 L446 60" stroke="#fff" stroke-width="1.2" opacity=".5"/>
    <!-- a guard silhouette approaching from the right -->
    <g class="sworo-guard">
      <path d="M436 250 q-6 -46 10 -46 q16 0 10 46z" fill="#0c0a08"/>
      <circle cx="446" cy="196" r="12" fill="#14100d"/>
      <rect x="440" y="182" width="12" height="6" rx="1" fill="#2a2320"/>
    </g>
    <!-- big Cinnamon head, pressed to the glass at the right of his muzzle -->
    <g class="sworo-press">
      <path d="M96 92 q-14 -44 20 -40 q14 8 8 40z" fill="#7d6242"/>
      <path d="M224 92 q14 -44 -20 -40 q-14 8 -8 40z" fill="#7d6242"/>
      <path d="M106 80 q-6 -22 12 -24 M214 80 q6 -22 -12 -24" stroke="#5e4a32" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="160" cy="150" rx="100" ry="92" fill="url(#sworo-fur)"/>
      <!-- muzzle pushed toward the glass on the right -->
      <path d="M150 120 q104 8 106 40 q2 30 -104 44 q-40 -6 -46 -44 q6 -38 44 -40z" fill="#e9d8bd"/>
      <ellipse cx="120" cy="164" rx="16" ry="12" fill="#e7b0a2" opacity=".55"/>
      <!-- eyes glancing toward the glass -->
      <ellipse cx="150" cy="132" rx="15" ry="19" fill="#241c16"/><ellipse cx="206" cy="130" rx="15" ry="19" fill="#241c16"/>
      <circle cx="156" cy="124" r="5" fill="#fff"/><circle cx="212" cy="122" r="5" fill="#fff"/>
      <!-- flattened nose against the pane -->
      <path d="M244 150 q10 -8 10 0 q0 8 -10 8 q-8 0 -8 -4z" fill="#2e2219"/>
      <path d="M232 168 q10 6 20 0" stroke="#3a2c24" stroke-width="2.6" fill="none"/>
      <path d="M118 160 l-30 -6 M120 172 l-30 4" stroke="#cbb894" stroke-width="1.6" opacity=".8"/>
    </g>
    <!-- the glass pane + its foggy breath patch -->
    <line x1="262" y1="0" x2="262" y2="270" stroke="#9fb8c0" stroke-width="2" opacity=".35"/>
    <path d="M262 20 L300 40 L300 250 L262 240 Z" fill="#a9c4cc" opacity=".08"/>
    <ellipse class="sworo-fog" cx="258" cy="156" rx="26" ry="30" fill="#eaf2f4" opacity=".5"/>
  </g>

  <!-- ============ SCENE 5 — PAYOFF: samurai faces in the dim hall ============ -->
  <g class="scene" data-dur="3.0" data-caption="SOCKS: “Twenty minutes end to end — unless it catches you. It caught us. Ninety.”">
    <rect width="480" height="270" fill="#16120f"/>
    <!-- dark hall with one lit vitrine + blade behind -->
    <rect x="0" y="0" width="480" height="204" fill="#1c1815"/>
    <rect x="0" y="204" width="480" height="66" fill="#2a2320"/>
    <line x1="0" y1="204" x2="480" y2="204" stroke="#0e0b09" stroke-width="2"/>
    <rect x="360" y="60" width="70" height="144" fill="#0e0c0a"/>
    <g class="sworo-uplight"><ellipse cx="395" cy="150" rx="30" ry="80" fill="url(#sworo-up)"/></g>
    <path d="M380 186 L414 74" stroke="url(#sworo-steel)" stroke-width="4" stroke-linecap="round"/>
    <!-- a dramatic key light beam -->
    <path d="M150 0 L110 204 L200 204 L230 0 Z" fill="#ffe6a8" opacity=".06"/>
    <!-- Socks in a low ready crouch, posing -->
    <g class="sworo-bobB"><use href="#advc-socks" x="248" y="150" width="58" height="58"/></g>
    <!-- Cinnamon front and center in a samurai stance -->
    <g class="sworo-bobA"><use href="#advc-cinnamon" x="120" y="140" width="72" height="72"/></g>
    <!-- the katana he swings, pivoting from his paws -->
    <g class="sworo-slash">
      <path d="M150 210 L150 96" stroke="url(#sworo-steel)" stroke-width="5" stroke-linecap="round"/>
      <path d="M150 210 L150 96" stroke="#fff" stroke-width="1.2" opacity=".6"/>
      <ellipse cx="150" cy="206" rx="8" ry="4" fill="#3a2c1e"/>
      <rect x="147" y="206" width="6" height="18" rx="2" fill="#2a1d13"/>
    </g>
    <!-- the slash flash arc -->
    <g class="sworo-flash"><path d="M150 200 Q250 120 300 60" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/></g>
  </g>
</svg>
