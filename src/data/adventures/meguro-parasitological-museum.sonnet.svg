<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270"
     data-episode="Longer Than Mon-chan, Twenty Times Over" data-prefix="megus">
  <style>
    .megus-walk1 { animation: megus-walkin 1.3s cubic-bezier(.3,.9,.4,1) both; animation-delay: calc(var(--t1) + .2s); }
    .megus-sign { animation: megus-flicker 2.4s steps(1) infinite; }
    .megus-bob { animation: megus-bob 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .megus-ribbonwalk { animation: megus-ribbonwalk 2.2s ease-in-out both; animation-delay: calc(var(--t2) + .3s); }
    .megus-jealous { animation: megus-jealous 1.8s ease-in-out infinite; animation-delay: calc(var(--t2) + .5s); transform-box: fill-box; transform-origin: 50% 100%; }
    .megus-tapeglint { animation: megus-glint 2.2s ease-in-out infinite; }
    .megus-noseto { animation: megus-noseto 1s ease-out both; animation-delay: calc(var(--t3) + .3s); transform-box: fill-box; transform-origin: 50% 100%; }
    .megus-tail { animation: megus-tailwag .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 50%; }
    .megus-cam4 { animation: megus-push 2.6s ease-out both; animation-delay: var(--t4); transform-box: fill-box; transform-origin: 50% 55%; }
    .megus-huff { animation: megus-huff 1.6s ease-in-out infinite; animation-delay: calc(var(--t4) + .3s); transform-box: fill-box; transform-origin: 50% 100%; }
    .megus-popin { animation: megus-popin .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--t5) + .3s); transform-box: fill-box; transform-origin: 50% 100%; }
    .megus-dangle { animation: megus-dangle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }

    @keyframes megus-walkin { from { transform: translateX(-140px); } to { transform: translateX(0); } }
    @keyframes megus-flicker { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes megus-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes megus-ribbonwalk { from { transform: translateX(-90px); } to { transform: translateX(0); } }
    @keyframes megus-jealous { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
    @keyframes megus-glint { 0%,100% { opacity: .2; } 50% { opacity: .7; } }
    @keyframes megus-noseto { from { transform: scale(.6) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes megus-tailwag { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
    @keyframes megus-push { from { transform: scale(1); } to { transform: scale(1.06); } }
    @keyframes megus-huff { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-3deg); } }
    @keyframes megus-popin { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes megus-dangle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  </style>
  <defs>
    <linearGradient id="megus-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce7f2"/><stop offset="1" stop-color="#f3ede0"/>
    </linearGradient>
    <linearGradient id="megus-build" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e2d2"/><stop offset="1" stop-color="#cfc6ac"/>
    </linearGradient>
    <linearGradient id="megus-hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead4"/><stop offset="1" stop-color="#dccdaa"/>
    </linearGradient>
    <linearGradient id="megus-sqg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7c55"/><stop offset="1" stop-color="#7d6242"/>
    </linearGradient>
    <linearGradient id="megus-mong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eea355"/><stop offset="1" stop-color="#e8973f"/>
    </linearGradient>
  </defs>

  <!-- Scene 1: wide establishing — quiet Shimomeguro street, museum entrance -->
  <g class="scene" data-dur="3.0" data-caption="CINNAMON: “Founded in 1953. Extremely serious. I am thrilled.”">
    <rect x="0" y="0" width="480" height="270" fill="url(#megus-sky)"/>
    <path d="M0,140 L480,140 L480,270 L0,270 Z" fill="#d7cdb4"/>
    <path d="M60,140 L60,60 L260,60 L260,140 Z" fill="url(#megus-build)" stroke="#a99b76" stroke-width="2"/>
    <rect x="60" y="45" width="200" height="18" fill="#8a5a34"/>
    <g fill="#79604a"><rect x="80" y="75" width="26" height="34"/><rect x="126" y="75" width="26" height="34"/><rect x="172" y="75" width="26" height="34"/><rect x="218" y="75" width="26" height="34"/></g>
    <g fill="#bcd8de"><rect x="84" y="79" width="18" height="26"/><rect x="130" y="79" width="18" height="26"/><rect x="176" y="79" width="18" height="26"/><rect x="222" y="79" width="18" height="26"/></g>
    <rect x="145" y="110" width="30" height="30" fill="#5a4632"/>
    <g class="megus-sign">
      <rect x="90" y="52" width="140" height="10" fill="#3a2c24"/>
      <text x="160" y="60" font-size="7" fill="#f3ead4" text-anchor="middle" font-family="sans-serif">MEGURO PARASITOLOGICAL MUSEUM</text>
    </g>
    <path d="M300,140 L300,95 Q330,80 360,95 L360,140 Z" fill="#c8bfa2"/>
    <rect x="325" y="115" width="10" height="25" fill="#79604a"/>
    <g stroke="#a99b76" stroke-width="1" opacity="0.5"><line x1="0" y1="160" x2="480" y2="160"/><line x1="0" y1="180" x2="480" y2="180"/></g>
    <g fill="#3f6b4a"><ellipse cx="30" cy="150" rx="16" ry="20"/><rect x="26" y="150" width="8" height="20"/></g>
    <g fill="#3f6b4a"><ellipse cx="440" cy="148" rx="18" ry="22"/><rect x="435" y="148" width="8" height="22"/></g>
    <path d="M0,205 Q120,196 240,202 T480,198 L480,270 L0,270 Z" fill="#9c9482"/>
    <g stroke="#7d745f" stroke-width="1.5" opacity="0.5"><line x1="40" y1="208" x2="40" y2="270"/><line x1="140" y1="205" x2="140" y2="270"/><line x1="300" y1="202" x2="300" y2="270"/><line x1="400" y1="200" x2="400" y2="270"/></g>
    <g class="megus-walk1">
      <use href="#advc-cinnamon" x="130" y="150" width="80" height="80"/>
      <g class="megus-tail" style="transform-box:fill-box;transform-origin:0% 60%">
        <use href="#advc-mon" x="205" y="163" width="70" height="70"/>
      </g>
    </g>
  </g>

  <!-- Scene 2: medium — the 8.8m tapeworm hall, ribbon marking its length -->
  <g class="scene" data-dur="3.4" data-caption="MON-CHAN: “That thing is longer than me by a LOT. I don't like it.”">
    <rect x="0" y="0" width="480" height="270" fill="url(#megus-hall)"/>
    <rect x="0" y="0" width="480" height="70" fill="#e4d6b4"/>
    <g fill="#c9b98c"><rect x="20" y="10" width="18" height="50"/><rect x="140" y="10" width="18" height="50"/><rect x="320" y="10" width="18" height="50"/><rect x="440" y="10" width="18" height="50"/></g>
    <path d="M0,200 Q160,190 280,196 T480,192 L480,270 L0,270 Z" fill="#c7bda0"/>
    <g stroke="#a99b76" stroke-width="1" opacity="0.4"><line x1="0" y1="215" x2="480" y2="212"/><line x1="0" y1="235" x2="480" y2="232"/></g>
    <rect x="30" y="90" width="420" height="90" rx="6" fill="#eef6f5" stroke="#9fb7b6" stroke-width="3" opacity="0.9"/>
    <path class="megus-tapeglint" d="M50,100 Q120,150 200,110 Q280,155 360,105 Q410,130 440,100" fill="none" stroke="#f7fbfa" stroke-width="4"/>
    <path d="M50,150 Q120,110 200,150 Q280,105 360,150 Q410,120 440,150" fill="none" stroke="#d9a5ab" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <path d="M50,150 Q120,110 200,150 Q280,105 360,150 Q410,120 440,150" fill="none" stroke="#c98d95" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.4"/>
    <g>
      <line x1="46" y1="185" x2="46" y2="196" stroke="#8a3f45" stroke-width="2"/>
      <line x1="444" y1="185" x2="444" y2="196" stroke="#8a3f45" stroke-width="2"/>
      <path d="M46,196 Q245,214 444,196" fill="none" stroke="#d64a55" stroke-width="3"/>
      <rect x="200" y="196" width="90" height="12" rx="2" fill="#fff" stroke="#8a3f45" stroke-width="1"/>
      <text x="245" y="205" font-size="6" fill="#3a2c24" text-anchor="middle" font-family="sans-serif">TAPEWORM — 8.8 M</text>
    </g>
    <g class="megus-bob">
      <use href="#advc-socks" x="60" y="180" width="60" height="60"/>
    </g>
    <g class="megus-jealous">
      <use href="#advc-mon" x="330" y="175" width="72" height="72"/>
    </g>
  </g>

  <!-- Scene 3: close-up insert — walking the ribbon, nose to tail-tip -->
  <g class="scene" data-dur="2.6" data-caption="CINNAMON: “Nose to tail-tip. Then again, to be sure.”">
    <rect x="0" y="0" width="480" height="270" fill="url(#megus-hall)"/>
    <rect x="0" y="60" width="480" height="150" fill="#eef6f5"/>
    <path d="M0,90 Q120,60 240,90 T480,85" fill="none" stroke="#dfe9e8" stroke-width="3" opacity="0.6"/>
    <path d="M0,130 Q140,150 260,128 Q360,110 480,140" fill="none" stroke="#d9a5ab" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
    <path d="M0,130 Q140,150 260,128 Q360,110 480,140" fill="none" stroke="#c98d95" stroke-width="20" stroke-linecap="round" stroke-dasharray="3 14" opacity="0.4"/>
    <path d="M0,205 Q160,196 280,200 T480,198 L480,270 L0,270 Z" fill="#c7bda0"/>
    <g stroke="#a99b76" stroke-width="1" opacity="0.4"><line x1="0" y1="216" x2="480" y2="214"/></g>
    <g class="megus-ribbonwalk">
      <ellipse cx="240" cy="222" rx="46" ry="10" fill="#000" opacity="0.15"/>
      <use href="#advc-cinnamon" x="196" y="150" width="88" height="88"/>
    </g>
    <g class="megus-noseto">
      <ellipse cx="360" cy="140" rx="10" ry="7" fill="#b9966c" opacity="0.9"/>
    </g>
  </g>

  <!-- Scene 4: reaction — Mon-chan's wounded dignity, arms crossed -->
  <g class="scene" data-dur="2.6" data-caption="MON-CHAN: “I am the biggest thing in this museum. Was. Was the biggest.”">
    <g class="megus-cam4">
      <rect x="0" y="0" width="480" height="270" fill="url(#megus-hall)"/>
      <path d="M0,60 Q160,40 300,58 T480,50 L480,0 L0,0 Z" fill="#e4d6b4" opacity="0.7"/>
      <path d="M0,270 Q160,240 300,255 T480,245 L480,270 Z" fill="#c7bda0" opacity="0.8"/>
      <rect x="330" y="70" width="130" height="90" rx="6" fill="#eef6f5" stroke="#9fb7b6" stroke-width="2" opacity="0.75"/>
      <path d="M340,90 Q400,140 450,100" fill="none" stroke="#d9a5ab" stroke-width="6" opacity="0.55"/>
      <g class="megus-huff">
        <ellipse cx="200" cy="240" rx="90" ry="14" fill="#000" opacity="0.15"/>
        <ellipse cx="200" cy="180" rx="70" ry="66" fill="url(#megus-mong)"/>
        <path d="M156,138 q-14,-28 12,-26 q10,4 6,24z" fill="#e8973f" stroke="#c67a2c" stroke-width="2"/>
        <path d="M244,138 q14,-28 -12,-26 q-10,4 -6,24z" fill="#e8973f" stroke="#c67a2c" stroke-width="2"/>
        <path d="M200,150 q22,-2 26,22 q3,22 -26,24 q-29,-2 -26,-24 q4,-24 26,-22z" fill="#f7ecd8"/>
        <ellipse cx="184" cy="170" rx="6" ry="7.5" fill="#241c16"/><ellipse cx="216" cy="170" rx="6" ry="7.5" fill="#241c16"/>
        <circle cx="186" cy="167" r="1.8" fill="#fff"/><circle cx="218" cy="167" r="1.8" fill="#fff"/>
        <ellipse cx="164" cy="184" rx="8" ry="6" fill="#e7a793" opacity="0.7"/><ellipse cx="236" cy="184" rx="8" ry="6" fill="#e7a793" opacity="0.7"/>
        <path d="M200,180 q-6,6 -12,0 M200,180 q6,6 12,0" stroke="#3a2c24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M186,196 q14,-10 28,0" stroke="#3a2c24" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M140,225 Q150,205 175,215 Q160,230 140,225Z" fill="#e8973f"/>
        <path d="M260,225 Q250,205 225,215 Q240,230 260,225Z" fill="#e8973f"/>
      </g>
    </g>
  </g>

  <!-- Scene 5: payoff — the gift shop, a keychain that funds research -->
  <g class="scene" data-dur="2.8" data-caption="CINNAMON: “A tapeworm keychain, for Socks. It funds actual research.”">
    <rect x="0" y="0" width="480" height="270" fill="url(#megus-hall)"/>
    <path d="M0,0 L480,0 L480,60 L0,60 Z" fill="#e4d6b4"/>
    <rect x="0" y="55" width="480" height="10" fill="#79604a"/>
    <g fill="#79604a"><rect x="40" y="65" width="400" height="6"/><rect x="40" y="115" width="400" height="6"/><rect x="40" y="165" width="400" height="6"/></g>
    <g>
      <rect x="55" y="72" width="34" height="40" rx="3" fill="#e8e2d2" stroke="#a99b76"/>
      <rect x="105" y="72" width="34" height="40" rx="3" fill="#f3ead4" stroke="#a99b76"/>
      <rect x="155" y="72" width="34" height="40" rx="3" fill="#e8e2d2" stroke="#a99b76"/>
      <text x="72" y="96" font-size="16" text-anchor="middle">🪱</text>
      <text x="122" y="96" font-size="16" text-anchor="middle">🪱</text>
      <text x="172" y="96" font-size="16" text-anchor="middle">🔑</text>
      <rect x="55" y="122" width="34" height="40" rx="3" fill="#f3ead4" stroke="#a99b76"/>
      <rect x="105" y="122" width="34" height="40" rx="3" fill="#e8e2d2" stroke="#a99b76"/>
      <text x="72" y="146" font-size="14" text-anchor="middle">👕</text>
      <text x="122" y="146" font-size="14" text-anchor="middle">🪱</text>
    </g>
    <path d="M0,205 Q160,196 280,200 T480,198 L480,270 L0,270 Z" fill="#c7bda0"/>
    <g stroke="#a99b76" stroke-width="1" opacity="0.4"><line x1="0" y1="216" x2="480" y2="214"/></g>
    <g class="megus-bob">
      <use href="#advc-cinnamon" x="260" y="155" width="76" height="76"/>
    </g>
    <g class="megus-popin">
      <line x1="380" y1="150" x2="380" y2="185" stroke="#3a2c24" stroke-width="1.5"/>
      <circle cx="380" cy="192" r="9" fill="#e8e2d2" stroke="#8a5a34" stroke-width="1.5"/>
      <text x="380" y="196" font-size="9" text-anchor="middle">🪱</text>
    </g>
    <g class="megus-dangle" style="transform-box:fill-box;transform-origin:380px 150px">
      <use href="#advc-socks" x="345" y="160" width="66" height="66"/>
    </g>
  </g>
</svg>
